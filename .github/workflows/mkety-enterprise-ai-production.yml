name: Mkety Enterprise AI Production

on:
  workflow_dispatch:
    inputs:
      verified_sha:
        description: Exact fully verified main SHA to deploy
        required: true
        type: string
      confirmation:
        description: Type DEPLOY ENTERPRISE AI HOST
        required: true
        type: string

concurrency:
  group: mkety-enterprise-ai-production
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  PRODUCTION_WORKER_NAME: mkety-platform
  AI_DELIVERY_WORKER: mkety-ai-delivery
  AI_DELIVERY_QUEUE: mkety-ai-delivery
  AI_DELIVERY_DEAD_QUEUE: mkety-ai-delivery-dead
  MKETY_HYPERDRIVE_NAME: mkety-production-db-v2

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      verified_sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate exact main SHA and blocking proofs
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ inputs.verified_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [ "$CONFIRMATION" = 'DEPLOY ENTERPRISE AI HOST' ] || { echo 'Confirmation phrase did not match.'; exit 1; }
          [[ "$VERIFIED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'verified_sha must be an exact 40-character SHA.'; exit 1; }

          main="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/branches/main")"
          head="$(MAIN="$main" node -e "process.stdout.write(JSON.parse(process.env.MAIN).commit.sha)")"
          [ "$head" = "$VERIFIED_SHA" ] || { echo "main head is $head, not $VERIFIED_SHA"; exit 1; }

          verify_success() {
            workflow="$1"; label="$2"
            response="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$VERIFIED_SHA&status=success&per_page=20")"
            RESPONSE="$response" LABEL="$label" node -e "const x=JSON.parse(process.env.RESPONSE||'{}');if(!Array.isArray(x.workflow_runs)||!x.workflow_runs.length)throw new Error('Missing successful '+process.env.LABEL+' proof for exact SHA')"
          }

          verify_success ci.yml CI
          verify_success mkety-migration-baseline.yml Migration-Baseline
          verify_success mkety-cloudflare-vinext-smoke.yml Cloudflare-vinext
          echo "sha=$VERIFIED_SHA" >> "$GITHUB_OUTPUT"

  deploy:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VERIFIED_SHA: ${{ needs.authorize.outputs.verified_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.verified_sha }}
          fetch-depth: 1

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify Cloudflare account and queue permissions
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo 'CLOUDFLARE_API_TOKEN missing'; exit 1; }
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || { echo 'CLOUDFLARE_ACCOUNT_ID missing'; exit 1; }
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Accept: application/json')
          curl -fsS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID" >/dev/null
          curl -fsS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/queues" >/dev/null

      - name: Resolve production Hyperdrive
        id: hyperdrive
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Accept: application/json' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/hyperdrive/configs?per_page=100")"
          HYPERDRIVES="$response" NAME="$MKETY_HYPERDRIVE_NAME" node <<'NODE' >/tmp/hyperdrive-id
          const x=JSON.parse(process.env.HYPERDRIVES||'{}');
          const matches=(x.result||[]).filter((item)=>item.name===process.env.NAME);
          if(!x.success||matches.length!==1||!matches[0]?.id) throw new Error('Expected exactly one production Mkety Hyperdrive.');
          process.stdout.write(matches[0].id);
          NODE
          echo "id=$(cat /tmp/hyperdrive-id)" >> "$GITHUB_OUTPUT"

      - name: Provision AI delivery queues
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          ensure_queue() {
            name="$1"
            queues="$(curl -fsS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/queues")"
            id="$(QUEUES="$queues" NAME="$name" node -e "const x=JSON.parse(process.env.QUEUES||'{}');const a=Array.isArray(x.result)?x.result:(x.result?.queues||[]);const q=a.find(v=>(v.queue_name||v.name)===process.env.NAME);if(q)process.stdout.write(String(q.queue_id||q.id||''))")"
            if [ -z "$id" ]; then
              body="$(NAME="$name" node -e "process.stdout.write(JSON.stringify({queue_name:process.env.NAME}))")"
              created="$(curl -fsS -X POST "${auth[@]}" --data "$body" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/queues")"
              id="$(CREATED="$created" node -e "const x=JSON.parse(process.env.CREATED||'{}');process.stdout.write(String(x.result?.queue_id||x.result?.id||''))")"
            fi
            [ -n "$id" ] || { echo "Could not resolve queue id for $name"; exit 1; }
          }
          ensure_queue "$AI_DELIVERY_QUEUE"
          ensure_queue "$AI_DELIVERY_DEAD_QUEUE"

      - name: Configure and build exact central application
        shell: bash
        env:
          MKETY_HYPERDRIVE_ID: ${{ steps.hyperdrive.outputs.id }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const config=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          config.name=process.env.PRODUCTION_WORKER_NAME;
          config.workers_dev=false;
          config.preview_urls=false;
          config.keep_vars=true;
          config.vars={...(config.vars||{}),SKIP_ENV_VALIDATION:'true'};
          config.hyperdrive=[{binding:'MKETY_DB',id:process.env.MKETY_HYPERDRIVE_ID}];
          config.queues={
            ...(config.queues||{}),
            producers:[{binding:'MKETY_AI_DELIVERY_QUEUE',queue:process.env.AI_DELIVERY_QUEUE}],
          };
          delete config.route;
          delete config.routes;
          fs.writeFileSync('wrangler.jsonc',JSON.stringify(config,null,2)+'\n');
          NODE
          pnpm build
          pnpm run deploy --dry-run
          pnpm run deploy

      - name: Deploy durable AI delivery worker
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler deploy -c workers/ai-delivery/wrangler.jsonc

      - name: Attach AI delivery secrets and product host settings
        shell: bash
        run: |
          set -euo pipefail
          secret="$(openssl rand -hex 32)"
          echo "::add-mask::$secret"

          put() {
            worker="$1"; name="$2"; value="$3"
            printf '%s' "$value" | pnpm exec wrangler secret put "$name" --name "$worker" >/dev/null
          }

          put "$AI_DELIVERY_WORKER" MKETY_AI_DELIVERY_INTERNAL_SECRET "$secret"
          put "$AI_DELIVERY_WORKER" MKETY_AI_DELIVERY_CALLBACK_BASE_URL 'https://api.mkety.com'
          put "$PRODUCTION_WORKER_NAME" MKETY_AI_DELIVERY_INTERNAL_SECRET "$secret"
          put "$PRODUCTION_WORKER_NAME" MKETY_AI_HOST 'ai.mkety.com'
          put "$PRODUCTION_WORKER_NAME" MKETY_API_HOST 'api.mkety.com'

      - name: Verify auth bindings survived central app deploy
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler secret list --name "$PRODUCTION_WORKER_NAME" --format json >/tmp/app-secrets.json
          node <<'NODE'
          const fs=require('node:fs');
          const raw=fs.readFileSync('/tmp/app-secrets.json','utf8');
          const start=raw.indexOf('[');
          const rows=start>=0?JSON.parse(raw.slice(start)):[];
          const names=new Set(rows.map((row)=>row.name));
          const required=['MKETY_AUTH_PROVIDER','MKETY_AUTH_ISSUER','MKETY_AUTH_CLIENT_ID','MKETY_AUTH_REDIRECT_URI','MKETY_AUTH_SESSION_SECRET','NEXT_PUBLIC_APP_URL','MKETY_AI_DELIVERY_INTERNAL_SECRET'];
          const missing=required.filter((name)=>!names.has(name));
          if(missing.length) throw new Error('Central app is missing required bindings: '+missing.join(', '));
          NODE

      - name: Attach ai.mkety.com and preserve canonical API ownership
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          zone_response="$(curl -fsS "${auth[@]}" "$api/zones?name=mkety.com&status=active")"
          zone_id="$(ZONE="$zone_response" node -e "const x=JSON.parse(process.env.ZONE||'{}');const z=(x.result||[])[0];if(!z?.id)process.exit(1);process.stdout.write(z.id)")"
          domains="$(curl -fsS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains")"

          for host in ai.mkety.com api.mkety.com; do
            service="$(DOMAINS="$domains" HOST="$host" node -e "const x=JSON.parse(process.env.DOMAINS||'{}');const d=(x.result||[]).find(v=>v.hostname===process.env.HOST);if(d)process.stdout.write(String(d.service||''))")"
            if [ -n "$service" ] && [ "$service" != "$PRODUCTION_WORKER_NAME" ]; then
              echo "$host belongs to Worker $service, refusing takeover."
              exit 1
            fi
            if [ -z "$service" ]; then
              body="$(HOST="$host" ZONE="$zone_id" WORKER="$PRODUCTION_WORKER_NAME" node -e "process.stdout.write(JSON.stringify({hostname:process.env.HOST,service:process.env.WORKER,zone_id:process.env.ZONE,zone_name:'mkety.com'}))")"
              curl -fsS -X PUT "${auth[@]}" --data "$body" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" >/dev/null
            fi
          done

      - name: Product-host and fail-closed smoke
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            code="$(curl -sS --connect-timeout 10 --max-time 20 -o /tmp/ai-home -w '%{http_code}' https://ai.mkety.com/ || true)"
            if [ "$code" = '200' ] || [ "$code" = '302' ] || [ "$code" = '307' ] || [ "$code" = '308' ]; then break; fi
            [ "$attempt" -lt 24 ] || { echo "ai.mkety.com not ready: HTTP $code"; exit 1; }
            sleep 5
          done

          api_code="$(curl -sS -o /tmp/ai-api -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{}' 'https://api.mkety.com/v1/ai/chat/completions')"
          [ "$api_code" = '401' ] || [ "$api_code" = '403' ] || { echo "AI API fail-closed smoke expected auth denial, got $api_code"; exit 1; }

          scheduler_code="$(curl -sS -o /tmp/ai-scheduler -w '%{http_code}' -X POST 'https://api.mkety.com/api/internal/ai/scheduled-actions/dispatch-due')"
          [ "$scheduler_code" = '401' ] || { echo "AI scheduler endpoint must fail closed without internal secret; got $scheduler_code"; exit 1; }

      - name: Record deployment evidence
        shell: bash
        run: |
          {
            echo '## Mkety Enterprise AI production-host deployment'
            echo "- SHA: `$VERIFIED_SHA`"
            echo "- host: `ai.mkety.com`"
            echo "- API: `api.mkety.com/v1/ai`"
            echo "- scheduler worker: `$AI_DELIVERY_WORKER`"
            echo "- queue: `$AI_DELIVERY_QUEUE`"
            echo "- DLQ: `$AI_DELIVERY_DEAD_QUEUE`"
            echo '- Product host and fail-closed internal/API smoke: PASS'
            echo '- This workflow does NOT enable production customer inference.'
            echo '- Production inference promotion remains a separate guarded workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
