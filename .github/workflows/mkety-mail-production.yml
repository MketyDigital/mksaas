name: Mkety Mail Production

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/mkety-mail-production.yml'
      - '.github/workflows/mkety-mail-gateway-production.yml'
      - '.github/workflows/mkety-coolify-production-db-executor.yml'
      - 'src/app/**/mail/**'
      - 'src/app/api/mail/**'
      - 'src/app/api/v1/mail/**'
      - 'src/app/api/internal/mail/**'
      - 'src/features/mail/**'
      - 'src/shared/db/schema/mail.ts'
      - 'src/shared/db/migrations/0020_mkety_mail_foundation.sql'
      - 'src/shared/db/migrations/meta/0020_snapshot.json'
      - 'src/shared/lib/tenant-settings.ts'
      - 'src/features/admin/services/webhook-admin-service.ts'
      - 'src/proxy.ts'
      - 'workers/mail-*/**'
      - 'ops/coolify-migration/run.sh'
      - 'scripts/normalize-platform-control-tenant-slug.ts'
      - 'scripts/report-first-party-mail-readiness.ts'
      - 'docs/MKETY_MAIL_*.md'
  workflow_dispatch:
    inputs:
      verified_sha:
        description: Exact fully verified main SHA to deploy
        required: true
        type: string
      confirmation:
        description: Type DEPLOY MKETY MAIL
        required: true
        type: string

concurrency:
  group: mkety-mail-production-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  statuses: write

env:
  PRODUCTION_WORKER_NAME: mkety-platform
  APP_HOST_WORKER_NAME: mkety-app-host
  # app.mkety.com admin server actions run on APP_HOST_WORKER_NAME.
  MAIL_INGRESS_WORKER: mkety-mail-ingress
  MAIL_DISPATCH_WORKER: mkety-mail-dispatch
  MAIL_BUCKET: mkety-mail-storage
  MAIL_SEND_QUEUE: mkety-mail-send
  MAIL_DEAD_QUEUE: mkety-mail-dead
  MAIL_EVENT_WORKER: mkety-mail-events
  MAIL_CONTENT_WORKER: mkety-mail-content
  MAIL_EVENT_QUEUE: mkety-mail-events
  MAIL_EVENT_DEAD_QUEUE: mkety-mail-events-dead
  MAIL_MIGRATION_WORKER: mkety-mail-migration
  MAIL_MIGRATION_QUEUE: mkety-mail-migrations
  MAIL_MIGRATION_DEAD_QUEUE: mkety-mail-migrations-dead
  MKETY_HYPERDRIVE_NAME: mkety-production-db-v2

jobs:
  authorize:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[mail-production]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      verified_sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate required Platform Control tenant slug
        shell: bash
        env:
          MKETY_PLATFORM_CONTROL_TENANT_SLUG: ${{ secrets.MKETY_PLATFORM_CONTROL_TENANT_SLUG }}
        run: |
          set -euo pipefail
          if [ -z "$MKETY_PLATFORM_CONTROL_TENANT_SLUG" ]; then
            echo '::error::Missing required MKETY_PLATFORM_CONTROL_TENANT_SLUG GitHub secret'
            exit 1
          fi
          echo "::add-mask::$MKETY_PLATFORM_CONTROL_TENANT_SLUG"

      - name: Validate exact main SHA and release authorization
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA_INPUT: ${{ inputs.verified_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
          EVENT_NAME: ${{ github.event_name }}
          PUSH_SHA: ${{ github.sha }}
          PUSH_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            VERIFIED_SHA="$VERIFIED_SHA_INPUT"
            [ "$CONFIRMATION" = 'DEPLOY MKETY MAIL' ] || { echo 'Confirmation phrase did not match.'; exit 1; }
          else
            VERIFIED_SHA="$PUSH_SHA"
            printf '%s' "$PUSH_MESSAGE" | grep -Fq '[mail-production]' || { echo 'Push is not an authorized Mail production merge.'; exit 1; }
          fi
          [[ "$VERIFIED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'verified_sha must be a 40-character SHA.'; exit 1; }
          echo "sha=$VERIFIED_SHA" >> "$GITHUB_OUTPUT"

          main="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json'             "https://api.github.com/repos/$GITHUB_REPOSITORY/branches/main")"
          head="$(MAIN="$main" node -e "process.stdout.write(JSON.parse(process.env.MAIN).commit.sha)")"
          [ "$head" = "$VERIFIED_SHA" ] || { echo "main head is $head, not $VERIFIED_SHA"; exit 1; }

          verify_success() {
            workflow="$1"
            label="$2"
            for attempt in $(seq 1 60); do
              response="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$VERIFIED_SHA&status=success&per_page=20")"
              if RESPONSE="$response" node -e "const x=JSON.parse(process.env.RESPONSE||'{}');process.exit(Array.isArray(x.workflow_runs)&&x.workflow_runs.length?0:1)"; then
                echo "Verified successful $label for exact SHA."
                return 0
              fi
              echo "Waiting for $label on exact SHA ($attempt/60)..."
              sleep 15
            done
            echo "Missing successful $label for exact SHA after bounded wait."
            return 1
          }

          proof_sha="$VERIFIED_SHA"
          for depth in $(seq 1 8); do
            curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/$proof_sha" -o /tmp/mail-proof-commit.json
            next_parent="$(node -e "const fs=require('node:fs');const x=JSON.parse(fs.readFileSync('/tmp/mail-proof-commit.json','utf8'));const files=(x.files||[]).map(f=>f.filename).sort();const p=(x.parents||[])[0]?.sha||'';const neutral=files.length>0&&files.every(file=>file==='.github/workflows/mkety-mail-production.yml'||file==='.github/workflows/mkety-ai-production.yml'||file.startsWith('docs/MKETY_MAIL_')||file.startsWith('docs/MKETY_AI_'));if(neutral&&p)process.stdout.write(p)")"
            [ -n "$next_parent" ] || break
            proof_sha="$next_parent"
          done
          if [ "$proof_sha" != "$VERIFIED_SHA" ]; then
            echo "Workflow-only hotfix chain detected; infrastructure proof base is $proof_sha."
          fi

          verify_infra_proof() {
            workflow="$1"
            label="$2"
            invalidating_paths="$3"

            response="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$VERIFIED_SHA&status=success&per_page=20")"
            if RESPONSE="$response" node -e "const x=JSON.parse(process.env.RESPONSE||'{}');process.exit(Array.isArray(x.workflow_runs)&&x.workflow_runs.length?0:1)"; then
              echo "Verified successful $label for exact SHA."
              return 0
            fi

            response="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=main&status=success&per_page=50")"
            printf '%s' "$response" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s||'{}');for(const r of x.workflow_runs||[])if(r.head_sha)console.log(r.head_sha)})" >/tmp/mail-infra-proof-candidates

            while IFS= read -r candidate; do
              [ -n "$candidate" ] || continue
              git cat-file -e "$candidate^{commit}" 2>/dev/null || continue
              git merge-base --is-ancestor "$candidate" "$VERIFIED_SHA" || continue
              changed="$(git diff --name-only "$candidate" "$VERIFIED_SHA")"
              if [ -n "$changed" ] && printf '%s\n' "$changed" | grep -Eq "$invalidating_paths"; then
                continue
              fi
              echo "Verified inherited $label proof from ancestor $candidate; no $label trigger paths changed afterward."
              return 0
            done </tmp/mail-infra-proof-candidates

            echo "No acceptable $label proof found."
            return 1
          }

          verify_success type-check.yml Typecheck
          verify_success lint.yml Lint
          verify_success tests.yml Tests
          verify_success build.yml Build

          verify_migration_proof() {
            workflow='mkety-migration-baseline.yml'
            label='Migration-Baseline'

            response="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$VERIFIED_SHA&status=success&per_page=20")"
            if RESPONSE="$response" node -e "const x=JSON.parse(process.env.RESPONSE||'{}');process.exit(Array.isArray(x.workflow_runs)&&x.workflow_runs.length?0:1)"; then
              echo "Verified successful $label for exact SHA."
              return 0
            fi

            response="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=main&status=success&per_page=20")"
            printf '%s' "$response" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s||'{}');for(const r of x.workflow_runs||[])if(r.head_sha)console.log(r.head_sha)})" >/tmp/mail-migration-proof-candidates

            while IFS= read -r candidate; do
              [ -n "$candidate" ] || continue
              git cat-file -e "$candidate^{commit}" 2>/dev/null || continue
              git merge-base --is-ancestor "$candidate" "$VERIFIED_SHA" || continue

              changed="$(git diff --name-only "$candidate" "$VERIFIED_SHA")"
              if printf '%s\n' "$changed" | grep -Eq '^(src/shared/db/migrations/|migrations/|scripts/check-migration-baseline\.ts$|src/shared/db/__tests__/migration-baseline\.test\.ts$|package\.json$|pnpm-lock\.yaml$|\.github/workflows/mkety-migration-baseline\.yml$)'; then
                continue
              fi

              echo "Verified inherited $label proof from ancestor $candidate; no migration-baseline trigger paths changed afterward."
              return 0
            done </tmp/mail-migration-proof-candidates

            echo "No acceptable $label proof found."
            return 1
          }

          verify_migration_proof
          verify_infra_proof mkety-cloudflare-vinext-smoke.yml Cloudflare-Smoke '^(src/|package\.json$|pnpm-lock\.yaml$|vite\.config\.ts$|wrangler\.jsonc$|\.github/workflows/mkety-cloudflare-vinext-smoke\.yml$)'

          main_after="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/branches/main")"
          head_after="$(MAIN="$main_after" node -e "process.stdout.write(JSON.parse(process.env.MAIN).commit.sha)")"
          [ "$head_after" = "$VERIFIED_SHA" ] || { echo "main advanced to $head_after while Mail authorization was running; refusing stale production release for $VERIFIED_SHA"; exit 1; }

  production-db:
    needs: authorize
    uses: ./.github/workflows/mkety-coolify-production-db-executor.yml
    with:
      verified_sha: ${{ needs.authorize.outputs.verified_sha }}
      release_branch: main
    secrets:
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      MKETY_PLATFORM_CONTROL_TENANT_SLUG: ${{ secrets.MKETY_PLATFORM_CONTROL_TENANT_SLUG }}

  deploy-mail:
    needs: [authorize, production-db]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      VERIFIED_SHA: ${{ needs.authorize.outputs.verified_sha }}
      MKETY_FIRST_PARTY_MAIL_TENANT_ID: ${{ needs.production-db.outputs.first_party_mail_tenant_id }}
      MKETY_FIRST_PARTY_MAIL_READINESS: ${{ needs.production-db.outputs.first_party_mail_readiness }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.verified_sha }}
          fetch-depth: 1

      - name: Validate tenant binding before deployment
        shell: bash
        run: |
          set -euo pipefail
          [[ "$MKETY_FIRST_PARTY_MAIL_TENANT_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]] || {
            echo '::error::Private DB executor did not return a valid first-party Mail tenant UUID.'
            exit 1
          }
          [ -n "$MKETY_FIRST_PARTY_MAIL_READINESS" ] || {
            echo '::error::Private DB executor did not return Mail readiness status.'
            exit 1
          }
          echo "::add-mask::$MKETY_FIRST_PARTY_MAIL_TENANT_ID"
          echo "First-party Mail readiness preflight: $MKETY_FIRST_PARTY_MAIL_READINESS"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo 'CLOUDFLARE_API_TOKEN missing'; exit 1; }
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || { echo 'CLOUDFLARE_ACCOUNT_ID missing'; exit 1; }
          curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID" >/tmp/cf-account.json

      - name: Verify Mail infrastructure permissions before deployment
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Accept: application/json')

          check_permission() {
            label="$1"
            permission="$2"
            url="$3"
            code="$(curl -sS -o /tmp/mail-permission.json -w '%{http_code}' "${auth[@]}" "$url")"
            if [ "$code" != '200' ]; then
              echo "::error::$label permission check failed with HTTP $code. Update the repository CLOUDFLARE_API_TOKEN to include: $permission."
              exit 1
            fi
          }

          check_permission 'R2' 'Workers R2 Storage Write' "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets"
          check_permission 'Queues' 'Queues Edit' "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/queues"
          check_permission 'Event subscriptions' 'Queues Edit (or Workers Scripts Write)' "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/event_subscriptions/subscriptions?per_page=1"

          echo 'Mail infrastructure permission preflight passed.'

      - name: Resolve production Hyperdrive
        id: hyperdrive
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Accept: application/json' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/hyperdrive/configs?per_page=100")"
          HYPERDRIVES="$response" NAME="$MKETY_HYPERDRIVE_NAME" node <<'NODE' >/tmp/mkety-mail-hyperdrive-id
          const x=JSON.parse(process.env.HYPERDRIVES||'{}');
          const matches=(x.result||[]).filter((item)=>item.name===process.env.NAME);
          if(!x.success||matches.length!==1||!matches[0]?.id) throw new Error('Expected exactly one production Mkety Hyperdrive.');
          process.stdout.write(matches[0].id);
          NODE
          echo "id=$(cat /tmp/mkety-mail-hyperdrive-id)" >> "$GITHUB_OUTPUT"

      - name: Build and deploy exact Mkety application SHA
        shell: bash
        env:
          MKETY_HYPERDRIVE_ID: ${{ steps.hyperdrive.outputs.id }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const config=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          if(!process.env.MKETY_HYPERDRIVE_ID) throw new Error('Missing production Hyperdrive id.');
          config.name=process.env.PRODUCTION_WORKER_NAME;
          config.workers_dev=true;
          config.preview_urls=true;
          config.keep_vars=true;
          config.vars={...(config.vars||{}),SKIP_ENV_VALIDATION:'true'};
          config.hyperdrive=[{binding:'MKETY_DB',id:process.env.MKETY_HYPERDRIVE_ID}];
          delete config.route;
          delete config.routes;
          fs.writeFileSync('wrangler.jsonc',JSON.stringify(config,null,2)+'\n');
          NODE
          pnpm build
          pnpm run deploy --dry-run
          pnpm run deploy

      - name: Build and deploy exact Mkety app-host SHA
        shell: bash
        env:
          MKETY_HYPERDRIVE_ID: ${{ steps.hyperdrive.outputs.id }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const config=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          if(!process.env.MKETY_HYPERDRIVE_ID) throw new Error('Missing production Hyperdrive id.');
          config.name=process.env.APP_HOST_WORKER_NAME;
          config.workers_dev=false;
          config.preview_urls=false;
          config.keep_vars=true;
          config.hyperdrive=[{binding:'MKETY_DB',id:process.env.MKETY_HYPERDRIVE_ID}];
          config.vars={...(config.vars||{}),NEXT_PUBLIC_APP_URL:'https://app.mkety.com'};
          delete config.route;
          delete config.routes;
          fs.writeFileSync('wrangler.jsonc',JSON.stringify(config,null,2)+'\\n');
          NODE
          pnpm build
          pnpm run deploy --dry-run
          pnpm run deploy

          pnpm exec wrangler secret list --name "$APP_HOST_WORKER_NAME" --env="" --format json >/tmp/mkety-app-host-auth-secrets.json
          node <<'NODE'
          const fs=require('node:fs');
          const raw=fs.readFileSync('/tmp/mkety-app-host-auth-secrets.json','utf8');
          const start=raw.indexOf('[');
          const rows=start>=0?JSON.parse(raw.slice(start)):[];
          const names=new Set(rows.map((row)=>row.name));
          const required=['MKETY_AUTH_PROVIDER','MKETY_AUTH_ISSUER','MKETY_AUTH_CLIENT_ID','MKETY_AUTH_SESSION_SECRET','MKETY_AUTH_REDIRECT_URI','MKETY_PLATFORM_CONTROL_TENANT_SLUG','MKETY_PLATFORM_ADMIN_EMAILS'];
          const missing=required.filter((name)=>!names.has(name));
          if(missing.length) throw new Error('App-host deploy lacks required Auth bindings: '+missing.join(', '));
          console.log('Verified required auth bindings remain on the dedicated app-host Worker.');
          NODE

      - name: Verify central Mkety auth bindings survived app deploy
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler secret list --name "$PRODUCTION_WORKER_NAME" --format json >/tmp/mkety-mail-app-secrets.json
          node <<'NODE'
          const fs=require('node:fs');
          const raw=fs.readFileSync('/tmp/mkety-mail-app-secrets.json','utf8');
          const start=raw.indexOf('[');
          const rows=start>=0?JSON.parse(raw.slice(start)):[];
          const names=new Set(rows.map((row)=>row.name));
          const required=['MKETY_AUTH_PROVIDER','MKETY_AUTH_ISSUER','MKETY_AUTH_CLIENT_ID','MKETY_AUTH_REDIRECT_URI','MKETY_AUTH_SESSION_SECRET','NEXT_PUBLIC_APP_URL'];
          const missing=required.filter((name)=>!names.has(name));
          if(missing.length) throw new Error('Mkety app deploy lost required Auth bindings: '+missing.join(', '));
          NODE

      - name: Provision R2 and queues idempotently
        id: infra
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')

          buckets="$(curl -fsS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets")"
          if ! BUCKETS="$buckets" NAME="$MAIL_BUCKET" node -e "const x=JSON.parse(process.env.BUCKETS||'{}');process.exit((x.result?.buckets||x.result||[]).some?.(b=>b.name===process.env.NAME)?0:1)"; then
            body="$(NAME="$MAIL_BUCKET" node -e "process.stdout.write(JSON.stringify({name:process.env.NAME}))")"
            curl -fsS -X POST "${auth[@]}" --data "$body" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets" >/dev/null
          fi

          ensure_queue() {
            name="$1"
            queues="$(curl -fsS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/queues")"
            id="$(QUEUES="$queues" NAME="$name" node -e "const x=JSON.parse(process.env.QUEUES||'{}');const a=Array.isArray(x.result)?x.result:(x.result?.queues||[]);const q=a.find(v=>(v.queue_name||v.name)===process.env.NAME);if(q)process.stdout.write(String(q.queue_id||q.id||''))")"
            if [ -z "$id" ]; then
              body="$(NAME="$name" node -e "process.stdout.write(JSON.stringify({queue_name:process.env.NAME}))")"
              created="$(curl -fsS -X POST "${auth[@]}" --data "$body" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/queues")"
              id="$(CREATED="$created" node -e "const x=JSON.parse(process.env.CREATED||'{}');process.stdout.write(String(x.result?.queue_id||x.result?.id||''))")"
            fi
            [ -n "$id" ] || { echo "Could not resolve queue id for $name"; exit 1; }
            printf '%s' "$id"
          }

          send_id="$(ensure_queue "$MAIL_SEND_QUEUE")"
          dead_id="$(ensure_queue "$MAIL_DEAD_QUEUE")"
          event_id="$(ensure_queue "$MAIL_EVENT_QUEUE")"
          event_dead_id="$(ensure_queue "$MAIL_EVENT_DEAD_QUEUE")"
          migration_id="$(ensure_queue "$MAIL_MIGRATION_QUEUE")"
          migration_dead_id="$(ensure_queue "$MAIL_MIGRATION_DEAD_QUEUE")"
          echo "send_queue_id=$send_id" >> "$GITHUB_OUTPUT"
          echo "dead_queue_id=$dead_id" >> "$GITHUB_OUTPUT"
          echo "event_queue_id=$event_id" >> "$GITHUB_OUTPUT"
          echo "event_dead_queue_id=$event_dead_id" >> "$GITHUB_OUTPUT"
          echo "migration_queue_id=$migration_id" >> "$GITHUB_OUTPUT"
          echo "migration_dead_queue_id=$migration_dead_id" >> "$GITHUB_OUTPUT"

      - name: Deploy Mail workers
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler deploy -c workers/mail-ingress/wrangler.jsonc
          pnpm exec wrangler deploy -c workers/mail-dispatch/wrangler.jsonc
          pnpm exec wrangler deploy -c workers/mail-events/wrangler.jsonc
          pnpm exec wrangler deploy -c workers/mail-content/wrangler.jsonc
          pnpm exec wrangler deploy -c workers/mail-migration/wrangler.jsonc

      - name: Attach Mail runtime secrets
        shell: bash
        env:
          SEND_QUEUE_ID: ${{ steps.infra.outputs.send_queue_id }}
          EVENT_QUEUE_ID: ${{ steps.infra.outputs.event_queue_id }}
          MIGRATION_QUEUE_ID: ${{ steps.infra.outputs.migration_queue_id }}
          MKETY_FIRST_PARTY_MAIL_TENANT_ID: ${{ needs.production-db.outputs.first_party_mail_tenant_id }}
        run: |
          set -euo pipefail
          [[ "$MKETY_FIRST_PARTY_MAIL_TENANT_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$ ]] || {
            echo '::error::Private DB executor did not return a valid first-party Mail tenant UUID.'
            exit 1
          }
          echo "::add-mask::$MKETY_FIRST_PARTY_MAIL_TENANT_ID"
          echo "First-party Mail readiness preflight: ${MKETY_FIRST_PARTY_MAIL_READINESS:-unknown}"
          internal_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$internal_secret"

          put() {
            worker="$1"; name="$2"; value="$3"
            printf '%s' "$value" | pnpm exec wrangler secret put "$name" --name "$worker" --env="" >/dev/null
          }

          put "$MAIL_INGRESS_WORKER" MKETY_MAIL_INTERNAL_SECRET "$internal_secret"
          put "$MAIL_INGRESS_WORKER" MKETY_MAIL_RESOLVE_URL 'https://api.mkety.com/api/internal/mail/resolve-recipient'
          put "$MAIL_INGRESS_WORKER" MKETY_MAIL_INGEST_URL 'https://api.mkety.com/api/internal/mail/ingest'

          put "$MAIL_DISPATCH_WORKER" MKETY_MAIL_INTERNAL_SECRET "$internal_secret"
          put "$MAIL_DISPATCH_WORKER" MKETY_MAIL_CALLBACK_URL 'https://api.mkety.com/api/internal/mail/dispatch-result'

          put "$MAIL_EVENT_WORKER" MKETY_MAIL_INTERNAL_SECRET "$internal_secret"
          put "$MAIL_EVENT_WORKER" MKETY_MAIL_EVENT_CALLBACK_URL 'https://api.mkety.com/api/internal/mail/provider-event'

          put "$MAIL_CONTENT_WORKER" MKETY_MAIL_INTERNAL_SECRET "$internal_secret"

          put "$MAIL_MIGRATION_WORKER" MKETY_MAIL_INTERNAL_SECRET "$internal_secret"
          put "$MAIL_MIGRATION_WORKER" MKETY_MAIL_INTERNAL_API_URL 'https://api.mkety.com'

          put "$PRODUCTION_WORKER_NAME" MKETY_MAIL_INTERNAL_SECRET "$internal_secret"
          put "$PRODUCTION_WORKER_NAME" MKETY_MAIL_QUEUE_ID "$SEND_QUEUE_ID"
          put "$PRODUCTION_WORKER_NAME" MKETY_MAIL_EVENT_QUEUE_ID "$EVENT_QUEUE_ID"
          put "$PRODUCTION_WORKER_NAME" MKETY_MAIL_MIGRATION_QUEUE_ID "$MIGRATION_QUEUE_ID"
          put "$PRODUCTION_WORKER_NAME" MKETY_MAIL_HOST 'mail.mkety.com'
          put "$PRODUCTION_WORKER_NAME" MKETY_FIRST_PARTY_MAIL_TENANT_ID "$MKETY_FIRST_PARTY_MAIL_TENANT_ID"
          # The authenticated admin UI and its server actions run on this separate Worker.
          put "$APP_HOST_WORKER_NAME" MKETY_FIRST_PARTY_MAIL_TENANT_ID "$MKETY_FIRST_PARTY_MAIL_TENANT_ID"
          put "$PRODUCTION_WORKER_NAME" MKETY_MAIL_CONTENT_URL 'https://mail-content.mkety.com'
          # External IMAP/SMTP remains fail-closed until the dedicated TCP gateway
          # passes TLS, app-password, mailbox and send acceptance.
          put "$PRODUCTION_WORKER_NAME" MKETY_MAIL_EXTERNAL_CLIENTS_ENABLED 'false'

          pnpm exec wrangler secret list --name "$PRODUCTION_WORKER_NAME" --env="" --format json >/tmp/mkety-mail-runtime-secrets.json
          node <<'NODE'
          const fs=require('node:fs');
          const raw=fs.readFileSync('/tmp/mkety-mail-runtime-secrets.json','utf8');
          const start=raw.indexOf('[');
          const rows=start>=0?JSON.parse(raw.slice(start)):[];
          const names=new Set(rows.map((row)=>row.name));
          const required=[
            'MKETY_FIRST_PARTY_MAIL_TENANT_ID',
            'MKETY_MAIL_INTERNAL_SECRET',
            'MKETY_MAIL_QUEUE_ID',
            'MKETY_MAIL_EVENT_QUEUE_ID',
            'MKETY_MAIL_MIGRATION_QUEUE_ID',
            'MKETY_MAIL_HOST',
            'MKETY_MAIL_CONTENT_URL',
            'MKETY_MAIL_EXTERNAL_CLIENTS_ENABLED',
          ];
          const missing=required.filter((name)=>!names.has(name));
          if(missing.length) throw new Error('Missing top-level Mail runtime secrets: '+missing.join(', '));
          NODE

          pnpm exec wrangler secret list --name "$APP_HOST_WORKER_NAME" --env="" --format json >/tmp/mkety-app-host-mail-secrets.json
          node <<'NODE'
          const fs=require('node:fs');
          const raw=fs.readFileSync('/tmp/mkety-app-host-mail-secrets.json','utf8');
          const start=raw.indexOf('[');
          const rows=start>=0?JSON.parse(raw.slice(start)):[];
          const names=new Set(rows.map((row)=>row.name));
          if(!names.has('MKETY_FIRST_PARTY_MAIL_TENANT_ID')) {
            throw new Error('Missing top-level first-party Mail tenant binding on app-host Worker');
          }
          console.log('First-party Mail tenant binding verified on authenticated app-host Worker.');
          NODE

      - name: Attach Mkety Mail application domains
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          zone_response="$(curl -fsS "${auth[@]}" "$api/zones?name=mkety.com&status=active")"
          zone_id="$(ZONE="$zone_response" node -e "const x=JSON.parse(process.env.ZONE||'{}');const z=(x.result||[])[0];if(!z?.id)process.exit(1);process.stdout.write(z.id)")"

          reconcile_domain() {
            host="$1"
            worker="$2"
            body="$(HOST="$host" ZONE="$zone_id" WORKER="$worker" node -e "process.stdout.write(JSON.stringify({hostname:process.env.HOST,service:process.env.WORKER,zone_id:process.env.ZONE,zone_name:'mkety.com'}))")"

            # PUT is intentionally idempotent and also repairs a hostname that
            # already exists but points at a stale Worker service.
            curl -fsS -X PUT "${auth[@]}" --data "$body" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" >/dev/null

            domains="$(curl -fsS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains")"
            actual="$(DOMAINS="$domains" HOST="$host" node -e "const x=JSON.parse(process.env.DOMAINS||'{}');const d=(x.result||[]).find(v=>v.hostname===process.env.HOST);if(d)process.stdout.write(String(d.service||''))")"
            [ "$actual" = "$worker" ] || {
              echo "::error::Custom domain $host maps to '${actual:-missing}', expected '$worker'."
              exit 1
            }
            echo "Verified custom domain $host -> $worker"
          }

          for host in mail.mkety.com api.mkety.com autoconfig.mkety.com autodiscover.mkety.com; do
            reconcile_domain "$host" "$PRODUCTION_WORKER_NAME"
          done

          reconcile_domain 'mail-content.mkety.com' "$MAIL_CONTENT_WORKER"

      - name: Production smoke
        shell: bash
        run: |
          set -euo pipefail

          fetch_expected() {
            label="$1"
            url="$2"
            expected_codes="$3"
            output="$4"
            method="${5:-GET}"
            body="${6:-}"
            follow_redirects="${7:-true}"
            code='000'

            for attempt in 1 2 3 4 5; do
              args=(--connect-timeout 10 --max-time 30 -sS -o "$output" -w '%{http_code}')
              [ "$follow_redirects" = true ] && args+=(-L)
              if [ "$method" = 'POST' ]; then
                args+=(-X POST -H 'Content-Type: application/json' --data "$body")
              fi
              code="$(curl "${args[@]}" "$url" || true)"
              echo "$label attempt $attempt: HTTP $code"
              case " $expected_codes " in
                *" $code "*) return 0 ;;
              esac
              sleep 3
            done

            echo "::error::$label failed after bounded retries; last HTTP $code"
            head -c 500 "$output" 2>/dev/null || true
            echo
            return 1
          }

          fetch_expected 'Mail app host' 'https://mail.mkety.com/' '200 302 307 308' /tmp/mail-home GET '' false
          # Public mkety.com availability is certified by the public-site release
          # pipeline. Do not let a separate public-host transport incident invalidate
          # the Mail application/API/Worker infrastructure release.
          if fetch_expected 'Public Mail page (advisory)' 'https://mkety.com/mail' '200' /tmp/mail-public; then
            grep -Fq 'Mkety Mail' /tmp/mail-public || echo '::warning::Public Mail page responded but expected product identity was not found.'
          else
            echo '::warning::Public mkety.com/mail is unavailable from this runner; track under public-host readiness.'
          fi

          fetch_expected 'Mail autoconfig fail-closed' 'https://autoconfig.mkety.com/mail/config-v1.1.xml?emailaddress=hello%40example.com' '503' /tmp/mail-autoconfig
          fetch_expected 'Mail API fail-closed smoke' 'https://api.mkety.com/api/v1/mail/send' '401' /tmp/mail-api POST '{}'
          fetch_expected 'Mail content fail-closed smoke' 'https://mail-content.mkety.com' '401' /tmp/mail-content POST '{"key":"mail/nope"}'

      - name: Publish deployment evidence
        shell: bash
        env:
          SEND_QUEUE_ID: ${{ steps.infra.outputs.send_queue_id }}
          MIGRATION_QUEUE_ID: ${{ steps.infra.outputs.migration_queue_id }}
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Mkety Mail production
          - SHA: `$VERIFIED_SHA`
          - R2: `$MAIL_BUCKET`
          - send queue: `$MAIL_SEND_QUEUE`
          - DLQ: `$MAIL_DEAD_QUEUE`
          - migration queue: `$MAIL_MIGRATION_QUEUE`
          - ingress worker: `$MAIL_INGRESS_WORKER`
          - dispatch worker: `$MAIL_DISPATCH_WORKER`
          - event worker: `$MAIL_EVENT_WORKER`
          - content worker: `$MAIL_CONTENT_WORKER`
          - event queue: `$MAIL_EVENT_QUEUE`
          - Mail app/API/content smoke: PASS
          - External IMAP/SMTP clients: DISABLED pending dedicated TCP-gateway acceptance
          - Public mkety.com/mail availability is tracked separately by the public-site release boundary.
          - Internal Mail secret generated during deployment and never printed.
          EOF
