name: Mkety DomainNameAPI OT&E Acceptance

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN_DOMAINNAMEAPI_OTE_ACCEPTANCE
        required: true
        type: string
      lifecycle:
        description: Also perform OT&E register + renew using the configured contact reference
        required: false
        default: false
        type: boolean
      contact_ref:
        description: OT&E registrant contact reference required only for lifecycle acceptance
        required: false
        type: string

permissions:
  contents: read

jobs:
  domainnameapi-ote-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview
    env:
      DOMAIN_ACCEPTANCE_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      MKETY_CONNECTION_SECRET_ENCRYPTION_KEY: ${{ secrets.MKETY_CONNECTION_SECRET_ENCRYPTION_KEY }}
      DOMAIN_ACCEPTANCE_LIFECYCLE: ${{ inputs.lifecycle }}
      DOMAIN_ACCEPTANCE_CONTACT_REF: ${{ inputs.contact_ref }}
    steps:
      - name: Require explicit OT&E authorization
        shell: bash
        run: |
          set -euo pipefail
          [ "${{ inputs.confirmation }}" = "RUN_DOMAINNAMEAPI_OTE_ACCEPTANCE" ] || {
            echo "Refusing DomainNameAPI OT&E acceptance without exact confirmation." >&2
            exit 1
          }

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate bootstrap acceptance secrets
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${DOMAIN_ACCEPTANCE_DATABASE_URL:-}" ] || { echo "Missing preview STAGING_DATABASE_URL." >&2; exit 1; }
          [ -n "${MKETY_CONNECTION_SECRET_ENCRYPTION_KEY:-}" ] || { echo "Missing preview MKETY_CONNECTION_SECRET_ENCRYPTION_KEY." >&2; exit 1; }
          echo "::add-mask::$DOMAIN_ACCEPTANCE_DATABASE_URL"
          echo "::add-mask::$MKETY_CONNECTION_SECRET_ENCRYPTION_KEY"
          if [ "${DOMAIN_ACCEPTANCE_LIFECYCLE}" = "true" ] && [ -z "${DOMAIN_ACCEPTANCE_CONTACT_REF:-}" ]; then
            echo "Lifecycle acceptance requires an OT&E contact_ref input." >&2
            exit 1
          fi

      - name: Verify database-backed DomainNameAPI OT&E connection
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/accept-domainnameapi-ote.ts | tee /tmp/domainnameapi-acceptance.json

      - name: Publish DomainNameAPI evidence
        shell: bash
        run: |
          set -euo pipefail
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/domainnameapi-acceptance.json','utf8'));const rows=['## DomainNameAPI OT&E acceptance','','- Credential source: encrypted database connection','- Environment: '+x.environment,'- Domain checked: '+x.domain,'- Availability transport: passed','- Currency: '+x.currency,'- Lifecycle: '+x.lifecycle];fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,rows.join('\\n')+'\\n');"
