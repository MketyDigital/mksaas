name: Mkety Coolify Migration Build Diagnostic

on:
  push:
    branches:
      - ops/redis-auth-diagnostic-20260914
    paths:
      - .github/workflows/mkety-coolify-migration-build-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      COOLIFY_URL: https://deploy.mkety.com
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      DEPLOYMENT_UUID: fnip2sggynlojfoqnthol3cq
    steps:
      - name: Retrieve sanitized failed Coolify deployment logs
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${COOLIFY_API_TOKEN:-}" ] || { echo 'COOLIFY_TOKEN is required.'; exit 1; }
          echo "::add-mask::$COOLIFY_API_TOKEN"
          base="${COOLIFY_URL%/}/api/v1"

          code='000'
          for i in $(seq 1 30); do
            code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/deployment.json -w '%{http_code}' \
              -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
              "$base/deployments/$DEPLOYMENT_UUID" || true)"
            if [ "$code" = '200' ]; then
              break
            fi
            echo "MKETY_DIAG_DEPLOYMENT_FETCH_HTTP=$code"
            sleep 2
          done
          [ "$code" = '200' ] || { echo "Unable to retrieve deployment record after retries; last HTTP=$code"; exit 2; }

          TOKEN="$COOLIFY_API_TOKEN" node <<'NODE'
          const fs=require('node:fs');
          const x=JSON.parse(fs.readFileSync('/tmp/deployment.json','utf8'));
          let logs=String(x.logs||'');
          const token=process.env.TOKEN;
          if (token) logs=logs.split(token).join('***');
          logs=logs
            .replace(/postgres(?:ql)?:\/\/[^\s@]+@/gi,'postgresql://***@')
            .replace(/Authorization:\s*Bearer\s+[^\s]+/gi,'Authorization: Bearer ***')
            .replace(/(password|token|secret)=([^\s]+)/gi,'$1=***');
          const lines=logs.split(/\r?\n/).slice(-260);
          console.log(`MKETY_DIAG_DEPLOYMENT_STATUS=${String(x.status||'unknown')}`);
          console.log(`MKETY_DIAG_COMMIT=${String(x.commit||'unknown')}`);
          console.log('----- SANITIZED COOLIFY DEPLOYMENT LOG TAIL -----');
          console.log(lines.join('\n'));
          console.log('----- END SANITIZED COOLIFY DEPLOYMENT LOG TAIL -----');
          console.log('MKETY_DIAG_DEPLOYMENT_LOG_CAPTURED=true');
          NODE
