name: Mkety Coolify Migration Build Diagnostic

on:
  push:
    branches:
      - ops/redis-auth-diagnostic-20260914
    paths:
      - .github/workflows/mkety-coolify-migration-build-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      COOLIFY_URL: https://deploy.mkety.com
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      PROJECT_UUID: 0zqhpkprlhtvlacmsgmfyyhs
      ENVIRONMENT_UUID: rtebcetyfvzlaiqitzcp0gl8
      SERVER_UUID: ynkdc4tx6bi7cyxf0kuy8kte
      POSTGRES_UUID: hgxwkiyxgbmb2i3pl57kmxc8
      RELEASE_BRANCH: feat/mkety-public-site-production
      TARGET_SHA: e99a2b14753ebdb546085720dd967f7751e0bd2e
    steps:
      - name: Reproduce migration-host build and capture deployment logs
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${COOLIFY_API_TOKEN:-}" ] || { echo 'COOLIFY_TOKEN is required.'; exit 1; }
          base="${COOLIFY_URL%/}/api/v1"

          curl --proto '=https' --tlsv1.2 -fsS \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            "$base/databases/$POSTGRES_UUID" -o /tmp/production-db.json

          DATABASE_URL="$(node <<'NODE'
          const db = require('/tmp/production-db.json');
          const healthy = String(db.status || '').toLowerCase().includes('healthy');
          if (db.is_public !== false || db.enable_ssl !== true || !healthy || !db.internal_db_url) {
            throw new Error('Private PostgreSQL preflight failed');
          }
          process.stdout.write(String(db.internal_db_url));
          NODE
          )"
          echo "::add-mask::$DATABASE_URL"
          echo "::add-mask::$COOLIFY_API_TOKEN"

          TARGET_SHA="$TARGET_SHA" PROJECT_UUID="$PROJECT_UUID" ENVIRONMENT_UUID="$ENVIRONMENT_UUID" SERVER_UUID="$SERVER_UUID" RELEASE_BRANCH="$RELEASE_BRANCH" node <<'NODE' >/tmp/create-app.json
          process.stdout.write(JSON.stringify({
            project_uuid: process.env.PROJECT_UUID,
            server_uuid: process.env.SERVER_UUID,
            environment_uuid: process.env.ENVIRONMENT_UUID,
            git_repository: 'https://github.com/MketyDigital/mksaas',
            git_branch: process.env.RELEASE_BRANCH,
            git_commit_sha: process.env.TARGET_SHA,
            build_pack: 'dockerfile',
            dockerfile_location: '/ops/coolify-migration/Dockerfile',
            ports_exposes: '3000',
            name: `mkety-db-build-diag-${process.env.TARGET_SHA.slice(0,12)}`,
            description: `Diagnostics-only migration build reproduction for ${process.env.TARGET_SHA}`,
            autogenerate_domain: false,
            connect_to_docker_network: true,
            instant_deploy: false
          }));
          NODE

          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/create-response.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @/tmp/create-app.json "$base/applications/public")"
          [ "$code" = '201' ] || { echo "MKETY_DIAG_CREATE_HTTP=$code"; cat /tmp/create-response.json; exit 2; }
          APP_UUID="$(node -e "const x=require('/tmp/create-response.json'); if(!x.uuid) process.exit(1); process.stdout.write(x.uuid)")"

          cleanup() {
            curl --proto '=https' --tlsv1.2 -sS -X DELETE \
              -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
              "$base/applications/$APP_UUID" >/dev/null || true
            echo 'MKETY_DIAG_EPHEMERAL_APP_CLEANED=true'
          }
          trap cleanup EXIT

          DB="$DATABASE_URL" node <<'NODE' >/tmp/db-env.json
          process.stdout.write(JSON.stringify({key:'DATABASE_URL',value:process.env.DB,is_preview:false,is_literal:true,is_multiline:false,is_shown_once:true}));
          NODE
          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/env-response.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @/tmp/db-env.json "$base/applications/$APP_UUID/envs")"
          [ "$code" = '201' ] || { echo "MKETY_DIAG_ENV_HTTP=$code"; exit 3; }

          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/deploy.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $COOLIFY_API_TOKEN" "$base/deploy?uuid=$APP_UUID&force=true")"
          [ "$code" = '200' ] || { echo "MKETY_DIAG_DEPLOY_HTTP=$code"; cat /tmp/deploy.json; exit 4; }
          DEPLOYMENT_UUID="$(node -e "const x=require('/tmp/deploy.json'); const d=Array.isArray(x.deployments)?x.deployments[0]:null; if(!d?.deployment_uuid) process.exit(1); process.stdout.write(d.deployment_uuid)")"
          echo "MKETY_DIAG_DEPLOYMENT_UUID=$DEPLOYMENT_UUID"

          for i in $(seq 1 90); do
            curl --proto '=https' --tlsv1.2 -fsS \
              -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
              "$base/deployments/$DEPLOYMENT_UUID" -o /tmp/deployment.json
            status="$(node -e "const x=require('/tmp/deployment.json'); process.stdout.write(String(x.status||''))")"
            case "${status,,}" in
              finished|success|successful|succeeded|completed|failed|failure|error|cancelled|canceled) break ;;
            esac
            sleep 3
          done

          DB="$DATABASE_URL" TOKEN="$COOLIFY_API_TOKEN" node <<'NODE'
          const fs=require('node:fs');
          const x=JSON.parse(fs.readFileSync('/tmp/deployment.json','utf8'));
          let logs=String(x.logs||'');
          for (const secret of [process.env.DB, process.env.TOKEN]) {
            if (secret) logs=logs.split(secret).join('***');
          }
          logs=logs
            .replace(/postgres(?:ql)?:\/\/[^\s@]+@/gi,'postgresql://***@')
            .replace(/Authorization:\s*Bearer\s+[^\s]+/gi,'Authorization: Bearer ***');
          const lines=logs.split(/\r?\n/).slice(-220);
          console.log(`MKETY_DIAG_DEPLOYMENT_STATUS=${String(x.status||'unknown')}`);
          console.log('----- SANITIZED COOLIFY DEPLOYMENT LOG TAIL -----');
          console.log(lines.join('\n'));
          console.log('----- END SANITIZED COOLIFY DEPLOYMENT LOG TAIL -----');
          console.log('MKETY_DIAG_DEPLOYMENT_LOG_CAPTURED=true');
          NODE
