name: Mkety Coolify Migration Build Diagnostic

on:
  push:
    branches:
      - ops/redis-auth-diagnostic-20260914
    paths:
      - .github/workflows/mkety-coolify-migration-build-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      COOLIFY_URL: https://deploy.mkety.com
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      PROJECT_UUID: 0zqhpkprlhtvlacmsgmfyyhs
      ENVIRONMENT_UUID: rtebcetyfvzlaiqitzcp0gl8
      SERVER_UUID: ynkdc4tx6bi7cyxf0kuy8kte
      POSTGRES_UUID: hgxwkiyxgbmb2i3pl57kmxc8
      TARGET_BRANCH: fix/optional-rls-auto-enable-hardening
      TARGET_SHA: d7e0d78a6b99e37615f3290d94f08684c84d1eee

    steps:
      - name: Verify fixed exact SHA through isolated production migration host
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${COOLIFY_API_TOKEN:-}" ] || { echo 'COOLIFY_TOKEN is required.'; exit 1; }
          echo "::add-mask::$COOLIFY_API_TOKEN"
          base="${COOLIFY_URL%/}/api/v1"

          curl --proto '=https' --tlsv1.2 -fsS \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            "$base/databases/$POSTGRES_UUID" -o /tmp/production-db.json

          DATABASE_URL="$(node <<'NODE'
          const db = require('/tmp/production-db.json');
          const healthy = String(db.status || '').toLowerCase().includes('healthy');
          if (db.is_public !== false || db.enable_ssl !== true || !healthy || !db.internal_db_url) {
            throw new Error('Private PostgreSQL preflight failed');
          }
          process.stdout.write(String(db.internal_db_url));
          NODE
          )"
          [ -n "$DATABASE_URL" ] || { echo 'Private PostgreSQL URL resolution failed.'; exit 1; }
          echo "::add-mask::$DATABASE_URL"
          echo 'MKETY_DIAG_PRIVATE_DB_OK=true'

          TARGET_SHA="$TARGET_SHA" TARGET_BRANCH="$TARGET_BRANCH" PROJECT_UUID="$PROJECT_UUID" ENVIRONMENT_UUID="$ENVIRONMENT_UUID" SERVER_UUID="$SERVER_UUID" GITHUB_RUN_ID="$GITHUB_RUN_ID" node <<'NODE' >/tmp/create-app.json
          process.stdout.write(JSON.stringify({
            project_uuid: process.env.PROJECT_UUID,
            server_uuid: process.env.SERVER_UUID,
            environment_uuid: process.env.ENVIRONMENT_UUID,
            git_repository: 'https://github.com/MketyDigital/mksaas',
            git_branch: process.env.TARGET_BRANCH,
            git_commit_sha: process.env.TARGET_SHA,
            build_pack: 'dockerfile',
            dockerfile_location: '/ops/coolify-migration/Dockerfile',
            ports_exposes: '3000',
            name: `mkety-db-fix-verify-${process.env.GITHUB_RUN_ID}`,
            description: `Isolated production DB migration verification for ${process.env.TARGET_SHA}`,
            autogenerate_domain: false,
            connect_to_docker_network: true,
            instant_deploy: false
          }));
          NODE

          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/create-response.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @/tmp/create-app.json "$base/applications/public")"
          [ "$code" = '201' ] || { echo "Migration verification host creation failed with HTTP $code."; exit 2; }
          APP_UUID="$(node -e "const x=require('/tmp/create-response.json'); if(!x.uuid) process.exit(1); process.stdout.write(x.uuid)")"
          echo 'MKETY_DIAG_EPHEMERAL_APP_CREATED=true'

          cleanup() {
            set +e
            for i in $(seq 1 10); do
              cleanup_code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/cleanup.json -w '%{http_code}' \
                -X DELETE -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
                "$base/applications/$APP_UUID" || true)"
              if [ "$cleanup_code" = '200' ] || [ "$cleanup_code" = '204' ] || [ "$cleanup_code" = '404' ]; then
                echo 'MKETY_DIAG_EPHEMERAL_APP_CLEANED=true'
                return 0
              fi
              sleep 2
            done
            echo "MKETY_DIAG_CLEANUP_LAST_HTTP=$cleanup_code"
          }
          trap cleanup EXIT

          DB="$DATABASE_URL" node <<'NODE' >/tmp/db-env.json
          process.stdout.write(JSON.stringify({key:'DATABASE_URL',value:process.env.DB,is_preview:false,is_literal:true,is_multiline:false,is_shown_once:true}));
          NODE
          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/env-response.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @/tmp/db-env.json "$base/applications/$APP_UUID/envs")"
          [ "$code" = '201' ] || { echo "Adding migration database secret failed with HTTP $code."; exit 3; }

          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/deploy.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $COOLIFY_API_TOKEN" "$base/deploy?uuid=$APP_UUID&force=true")"
          [ "$code" = '200' ] || { echo "Deploying migration verification host failed with HTTP $code."; exit 4; }
          DEPLOYMENT_UUID="$(node -e "const x=require('/tmp/deploy.json'); const d=Array.isArray(x.deployments)?x.deployments[0]:null; if(!d?.deployment_uuid) process.exit(1); process.stdout.write(d.deployment_uuid)")"

          deployment_ok='no'
          last_status='unknown'
          for i in $(seq 1 150); do
            fetch_code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/deployment.json -w '%{http_code}' \
              -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
              "$base/deployments/$DEPLOYMENT_UUID" || true)"
            if [ "$fetch_code" != '200' ]; then
              echo "MKETY_DIAG_DEPLOYMENT_FETCH_HTTP=$fetch_code"
              sleep 3
              continue
            fi
            last_status="$(node -e "const x=require('/tmp/deployment.json'); process.stdout.write(String(x.status||'unknown'))")"
            case "${last_status,,}" in
              finished|success|successful|succeeded|completed) deployment_ok='yes'; break ;;
              failed|failure|error|cancelled|canceled)
                echo "Migration verification deployment failed: $last_status"
                exit 5
                ;;
            esac
            sleep 3
          done
          [ "$deployment_ok" = 'yes' ] || { echo "Migration verification deployment did not complete successfully; last_status=$last_status"; exit 6; }
          echo 'MKETY_DIAG_DEPLOYMENT_OK=true'

          sequence_ok='no'
          for i in $(seq 1 90); do
            log_code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/app-logs.json -w '%{http_code}' \
              -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
              "$base/applications/$APP_UUID/logs?lines=220&show_timestamps=false" || true)"
            if [ "$log_code" = '200' ]; then
              if node <<'NODE'
          const fs=require('node:fs');
          let logs='';
          try { logs=String(JSON.parse(fs.readFileSync('/tmp/app-logs.json','utf8')).logs||''); } catch {}
          const required=[
            'MKETY_DB_STAGE_OK=base-migrate',
            'MKETY_DB_STAGE_OK=content-migrate',
            'MKETY_DB_STAGE_OK=content-seed',
            'MKETY_DB_STAGE_OK=content-smoke',
            'MKETY_DB_RELEASE_SEQUENCE_OK=true'
          ];
          process.exit(required.every(marker => logs.includes(marker)) ? 0 : 1);
          NODE
              then
                sequence_ok='yes'
                break
              fi
            else
              echo "MKETY_DIAG_APP_LOG_FETCH_HTTP=$log_code"
            fi
            sleep 3
          done

          if [ "$sequence_ok" != 'yes' ]; then
            if [ -f /tmp/app-logs.json ]; then
              node <<'NODE'
          const fs=require('node:fs');
          let logs='';
          try { logs=String(JSON.parse(fs.readFileSync('/tmp/app-logs.json','utf8')).logs||''); } catch {}
          const stages=[...logs.matchAll(/MKETY_DB_STAGE(?:_OK)?=([a-z-]+)/g)].map(m=>m[0]);
          console.log(`Safe migration stage evidence: ${stages.slice(-20).join(',') || 'none'}`);
          NODE
            fi
            echo 'Full production DB release sequence markers were not observed.'
            exit 7
          fi

          echo 'MKETY_DIAG_BASE_MIGRATE_OK=true'
          echo 'MKETY_DIAG_CONTENT_MIGRATE_OK=true'
          echo 'MKETY_DIAG_CONTENT_SEED_OK=true'
          echo 'MKETY_DIAG_CONTENT_SMOKE_OK=true'
          echo 'MKETY_DIAG_RELEASE_SEQUENCE_OK=true'
          echo "Fixed migration verified against private production PostgreSQL for exact SHA $TARGET_SHA."
