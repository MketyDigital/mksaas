name: Mkety Precutover Diagnostics

on:
  push:
    branches:
      - ops/precutover-diagnostics-20260913

permissions:
  contents: read

jobs:
  verify:
    name: Verify production DB backup, TLS, R2, and Hyperdrive
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      COOLIFY_URL: https://deploy.mkety.com
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      POSTGRES_UUID: hgxwkiyxgbmb2i3pl57kmxc8
      BACKUP_UUID: slamhu8pudyyj3qldejcgbr2
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_S3_API: ${{ secrets.R2_S3_API }}
      R2_BUCKET: mkety-production-db-backups
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MKETY_HYPERDRIVE_NAME: mkety-production-db

    steps:
      - name: Validate credentials
        shell: bash
        run: |
          set -euo pipefail
          for variable in COOLIFY_API_TOKEN R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_S3_API CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            [ -n "${!variable:-}" ] || { echo "$variable is required."; exit 1; }
          done
          [[ "$COOLIFY_URL" == https://* ]] || { echo 'Coolify must use HTTPS.'; exit 1; }
          [[ "$R2_S3_API" == https://* ]] || { echo 'R2 S3 endpoint must use HTTPS.'; exit 1; }

      - name: Inspect sanitized Coolify database and backup state
        id: coolify
        shell: bash
        run: |
          set -euo pipefail
          base="${COOLIFY_URL%/}/api/v1"
          curl --proto '=https' --tlsv1.2 -fsS \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            -H 'Accept: application/json' \
            "$base/databases/$POSTGRES_UUID" -o /tmp/postgres.json
          curl --proto '=https' --tlsv1.2 -fsS \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            -H 'Accept: application/json' \
            "$base/databases/$POSTGRES_UUID/backups" -o /tmp/backups.json

          node <<'NODE'
          const fs = require('node:fs');
          const db = JSON.parse(fs.readFileSync('/tmp/postgres.json', 'utf8'));
          const raw = JSON.parse(fs.readFileSync('/tmp/backups.json', 'utf8'));
          const list = Array.isArray(raw) ? raw : Array.isArray(raw?.data) ? raw.data : Array.isArray(raw?.backups) ? raw.backups : [];
          const backup = list.find((item) => item?.uuid === process.env.BACKUP_UUID);
          if (!backup) throw new Error('Expected production backup policy was not returned by Coolify.');

          const executions = Array.isArray(backup.executions) ? backup.executions : [];
          const latest = [...executions].sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0))[0] || null;
          const latestCreated = latest ? new Date(latest.created_at || 0).getTime() : NaN;
          const latestFresh = Number.isFinite(latestCreated) && Date.now() - latestCreated <= 30 * 60 * 60 * 1000;
          const latestStatus = String(latest?.status || '').toLowerCase();
          const latestSuccess = ['success', 'successful', 'succeeded', 'completed'].includes(latestStatus);
          const latestS3Uploaded = latest?.s3_uploaded === true || latest?.s3_uploaded === 1;

          const summary = {
            db: {
              uuid_matches: db.uuid === process.env.POSTGRES_UUID,
              name: db.name,
              status: db.status,
              private: db.is_public === false && (db.public_port === null || db.public_port === undefined || db.public_port === 0),
              enable_ssl: db.enable_ssl ?? null,
            },
            backup: {
              uuid_matches: backup.uuid === process.env.BACKUP_UUID,
              enabled: backup.enabled !== false,
              save_s3: backup.save_s3 === true,
              has_s3_storage_id: backup.s3_storage_id !== null && backup.s3_storage_id !== undefined && backup.s3_storage_id !== 0,
              has_s3_storage_uuid: Boolean(backup.s3_storage_uuid),
              returned_keys: Object.keys(backup).sort(),
              local_retention: Number(backup.database_backup_retention_amount_locally || 0),
              s3_retention: Number(backup.database_backup_retention_amount_s3 || 0),
              execution_count: executions.length,
              latest_execution: latest ? {
                status: latest.status ?? null,
                size: Number(latest.size || 0),
                created_at: latest.created_at ?? null,
                fresh_within_30h: latestFresh,
                success_status: latestSuccess,
                s3_uploaded: latestS3Uploaded,
                returned_keys: Object.keys(latest).sort(),
              } : null,
            },
          };

          fs.writeFileSync('/tmp/coolify-precutover.json', JSON.stringify(summary, null, 2));
          console.log(JSON.stringify(summary, null, 2));

          const out = process.env.GITHUB_OUTPUT;
          fs.appendFileSync(out, `db_private=${summary.db.private}\n`);
          fs.appendFileSync(out, `db_healthy=${String(summary.db.status || '').toLowerCase().includes('healthy')}\n`);
          fs.appendFileSync(out, `db_tls=${summary.db.enable_ssl === true}\n`);
          fs.appendFileSync(out, `backup_enabled=${summary.backup.enabled}\n`);
          fs.appendFileSync(out, `backup_save_s3=${summary.backup.save_s3}\n`);
          fs.appendFileSync(out, `backup_linked=${summary.backup.has_s3_storage_id || summary.backup.has_s3_storage_uuid}\n`);
          fs.appendFileSync(out, `local_retention_ok=${summary.backup.local_retention >= 7}\n`);
          fs.appendFileSync(out, `s3_retention_ok=${summary.backup.s3_retention >= 30}\n`);
          fs.appendFileSync(out, `coolify_execution_ok=${Boolean(latest && latestSuccess && latestFresh && Number(latest.size || 0) > 0)}\n`);
          fs.appendFileSync(out, `coolify_s3_uploaded=${latestS3Uploaded}\n`);
          NODE

      - name: Verify fresh non-empty R2 backup object
        id: r2
        shell: bash
        run: |
          set -euo pipefail
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION=auto
          if ! command -v aws >/dev/null 2>&1; then
            python3 -m pip install --user --quiet awscli
            export PATH="$HOME/.local/bin:$PATH"
          fi

          endpoint_origin="$(node -e "const u=new URL(process.env.R2_S3_API); console.log(u.origin)")"
          endpoint_path="$(node -e "const u=new URL(process.env.R2_S3_API); console.log(u.pathname || '/')")"
          endpoint_host="$(node -e "const u=new URL(process.env.R2_S3_API); console.log(u.host)")"
          echo "R2 endpoint host: $endpoint_host"
          echo "R2 endpoint path present: $([ "$endpoint_path" = '/' ] && echo false || echo true)"

          if aws s3api list-objects-v2 \
            --endpoint-url "$endpoint_origin" \
            --bucket "$R2_BUCKET" \
            --max-items 1000 \
            --output json > /tmp/r2-objects.json 2>/tmp/r2-error.txt; then
            node <<'NODE'
            const fs = require('node:fs');
            const payload = JSON.parse(fs.readFileSync('/tmp/r2-objects.json', 'utf8'));
            const objects = Array.isArray(payload.Contents) ? payload.Contents : [];
            const latest = [...objects].sort((a, b) => new Date(b.LastModified || 0) - new Date(a.LastModified || 0))[0] || null;
            const modified = latest ? new Date(latest.LastModified || 0).getTime() : NaN;
            const fresh = Number.isFinite(modified) && Date.now() - modified <= 30 * 60 * 60 * 1000;
            const nonEmpty = Number(latest?.Size || 0) > 0;
            const summary = {
              bucket: process.env.R2_BUCKET,
              object_count: objects.length,
              latest_modified: latest?.LastModified ?? null,
              latest_size: Number(latest?.Size || 0),
              fresh_within_30h: fresh,
              non_empty: nonEmpty,
            };
            fs.writeFileSync('/tmp/r2-precutover.json', JSON.stringify(summary, null, 2));
            console.log(JSON.stringify(summary, null, 2));
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `r2_ok=${Boolean(objects.length && fresh && nonEmpty)}\n`);
            NODE
          else
            echo 'R2 ListObjectsV2 failed after normalizing the endpoint origin.'
            sed -E 's/[A-Za-z0-9+\/=]{20,}/[redacted]/g' /tmp/r2-error.txt || true
            printf '{"bucket":"%s","list_succeeded":false}\n' "$R2_BUCKET" > /tmp/r2-precutover.json
            echo 'r2_ok=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify dedicated Cloudflare Hyperdrive exists
        id: hyperdrive
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --proto '=https' --tlsv1.2 -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Accept: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/hyperdrive/configs?per_page=100")"
          HYPERDRIVES="$response" node <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(process.env.HYPERDRIVES || '{}');
          if (!payload.success || !Array.isArray(payload.result)) throw new Error('Could not list Cloudflare Hyperdrive configs.');
          const matches = payload.result.filter((item) => item?.name === process.env.MKETY_HYPERDRIVE_NAME);
          const match = matches[0] || null;
          const vpcService = Boolean(match?.origin?.service_id);
          const summary = {
            name: process.env.MKETY_HYPERDRIVE_NAME,
            match_count: matches.length,
            has_exact_single_config: matches.length === 1,
            id_present: Boolean(match?.id),
            origin_type: vpcService ? 'vpc-service' : match?.origin ? 'internet-or-access' : 'unknown',
            scheme: match?.origin?.scheme ?? null,
            port: match?.origin?.port ?? null,
            sslmode: match?.mtls?.sslmode ?? (vpcService ? 'managed-by-vpc-service' : 'default-require'),
          };
          fs.writeFileSync('/tmp/hyperdrive-precutover.json', JSON.stringify(summary, null, 2));
          console.log(JSON.stringify(summary, null, 2));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `hyperdrive_ok=${Boolean(matches.length === 1 && match?.id)}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `hyperdrive_vpc=${vpcService}\n`);
          NODE

      - name: Enforce precutover gates
        shell: bash
        env:
          DB_PRIVATE: ${{ steps.coolify.outputs.db_private }}
          DB_HEALTHY: ${{ steps.coolify.outputs.db_healthy }}
          DB_TLS: ${{ steps.coolify.outputs.db_tls }}
          BACKUP_ENABLED: ${{ steps.coolify.outputs.backup_enabled }}
          BACKUP_SAVE_S3: ${{ steps.coolify.outputs.backup_save_s3 }}
          BACKUP_LINKED: ${{ steps.coolify.outputs.backup_linked }}
          LOCAL_RETENTION_OK: ${{ steps.coolify.outputs.local_retention_ok }}
          S3_RETENTION_OK: ${{ steps.coolify.outputs.s3_retention_ok }}
          COOLIFY_EXECUTION_OK: ${{ steps.coolify.outputs.coolify_execution_ok }}
          COOLIFY_S3_UPLOADED: ${{ steps.coolify.outputs.coolify_s3_uploaded }}
          R2_OK: ${{ steps.r2.outputs.r2_ok }}
          HYPERDRIVE_OK: ${{ steps.hyperdrive.outputs.hyperdrive_ok }}
          HYPERDRIVE_VPC: ${{ steps.hyperdrive.outputs.hyperdrive_vpc }}
        run: |
          set -euo pipefail
          failed=0
          for variable in DB_PRIVATE DB_HEALTHY BACKUP_ENABLED BACKUP_SAVE_S3 BACKUP_LINKED LOCAL_RETENTION_OK S3_RETENTION_OK COOLIFY_EXECUTION_OK COOLIFY_S3_UPLOADED R2_OK HYPERDRIVE_OK; do
            value="${!variable:-false}"
            printf '%s=%s\n' "$variable" "$value"
            if [ "$value" != 'true' ]; then failed=1; fi
          done
          printf 'DB_TLS=%s\n' "${DB_TLS:-false}"
          printf 'HYPERDRIVE_VPC=%s\n' "${HYPERDRIVE_VPC:-false}"
          if [ "${HYPERDRIVE_VPC:-false}" != 'true' ] && [ "${DB_TLS:-false}" != 'true' ]; then
            echo 'Internet-origin Hyperdrive requires PostgreSQL TLS, but Coolify reports enable_ssl=false.'
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then
            echo 'One or more production precutover gates failed.'
            exit 1
          fi
          echo 'All production precutover gates passed.'

      - name: Upload sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mkety-precutover-diagnostics-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            /tmp/coolify-precutover.json
            /tmp/r2-precutover.json
            /tmp/hyperdrive-precutover.json
