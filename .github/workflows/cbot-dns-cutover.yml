name: Cut over cbot DNS from Azure to OCI
on:
  push:
    branches:
      - ops/cbot-oci-dns-cutover-20260919
    paths:
      - ".github/workflows/cbot-dns-cutover.yml"
permissions:
  contents: read
jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZONE_NAME: mkety.com
      RECORD_NAME: cbot.mkety.com
      EXPECTED_OLD_IP: 20.57.161.98
      OCI_IP: 89.168.70.209
    steps:
      - name: Guard and update DNS
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H "Authorization: Bearer $CF_TOKEN"             "https://api.cloudflare.com/client/v4/zones?name=$ZONE_NAME&status=active" > /tmp/zones.json
          zone_id="$(node -e "const x=require('/tmp/zones.json');if(!x.success||x.result.length!==1)process.exit(1);process.stdout.write(x.result[0].id)")"
          curl -fsS -H "Authorization: Bearer $CF_TOKEN"             "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?name=$RECORD_NAME" > /tmp/current.json
          record_id="$(OLD="$EXPECTED_OLD_IP" node - <<'NODE'
          const x=require('/tmp/current.json');
          if(!x.success||x.result.length!==1) throw new Error('Expected one cbot record');
          const r=x.result[0];
          if(r.type!=='A') throw new Error('Unexpected record type '+r.type);
          if(r.content!==process.env.OLD) throw new Error('Refusing cutover: current IP is '+r.content);
          if(r.proxied!==false) throw new Error('Refusing cutover: record is proxied');
          if(Number(r.ttl)!==300) throw new Error('Refusing cutover: TTL changed to '+r.ttl);
          process.stdout.write(r.id);
          NODE
          )"
          node - <<'NODE' > /tmp/update.json
          process.stdout.write(JSON.stringify({
            type:'A',
            name:process.env.RECORD_NAME,
            content:process.env.OCI_IP,
            ttl:300,
            proxied:false
          }));
          NODE
          curl -fsS -X PUT             -H "Authorization: Bearer $CF_TOKEN"             -H "Content-Type: application/json"             --data-binary @/tmp/update.json             "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records/$record_id" > /tmp/result.json
          node - <<'NODE'
          const x=require('/tmp/result.json');
          if(!x.success) throw new Error('Cloudflare update failed');
          const r=x.result;
          if(r.content!==process.env.OCI_IP||r.proxied!==false||Number(r.ttl)!==300) throw new Error('Cutover verification mismatch');
          console.log('CBOT_DNS_CUTOVER=PASS');
          console.log(JSON.stringify({type:r.type,name:r.name,content:r.content,proxied:r.proxied,ttl:r.ttl},null,2));
          NODE
