name: Verify immutable Auth cleanup head

on:
  push:
    branches:
      - feat/mkety-auth-zitadel-vinext

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7412bed2c481de8e5fa3aac448effce1f80b7aeb
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify migration baseline
        run: pnpm db:check:migrations
      - name: Verify no active legacy Auth or template references
        shell: bash
        run: |
          set -o pipefail
          git grep -n -I -E '(auth0|Auth0|AUTH0_|next-auth|NextAuth|nextauth|@auth/|NEXTAUTH_|Next\.js SaaS AI Template|next-saas-ai-starter)' -- ':!pnpm-lock.yaml' \
            | grep -v -E '^(docs/superpowers/|docs/AUTHENTICATION\.md:|docs/MKETY_AUTH_SOURCE_OF_TRUTH\.md:|docs/HANDOFF_MKETY_AUTH_ZITADEL_CLOUDFLARE\.md:|docs/DEPLOYMENT\.md:|\.envrc\.example:|src/features/auth/components/__tests__/LoginForm\.test\.tsx:|\.github/workflows/_auth-reference-audit\.yml:)' \
            | tee /tmp/active-forbidden.txt || true
          test ! -s /tmp/active-forbidden.txt
          git grep -n -I -E '(auth0|Auth0|AUTH0_|next-auth|NextAuth|nextauth|@auth/|NEXTAUTH_)' -- pnpm-lock.yaml \
            | tee /tmp/lock-forbidden.txt || true
          test ! -s /tmp/lock-forbidden.txt
      - name: Verify full test suite
        run: pnpm test
      - name: Verify types
        run: pnpm type-check
      - name: Verify lint
        run: pnpm lint
      - name: Verify vinext compatibility
        run: pnpx vinext check
      - name: Verify production build
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: 'true'
      - name: Verify isolated preview packaging
        run: pnpm run deploy --env preview --dry-run
        env:
          SKIP_ENV_VALIDATION: 'true'
