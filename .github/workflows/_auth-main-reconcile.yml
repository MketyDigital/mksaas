name: Guarded Main to Auth Reconciliation

on:
  push:
    branches:
      - feat/mkety-auth-zitadel-vinext
    paths:
      - .github/workflows/_auth-main-reconcile.yml

permissions:
  contents: write

concurrency:
  group: mkety-auth-main-reconcile
  cancel-in-progress: false

env:
  EXPECTED_MAIN_SHA: 0693b00fba639549d92c4dd82a2fcef618d0bd47
  EXPECTED_CONTENT_REPAIR_BLOB: 8b8be8e68785dec4bbdf39d3d680cfc9ad808fc2
  EXPECTED_DEPLOY_HELPER_BLOB: eb21835005713fd1ecbaccd1eee9bc23f8bc8abb
  SKIP_ENV_VALIDATION: 'true'

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/mkety-auth-zitadel-vinext

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Guard exact main and start merge
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          main_sha="$(git rev-parse origin/main)"
          if [ "$main_sha" != "$EXPECTED_MAIN_SHA" ]; then
            echo "::error::main moved: expected $EXPECTED_MAIN_SHA, found $main_sha"
            exit 1
          fi

          auth_sha="$(git rev-parse HEAD)"
          merge_base="$(git merge-base HEAD origin/main)"
          echo "auth_sha=$auth_sha" >> "$GITHUB_OUTPUT"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "merge_base=$merge_base" >> "$GITHUB_OUTPUT"

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          conflicts="$(git diff --name-only --diff-filter=U || true)"
          if [ -n "$conflicts" ]; then
            printf '%s\n' "$conflicts" > /tmp/conflicts.txt
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              case "$path" in
                .env.example|.mega-linter.yml|docs/README.md|jest.setup.tsx|src/app/layout.tsx) ;;
                *)
                  echo "::error::Unexpected merge conflict: $path"
                  git merge --abort || true
                  exit 1
                  ;;
              esac
            done < /tmp/conflicts.txt
            echo "Known conflicts detected; resolving with pre-reviewed Auth-side versions:"
            cat /tmp/conflicts.txt
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              git checkout --ours -- "$path"
              git add "$path"
            done < /tmp/conflicts.txt
          elif [ "$merge_status" -ne 0 ]; then
            echo "::error::Merge failed without ordinary content conflicts"
            git merge --abort || true
            exit "$merge_status"
          fi

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "::error::Unresolved merge paths remain"
            git diff --name-only --diff-filter=U
            exit 1
          fi
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' .env.example .mega-linter.yml docs/README.md jest.setup.tsx src/app/layout.tsx; then
            echo "::error::Conflict markers remain in reconciled files"
            exit 1
          fi
          git diff --check

          echo "### Guarded Auth reconciliation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Auth pre-merge SHA: \`$auth_sha\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Main SHA: \`$main_sha\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Merge base: \`$merge_base\`" >> "$GITHUB_STEP_SUMMARY"
          if [ -s /tmp/conflicts.txt ]; then
            echo "- Reviewed conflicts:" >> "$GITHUB_STEP_SUMMARY"
            while IFS= read -r path; do echo "  - \`$path\`" >> "$GITHUB_STEP_SUMMARY"; done < /tmp/conflicts.txt
          fi

      - name: Repair known public-content migration prefix collision
        shell: bash
        run: |
          set -euo pipefail
          source_path="migrations/0004_platform_commercial_content_repair.sql"
          target_path="migrations/0009_platform_commercial_content_repair.sql"
          source_blob="$(git rev-parse "origin/main:$source_path")"
          if [ "$source_blob" != "$EXPECTED_CONTENT_REPAIR_BLOB" ]; then
            echo "::error::Unexpected commercial-content repair blob: $source_blob"
            exit 1
          fi
          if [ ! -f "$source_path" ] || [ -e "$target_path" ]; then
            echo "::error::Unexpected content migration namespace state before repair"
            exit 1
          fi
          git mv "$source_path" "$target_path"
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/migrate-mkety-platform-content.ts')
          text = path.read_text()
          needle = "  'migrations/0008_harden_rls_auto_enable.sql',\n"
          addition = needle + "  'migrations/0009_platform_commercial_content_repair.sql',\n"
          if text.count(needle) != 1 or '0009_platform_commercial_content_repair.sql' in text:
              raise SystemExit('unexpected content migration runner state')
          path.write_text(text.replace(needle, addition))
          PY
          git add "$target_path" scripts/migrate-mkety-platform-content.ts
          echo "- Repaired public-content migration prefix collision: later commercial repair is now root migration \`0009\`." >> "$GITHUB_STEP_SUMMARY"

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Repair JSONC parsing in Cloudflare deploy helper
        shell: bash
        run: |
          set -euo pipefail
          helper="scripts/deploy-vinext-cloudflare.sh"
          helper_blob="$(git rev-parse "origin/main:$helper")"
          if [ "$helper_blob" != "$EXPECTED_DEPLOY_HELPER_BLOB" ]; then
            echo "::error::Unexpected deploy helper blob: $helper_blob"
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/deploy-vinext-cloudflare.sh')
          text = path.read_text()
          old = '''expected_worker_name="${CANDIDATE_WORKER_NAME:-}"
          if [ -z "$expected_worker_name" ]; then
            expected_worker_name="$(node -e "const fs=require('node:fs'); const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8')); process.stdout.write(c.name || '')")"
          fi
          '''
          new = '''expected_worker_name="${CANDIDATE_WORKER_NAME:-}"
          if [ -z "$expected_worker_name" ]; then
            expected_worker_name="$(node - <<'NODE'
          const fs = require('node:fs');
          const ts = require('typescript');
          const file = 'wrangler.jsonc';
          const parsed = ts.parseConfigFileTextToJson(file, fs.readFileSync(file, 'utf8'));
          if (parsed.error) {
            const message = ts.flattenDiagnosticMessageText(parsed.error.messageText, '\\n');
            throw new Error(`Unable to parse ${file}: ${message}`);
          }
          process.stdout.write(typeof parsed.config?.name === 'string' ? parsed.config.name : '');
          NODE
          )"
          fi
          '''
          if text.count(old) != 1:
              raise SystemExit('expected strict-JSON worker-name parser exactly once')
          path.write_text(text.replace(old, new))
          PY
          git add "$helper"
          worker_name="$(node - <<'NODE'
          const fs = require('node:fs');
          const ts = require('typescript');
          const parsed = ts.parseConfigFileTextToJson('wrangler.jsonc', fs.readFileSync('wrangler.jsonc', 'utf8'));
          if (parsed.error) process.exit(1);
          process.stdout.write(parsed.config?.name || '');
          NODE
          )"
          test "$worker_name" = "mkety-platform"
          echo "- Repaired deploy helper to parse valid JSONC with the repository TypeScript parser." >> "$GITHUB_STEP_SUMMARY"

      - name: Refresh merged Drizzle baseline snapshot without duplicate SQL
        shell: bash
        run: |
          set -euo pipefail
          snapshot="src/shared/db/migrations/meta/0009_snapshot.json"
          journal="src/shared/db/migrations/meta/_journal.json"
          cp "$journal" /tmp/journal.before-public-baseline.json

          node - <<'NODE' > /tmp/0009-identity.json
          const fs = require('node:fs');
          const s = JSON.parse(fs.readFileSync('src/shared/db/migrations/meta/0009_snapshot.json', 'utf8'));
          process.stdout.write(JSON.stringify({ id: s.id, prevId: s.prevId }));
          NODE

          pnpm db:generate
          generated_sql="$(git ls-files --others --exclude-standard 'src/shared/db/migrations/0010_*.sql' | head -n 1)"
          generated_snapshot="src/shared/db/migrations/meta/0010_snapshot.json"
          if [ -z "$generated_sql" ] || [ ! -f "$generated_snapshot" ]; then
            echo "::error::Expected exactly one generated 0010 SQL and snapshot for baseline inspection"
            git status --short
            exit 1
          fi
          if [ "$(git ls-files --others --exclude-standard 'src/shared/db/migrations/0010_*.sql' | wc -l)" -ne 1 ]; then
            echo "::error::Unexpected number of generated SQL files"
            exit 1
          fi

          actual_tables="$(grep -oE '"saas_template"\."[A-Za-z0-9_]+"' "$generated_sql" | sed -E 's/"saas_template"\."([A-Za-z0-9_]+)"/\1/' | sort -u)"
          expected_tables="$(printf '%s\n' \
            platform_enterprise_orders \
            public_ai_conversations \
            public_ai_memory_facts \
            public_ai_messages \
            public_ai_tool_runs \
            public_ai_visitors | sort)"
          if [ "$actual_tables" != "$expected_tables" ]; then
            echo "::error::Generated Drizzle delta contains tables outside the public-site-owned baseline"
            echo "Actual:"; printf '%s\n' "$actual_tables"
            exit 1
          fi

          # These six tables are already owned by root migrations 0002 and 0003.
          grep -q 'CREATE TABLE IF NOT EXISTS "saas_template"."public_ai_visitors"' migrations/0002_public_ai_memory.sql
          grep -q 'CREATE TABLE IF NOT EXISTS "saas_template"."platform_enterprise_orders"' migrations/0003_platform_enterprise_orders.sql

          cp "$generated_snapshot" "$snapshot"
          node - <<'NODE'
          const fs = require('node:fs');
          const path = 'src/shared/db/migrations/meta/0009_snapshot.json';
          const identity = JSON.parse(fs.readFileSync('/tmp/0009-identity.json', 'utf8'));
          const snapshot = JSON.parse(fs.readFileSync(path, 'utf8'));
          snapshot.id = identity.id;
          snapshot.prevId = identity.prevId;
          fs.writeFileSync(path, `${JSON.stringify(snapshot, null, 2)}\n`);
          NODE
          cp /tmp/journal.before-public-baseline.json "$journal"
          rm -f "$generated_sql" "$generated_snapshot"
          git add "$snapshot" "$journal"

          before="$(git status --porcelain)"
          pnpm db:generate
          after="$(git status --porcelain)"
          if [ "$before" != "$after" ]; then
            echo "::error::Merged Drizzle baseline is still not a forward-generation no-op"
            git status --short
            exit 1
          fi
          if git ls-files --others --exclude-standard 'src/shared/db/migrations/*.sql' 'src/shared/db/migrations/meta/*_snapshot.json' | grep -q .; then
            echo "::error::Forward generation left unexpected migration artifacts"
            git ls-files --others --exclude-standard 'src/shared/db/migrations/*.sql' 'src/shared/db/migrations/meta/*_snapshot.json'
            exit 1
          fi
          echo "- Refreshed \`0009_mkety_auth\` snapshot metadata to include public-site-owned tables already migrated by root migrations 0002/0003; no duplicate application SQL was added." >> "$GITHUB_STEP_SUMMARY"

      - name: Verify Auth.js and Auth0 are absent from active package/config
        shell: bash
        run: |
          set -euo pipefail
          node -e "const p=require('./package.json'); if (p.dependencies?.['next-auth'] || p.dependencies?.['@auth/drizzle-adapter']) process.exit(1)"
          if grep -nE 'AUTH0_|NEXTAUTH_' .env.example; then
            echo "::error::Legacy Auth0/NextAuth environment names were reintroduced"
            exit 1
          fi

      - name: Verify migration baseline
        run: pnpm db:check:migrations

      - name: Verify Drizzle consistency
        run: pnpm exec drizzle-kit check

      - name: Run full tests
        run: pnpm test

      - name: Run type-check
        run: pnpm type-check

      - name: Run lint
        run: pnpm lint

      - name: Check vinext compatibility
        run: pnpx vinext check

      - name: Build production artifact
        run: pnpm build

      - name: Validate isolated preview packaging
        run: pnpm run deploy --env preview --dry-run

      - name: Commit merge locally after verification
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          test -f .git/MERGE_HEAD
          git commit -m "Merge main ${EXPECTED_MAIN_SHA:0:12} into Mkety Auth after guarded verification"
          merge_sha="$(git rev-parse HEAD)"
          echo "merge_sha=$merge_sha" >> "$GITHUB_OUTPUT"
          echo "- Verified merge SHA: \`$merge_sha\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Prove committed forward migration generation is a no-op
        shell: bash
        run: |
          set -euo pipefail
          before="$(git status --porcelain)"
          pnpm db:generate
          after="$(git status --porcelain)"
          if [ "$before" != "$after" ] || [ -n "$after" ]; then
            echo "::error::db:generate changed the committed verified merge"
            git status --short
            exit 1
          fi
          pnpm db:check:migrations
          pnpm exec drizzle-kit check

      - name: Push verified merge to Auth branch
        shell: bash
        env:
          MERGE_SHA: ${{ steps.commit.outputs.merge_sha }}
          AUTH_PREMERGE_SHA: ${{ steps.merge.outputs.auth_sha }}
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin refs/heads/feat/mkety-auth-zitadel-vinext | cut -f1)"
          if [ "$remote_head" != "$AUTH_PREMERGE_SHA" ]; then
            echo "::error::Auth branch moved during guarded verification; refusing to push"
            echo "Expected remote head: $AUTH_PREMERGE_SHA"
            echo "Actual remote head:   $remote_head"
            exit 1
          fi
          git push origin "$MERGE_SHA:refs/heads/feat/mkety-auth-zitadel-vinext"
          echo "- Remote Auth branch updated only after all internal gates passed." >> "$GITHUB_STEP_SUMMARY"
