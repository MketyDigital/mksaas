name: Mkety Production Auth Proxy Diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mkety-production-auth-proxy-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      COOLIFY_URL: https://deploy.mkety.com
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NEW_PROXY_NAME: mkety-production-pgbouncer-tls-proxy-v2
      OLD_PROXY_NAME: mkety-production-pgbouncer-tls-proxy
      TUNNEL_NAME: mkety-production-vpc
      DB_HOSTNAME: db-runtime.mkety.com

    steps:
      - name: Inspect proxy and tunnel safely
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          publish() {
            CONTEXT="$1" STATE="$2" DESCRIPTION="$3" node <<'NODE' >/tmp/status.json
          process.stdout.write(JSON.stringify({state:process.env.STATE,context:process.env.CONTEXT,description:String(process.env.DESCRIPTION||'').slice(0,140)}));
          NODE
            curl --connect-timeout 5 --max-time 10 -fsS -X POST               -H "Authorization: Bearer $GH_TOKEN"               -H 'Accept: application/vnd.github+json'               -H 'X-GitHub-Api-Version: 2022-11-28'               -H 'Content-Type: application/json'               --data @/tmp/status.json               "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null || true
          }

          base="${COOLIFY_URL%/}/api/v1"
          code="$(curl --proto '=https' --tlsv1.2 --connect-timeout 5 --max-time 12 -sS -o /tmp/apps.json -w '%{http_code}'             -H "Authorization: Bearer $COOLIFY_API_TOKEN" "$base/applications" || true)"
          if [ "$code" != 200 ]; then
            publish mkety/auth-proxy-app failure "Coolify application inventory failed (HTTP $code)."
            exit 1
          fi

          node <<'NODE' >/tmp/proxy.json
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('/tmp/apps.json','utf8'));
          const rows=Array.isArray(p)?p:Array.isArray(p?.data)?p.data:[];
          const found=rows.filter(x=>x.name===process.env.NEW_PROXY_NAME);
          if(found.length!==1||!found[0]?.uuid) process.exit(1);
          process.stdout.write(JSON.stringify({uuid:String(found[0].uuid),status:String(found[0].status||'')}));
          NODE
          if [ "$?" -ne 0 ]; then
            publish mkety/auth-proxy-app failure 'PgBouncer v2 Coolify application is missing or duplicated.'
            exit 1
          fi

          uuid="$(node -e "const x=require('/tmp/proxy.json');process.stdout.write(x.uuid)")"
          status="$(node -e "const x=require('/tmp/proxy.json');process.stdout.write(x.status)")"
          echo "::add-mask::$uuid"

          curl --proto '=https' --tlsv1.2 --connect-timeout 5 --max-time 12 -sS             -H "Authorization: Bearer $COOLIFY_API_TOKEN" "$base/applications/$uuid/logs?lines=500&show_timestamps=false" -o /tmp/logs.json || true

          markers="$(node <<'NODE'
          const fs=require('node:fs');
          let raw='';try{raw=String(JSON.parse(fs.readFileSync('/tmp/logs.json','utf8')).logs||'')}catch{}
          const required=['MKETY_PGBOUNCER_V2_UPSTREAM_VERIFY_OK=true','MKETY_PGBOUNCER_V2_CLIENT_TLS_OK=true','MKETY_PGBOUNCER_V2_QUERY_OK=true','MKETY_PGBOUNCER_V2_READY=true'];
          process.stdout.write(required.every(x=>raw.includes(x))?'ready':'not-ready');
          NODE
          )"

          case "${status,,}" in
            *running*|*healthy*|*started*) appok=1 ;;
            *) appok=0 ;;
          esac
          if [ "$appok" -eq 1 ] && [ "$markers" = ready ]; then
            publish mkety/auth-proxy-app success 'PgBouncer v2 app is running and has verified TLS/query readiness markers.'
          else
            reason="runtime=$status; markers=$markers"
            publish mkety/auth-proxy-app failure "PgBouncer v2 app is not ready ($reason)."
            if [ "$appok" -ne 1 ]; then
              publish mkety/auth-proxy-runtime failure "PgBouncer v2 runtime is not healthy/running ($status)."
            else
              publish mkety/auth-proxy-runtime success "PgBouncer v2 runtime is running ($status)."
            fi
            if [ "$markers" != ready ]; then
              publish mkety/auth-proxy-markers failure 'PgBouncer v2 readiness markers are incomplete.'
            else
              publish mkety/auth-proxy-markers success 'PgBouncer v2 readiness markers are complete.'
            fi
          fi

          tunnels="$(curl --connect-timeout 5 --max-time 12 -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel?is_deleted=false&per_page=100" 2>/dev/null || true)"
          tid="$(TUNNELS="$tunnels" node -e "try{const p=JSON.parse(process.env.TUNNELS||'{}'),a=Array.isArray(p.result)?p.result:[];const m=a.filter(x=>x.name===process.env.TUNNEL_NAME);process.stdout.write(m.length===1&&m[0]?.id?String(m[0].id):'')}catch{}")"
          if [ -z "$tid" ]; then
            publish mkety/auth-proxy-tunnel failure 'Production Cloudflare tunnel could not be resolved.'
            exit 1
          fi

          cfg="$(curl --connect-timeout 5 --max-time 12 -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel/$tid/configurations" 2>/dev/null || true)"
          target="$(CFG="$cfg" node -e "try{const p=JSON.parse(process.env.CFG||'{}');const a=p?.result?.config?.ingress||[];const m=a.filter(x=>x.hostname===process.env.DB_HOSTNAME);if(m.length===1)process.stdout.write(String(m[0].service||''))}catch{}")"
          if [ "$target" = "tcp://$NEW_PROXY_NAME:6432" ]; then
            publish mkety/auth-proxy-tunnel success 'Production DB tunnel already targets PgBouncer v2.'
          elif [ "$target" = "tcp://$OLD_PROXY_NAME:6432" ]; then
            publish mkety/auth-proxy-tunnel failure 'Production DB tunnel still targets legacy PgBouncer.'
          else
            publish mkety/auth-proxy-tunnel failure 'Production DB tunnel target is unexpected.'
          fi

          [ "$appok" -eq 1 ] && [ "$markers" = ready ]
