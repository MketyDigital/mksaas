name: Usage Credits Generate Migration

on:
  push:
    branches:
      - feat/mkety-usage-credits-core
    paths:
      - .github/workflows/_usage-credits-generate-migration.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/mkety-usage-credits-core
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate migration
        run: pnpm db:generate
      - name: Show generated state
        run: git status --short && git diff -- src/shared/db/migrations src/shared/db/migrations/meta || true
      - name: Commit generated migration
        run: |
          if git diff --quiet -- src/shared/db/migrations src/shared/db/migrations/meta && [ -z "$(git status --porcelain src/shared/db/migrations src/shared/db/migrations/meta)" ]; then
            echo "No migration changes generated"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shared/db/migrations src/shared/db/migrations/meta
          git commit -m "chore: generate usage credits migration"
          git push origin HEAD:feat/mkety-usage-credits-core
