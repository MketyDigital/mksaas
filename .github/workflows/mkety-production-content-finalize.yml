name: Mkety Production Content Reconcile Finalization

on:
  push:
    branches:
      - release/production-finalize-20260929
    paths:
      - .github/workflows/mkety-production-content-finalize.yml

permissions:
  contents: read

jobs:
  reconcile:
    uses: ./.github/workflows/mkety-coolify-production-db-executor.yml
    with:
      verified_sha: ${{ github.sha }}
      release_branch: release/production-finalize-20260929
    secrets:
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
