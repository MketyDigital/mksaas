name: Mkety Branded Auth Readiness

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mkety-branded-auth-readiness.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      ZITADEL_ISSUER: ${{ vars.ZITADEL_URL }}
      ZITADEL_MANAGEMENT_TOKEN: ${{ secrets.ZITADEL_MANAGEMENT_PAT }}
      ZITADEL_PROJECT_ID: ${{ secrets.ZITADEL_PROJECT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      COOLIFY_URL: https://deploy.mkety.com
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      AUTH_HOSTNAME: auth.mkety.com
      LOGIN_APP_NAME: mkety-zitadel-login
      OIDC_APP_NAME: Mkety Platform Production

    steps:
      - name: Publish readiness locator
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat >/tmp/status.json <<JSON
          {"state":"pending","context":"mkety/branded-auth-readiness","description":"Checking auth.mkety.com self-hosted Login V2 readiness.","target_url":"https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"}
          JSON
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json'             --data @/tmp/status.json "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

      - name: Require infrastructure credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in ZITADEL_ISSUER ZITADEL_MANAGEMENT_TOKEN ZITADEL_PROJECT_ID CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID COOLIFY_API_TOKEN; do
            [ -n "${!name:-}" ] || { echo "::error::Missing $name"; exit 1; }
          done
          echo "::add-mask::$ZITADEL_MANAGEMENT_TOKEN"
          echo "::add-mask::$COOLIFY_API_TOKEN"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"

      - name: Inspect ZITADEL instance and production OIDC app
        shell: bash
        run: |
          set -euo pipefail
          issuer="${ZITADEL_ISSUER%/}"
          get_instance="$(curl --fail-with-body --silent --show-error -X POST             "$issuer/zitadel.instance.v2.InstanceService/GetInstance"             -H "Authorization: Bearer $ZITADEL_MANAGEMENT_TOKEN"             -H 'Connect-Protocol-Version: 1' -H 'Content-Type: application/json' --data '{}')"
          INSTANCE="$get_instance" node <<'NODE'
          const p=JSON.parse(process.env.INSTANCE||'{}'), i=p.instance||{};
          console.log('ZITADEL_INSTANCE_SAFE '+JSON.stringify({
            idPresent:!!i.id,
            name:i.name||null,
            version:i.version||null,
            customDomainCount:Array.isArray(i.customDomains)?i.customDomains.length:0,
            domains:(i.customDomains||[]).map(x=>({domain:x.domain,primary:!!x.primary,generated:!!x.generated}))
          }));
          NODE

          apps="$(curl --fail-with-body --silent --show-error -X POST             "$issuer/zitadel.application.v2.ApplicationService/ListApplications"             -H "Authorization: Bearer $ZITADEL_MANAGEMENT_TOKEN"             -H 'Connect-Protocol-Version: 1' -H 'Content-Type: application/json' --data '{}')"
          APPS="$apps" node <<'NODE' >/tmp/app.json
          const p=JSON.parse(process.env.APPS||'{}'), a=Array.isArray(p.applications)?p.applications:[];
          const m=a.filter(x=>x.projectId===process.env.ZITADEL_PROJECT_ID && x.name===process.env.OIDC_APP_NAME);
          if(m.length!==1) throw new Error('Production OIDC app was not uniquely resolved');
          const x=m[0], o=x.oidcConfiguration||{};
          process.stdout.write(JSON.stringify({
            applicationId:x.applicationId,
            clientId:o.clientId||null,
            configKeys:Object.keys(o).sort(),
            redirectUris:o.redirectUris||[],
            postLogoutRedirectUris:o.postLogoutRedirectUris||[]
          }));
          NODE
          app_id="$(node -e "const x=require('/tmp/app.json');process.stdout.write(x.applicationId)")"
          echo "::add-mask::$app_id"
          detail="$(curl --fail-with-body --silent --show-error -X POST             "$issuer/zitadel.application.v2.ApplicationService/GetApplication"             -H "Authorization: Bearer $ZITADEL_MANAGEMENT_TOKEN"             -H 'Connect-Protocol-Version: 1' -H 'Content-Type: application/json'             --data "$(APP_ID="$app_id" node -e "process.stdout.write(JSON.stringify({applicationId:process.env.APP_ID}))")")"
          DETAIL="$detail" node <<'NODE'
          const p=JSON.parse(process.env.DETAIL||'{}'), x=p.application||{}, o=x.oidcConfiguration||{};
          console.log('ZITADEL_APP_SAFE '+JSON.stringify({
            appResolved:!!x.applicationId,
            name:x.name||null,
            oidc:true,
            configKeys:Object.keys(o).sort(),
            hasClientId:!!o.clientId,
            redirectCount:Array.isArray(o.redirectUris)?o.redirectUris.length:0,
            logoutCount:Array.isArray(o.postLogoutRedirectUris)?o.postLogoutRedirectUris.length:0
          }));
          NODE

      - name: Verify ZITADEL admin permissions needed for dedicated login client
        shell: bash
        run: |
          set -euo pipefail
          issuer="${ZITADEL_ISSUER%/}"
          orgs_code="$(curl --silent --show-error -o /tmp/orgs.json -w '%{http_code}' -X POST             "$issuer/v2/organizations/_search"             -H "Authorization: Bearer $ZITADEL_MANAGEMENT_TOKEN"             -H 'Content-Type: application/json' --data '{"query":{"limit":1}}')"
          [ "$orgs_code" = 200 ] || { echo "::error::Management PAT lacks org.read (HTTP $orgs_code)"; exit 1; }

          # Do not grant IAM_LOGIN_CLIENT here. Confirm the management credential is an instance administrator
          # by requiring instance read; provisioning remains a separate guarded step.
          instance_code="$(curl --silent --show-error -o /tmp/instance.json -w '%{http_code}' -X POST             "$issuer/zitadel.instance.v2.InstanceService/GetInstance"             -H "Authorization: Bearer $ZITADEL_MANAGEMENT_TOKEN"             -H 'Connect-Protocol-Version: 1' -H 'Content-Type: application/json' --data '{}')"
          [ "$instance_code" = 200 ] || { echo "::error::Management PAT cannot inspect instance context (HTTP $instance_code)"; exit 1; }
          echo 'ZITADEL_PERMISSION_SAFE org.read=true iam.read=true'

      - name: Inspect Coolify capacity and existing branded-login app
        shell: bash
        run: |
          set -euo pipefail
          base="${COOLIFY_URL%/}/api/v1"
          apps="$(curl --proto '=https' --tlsv1.2 --connect-timeout 5 --max-time 15 -fsS             -H "Authorization: Bearer $COOLIFY_API_TOKEN" "$base/applications")"
          APPS="$apps" node <<'NODE'
          const p=JSON.parse(process.env.APPS||'[]'), a=Array.isArray(p)?p:(Array.isArray(p.data)?p.data:[]);
          const m=a.filter(x=>x.name===process.env.LOGIN_APP_NAME);
          console.log('COOLIFY_LOGIN_SAFE '+JSON.stringify({
            totalApps:a.length,
            existingCount:m.length,
            existingStatus:m[0]?.status||null,
            existingFqdn:m[0]?.fqdn||m[0]?.domains||null
          }));
          NODE

      - name: Inspect Cloudflare DNS for auth.mkety.com
        shell: bash
        run: |
          set -euo pipefail
          zones="$(curl --connect-timeout 5 --max-time 15 -fsS             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/zones?name=mkety.com&status=active&per_page=50")"
          zone_id="$(ZONES="$zones" node -e "const p=JSON.parse(process.env.ZONES||'{}'),a=Array.isArray(p.result)?p.result:[];if(a.length!==1||!a[0]?.id)process.exit(1);process.stdout.write(a[0].id)")"
          echo "::add-mask::$zone_id"
          records="$(curl --connect-timeout 5 --max-time 15 -fsS             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?name=$AUTH_HOSTNAME&per_page=100")"
          RECORDS="$records" node <<'NODE'
          const p=JSON.parse(process.env.RECORDS||'{}'), a=Array.isArray(p.result)?p.result:[];
          console.log('CLOUDFLARE_AUTH_DNS_SAFE '+JSON.stringify({
            count:a.length,
            records:a.map(x=>({type:x.type,proxied:x.proxied===true,ttl:x.ttl}))
          }));
          NODE

      - name: Publish readiness result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=success
          desc='auth.mkety.com readiness checks passed; no auth traffic changed.'
          if [ "$JOB_STATUS" != success ]; then
            state=failure
            desc='auth.mkety.com readiness check failed; current hosted ZITADEL login remains unchanged.'
          fi
          STATE="$state" DESC="$desc" node <<'NODE' >/tmp/status.json
          process.stdout.write(JSON.stringify({state:process.env.STATE,context:'mkety/branded-auth-readiness',description:process.env.DESC,target_url:`https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`}));
          NODE
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json'             --data @/tmp/status.json "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null || true
