name: Mkety Production Bridge Inspect
# certificate-chain field inspection
# rerun after Origin CA ClientHello failure 2026-09-20
# public recovery inspection 2026-09-19

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mkety-production-bridge-inspect.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  inspect:
    name: Inspect production database bridge safely
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_URL: https://deploy.mkety.com
      POSTGRES_UUID: hgxwkiyxgbmb2i3pl57kmxc8
      MKETY_HYPERDRIVE_NAME: mkety-production-db
    steps:
      - name: Publish bridge inspection locator
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > /tmp/status.json <<JSON
          {"state":"pending","context":"mkety/bridge-inspect-run","description":"Sanitized production bridge inspection started.","target_url":"https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"}
          JSON
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json' --data @/tmp/status.json "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

      - name: Inspect sanitized bridge state
        shell: bash
        run: |
          set -euo pipefail
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID COOLIFY_API_TOKEN; do
            [ -n "${!v:-}" ] || { echo "$v is required"; exit 1; }
          done

          hd="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Accept: application/json' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/hyperdrive/configs?per_page=100")"
          HD="$hd" node <<'NODE'
          const p=JSON.parse(process.env.HD||'{}');
          const h=Array.isArray(p.result)?p.result.find(x=>x.name===process.env.MKETY_HYPERDRIVE_NAME):null;
          if(!p.success||!h) throw new Error('Production Hyperdrive not found');
          const o=h.origin&&typeof h.origin==='object'?h.origin:{};
          console.log('HYPERDRIVE_SAFE '+JSON.stringify({
            name:h.name||null,
            originKeys:Object.keys(o).sort(),
            scheme:o.scheme||null,
            port:o.port??null,
            hasServiceId:Boolean(o.service_id),
            hasHost:Boolean(o.host),
            hasDatabase:Boolean(o.database),
            hasUser:Boolean(o.user),
            createdOn:h.created_on||null,
            modifiedOn:h.modified_on||null
          }));
          NODE

          db="$(curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Accept: application/json' "${COOLIFY_URL%/}/api/v1/databases/$POSTGRES_UUID")"
          DB="$db" node <<'NODE'
          const d=JSON.parse(process.env.DB||'{}');
          console.log('POSTGRES_SAFE '+JSON.stringify({
            name:d.name||null,status:d.status||null,image:d.image||null,
            isPublic:d.is_public===true,publicPort:d.public_port??null,
            sslEnabled:d.enable_ssl??null,sslMode:d.ssl_mode??null,
            certificateStatus:d.ssl_certificate_status??d.certificate_status??null,
            certificateExpiresAt:d.ssl_certificate_expiration_date??d.certificate_expiration_date??null,
            internalScheme:typeof d.internal_db_url==='string'?String(d.internal_db_url).split(':')[0]:null,
            createdAt:d.created_at||null,updatedAt:d.updated_at||null
          }));
          const tlsKeys=Object.keys(d).filter(k=>/ssl|cert|ca|key/i.test(k)).sort();
          console.log('POSTGRES_TLS_FIELDS_SAFE '+JSON.stringify(tlsKeys.map(k=>({
            key:k,
            type:Array.isArray(d[k])?'array':d[k]===null?'null':typeof d[k],
            present:d[k]!==null&&d[k]!==undefined&&String(d[k]).length>0
          }))));
          NODE

          db_logs="$(curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Accept: application/json' "${COOLIFY_URL%/}/api/v1/databases/$POSTGRES_UUID/logs?lines=300&show_timestamps=false" || printf '{"logs":""}')"
          DB_LOGS="$db_logs" node <<'NODE'
          let raw=''; try { raw=String(JSON.parse(process.env.DB_LOGS||'{}').logs||''); } catch {}
          const lines=raw.split('\n').filter(Boolean);
          const safe=lines.filter(line=>/ssl|tls|certificate|handshake|connection received|could not accept|fatal|error/i.test(line))
            .slice(-80)
            .map(line=>line.replace(/user=[^ ]+/gi,'user=***').replace(/database=[^ ]+/gi,'database=***').replace(/host=[^ ]+/gi,'host=***'));
          console.log('POSTGRES_TLS_LOGS_SAFE '+JSON.stringify(safe));
          NODE

          backups="$(curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Accept: application/json' "${COOLIFY_URL%/}/api/v1/databases/$POSTGRES_UUID/backups" || printf '[]')"
          BACKUPS="$backups" node <<'NODE'
          let rows=[]; try { const p=JSON.parse(process.env.BACKUPS||'[]'); rows=Array.isArray(p)?p:Array.isArray(p?.data)?p.data:Array.isArray(p?.backups)?p.backups:[]; } catch {}
          console.log('BACKUPS_SAFE '+JSON.stringify(rows.map(x=>({
            uuid:x.uuid||null,enabled:x.enabled!==false,frequency:x.frequency||null,saveS3:x.save_s3===true,
            s3StorageUuid:x.s3_storage_uuid||x.s3_storage?.uuid||null,
            localRetention:Number(x.database_backup_retention_amount_locally||0),
            s3Retention:Number(x.database_backup_retention_amount_s3||0),
            lastSavedAt:x.last_saved_at||null
          }))));
          NODE

          s3_storages="$(curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Accept: application/json' "${COOLIFY_URL%/}/api/v1/s3-storages" || printf '[]')"
          S3_STORAGES="$s3_storages" node <<'NODE'
          let rows=[]; try { const p=JSON.parse(process.env.S3_STORAGES||'[]'); rows=Array.isArray(p)?p:Array.isArray(p?.data)?p.data:[]; } catch {}
          console.log('S3_STORAGES_SAFE '+JSON.stringify(rows.map(x=>({
            uuid:x.uuid||null,name:x.name||null,bucket:x.bucket||null,region:x.region||null,
            endpointHost:typeof x.endpoint==='string' ? (()=>{try{return new URL(x.endpoint).hostname}catch{return null}})() : null,
            isUsable:x.is_usable===true
          }))));
          NODE

          services="$(curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Accept: application/json' "${COOLIFY_URL%/}/api/v1/services")"
          apps="$(curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Accept: application/json' "${COOLIFY_URL%/}/api/v1/applications")"
          SERVICES="$services" APPS="$apps" node <<'NODE'
          const norm=x=>Array.isArray(x)?x:Array.isArray(x?.data)?x.data:[];
          const ss=norm(JSON.parse(process.env.SERVICES||'[]'));
          const aa=norm(JSON.parse(process.env.APPS||'[]'));
          const rows=[...ss.map(x=>({...x,kind:'service'})),...aa.map(x=>({...x,kind:'application'}))];
          const m=rows.filter(x=>/cloudflared|cloudflare|tunnel/i.test([x.name,x.description,x.service_type].filter(Boolean).join(' ')));
          console.log('COOLIFY_TUNNEL_CANDIDATES '+JSON.stringify(m.map(x=>({
            kind:x.kind,name:x.name||null,status:x.status||null,serviceType:x.service_type||null
          }))));
          NODE

          tunnels="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Accept: application/json' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel?is_deleted=false&per_page=100" || printf '{"success":false}')"
          TUNNELS="$tunnels" node <<'NODE'
          const p=JSON.parse(process.env.TUNNELS||'{}');
          const rows=Array.isArray(p.result)?p.result:[];
          console.log('TUNNELS_SAFE '+JSON.stringify(rows.map(x=>({
            name:x.name||null,status:x.status||null,createdAt:x.created_at||null,deletedAt:x.deleted_at||null
          }))));
          NODE

          directory="$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Accept: application/json' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/connectivity/directory/services" || true)"
          DIRECTORY="$directory" DB="$db" node <<'NODE'
          let p={}; try{p=JSON.parse(process.env.DIRECTORY||'{}')}catch{}
          const rows=Array.isArray(p.result)?p.result:[];
          let dbHost=null;
          try {
            const d=JSON.parse(process.env.DB||'{}');
            if(typeof d.internal_db_url==='string') dbHost=new URL(d.internal_db_url).hostname;
          } catch {}
          console.log('VPC_SERVICES_SAFE '+JSON.stringify(rows.map(x=>({
            name:x.name||null,type:x.type||null,tcpPort:x.tcp_port??null,
            appProtocol:x.app_protocol||null,
            hostKind:x.host?.hostname?'hostname':x.host?.ipv4?'ipv4':x.host?.ipv6?'ipv6':'unknown',
            hostnameMatchesInternalDbHost:Boolean(dbHost&&x.host?.hostname===dbHost),
            resolverIpCount:Array.isArray(x.host?.resolver_network?.resolver_ips)?x.host.resolver_network.resolver_ips.length:0,
            certVerificationMode:x.tls_settings?.cert_verification_mode||null,
            hasTunnel:Boolean(x.host?.network?.tunnel_id||x.host?.resolver_network?.tunnel_id)
          }))));
          NODE
