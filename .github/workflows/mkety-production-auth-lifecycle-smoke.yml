name: Mkety Production Auth Lifecycle Smoke

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mkety-production-auth-lifecycle-smoke.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ZITADEL_MANAGEMENT_TOKEN: ${{ secrets.ZITADEL_MANAGEMENT_PAT }}
      ZITADEL_PROJECT_ID: ${{ secrets.ZITADEL_PROJECT_ID }}
      ZITADEL_ISSUER: ${{ vars.ZITADEL_URL }}
      HYPERDRIVE_NAME: mkety-production-db-v2
      CLEANUP_WORKER_NAME: mkety-production-auth-lifecycle-cleanup

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish run locator
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat >/tmp/status.json <<JSON
          {"state":"pending","context":"mkety/production-auth-lifecycle","description":"Production auth lifecycle smoke started.","target_url":"https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"}
          JSON
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json'             --data @/tmp/status.json "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

      - name: Require credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ZITADEL_MANAGEMENT_TOKEN ZITADEL_PROJECT_ID ZITADEL_ISSUER; do
            [ -n "${!name:-}" ] || { echo "::error::Missing $name"; exit 1; }
          done
          echo "::add-mask::$ZITADEL_MANAGEMENT_TOKEN"

      - name: Verify signup opens registration intent
        shell: bash
        run: |
          set -euo pipefail
          h=/tmp/signup-intent.headers
          code="$(curl -sS --connect-timeout 10 --max-time 25 -D "$h" -o /dev/null -w '%{http_code}'             'https://mkety.com/api/auth/login?returnTo=/select-tenant&intent=signup')"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/, "");sub(/\r$/,"");print;exit}' "$h")"
          [ "$code" -ge 300 ] && [ "$code" -lt 400 ]
          [ -n "$location" ]
          LOCATION="$location" node <<'NODE'
          const u=new URL(process.env.LOCATION), issuer=new URL(process.env.ZITADEL_ISSUER);
          if(u.origin!==issuer.origin) throw new Error('signup redirect issuer mismatch');
          if(u.searchParams.get('prompt')!=='create') throw new Error('signup prompt is not create');
          if(u.searchParams.get('response_type')!=='code') throw new Error('signup response type mismatch');
          if(u.searchParams.get('code_challenge_method')!=='S256'||!u.searchParams.get('code_challenge')) throw new Error('signup PKCE missing');
          NODE

      - name: Create ephemeral verified ZITADEL identity
        shell: bash
        run: |
          set -euo pipefail
          password="$(openssl rand -hex 24)Aa1!"
          email="mkety-prod-auth-smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.com"
          echo "::add-mask::$password"
          echo "SMOKE_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "SMOKE_EMAIL=$email" >> "$GITHUB_ENV"

          project_response="$(curl --fail-with-body --silent --show-error             -X POST "${ZITADEL_ISSUER%/}/zitadel.project.v2.ProjectService/GetProject"             -H "Authorization: Bearer ${ZITADEL_MANAGEMENT_TOKEN}"             -H 'Connect-Protocol-Version: 1'             -H 'Content-Type: application/json'             --data "{\"projectId\":\"${ZITADEL_PROJECT_ID}\"}")"
          organization_id="$(PROJECT_RESPONSE="$project_response" node <<'NODE'
          const p=JSON.parse(process.env.PROJECT_RESPONSE||'{}');
          const id=p.project?.organizationId||p.project?.organization_id;
          if(!id) throw new Error('organization id missing');
          process.stdout.write(id);
          NODE
          )"
          echo "::add-mask::$organization_id"

          payload="$(SMOKE_EMAIL="$email" SMOKE_PASSWORD="$password" ORGANIZATION_ID="$organization_id" node <<'NODE'
          process.stdout.write(JSON.stringify({
            organizationId:process.env.ORGANIZATION_ID,
            username:process.env.SMOKE_EMAIL,
            human:{
              profile:{givenName:'Mkety',familyName:'Production Smoke',displayName:'Mkety Production Auth Smoke',preferredLanguage:'en'},
              email:{email:process.env.SMOKE_EMAIL,isVerified:true},
              password:{password:process.env.SMOKE_PASSWORD,changeRequired:false}
            }
          }));
          NODE
          )"

          created="$(curl --fail-with-body --silent --show-error             -X POST "${ZITADEL_ISSUER%/}/v2/users/new"             -H "Authorization: Bearer ${ZITADEL_MANAGEMENT_TOKEN}"             -H 'Content-Type: application/json'             --data "$payload")"
          uid="$(CREATED="$created" node -e "const x=JSON.parse(process.env.CREATED||'{}');const id=x.id||x.userId||x.user_id;if(!id)process.exit(1);process.stdout.write(id)")"
          echo "::add-mask::$uid"
          echo "SMOKE_ZITADEL_USER_ID=$uid" >> "$GITHUB_ENV"

      - name: Install browser smoke dependency
        shell: bash
        run: |
          pnpm add --ignore-workspace-root-check --save-dev @playwright/test@1.55.0
          pnpm exec playwright install --with-deps chromium

      - name: Run production browser auth lifecycle
        shell: bash
        run: |
          set -euo pipefail
          cat > mkety-prod-auth.spec.ts <<'TEST'
          import { test, expect, type Locator, type Page } from '@playwright/test';

          const app = 'https://mkety.com';
          const appOrigin = new URL(app).origin;
          const issuer = new URL(process.env.ZITADEL_ISSUER!).origin;
          const email = process.env.SMOKE_EMAIL!;
          const password = process.env.SMOKE_PASSWORD!;

          async function visible(locator: Locator) {
            return locator.isVisible().catch(() => false);
          }

          async function fillHosted(page: Page, input: Locator, value: string) {
            await expect(input).toBeVisible({ timeout: 8_000 });
            await input.fill('');
            await input.pressSequentially(value, { delay: 10 });
            await expect(input).toHaveValue(value);
          }

          async function completeHostedLogin(page: Page) {
            const deadline = Date.now() + 70_000;
            while (Date.now() < deadline) {
              const current = new URL(page.url());
              if (current.origin === appOrigin) return;
              if (current.origin !== issuer) throw new Error(`Unexpected hosted-login origin: ${current.origin}`);

              const passwordInput = page.getByTestId('password-text-input').first();
              if (await visible(passwordInput)) {
                await fillHosted(page, passwordInput, password);
                await passwordInput.locator('xpath=ancestor::form[1]').locator('[data-testid="submit-button"][type="submit"]').click();
                await page.waitForTimeout(400);
                continue;
              }

              const usernameInput = page.getByTestId('username-text-input').first();
              if (await visible(usernameInput)) {
                await fillHosted(page, usernameInput, email);
                await usernameInput.locator('xpath=ancestor::form[1]').locator('[data-testid="submit-button"][type="submit"]').click();
                await page.waitForTimeout(400);
                continue;
              }

              const account = page.getByRole('button').filter({ hasText: email }).first();
              if (await visible(account)) {
                await account.click();
                await page.waitForTimeout(400);
                continue;
              }

              const authorization = page.getByRole('button', { name: /authorize|allow|continue/i }).first();
              if (await visible(authorization)) {
                await authorization.click();
                await page.waitForTimeout(400);
                continue;
              }

              await page.waitForTimeout(500);
            }
            throw new Error(`Hosted login did not return to Mkety; url=${page.url()}`);
          }

          async function completeHostedLogout(page: Page) {
            const deadline = Date.now() + 35_000;
            while (Date.now() < deadline) {
              const current = new URL(page.url());
              if (current.origin === appOrigin && current.pathname === '/login') return;
              if (current.origin !== issuer) throw new Error(`Unexpected hosted-logout origin: ${current.origin}`);
              const account = page.getByRole('button').filter({ hasText: email }).first();
              if (await visible(account)) {
                await account.click();
                await page.waitForTimeout(400);
                continue;
              }
              const button = page.getByRole('button', { name: /logout|sign out|continue/i }).first();
              if (await visible(button)) {
                await button.click();
                await page.waitForTimeout(400);
                continue;
              }
              await page.waitForTimeout(500);
            }
            throw new Error(`Hosted logout did not return to Mkety; url=${page.url()}`);
          }

          test('production callback, session, onboarding, logout and login-again work', async ({ page }) => {
            test.setTimeout(150_000);

            await page.goto(`${app}/api/auth/login?returnTo=/select-tenant&intent=signin`, { waitUntil: 'domcontentloaded' });
            await expect.poll(() => new URL(page.url()).origin, { timeout: 20_000 }).toBe(issuer);
            await completeHostedLogin(page);
            await page.waitForURL((url) => url.origin===appOrigin && url.pathname==='/select-tenant', { timeout: 20_000 });

            const sessionResponse=await page.context().request.get(`${app}/api/auth/session`);
            expect(sessionResponse.status()).toBe(200);
            const session=await sessionResponse.json();
            expect(session?.user?.email).toBe(email);

            await expect(page.getByRole('heading', { name: /create your first workspace/i })).toBeVisible({ timeout: 15_000 });
            await expect(page.getByRole('link', { name: /create workspace/i })).toBeVisible();

            await page.goto(`${app}/api/auth/logout?returnTo=/login`, { waitUntil: 'domcontentloaded' });
            await completeHostedLogout(page);
            await page.waitForURL((url) => url.origin===appOrigin && url.pathname==='/login', { timeout: 20_000 });

            const afterLogout=await page.context().request.get(`${app}/api/auth/session`);
            expect(afterLogout.status()).toBe(200);
            expect(await afterLogout.json()).toBeNull();

            await page.goto(`${app}/api/auth/login?returnTo=/select-tenant&intent=signin`, { waitUntil: 'domcontentloaded' });
            await expect.poll(() => new URL(page.url()).origin, { timeout: 20_000 }).toBe(issuer);
            await completeHostedLogin(page);
            await page.waitForURL((url) => url.origin===appOrigin && url.pathname==='/select-tenant', { timeout: 20_000 });

            const secondSession=await page.context().request.get(`${app}/api/auth/session`);
            expect(secondSession.status()).toBe(200);
            expect((await secondSession.json())?.user?.email).toBe(email);
          });
          TEST

          cat > playwright.prod-auth.config.ts <<'CONFIG'
          import { defineConfig } from '@playwright/test';
          export default defineConfig({
            use:{ trace:'retain-on-failure', screenshot:'only-on-failure' }
          });
          CONFIG

          pnpm exec playwright test mkety-prod-auth.spec.ts             --config=playwright.prod-auth.config.ts             --browser=chromium --reporter=line --workers=1

      - name: Resolve production Hyperdrive for exact cleanup
        if: always()
        id: hd
        shell: bash
        run: |
          set -euo pipefail
          list="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/hyperdrive/configs?per_page=100")"
          LIST="$list" node <<'NODE' >/tmp/hd-id
          const p=JSON.parse(process.env.LIST||'{}'), rows=Array.isArray(p.result)?p.result:[];
          const m=rows.filter(x=>x.name===process.env.HYPERDRIVE_NAME);
          if(m.length!==1||!m[0]?.id||!m[0]?.origin?.service_id) process.exit(1);
          process.stdout.write(String(m[0].id));
          NODE
          id="$(cat /tmp/hd-id)"
          echo "::add-mask::$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Delete exact Mkety smoke user through ephemeral Worker
        if: always() && env.SMOKE_EMAIL != ''
        shell: bash
        env:
          HD_ID: ${{ steps.hd.outputs.id }}
        run: |
          set +e
          mkdir -p .prod-auth-cleanup
          cat > .prod-auth-cleanup/worker.mjs <<'JS'
          import postgres from 'postgres';
          export default {
            async fetch(request, env) {
              if (request.method !== 'POST') return new Response('method', {status:405});
              const email = request.headers.get('x-smoke-email');
              if (!email || !email.startsWith('mkety-prod-auth-smoke-') || !email.endsWith('@example.com')) {
                return new Response('invalid target',{status:400});
              }
              const sql=postgres(env.MKETY_DB.connectionString,{max:1});
              try {
                const rows=await sql`delete from saas_template.users where email=${email} returning id`;
                return Response.json({deleted:rows.length});
              } finally { await sql.end({timeout:1}).catch(()=>{}); }
            }
          }
          JS
          cat > .prod-auth-cleanup/wrangler.jsonc <<JSON
          {"name":"$CLEANUP_WORKER_NAME","main":"./worker.mjs","compatibility_date":"2026-09-06","compatibility_flags":["nodejs_compat"],"workers_dev":true,"preview_urls":false,"hyperdrive":[{"binding":"MKETY_DB","id":"$HD_ID"}]}
          JSON
          pnpm exec wrangler deploy --config .prod-auth-cleanup/wrangler.jsonc >/tmp/cleanup-deploy.log 2>&1
          account="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          sub="$(ACCOUNT="$account" node -e "const x=JSON.parse(process.env.ACCOUNT||'{}');if(!x.success||!x.result?.subdomain)process.exit(1);process.stdout.write(x.result.subdomain)")"
          curl -fsS -X POST -H "x-smoke-email: $SMOKE_EMAIL" "https://$CLEANUP_WORKER_NAME.$sub.workers.dev/" >/tmp/cleanup-result.json
          cat /tmp/cleanup-result.json

      - name: Remove cleanup Worker and generated browser files
        if: always()
        shell: bash
        run: |
          set +e
          rm -f mkety-prod-auth.spec.ts playwright.prod-auth.config.ts
          curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json'             --data '{"enabled":false,"previews_enabled":false}'             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$CLEANUP_WORKER_NAME/subdomain" >/dev/null || true
          curl -sS -X DELETE -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$CLEANUP_WORKER_NAME" >/dev/null || true

      - name: Delete ephemeral ZITADEL identity
        if: always() && env.SMOKE_ZITADEL_USER_ID != ''
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error             -X DELETE "${ZITADEL_ISSUER%/}/v2/users/${SMOKE_ZITADEL_USER_ID}"             -H "Authorization: Bearer ${ZITADEL_MANAGEMENT_TOKEN}" >/dev/null

      - name: Publish result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=success
          desc='Production signup intent, callback, Mkety session, onboarding, logout and login-again all passed.'
          if [ "$JOB_STATUS" != success ]; then
            state=failure
            desc='Production auth lifecycle smoke failed; inspect run evidence. Cleanup was attempted.'
          fi
          STATE="$state" DESC="$desc" node <<'NODE' >/tmp/status.json
          process.stdout.write(JSON.stringify({state:process.env.STATE,context:'mkety/production-auth-lifecycle',description:process.env.DESC,target_url:`https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`}));
          NODE
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json'             --data @/tmp/status.json "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null || true
