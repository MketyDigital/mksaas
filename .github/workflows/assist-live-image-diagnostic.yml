name: Assist Live Image Diagnostic

on:
  push:
    branches:
      - diag/assist-live-image
    paths:
      - '.github/workflows/assist-live-image-diagnostic.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MKETY_ASSIST_CF_SAAS_TOKEN: ${{ secrets.MKETY_ASSIST_CF_SAAS_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Assist D1
        id: cf
        shell: bash
        run: |
          set -euo pipefail
          zones="$(curl --fail-with-body --silent --show-error "https://api.cloudflare.com/client/v4/zones?name=mkety.app&status=active" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
          account_id="$(ZONES="$zones" node -e "const v=JSON.parse(process.env.ZONES);process.stdout.write(v.result[0].account.id)")"
          query_db() {
            token="$1"
            curl --silent --show-error "https://api.cloudflare.com/client/v4/accounts/$account_id/d1/database?name=mkety-assist-prod" -H "Authorization: Bearer $token"
          }
          primary="$(query_db "$CLOUDFLARE_API_TOKEN")"
          db_id="$(PRIMARY="$primary" node -e "const v=JSON.parse(process.env.PRIMARY);process.stdout.write(v.result?.[0]?.uuid||'')")"
          source=primary
          if [ -z "$db_id" ]; then
            secondary="$(query_db "$MKETY_ASSIST_CF_SAAS_TOKEN")"
            db_id="$(SECONDARY="$secondary" node -e "const v=JSON.parse(process.env.SECONDARY);process.stdout.write(v.result?.[0]?.uuid||'')")"
            source=saas
          fi
          test -n "$db_id"
          echo "account_id=$account_id" >> "$GITHUB_OUTPUT"
          echo "db_id=$db_id" >> "$GITHUB_OUTPUT"
          echo "token_source=$source" >> "$GITHUB_OUTPUT"

      - name: Query latest failed image pipeline
        shell: bash
        env:
          ACCOUNT_ID: ${{ steps.cf.outputs.account_id }}
          DB_ID: ${{ steps.cf.outputs.db_id }}
          TOKEN_SOURCE: ${{ steps.cf.outputs.token_source }}
        run: |
          set -euo pipefail
          if [ "$TOKEN_SOURCE" = "saas" ]; then token="$MKETY_ASSIST_CF_SAAS_TOKEN"; else token="$CLOUDFLARE_API_TOKEN"; fi
          query() {
            sql="$1"
            SQL="$sql" TOKEN="$token" node <<'NODE'
          const account=process.env.ACCOUNT_ID, db=process.env.DB_ID, token=process.env.TOKEN, sql=process.env.SQL;
          const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/d1/database/${db}/query`,{
            method:'POST',
            headers:{authorization:`Bearer ${token}`,'content-type':'application/json'},
            body:JSON.stringify({sql})
          });
          const t=await r.text();
          if(!r.ok) throw new Error('D1 query failed '+r.status+': '+t);
          console.log(t);
          NODE
          }
          echo "=== latest image media assets (no content) ==="
          query "SELECT id,kind,size_bytes,LENGTH(COALESCE(vision_text,'')) AS vision_chars,created_at FROM media_assets WHERE kind='image' ORDER BY created_at DESC LIMIT 10;"
          echo "=== latest image reply jobs ==="
          query "SELECT id,status,attempts,last_error,response_text,provider_message_id,image_count,audio_seconds,LENGTH(COALESCE(media_context,'')) AS media_context_chars,created_at,completed_at FROM reply_jobs WHERE image_count>0 ORDER BY created_at DESC LIMIT 10;"
          echo "=== latest image-related usage ==="
          query "SELECT model_alias,provider,provider_model,input_units,output_units,credits_charged,provider_cost_micros,created_at FROM usage_events WHERE model_alias IN ('mkety-media-vision','mkety-smart','mkety-fast','mkety-reasoning','mkety-vision') ORDER BY created_at DESC LIMIT 40;"
          echo "=== latest reservations ==="
          query "SELECT id,status,reserved_credits,settled_credits,created_at,settled_at FROM credit_reservations ORDER BY created_at DESC LIMIT 20;"
