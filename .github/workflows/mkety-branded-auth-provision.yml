name: Mkety Branded Auth Provision

# public auth settings refresh 2026-09-24
# production legal/login refresh 2026-09-24

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mkety-branded-auth-provision.yml
      - ops/zitadel-login/**
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      ZITADEL_ISSUER: ${{ vars.ZITADEL_URL }}
      ZITADEL_MANAGEMENT_TOKEN: ${{ secrets.ZITADEL_MANAGEMENT_PAT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      COOLIFY_URL: https://deploy.mkety.com
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      PROJECT_UUID: 0zqhpkprlhtvlacmsgmfyyhs
      ENVIRONMENT_UUID: rtebcetyfvzlaiqitzcp0gl8
      SERVER_UUID: ynkdc4tx6bi7cyxf0kuy8kte
      INFRA_ORG_NAME: Mkety Identity Infrastructure
      LOGIN_USERNAME: mkety-login-client
      LOGIN_APP_NAME: mkety-zitadel-login
      AUTH_HOSTNAME: auth.mkety.com
      AUTH_URL: https://auth.mkety.com
      LOGIN_BASE_PATH: /ui/v2/login

    steps:
      - uses: actions/checkout@v4

      - name: Publish provision locator
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat >/tmp/status.json <<JSON
          {"state":"pending","context":"mkety/branded-auth-provision","description":"Provisioning isolated auth.mkety.com Login V2; production OIDC app is not switched.","target_url":"https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"}
          JSON
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json'             --data @/tmp/status.json "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

      - name: Require infrastructure credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in ZITADEL_ISSUER ZITADEL_MANAGEMENT_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID COOLIFY_API_TOKEN; do
            [ -n "${!name:-}" ] || { echo "::error::Missing $name"; exit 1; }
          done
          echo "::add-mask::$ZITADEL_MANAGEMENT_TOKEN"
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "::add-mask::$COOLIFY_API_TOKEN"

      - name: Ensure dedicated ZITADEL infrastructure organization
        id: org
        shell: bash
        run: |
          set -euo pipefail
          issuer="${ZITADEL_ISSUER%/}"
          response="$(curl --fail-with-body --silent --show-error -X POST "$issuer/v2/organizations/_search"             -H "Authorization: Bearer $ZITADEL_MANAGEMENT_TOKEN" -H 'Content-Type: application/json'             --data '{"query":{"limit":100}}')"
          ORGS="$response" node <<'NODE' >/tmp/org-id
          const p=JSON.parse(process.env.ORGS||'{}'), a=Array.isArray(p.result)?p.result:[];
          const m=a.filter(x=>x.name===process.env.INFRA_ORG_NAME);
          if(m.length>1) throw new Error('Duplicate identity infrastructure organizations');
          if(m[0]?.id) process.stdout.write(String(m[0].id));
          NODE
          org_id="$(cat /tmp/org-id)"
          if [ -z "$org_id" ]; then
            payload="$(ORG_NAME="$INFRA_ORG_NAME" node -e "process.stdout.write(JSON.stringify({name:process.env.ORG_NAME}))")"
            created="$(curl --fail-with-body --silent --show-error -X POST "$issuer/v2/organizations"               -H "Authorization: Bearer $ZITADEL_MANAGEMENT_TOKEN" -H 'Content-Type: application/json' --data "$payload")"
            org_id="$(CREATED="$created" node -e "const x=JSON.parse(process.env.CREATED||'{}');if(!x.organizationId)process.exit(1);process.stdout.write(x.organizationId)")"
            echo "created=true" >> "$GITHUB_OUTPUT"
          else
            echo "created=false" >> "$GITHUB_OUTPUT"
          fi
          echo "::add-mask::$org_id"
          echo "org_id=$org_id" >> "$GITHUB_OUTPUT"
          echo 'Dedicated ZITADEL infrastructure organization resolved.'

      - name: Ensure dedicated Login V2 machine user
        id: user
        shell: bash
        env:
          ORG_ID: ${{ steps.org.outputs.org_id }}
        run: |
          set -euo pipefail
          issuer="${ZITADEL_ISSUER%/}"
          users="$(curl --fail-with-body --silent --show-error -X POST "$issuer/v2/users"             -H "Authorization: Bearer $ZITADEL_MANAGEMENT_TOKEN" -H 'Content-Type: application/json'             --data '{"query":{"limit":100}}')"
          USERS="$users" node <<'NODE' >/tmp/user-id
          const p=JSON.parse(process.env.USERS||'{}'), a=Array.isArray(p.result)?p.result:(Array.isArray(p.users)?p.users:[]);
          const m=a.filter(x=>{
            const username=x.username||x.userName||x.preferredLoginName||x.machine?.username||'';
            const org=x.organizationId||x.organization?.id||x.details?.resourceOwner||'';
            return username===process.env.LOGIN_USERNAME && (!org || org===process.env.ORG_ID);
          });
          if(m.length>1) throw new Error('Duplicate Mkety login-client users');
          const id=m[0]?.id||m[0]?.userId;
          if(id) process.stdout.write(String(id));
          NODE
          user_id="$(cat /tmp/user-id)"
          if [ -z "$user_id" ]; then
            payload="$(ORG_ID="$ORG_ID" LOGIN_USERNAME="$LOGIN_USERNAME" node <<'NODE'
          process.stdout.write(JSON.stringify({
            organizationId:process.env.ORG_ID,
            username:process.env.LOGIN_USERNAME,
            machine:{
              name:'Mkety Login Client',
              description:'Dedicated least-privilege service account for auth.mkety.com Login V2'
            }
          }));
          NODE
            )"
            code="$(curl --silent --show-error -o /tmp/user-create.json -w '%{http_code}' -X POST "$issuer/v2/users/new"               -H "Authorization: Bearer $ZITADEL_MANAGEMENT_TOKEN" -H 'Content-Type: application/json' --data "$payload")"
            if [ "$code" != 200 ]; then
              CODE="$code" node <<'NODE'
          const fs=require('node:fs');let x={};try{x=JSON.parse(fs.readFileSync('/tmp/user-create.json','utf8'))}catch{}
          console.log('ZITADEL_LOGIN_USER_CREATE_SAFE '+JSON.stringify({http:process.env.CODE,code:x.code||null,message:x.message||null}));
          NODE
              exit 1
            fi
            user_id="$(node -e "const x=require('/tmp/user-create.json');const id=x.id||x.userId;if(!id)process.exit(1);process.stdout.write(id)")"
            echo "created=true" >> "$GITHUB_OUTPUT"
          else
            echo "created=false" >> "$GITHUB_OUTPUT"
          fi
          echo "::add-mask::$user_id"
          echo "user_id=$user_id" >> "$GITHUB_OUTPUT"
          echo 'Dedicated Login V2 machine user resolved.'

      - name: Ensure Instance Login Client role
        shell: bash
        env:
          USER_ID: ${{ steps.user.outputs.user_id }}
        run: |
          set -euo pipefail
          issuer="${ZITADEL_ISSUER%/}"
          payload="$(USER_ID="$USER_ID" node -e "process.stdout.write(JSON.stringify({userId:process.env.USER_ID,resource:{instance:true},roles:['IAM_LOGIN_CLIENT']}))")"
          code="$(curl --silent --show-error -o /tmp/admin-role.json -w '%{http_code}' -X POST             "$issuer/zitadel.internal_permission.v2.InternalPermissionService/CreateAdministrator"             -H "Authorization: Bearer $ZITADEL_MANAGEMENT_TOKEN"             -H 'Connect-Protocol-Version: 1' -H 'Content-Type: application/json' --data "$payload")"
          if [ "$code" != 200 ]; then
            acceptable="$(node -e "const fs=require('node:fs');let x={};try{x=JSON.parse(fs.readFileSync('/tmp/admin-role.json','utf8'))}catch{};const t=String(x.code||'')+' '+String(x.message||'');process.stdout.write(/already|exists/i.test(t)?'true':'false')")"
            if [ "$acceptable" != true ]; then
              CODE="$code" node <<'NODE'
          const fs=require('node:fs');let x={};try{x=JSON.parse(fs.readFileSync('/tmp/admin-role.json','utf8'))}catch{}
          console.log('ZITADEL_LOGIN_ROLE_SAFE '+JSON.stringify({http:process.env.CODE,code:x.code||null,message:x.message||null}));
          NODE
              exit 1
            fi
          fi
          echo 'Dedicated login client has IAM_LOGIN_CLIENT only.'

      - name: Ensure auth.mkety.com is a ZITADEL trusted domain
        shell: bash
        run: |
          set -euo pipefail
          issuer="${ZITADEL_ISSUER%/}"
          trusted="$(curl --fail-with-body --silent --show-error -X POST             "$issuer/zitadel.instance.v2.InstanceService/ListTrustedDomains"             -H "Authorization: Bearer $ZITADEL_MANAGEMENT_TOKEN"             -H 'Connect-Protocol-Version: 1' -H 'Content-Type: application/json' --data '{}')"
          present="$(TRUSTED="$trusted" node -e "const p=JSON.parse(process.env.TRUSTED||'{}');const a=Array.isArray(p.trustedDomain)?p.trustedDomain:(Array.isArray(p.trustedDomains)?p.trustedDomains:[]);process.stdout.write(a.some(x=>(x.domain||x.trustedDomain)===process.env.AUTH_HOSTNAME)?'true':'false')")"
          if [ "$present" != true ]; then
            payload="$(AUTH_HOSTNAME="$AUTH_HOSTNAME" node -e "process.stdout.write(JSON.stringify({trustedDomain:process.env.AUTH_HOSTNAME}))")"
            curl --fail-with-body --silent --show-error -X POST               "$issuer/zitadel.instance.v2.InstanceService/AddTrustedDomain"               -H "Authorization: Bearer $ZITADEL_MANAGEMENT_TOKEN"               -H 'Connect-Protocol-Version: 1' -H 'Content-Type: application/json' --data "$payload" >/dev/null
          fi
          echo 'auth.mkety.com is trusted by ZITADEL.'

      - name: Ensure Mkety legal and support links in Login V2
        shell: bash
        run: |
          set -euo pipefail
          issuer="${ZITADEL_ISSUER%/}"
          cat >/tmp/link-settings.json <<'JSON'
          {
            "ctx": { "instance": true },
            "links": [
              { "type": "LINK_TYPE_TERMS_OF_SERVICE", "url": "https://mkety.com/terms", "target": "LINK_TARGET_BLANK" },
              { "type": "LINK_TYPE_PRIVACY_POLICY", "url": "https://mkety.com/privacy", "target": "LINK_TARGET_BLANK" },
              { "type": "LINK_TYPE_HELP", "url": "https://mkety.com/docs", "target": "LINK_TARGET_BLANK" },
              { "type": "LINK_TYPE_SUPPORT", "url": "mailto:support@mkety.com", "target": "LINK_TARGET_SELF" },
              { "type": "LINK_TYPE_DOCS", "url": "https://mkety.com/docs", "target": "LINK_TARGET_BLANK" }
            ]
          }
          JSON

          # Newer ZITADEL versions expose generic Login V2 link settings through
          # ConnectRPC. Some hosted instances can lag that API while still
          # supporting the fully supported Admin v1 privacy-policy operation.
          # Prefer the new API, but fall back only when the endpoint itself is
          # unavailable or unsupported by this hosted instance (HTTP 404/400).
          # The Admin v1 privacy policy is the supported compatibility fallback;
          # all other errors remain fail-closed.
          set +e
          link_status="$(curl --silent --show-error -o /tmp/link-settings-response.json -w '%{http_code}' \
            -X POST "$issuer/zitadel.settings.v2.SettingsService/SetLinkSettings" \
            -H "Authorization: Bearer $ZITADEL_MANAGEMENT_TOKEN" \
            -H 'Connect-Protocol-Version: 1' \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/link-settings.json)"
          curl_status=$?
          set -e

          if [ "$curl_status" -ne 0 ]; then
            cat /tmp/link-settings-response.json >&2 || true
            echo "::error::Could not reach ZITADEL Link Settings API."
            exit "$curl_status"
          fi

          if [ "$link_status" = "404" ] || [ "$link_status" = "400" ]; then
            printf '%s\n' '{"tosLink":"https://mkety.com/terms","privacyLink":"https://mkety.com/privacy","helpLink":"https://mkety.com/docs","supportEmail":"support@mkety.com","docsLink":"https://mkety.com/docs","customLink":"","customLinkText":""}' > /tmp/privacy-policy.json
            curl --fail-with-body --silent --show-error -X PUT \
              "$issuer/admin/v1/policies/privacy" \
              -H "Authorization: Bearer $ZITADEL_MANAGEMENT_TOKEN" \
              -H 'Content-Type: application/json' \
              --data-binary @/tmp/privacy-policy.json >/tmp/privacy-policy-response.json

            current="$(curl --fail-with-body --silent --show-error \
              "$issuer/admin/v1/policies/privacy" \
              -H "Authorization: Bearer $ZITADEL_MANAGEMENT_TOKEN" \
              -H 'Accept: application/json')"
            POLICY="$current" node -e 'const payload=JSON.parse(process.env.POLICY||"{}"); const policy=payload.policy||{}; const expected={tosLink:"https://mkety.com/terms",privacyLink:"https://mkety.com/privacy",helpLink:"https://mkety.com/docs",supportEmail:"support@mkety.com",docsLink:"https://mkety.com/docs"}; for (const [key,value] of Object.entries(expected)) { if (policy[key] !== value) throw new Error("Missing Mkety Login legal/support setting: "+key); } console.log("Mkety Login legal/support links verified through Admin v1 fallback.");'
          elif [ "$link_status" -ge 200 ] && [ "$link_status" -lt 300 ]; then
            current="$(curl --fail-with-body --silent --show-error -X POST \
              "$issuer/zitadel.settings.v2.SettingsService/GetLinkSettings" \
              -H "Authorization: Bearer $ZITADEL_MANAGEMENT_TOKEN" \
              -H 'Connect-Protocol-Version: 1' \
              -H 'Content-Type: application/json' \
              --data '{"ctx":{"instance":true}}')"
            LINKS="$current" node -e 'const payload=JSON.parse(process.env.LINKS||"{}"); const links=payload.settings?.links||[]; const expected=new Map([["LINK_TYPE_TERMS_OF_SERVICE","https://mkety.com/terms"],["LINK_TYPE_PRIVACY_POLICY","https://mkety.com/privacy"],["LINK_TYPE_HELP","https://mkety.com/docs"],["LINK_TYPE_SUPPORT","mailto:support@mkety.com"],["LINK_TYPE_DOCS","https://mkety.com/docs"]]); for (const [type,url] of expected) { if (!links.some((link)=>link.type===type && link.url===url)) throw new Error("Missing Mkety Login V2 link setting: "+type); } console.log("Mkety Login V2 legal/support links verified.");'
          else
            cat /tmp/link-settings-response.json >&2 || true
            echo "::error::ZITADEL SetLinkSettings returned HTTP $link_status."
            exit 1
          fi

      - name: Create fresh login-client PAT
        id: pat
        shell: bash
        env:
          USER_ID: ${{ steps.user.outputs.user_id }}
        run: |
          set -euo pipefail
          issuer="${ZITADEL_ISSUER%/}"
          expiration="$(node -e "const d=new Date();d.setUTCFullYear(d.getUTCFullYear()+1);process.stdout.write(d.toISOString())")"
          payload="$(EXPIRATION="$expiration" node -e "process.stdout.write(JSON.stringify({expirationDate:process.env.EXPIRATION}))")"
          created="$(curl --fail-with-body --silent --show-error -X POST "$issuer/v2/users/$USER_ID/pats"             -H "Authorization: Bearer $ZITADEL_MANAGEMENT_TOKEN" -H 'Content-Type: application/json' --data "$payload")"
          token="$(CREATED="$created" node -e "const x=JSON.parse(process.env.CREATED||'{}');if(!x.token)process.exit(1);process.stdout.write(x.token)")"
          token_id="$(CREATED="$created" node -e "const x=JSON.parse(process.env.CREATED||'{}');if(!x.tokenId)process.exit(1);process.stdout.write(x.tokenId)")"
          echo "::add-mask::$token"; echo "::add-mask::$token_id"
          echo "LOGIN_CLIENT_PAT=$token" >> "$GITHUB_ENV"
          echo "token_id=$token_id" >> "$GITHUB_OUTPUT"
          echo 'Fresh login-client PAT created and masked.'

      - name: Ensure Coolify Login V2 application
        id: app
        shell: bash
        run: |
          set -euo pipefail
          base="${COOLIFY_URL%/}/api/v1"
          curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" "$base/applications" -o /tmp/apps.json
          uuid="$(node -e "const p=require('/tmp/apps.json');const a=Array.isArray(p)?p:(p.data||[]);const m=a.filter(x=>x.name===process.env.LOGIN_APP_NAME);if(m.length>1)process.exit(2);process.stdout.write(m[0]?.uuid||'')")"
          if [ -z "$uuid" ]; then
            node <<'NODE' >/tmp/create-app.json
          process.stdout.write(JSON.stringify({
            project_uuid:process.env.PROJECT_UUID,
            server_uuid:process.env.SERVER_UUID,
            environment_uuid:process.env.ENVIRONMENT_UUID,
            git_repository:'https://github.com/MketyDigital/mksaas',
            git_branch:'main',
            git_commit_sha:process.env.GITHUB_SHA,
            build_pack:'dockerfile',
            dockerfile_location:'/ops/zitadel-login/Dockerfile',
            ports_exposes:'3000',
            name:process.env.LOGIN_APP_NAME,
            description:'Mkety-branded ZITADEL Login V2 edge',
            autogenerate_domain:false,
            connect_to_docker_network:true,
            instant_deploy:false,
            is_auto_deploy_enabled:false
          }));
          NODE
            code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/create-response.json -w '%{http_code}' -X POST               -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Content-Type: application/json'               --data-binary @/tmp/create-app.json "$base/applications/public")"
            [ "$code" = 201 ] || { echo "::error::Coolify app create failed HTTP $code"; cat /tmp/create-response.json; exit 1; }
            uuid="$(node -e "const x=require('/tmp/create-response.json');if(!x.uuid)process.exit(1);process.stdout.write(x.uuid)")"
            echo "created=true" >> "$GITHUB_OUTPUT"
          else
            echo "created=false" >> "$GITHUB_OUTPUT"
          fi
          echo "::add-mask::$uuid"
          echo "uuid=$uuid" >> "$GITHUB_OUTPUT"

          patch="$(AUTH_URL="$AUTH_URL" GITHUB_SHA="$GITHUB_SHA" node <<'NODE'
          process.stdout.write(JSON.stringify({
            domains:process.env.AUTH_URL,
            ports_exposes:'3000',
            git_branch:'main',
            git_commit_sha:process.env.GITHUB_SHA,
            dockerfile_location:'/ops/zitadel-login/Dockerfile',
            is_auto_deploy_enabled:false,
            is_force_https_enabled:true,
            health_check_enabled:true,
            health_check_path:'/ui/v2/login/ready',
            health_check_port:'3000',
            health_check_scheme:'http',
            health_check_method:'GET',
            health_check_return_code:200
          }));
          NODE
          )"
          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/patch-response.json -w '%{http_code}' -X PATCH             -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Content-Type: application/json'             --data "$patch" "$base/applications/$uuid")"
          [ "$code" = 200 ] || { echo "::error::Coolify app patch failed HTTP $code"; cat /tmp/patch-response.json; exit 1; }

          upsert() {
            KEY="$1" VALUE="$2" node <<'NODE' >/tmp/env.json
          process.stdout.write(JSON.stringify({key:process.env.KEY,value:process.env.VALUE,is_preview:false,is_literal:true,is_multiline:false,is_shown_once:true}));
          NODE
            code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/env-response.json -w '%{http_code}' -X POST               -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Content-Type: application/json'               --data-binary @/tmp/env.json "$base/applications/$uuid/envs")"
            if [ "$code" != 201 ]; then
              code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/env-response.json -w '%{http_code}' -X PATCH                 -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Content-Type: application/json'                 --data-binary @/tmp/env.json "$base/applications/$uuid/envs")"
            fi
            [ "$code" = 201 ] || { echo "::error::Coolify env update failed for $KEY HTTP $code"; exit 1; }
          }

          instance_host="$(node -e "process.stdout.write(new URL(process.env.ZITADEL_ISSUER).hostname)")"
          upsert ZITADEL_API_URL "${ZITADEL_ISSUER%/}"
          upsert ZITADEL_SERVICE_USER_TOKEN "$LOGIN_CLIENT_PAT"
          upsert NEXT_PUBLIC_BASE_PATH "$LOGIN_BASE_PATH"
          upsert ZITADEL_PUBLIC_HOST "$AUTH_HOSTNAME"
          upsert ZITADEL_INSTANCE_HOST "$instance_host"
          upsert EMAIL_VERIFICATION true
          upsert PORT 3001

      - name: Ensure Cloudflare DNS for auth.mkety.com
        id: dns
        shell: bash
        run: |
          set -euo pipefail
          zones="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/zones?name=mkety.com&status=active&per_page=50")"
          zone_id="$(ZONES="$zones" node -e "const p=JSON.parse(process.env.ZONES||'{}'),a=Array.isArray(p.result)?p.result:[];if(a.length!==1||!a[0]?.id)process.exit(1);process.stdout.write(a[0].id)")"
          echo "::add-mask::$zone_id"; echo "zone_id=$zone_id" >> "$GITHUB_OUTPUT"

          records="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?name=$AUTH_HOSTNAME&per_page=100")"
          record_id="$(RECORDS="$records" node -e "const p=JSON.parse(process.env.RECORDS||'{}'),a=Array.isArray(p.result)?p.result:[];if(a.length>1)process.exit(2);process.stdout.write(a[0]?.id||'')")"
          payload="$(AUTH_HOSTNAME="$AUTH_HOSTNAME" node -e "process.stdout.write(JSON.stringify({type:'CNAME',name:process.env.AUTH_HOSTNAME,content:'deploy.mkety.com',ttl:1,proxied:true}))")"
          if [ -z "$record_id" ]; then
            result="$(curl -fsS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json'               --data "$payload" "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records")"
            node -e "const x=JSON.parse(process.argv[1]);if(!x.success)process.exit(1)" "$result"
            echo "created=true" >> "$GITHUB_OUTPUT"
          else
            echo "::add-mask::$record_id"
            result="$(curl -fsS -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json'               --data "$payload" "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records/$record_id")"
            node -e "const x=JSON.parse(process.argv[1]);if(!x.success)process.exit(1)" "$result"
            echo "created=false" >> "$GITHUB_OUTPUT"
          fi
          echo 'Cloudflare proxied auth.mkety.com DNS is configured.'

      - name: Deploy branded Login V2
        shell: bash
        env:
          APP_UUID: ${{ steps.app.outputs.uuid }}
        run: |
          set -euo pipefail
          base="${COOLIFY_URL%/}/api/v1"
          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/deploy.json -w '%{http_code}' -X POST             -H "Authorization: Bearer $COOLIFY_API_TOKEN" "$base/deploy?uuid=$APP_UUID&force=true")"
          [ "$code" = 200 ] || { echo "::error::Coolify login deploy failed to queue HTTP $code"; exit 1; }
          dep="$(node -e "const x=require('/tmp/deploy.json');const d=Array.isArray(x.deployments)?x.deployments[0]:x;if(!d?.deployment_uuid)process.exit(1);process.stdout.write(d.deployment_uuid)")"
          echo "::add-mask::$dep"
          done=0
          for i in $(seq 1 120); do
            curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" "$base/deployments/$dep" -o /tmp/dep.json
            st="$(node -e "const x=require('/tmp/dep.json');process.stdout.write(String(x.status||''))")"
            case "${st,,}" in
              finished|success|successful|succeeded|completed) done=1; break ;;
              failed|failure|error|cancelled|canceled) echo "::error::Coolify deployment failed"; exit 1 ;;
            esac
            sleep 3
          done
          [ "$done" = 1 ] || { echo "::error::Coolify login deploy did not complete in time"; exit 1; }

      - name: Smoke auth.mkety.com before OIDC cutover
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 60); do
            code="$(curl -sS --connect-timeout 8 --max-time 20 -o /tmp/ready.body -w '%{http_code}' "$AUTH_URL$LOGIN_BASE_PATH/ready" || true)"
            if [ "$code" = 200 ]; then ready=1; break; fi
            sleep 4
          done
          [ "$ready" = 1 ] || { echo "::error::auth.mkety.com Login V2 readiness failed"; exit 1; }

          code="$(curl -sS --connect-timeout 8 --max-time 20 -D /tmp/login.headers -o /tmp/login.body -w '%{http_code}' "$AUTH_URL$LOGIN_BASE_PATH" || true)"
          ct="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {sub(/^[^:]*:[[:space:]]*/, "");gsub(/\r/,"");v=$0} END{print v}' /tmp/login.headers)"
          echo "auth.mkety.com Login V2 -> HTTP $code type=$ct"
          [ "$code" -ge 200 ] && [ "$code" -lt 500 ]
          printf '%s' "$ct" | grep -Eqi 'text/html|application/json'
          if grep -qi 'Instance not found' /tmp/login.body; then
            echo "::error::Login V2 reached wrong ZITADEL instance context."
            exit 1
          fi
          echo 'Branded Login V2 is reachable and no instance-resolution failure is present.'

      - name: Revoke older login-client PATs after successful deployment
        shell: bash
        env:
          USER_ID: ${{ steps.user.outputs.user_id }}
          NEW_TOKEN_ID: ${{ steps.pat.outputs.token_id }}
        run: |
          set -euo pipefail
          issuer="${ZITADEL_ISSUER%/}"
          pats="$(curl --fail-with-body --silent --show-error -X POST "$issuer/v2/users/pats/search"             -H "Authorization: Bearer $ZITADEL_MANAGEMENT_TOKEN" -H 'Content-Type: application/json'             --data '{"pagination":{"limit":100}}')"
          PATS="$pats" USER_ID="$USER_ID" NEW_TOKEN_ID="$NEW_TOKEN_ID" node <<'NODE' >/tmp/old-pats
          const p=JSON.parse(process.env.PATS||'{}'),a=Array.isArray(p.result)?p.result:[];
          for(const x of a){
            if(String(x.userId||'')===process.env.USER_ID && String(x.id||x.tokenId||'')!==process.env.NEW_TOKEN_ID){
              console.log(String(x.id||x.tokenId));
            }
          }
          NODE
          while IFS= read -r token_id; do
            [ -n "$token_id" ] || continue
            echo "::add-mask::$token_id"
            curl --fail-with-body --silent --show-error -X DELETE "$issuer/v2/users/$USER_ID/pats/$token_id"               -H "Authorization: Bearer $ZITADEL_MANAGEMENT_TOKEN" >/dev/null
          done </tmp/old-pats
          echo 'Older login-client PATs revoked after successful smoke.'

      - name: Remove newly issued PAT on failed deployment
        if: failure() && steps.pat.outputs.token_id != ''
        shell: bash
        env:
          USER_ID: ${{ steps.user.outputs.user_id }}
          TOKEN_ID: ${{ steps.pat.outputs.token_id }}
        run: |
          set +e
          curl --silent --show-error -X DELETE "${ZITADEL_ISSUER%/}/v2/users/$USER_ID/pats/$TOKEN_ID"             -H "Authorization: Bearer $ZITADEL_MANAGEMENT_TOKEN" >/dev/null

      - name: Publish provision result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=success
          desc='auth.mkety.com Login V2 deployed and smoke-tested; production OIDC app remains on existing login until cutover.'
          if [ "$JOB_STATUS" != success ]; then
            state=failure
            desc='Branded Login V2 provisioning failed; production OIDC login remains unchanged.'
          fi
          STATE="$state" DESC="$desc" node <<'NODE' >/tmp/status.json
          process.stdout.write(JSON.stringify({state:process.env.STATE,context:'mkety/branded-auth-provision',description:process.env.DESC,target_url:`https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`}));
          NODE
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/json'             --data @/tmp/status.json "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null || true
