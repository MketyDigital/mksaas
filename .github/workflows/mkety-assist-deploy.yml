name: Mkety Assist Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'customer-apps/assist/**'
      - '.github/workflows/mkety-assist-deploy.yml'

permissions:
  contents: read
  statuses: write

concurrency:
  group: mkety-assist-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MKETY_ASSIST_TELEGRAM_AUTH_BOT_TOKEN: ${{ secrets.MKETY_ASSIST_TELEGRAM_AUTH_BOT_TOKEN }}
      MKETY_ASSIST_TELEGRAM_AUTH_WEBHOOK_SECRET: ${{ secrets.MKETY_ASSIST_TELEGRAM_AUTH_WEBHOOK_SECRET }}
      MKETY_ASSIST_CF_SAAS_TOKEN: ${{ secrets.MKETY_ASSIST_CF_SAAS_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      MKETY_ASSIST_TELEGRAM_AUTH_BOT_USERNAME: ${{ vars.MKETY_ASSIST_TELEGRAM_AUTH_BOT_USERNAME }}
      MKETY_ASSIST_SECRET_ENCRYPTION_KEY: ${{ secrets.MKETY_ASSIST_SECRET_ENCRYPTION_KEY }}
      FLUTTERWAVE_CHECKOUT_BROKER_SECRET: ${{ secrets.FLUTTERWAVE_CHECKOUT_BROKER_SECRET }}
      NOWPAYMENTS_API_KEY: ${{ secrets.NOWPAYMENTS_API_KEY }}
      NOWPAYMENTS_IPN_SECRET: ${{ secrets.NOWPAYMENTS_IPN_SECRET }}
      ZITADEL_MANAGEMENT_TOKEN: ${{ secrets.ZITADEL_MANAGEMENT_PAT }}
      ZITADEL_PROJECT_ID: ${{ secrets.ZITADEL_PROJECT_ID }}
      MKETY_ASSIST_OPS_AUTH_ISSUER: ${{ secrets.ZITADEL_URL || vars.ZITADEL_URL }}
      MKETY_ASSIST_OPS_ALLOWED_EMAIL: hello@mkety.com
      MKETY_ASSIST_AZURE_FOUNDRY_API_KEY: ${{ secrets.MKETY_PUBLIC_AZURE_OPEN_AI_API_KEY || secrets.MKETY_PUBLIC_AZURE_OPENAI_API_KEY || secrets.MKETY_PUBLIC_AZURE_OPEN_AI_KEY || secrets.MKETY_PUBLIC_AZURE_OPENAI_KEY || secrets.MKETY_PUBLIC_AZURE_API_KEY || secrets.MKETY_PUBLIC_AZURE_KEY || secrets.AZURE_OPENAI_API_KEY || secrets.AZURE_AI_API_KEY }}
      MKETY_ASSIST_AZURE_FOUNDRY_ENDPOINT: ${{ secrets.MKETY_PUBLIC_AZURE_OPEN_AI_ENDPOINT || secrets.MKETY_PUBLIC_AZURE_OPENAI_ENDPOINT || vars.MKETY_PUBLIC_AZURE_OPEN_AI_ENDPOINT || vars.MKETY_PUBLIC_AZURE_OPENAI_ENDPOINT }}
      MKETY_ASSIST_AZURE_FOUNDRY_MODEL: ${{ secrets.MKETY_PUBLIC_AZURE_OPEN_AI_MODEL || secrets.MKETY_PUBLIC_AZURE_OPENAI_MODEL || secrets.MKETY_PUBLIC_AZURE_OPEN_AI_DEPLOYMENT || secrets.MKETY_PUBLIC_AZURE_OPENAI_DEPLOYMENT || vars.MKETY_PUBLIC_AZURE_OPEN_AI_MODEL || vars.MKETY_PUBLIC_AZURE_OPENAI_MODEL || vars.MKETY_PUBLIC_AZURE_OPEN_AI_DEPLOYMENT || vars.MKETY_PUBLIC_AZURE_OPENAI_DEPLOYMENT }}
      MKETY_ASSIST_OPENAI_API_KEY: ${{ secrets.MKETY_PUBLIC_OPENAI_API_KEY || secrets.OPENAI_API_KEY }}
      MKETY_ASSIST_OPENAI_MODEL: ${{ secrets.MKETY_PUBLIC_OPENAI_MODEL || vars.MKETY_PUBLIC_OPENAI_MODEL || 'gpt-5.6-luna' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Require deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          required=(CLOUDFLARE_API_TOKEN MKETY_ASSIST_CF_SAAS_TOKEN ZITADEL_MANAGEMENT_TOKEN ZITADEL_PROJECT_ID MKETY_ASSIST_OPS_AUTH_ISSUER NOWPAYMENTS_API_KEY NOWPAYMENTS_IPN_SECRET FLUTTERWAVE_CHECKOUT_BROKER_SECRET MKETY_ASSIST_AZURE_FOUNDRY_API_KEY MKETY_ASSIST_AZURE_FOUNDRY_ENDPOINT MKETY_ASSIST_AZURE_FOUNDRY_MODEL)
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required secret: $name"
              exit 1
            fi
          done

      - name: Install isolated Assist tooling
        working-directory: customer-apps/assist
        run: npm install --no-audit --no-fund

      - name: Type-check Assist
        working-directory: customer-apps/assist
        run: npm run type-check

      - name: Ensure Assist Operator OIDC application
        id: zitadel_ops
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = await import('node:fs');
          const issuer=(process.env.MKETY_ASSIST_OPS_AUTH_ISSUER||'').replace(/\/+$/,'');
          const token=process.env.ZITADEL_MANAGEMENT_TOKEN;
          const projectId=process.env.ZITADEL_PROJECT_ID;
          const appName='Mkety Assist Operator Production';
          const redirectUri='https://assist-ops.mkety.com/api/ops/auth/callback';
          const postLogoutRedirectUri='https://assist-ops.mkety.com/';

          async function call(method, body) {
            const r=await fetch(issuer+'/zitadel.application.v2.ApplicationService/'+method,{
              method:'POST',
              headers:{
                authorization:'Bearer '+token,
                'connect-protocol-version':'1',
                'content-type':'application/json'
              },
              body:JSON.stringify(body)
            });
            const text=await r.text();
            if(!r.ok) throw new Error('ZITADEL '+method+' failed HTTP '+r.status+': '+text);
            return text?JSON.parse(text):{};
          }

          const listed=await call('ListApplications',{});
          const matches=(listed.applications||[]).filter(a=>a.projectId===projectId && a.name===appName);
          if(matches.length>1) throw new Error('Multiple Assist Operator OIDC applications exist');
          let app=matches[0]||null;
          let clientId='';

          if(!app){
            const created=await call('CreateApplication',{
              projectId,
              name:appName,
              oidcConfiguration:{
                redirectUris:[redirectUri],
                responseTypes:['OIDC_RESPONSE_TYPE_CODE'],
                grantTypes:['OIDC_GRANT_TYPE_AUTHORIZATION_CODE'],
                applicationType:'OIDC_APP_TYPE_USER_AGENT',
                authMethodType:'OIDC_AUTH_METHOD_TYPE_NONE',
                postLogoutRedirectUris:[postLogoutRedirectUri],
                version:'OIDC_VERSION_1_0',
                developmentMode:false,
                accessTokenType:'OIDC_TOKEN_TYPE_BEARER'
              }
            });
            clientId=created.oidcConfiguration?.clientId||'';
            if(!clientId) throw new Error('Created Assist Operator OIDC app did not return clientId');
          } else {
            if(!app.oidcConfiguration) throw new Error('Existing Assist Operator app is not OIDC');
            clientId=app.oidcConfiguration.clientId||'';
            const redirects=[...new Set([...(app.oidcConfiguration.redirectUris||[]),redirectUri])];
            const logouts=[...new Set([...(app.oidcConfiguration.postLogoutRedirectUris||[]),postLogoutRedirectUri])];
            const changed=redirects.length!==(app.oidcConfiguration.redirectUris||[]).length || logouts.length!==(app.oidcConfiguration.postLogoutRedirectUris||[]).length;
            if(changed){
              await call('UpdateApplication',{
                applicationId:app.applicationId,
                projectId,
                oidcConfiguration:{redirectUris:redirects,postLogoutRedirectUris:logouts}
              });
            }
            if(!clientId) throw new Error('Existing Assist Operator OIDC app has no clientId');
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT,'client_id='+clientId+'\n');
          NODE

      - name: Resolve Cloudflare zone, account and D1
        id: cloudflare
        shell: bash
        run: |
          set -euo pipefail

          zones="$(curl --fail-with-body --silent --show-error             "https://api.cloudflare.com/client/v4/zones?name=mkety.app&status=active"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"

          read -r zone_id resolved_account_id < <(ZONES="$zones" node - <<'NODE'
          const v = JSON.parse(process.env.ZONES);
          if (!v.success || !v.result?.[0]?.id || !v.result?.[0]?.account?.id) {
            throw new Error('Active mkety.app Cloudflare zone/account not found');
          }
          console.log(v.result[0].id + ' ' + v.result[0].account.id);
          NODE
          )

          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] && [ "$CLOUDFLARE_ACCOUNT_ID" != "$resolved_account_id" ]; then
            echo "::warning::Configured CLOUDFLARE_ACCOUNT_ID differs from mkety.app zone account; using the zone account."
          fi
          export CLOUDFLARE_ACCOUNT_ID="$resolved_account_id"
          echo "CLOUDFLARE_ACCOUNT_ID=$resolved_account_id" >> "$GITHUB_ENV"

          d1_url="https://api.cloudflare.com/client/v4/accounts/$resolved_account_id/d1/database?name=mkety-assist-prod"
          primary_code="$(curl --silent --show-error --output /tmp/assist-d1-primary.json --write-out '%{http_code}'             "$d1_url" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" || true)"

          d1_token_source=""
          d1_json=""
          if [ "$primary_code" = "200" ]; then
            d1_token_source="primary"
            d1_json="$(cat /tmp/assist-d1-primary.json)"
          elif [ -n "${MKETY_ASSIST_CF_SAAS_TOKEN:-}" ]; then
            saas_code="$(curl --silent --show-error --output /tmp/assist-d1-saas.json --write-out '%{http_code}'               "$d1_url" -H "Authorization: Bearer $MKETY_ASSIST_CF_SAAS_TOKEN" || true)"
            if [ "$saas_code" = "200" ]; then
              d1_token_source="saas"
              d1_json="$(cat /tmp/assist-d1-saas.json)"
            else
              echo "::error::Neither existing Cloudflare token can access D1 (primary HTTP $primary_code, Assist SaaS HTTP $saas_code). The deploy credential needs Cloudflare Account > D1 > Edit for the mkety.app account."
              exit 1
            fi
          else
            echo "::error::The existing Cloudflare API token cannot access D1 (HTTP $primary_code). It needs Cloudflare Account > D1 > Edit for the mkety.app account."
            exit 1
          fi

          d1_id="$(D1_JSON="$d1_json" node - <<'NODE'
          const v = JSON.parse(process.env.D1_JSON);
          if (!v.success) throw new Error(JSON.stringify(v.errors || v));
          process.stdout.write(v.result?.[0]?.uuid || '');
          NODE
          )"

          if [ -z "$d1_id" ]; then
            if [ "$d1_token_source" = "saas" ]; then
              d1_token="$MKETY_ASSIST_CF_SAAS_TOKEN"
            else
              d1_token="$CLOUDFLARE_API_TOKEN"
            fi
            created="$(curl --fail-with-body --silent --show-error               -X POST "https://api.cloudflare.com/client/v4/accounts/$resolved_account_id/d1/database"               -H "Authorization: Bearer $d1_token"               -H "Content-Type: application/json"               --data '{"name":"mkety-assist-prod"}')"
            d1_id="$(CREATED="$created" node - <<'NODE'
          const v = JSON.parse(process.env.CREATED);
          if (!v.success || !v.result?.uuid) throw new Error(JSON.stringify(v.errors || v));
          process.stdout.write(v.result.uuid);
          NODE
            )"
          fi

          echo "d1_id=$d1_id" >> "$GITHUB_OUTPUT"
          echo "zone_id=$zone_id" >> "$GITHUB_OUTPUT"
          echo "account_id=$resolved_account_id" >> "$GITHUB_OUTPUT"
          echo "d1_token_source=$d1_token_source" >> "$GITHUB_OUTPUT"

      - name: Ensure Mkety Assist SaaS DNS topology exists
        env:
          ZONE_ID: ${{ steps.cloudflare.outputs.zone_id }}
        shell: bash
        run: |
          set -euo pipefail

          ensure_record() {
            local type="$1"
            local name="$2"
            local content="$3"
            existing="$(curl --fail-with-body --silent --show-error               "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?type=$type&name=$name"               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
            count="$(EXISTING="$existing" node - <<'NODE'
          const v = JSON.parse(process.env.EXISTING);
          process.stdout.write(String(v.result?.length || 0));
          NODE
            )"
            if [ "$count" = "0" ]; then
              payload="$(TYPE="$type" NAME="$name" CONTENT="$content" node - <<'NODE'
          process.stdout.write(JSON.stringify({
            type: process.env.TYPE,
            name: process.env.NAME,
            content: process.env.CONTENT,
            proxied: true,
            ttl: 1
          }));
          NODE
              )"
              curl --fail-with-body --silent --show-error                 -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records"                 -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"                 -H "Content-Type: application/json"                 --data "$payload" >/dev/null
            fi
          }

          # Default hosted customer portals.
          ensure_record AAAA "*.assist.mkety.app" "100::"

          # Same pattern used by MkLMS:
          # customer domain -> stable CNAME target -> routing origin -> exact Worker route.
          ensure_record AAAA "assist-origin.mkety.app" "100::"
          ensure_record CNAME "mkety-assist.mkety.app" "assist-origin.mkety.app"

      - name: Ensure Assist media bucket exists
        shell: bash
        run: |
          set -euo pipefail
          buckets="$(curl --fail-with-body --silent --show-error             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets"             -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
          found="$(BUCKETS="$buckets" node - <<'NODE'
          const v=JSON.parse(process.env.BUCKETS);
          process.stdout.write((v.result?.buckets||v.result||[]).some((b)=>b.name==='mkety-assist-media')?'yes':'no');
          NODE
          )"
          if [ "$found" != "yes" ]; then
            curl --fail-with-body --silent --show-error               -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/r2/buckets"               -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               -H "Content-Type: application/json"               --data '{"name":"mkety-assist-media"}' >/dev/null
          fi

      - name: Ensure Assist reply queues exist
        working-directory: customer-apps/assist
        shell: bash
        run: |
          set -euo pipefail
          ensure_queue() {
            local name="$1"
            if ! npx wrangler queues info "$name" >/dev/null 2>&1; then
              npx wrangler queues create "$name" --message-retention-period-secs=1209600
            fi
          }
          ensure_queue mkety-assist-replies
          ensure_queue mkety-assist-replies-dlq

      - name: Build deploy-time Wrangler config
        working-directory: customer-apps/assist
        env:
          D1_ID: ${{ steps.cloudflare.outputs.d1_id }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const p = 'wrangler.jsonc';
          const raw = fs.readFileSync(p, 'utf8');
          fs.writeFileSync('wrangler.deploy.jsonc', raw.replace('__MKETY_ASSIST_D1_DATABASE_ID__', process.env.D1_ID));
          NODE

      - name: Apply Assist D1 migrations
        working-directory: customer-apps/assist
        env:
          D1_TOKEN_SOURCE: ${{ steps.cloudflare.outputs.d1_token_source }}
        shell: bash
        run: |
          set -euo pipefail
          token="$CLOUDFLARE_API_TOKEN"
          if [ "$D1_TOKEN_SOURCE" = "saas" ]; then token="$MKETY_ASSIST_CF_SAAS_TOKEN"; fi
          CLOUDFLARE_API_TOKEN="$token" npx wrangler d1 migrations apply DB --remote --config wrangler.deploy.jsonc

      - name: Resolve Telegram recovery bot identity
        if: env.MKETY_ASSIST_TELEGRAM_AUTH_BOT_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error             "https://api.telegram.org/bot$MKETY_ASSIST_TELEGRAM_AUTH_BOT_TOKEN/getMe")"
          username="$(RESPONSE="$response" node - <<'NODE'
          const v=JSON.parse(process.env.RESPONSE);
          if(!v.ok || !v.result?.username) throw new Error('Telegram auth bot getMe failed');
          process.stdout.write(v.result.username);
          NODE
          )"
          echo "EFFECTIVE_TELEGRAM_AUTH_BOT_USERNAME=$username" >> "$GITHUB_ENV"

      - name: Normalize Telegram webhook secret
        if: env.MKETY_ASSIST_TELEGRAM_AUTH_WEBHOOK_SECRET != ''
        shell: bash
        run: |
          set -euo pipefail
          safe_secret="$(printf '%s' "$MKETY_ASSIST_TELEGRAM_AUTH_WEBHOOK_SECRET" | sha256sum | awk '{print $1}')"
          echo "EFFECTIVE_TELEGRAM_AUTH_WEBHOOK_SECRET=$safe_secret" >> "$GITHUB_ENV"

      - name: Deploy isolated Assist Worker
        working-directory: customer-apps/assist
        run: npx wrangler deploy --config wrangler.deploy.jsonc

      - name: Attach hosted customer portals as Worker Custom Domains
        working-directory: customer-apps/assist
        env:
          D1_TOKEN_SOURCE: ${{ steps.cloudflare.outputs.d1_token_source }}
          ACCOUNT_ID: ${{ steps.cloudflare.outputs.account_id }}
          ZONE_ID: ${{ steps.cloudflare.outputs.zone_id }}
        shell: bash
        run: |
          set -euo pipefail
          token="$CLOUDFLARE_API_TOKEN"
          if [ "$D1_TOKEN_SOURCE" = "saas" ]; then d1_token="$MKETY_ASSIST_CF_SAAS_TOKEN"; else d1_token="$CLOUDFLARE_API_TOKEN"; fi

          hosted_json="$(CLOUDFLARE_API_TOKEN="$d1_token" npx wrangler d1 execute DB --remote --json --config wrangler.deploy.jsonc             --command "SELECT hostname FROM customer_domains WHERE kind='hosted' ORDER BY hostname;")"

          HOSTED_JSON="$hosted_json" node - <<'NODE' >/tmp/assist-hosted-hostnames
          const value=JSON.parse(process.env.HOSTED_JSON||'[]');
          const rows=value?.[0]?.results || value?.result || [];
          for (const row of rows) if (row?.hostname) console.log(String(row.hostname));
          NODE

          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          domains="$(curl -fsS "${auth[@]}" "$api/accounts/$ACCOUNT_ID/workers/domains")"

          while IFS= read -r host; do
            [ -n "$host" ] || continue
            service="$(DOMAINS="$domains" HOST="$host" node -e "const x=JSON.parse(process.env.DOMAINS||'{}');const d=(x.result||[]).find(v=>v.hostname===process.env.HOST);if(d)process.stdout.write(String(d.service||''))")"
            if [ -n "$service" ] && [ "$service" != 'mkety-assist' ]; then
              echo "::error::Hosted Assist domain $host belongs to Worker $service"
              exit 1
            fi
            if [ "$service" = 'mkety-assist' ]; then
              echo "Hosted portal already attached: $host"
              continue
            fi
            body="$(HOST="$host" ZONE_ID="$ZONE_ID" node -e "process.stdout.write(JSON.stringify({hostname:process.env.HOST,service:'mkety-assist',zone_id:process.env.ZONE_ID,zone_name:'mkety.app'}))")"
            curl -fsS -X PUT "${auth[@]}" --data "$body" "$api/accounts/$ACCOUNT_ID/workers/domains" >/dev/null
            echo "Attached hosted portal: $host"
          done </tmp/assist-hosted-hostnames

      - name: Generate deploy probe credential
        shell: bash
        run: |
          set -euo pipefail
          probe="$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))")"
          echo "::add-mask::$probe"
          echo "MKETY_ASSIST_DEPLOY_PROBE_SECRET=$probe" >> "$GITHUB_ENV"

      - name: Upload configured Assist secrets
        working-directory: customer-apps/assist
        env:
          MKETY_ASSIST_CF_ZONE_ID: ${{ steps.cloudflare.outputs.zone_id }}
          MKETY_ASSIST_CF_ACCOUNT_ID: ${{ steps.cloudflare.outputs.account_id }}
          MKETY_ASSIST_OPS_AUTH_CLIENT_ID: ${{ steps.zitadel_ops.outputs.client_id }}
        shell: bash
        run: |
          set -euo pipefail
          secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file"' EXIT
          SECRETS_FILE="$secrets_file" node - <<'NODE'
          const fs = require('fs');
          const values = {
            MKETY_ASSIST_CF_ZONE_ID: process.env.MKETY_ASSIST_CF_ZONE_ID,
            MKETY_ASSIST_CF_ACCOUNT_ID: process.env.MKETY_ASSIST_CF_ACCOUNT_ID,
            MKETY_ASSIST_CF_SAAS_TOKEN: process.env.MKETY_ASSIST_CF_SAAS_TOKEN,
            MKETY_ASSIST_OPS_AUTH_ISSUER: process.env.MKETY_ASSIST_OPS_AUTH_ISSUER,
            MKETY_ASSIST_OPS_AUTH_CLIENT_ID: process.env.MKETY_ASSIST_OPS_AUTH_CLIENT_ID,
            MKETY_ASSIST_OPS_ALLOWED_EMAIL: process.env.MKETY_ASSIST_OPS_ALLOWED_EMAIL,
          };
          if (process.env.FLUTTERWAVE_CHECKOUT_BROKER_SECRET) values.FLUTTERWAVE_CHECKOUT_BROKER_SECRET = process.env.FLUTTERWAVE_CHECKOUT_BROKER_SECRET;
          if (process.env.NOWPAYMENTS_API_KEY) values.NOWPAYMENTS_API_KEY = process.env.NOWPAYMENTS_API_KEY;
          if (process.env.NOWPAYMENTS_IPN_SECRET) values.NOWPAYMENTS_IPN_SECRET = process.env.NOWPAYMENTS_IPN_SECRET;
          if (process.env.MKETY_ASSIST_SECRET_ENCRYPTION_KEY) values.MKETY_ASSIST_SECRET_ENCRYPTION_KEY = process.env.MKETY_ASSIST_SECRET_ENCRYPTION_KEY;
          if (process.env.MKETY_ASSIST_TELEGRAM_AUTH_BOT_TOKEN) values.MKETY_ASSIST_TELEGRAM_AUTH_BOT_TOKEN = process.env.MKETY_ASSIST_TELEGRAM_AUTH_BOT_TOKEN;
          if (process.env.MKETY_ASSIST_DEPLOY_PROBE_SECRET) values.MKETY_ASSIST_DEPLOY_PROBE_SECRET = process.env.MKETY_ASSIST_DEPLOY_PROBE_SECRET;
          if (process.env.MKETY_ASSIST_AZURE_FOUNDRY_API_KEY) values.MKETY_ASSIST_AZURE_FOUNDRY_API_KEY = process.env.MKETY_ASSIST_AZURE_FOUNDRY_API_KEY;
          if (process.env.MKETY_ASSIST_AZURE_FOUNDRY_ENDPOINT) values.MKETY_ASSIST_AZURE_FOUNDRY_ENDPOINT = process.env.MKETY_ASSIST_AZURE_FOUNDRY_ENDPOINT;
          if (process.env.MKETY_ASSIST_AZURE_FOUNDRY_MODEL) values.MKETY_ASSIST_AZURE_FOUNDRY_MODEL = process.env.MKETY_ASSIST_AZURE_FOUNDRY_MODEL;
          if (process.env.MKETY_ASSIST_OPENAI_API_KEY) values.MKETY_ASSIST_OPENAI_API_KEY = process.env.MKETY_ASSIST_OPENAI_API_KEY;
          if (process.env.MKETY_ASSIST_OPENAI_MODEL) values.MKETY_ASSIST_OPENAI_MODEL = process.env.MKETY_ASSIST_OPENAI_MODEL;
          const telegramWebhookSecret = process.env.EFFECTIVE_TELEGRAM_AUTH_WEBHOOK_SECRET || process.env.MKETY_ASSIST_TELEGRAM_AUTH_WEBHOOK_SECRET;
          if (telegramWebhookSecret) values.MKETY_ASSIST_TELEGRAM_AUTH_WEBHOOK_SECRET = telegramWebhookSecret;
          const telegramUsername = process.env.EFFECTIVE_TELEGRAM_AUTH_BOT_USERNAME || process.env.MKETY_ASSIST_TELEGRAM_AUTH_BOT_USERNAME;
          if (telegramUsername) values.MKETY_ASSIST_TELEGRAM_AUTH_BOT_USERNAME = telegramUsername;
          fs.writeFileSync(process.env.SECRETS_FILE, JSON.stringify(values));
          NODE
          npx wrangler secret bulk "$secrets_file" --config wrangler.deploy.jsonc

      - name: Detect encryption-root bootstrap need
        id: encryption
        working-directory: customer-apps/assist
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${MKETY_ASSIST_SECRET_ENCRYPTION_KEY:-}" ]; then
            echo "generate=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          listed="$(npx wrangler secret list --config wrangler.deploy.jsonc 2>/dev/null)"
          code=$?
          set -e
          if [ "$code" -eq 0 ] && LISTED="$listed" node - <<'NODE'
          const raw=process.env.LISTED||'';
          let found=false;
          try {
            const v=JSON.parse(raw);
            found=Array.isArray(v) && v.some((x)=>x.name==='MKETY_ASSIST_SECRET_ENCRYPTION_KEY');
          } catch {
            found=raw.includes('MKETY_ASSIST_SECRET_ENCRYPTION_KEY');
          }
          process.exit(found?0:1);
          NODE
          then
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Bootstrap stable encryption root
        if: steps.encryption.outputs.generate == 'true'
        working-directory: customer-apps/assist
        shell: bash
        run: |
          set -euo pipefail
          generated="$(node -e "process.stdout.write(require('crypto').randomBytes(32).toString('hex'))")"
          printf '%s' "$generated" | npx wrangler secret put MKETY_ASSIST_SECRET_ENCRYPTION_KEY --config wrangler.deploy.jsonc

      - name: Bootstrap shared managed AI credentials into isolated Assist records
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --retry 3 --retry-delay 2             --output /tmp/assist-provider-bootstrap.json --write-out '%{http_code}'             -X POST https://mkety-assist.mkety.app/api/internal/provider-bootstrap             -H "Authorization: Bearer $MKETY_ASSIST_DEPLOY_PROBE_SECRET"             -H 'Content-Type: application/json' --data '{}')"
          cat /tmp/assist-provider-bootstrap.json
          test "$status" -ge 200
          test "$status" -lt 300

      - name: Real production AI inference acceptance
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --retry 3 --retry-delay 2             --output /tmp/assist-inference-acceptance.json --write-out '%{http_code}'             -X POST https://mkety-assist.mkety.app/api/internal/inference-acceptance             -H "Authorization: Bearer $MKETY_ASSIST_DEPLOY_PROBE_SECRET"             -H 'Content-Type: application/json' --data '{}')"
          ACCEPTANCE=/tmp/assist-inference-acceptance.json STATUS="$status" node <<'NODE'
          const fs=require('node:fs');
          const status=Number(process.env.STATUS||0);
          const payload=JSON.parse(fs.readFileSync(process.env.ACCEPTANCE,'utf8'));
          for(const item of payload.providers||[]){
            const suffix=item.billingBlocked?' (credentials accepted; provider billing/quota blocked)':'';
            console.log(String(item.provider)+': '+(item.ok?'PASS':'NOT ACTIVE')+suffix+(item.model?' model='+item.model:''));
          }
          console.log('Ordered route targets visible: '+String((payload.routeTargets||[]).length));
          if(status<200||status>=300||payload.ok!==true){
            console.error(JSON.stringify(payload,null,2));
            process.exit(1);
          }
          NODE

      - name: Read-only media and MKredit reconciliation
        working-directory: customer-apps/assist
        env:
          D1_TOKEN_SOURCE: ${{ steps.cloudflare.outputs.d1_token_source }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$D1_TOKEN_SOURCE" = "saas" ]; then d1_token="$MKETY_ASSIST_CF_SAAS_TOKEN"; else d1_token="$CLOUDFLARE_API_TOKEN"; fi
          run_query() {
            CLOUDFLARE_API_TOKEN="$d1_token" npx wrangler d1 execute DB --remote --json --config wrangler.deploy.jsonc --command "$1"
          }

          echo "=== Commercial MKredit conversion ==="
          run_query "SELECT key,value_json FROM system_settings WHERE key='commercial';" >/tmp/assist-commercial-unit.json
          cat /tmp/assist-commercial-unit.json
          node <<'NODE'
          const fs=require('node:fs');
          const payload=JSON.parse(fs.readFileSync('/tmp/assist-commercial-unit.json','utf8'));
          const row=payload?.[0]?.results?.[0];
          const config=JSON.parse(row?.value_json||'{}');
          if(config.mkreditsPerUsd!==1000 || config.creditAtomsPerUsd!==10000000 || config.creditAtomsPerMkredit!==10000 || config.creditUnit!=='MKredit' || config.creditScaleVersion!==3){
            throw new Error('Production MKredit configuration is not active: '+JSON.stringify(config));
          }
          const providerCostUsd=0.03;
          const publicMkredit=providerCostUsd*config.mkreditsPerUsd;
          const internalAtoms=providerCostUsd*config.creditAtomsPerUsd;
          if(publicMkredit!==30 || internalAtoms!==300000) throw new Error('MKredit/atom invariant failed');
          console.log('MKredit invariant: PASS; $1 = 1000 MKredit and $0.03 = 30 MKredit = 300000 precision atoms');
          NODE

          echo "=== Active media route economics ==="
          run_query "SELECT alias,position,provider,provider_model,enabled,input_credits_per_million,output_credits_per_million,audio_credits_per_minute,provider_input_cost_micros_per_million,provider_output_cost_micros_per_million,provider_audio_cost_micros_per_minute FROM model_route_targets WHERE alias IN ('mkety-media-vision','mkety-media-speech') ORDER BY alias,position;"

          echo "=== Credit-atom/provider-cost rate invariant ==="
          run_query "SELECT COUNT(*) AS mismatches FROM model_route_targets WHERE (provider_input_cost_micros_per_million>0 AND input_credits_per_million<>provider_input_cost_micros_per_million*10) OR (provider_output_cost_micros_per_million>0 AND output_credits_per_million<>provider_output_cost_micros_per_million*10) OR (provider_image_cost_micros>0 AND image_credits<>provider_image_cost_micros*10) OR (provider_audio_cost_micros_per_minute>0 AND audio_credits_per_minute<>provider_audio_cost_micros_per_minute*10);" >/tmp/assist-rate-invariant.json
          cat /tmp/assist-rate-invariant.json
          node <<'NODE'
          const fs=require('node:fs');
          const payload=JSON.parse(fs.readFileSync('/tmp/assist-rate-invariant.json','utf8'));
          const mismatches=Number(payload?.[0]?.results?.[0]?.mismatches ?? -1);
          if(mismatches!==0) throw new Error('Credit-atom/provider-cost rate mismatch count: '+mismatches);
          console.log('Credit-atom/provider-cost rate invariant: PASS');
          NODE

          echo "=== Recent media proof (no message contents) ==="
          run_query "SELECT kind,size_bytes,LENGTH(COALESCE(vision_text,'')) AS vision_chars,LENGTH(COALESCE(transcript,'')) AS transcript_chars,created_at FROM media_assets ORDER BY created_at DESC LIMIT 12;"

          echo "=== Recent metered provider usage ==="
          run_query "SELECT model_alias,provider,provider_model,input_units,output_units,credits_charged,provider_cost_micros,created_at FROM usage_events ORDER BY created_at DESC LIMIT 30;"

          echo "=== Recent provider cost ledger ==="
          run_query "SELECT provider,provider_model,cost_micros,created_at FROM provider_cost_events ORDER BY created_at DESC LIMIT 30;"

          echo "=== Recent reply-job diagnostics (no message contents) ==="
          run_query "SELECT status,attempts,last_error,LENGTH(COALESCE(response_text,'')) AS response_chars,provider_message_id,image_count,audio_seconds,created_at,completed_at FROM reply_jobs ORDER BY created_at DESC LIMIT 20;"

      - name: Register Telegram recovery webhook
        if: env.MKETY_ASSIST_TELEGRAM_AUTH_BOT_TOKEN != '' && env.MKETY_ASSIST_TELEGRAM_AUTH_WEBHOOK_SECRET != ''
        shell: bash
        run: |
          set -euo pipefail
          payload="$(WEBHOOK_SECRET="$EFFECTIVE_TELEGRAM_AUTH_WEBHOOK_SECRET" node - <<'NODE'
          process.stdout.write(JSON.stringify({
            url: 'https://mkety-assist.mkety.app/api/telegram/auth-webhook',
            secret_token: process.env.WEBHOOK_SECRET,
            allowed_updates: ['message'],
            drop_pending_updates: false
          }));
          NODE
          )"
          curl --fail-with-body --silent --show-error             -X POST "https://api.telegram.org/bot$MKETY_ASSIST_TELEGRAM_AUTH_BOT_TOKEN/setWebhook"             -H "Content-Type: application/json"             --data "$payload" >/tmp/assist-telegram-auth-webhook.json
          node -e "const v=require('/tmp/assist-telegram-auth-webhook.json'); if(!v.ok) throw new Error(v.description||'Telegram setWebhook failed')"

      - name: Smoke Worker
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --retry 4 --retry-delay 2 --output /tmp/health.json --write-out '%{http_code}' https://mkety-assist.mkety.app/health)"
          cat /tmp/health.json
          test "$status" -ge 200
          test "$status" -lt 300

      - name: Publish production deployment proof
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          DEPLOY_DESCRIPTION: ${{ job.status == 'success' && 'Assist production deploy and real inference acceptance passed' || 'Assist production deploy or acceptance failed' }}
          DEPLOY_TARGET_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          payload="$(node - <<'NODE'
          process.stdout.write(JSON.stringify({
            state: process.env.DEPLOY_STATE,
            context: 'mkety-assist/production-deploy',
            description: process.env.DEPLOY_DESCRIPTION,
            target_url: process.env.DEPLOY_TARGET_URL
          }));
          NODE
          )"
          curl --fail-with-body --silent --show-error \
            -X POST "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            --data "$payload" >/dev/null
