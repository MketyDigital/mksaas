name: Mkety Public Candidate Deploy

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/mkety-public-candidate-deploy.yml'
      - 'src/app/**'
      - 'src/features/platform-content/**'
      - 'src/features/public-assistant/**'
      - 'scripts/smoke-mkety-platform-content.ts'
      - 'wrangler.jsonc'
      - 'vite.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

env:
  CANDIDATE_WORKER_NAME: mkety-public-candidate

jobs:
  candidate:
    name: Verify and deploy isolated public candidate
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 24
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      SKIP_ENV_VALIDATION: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate candidate secrets
        shell: bash
        run: |
          set -euo pipefail
          for variable in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID STAGING_DATABASE_URL; do
            if [ -z "${!variable:-}" ]; then
              echo "$variable is not configured for the staging environment."
              exit 1
            fi
          done

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run type-check
        run: pnpm type-check

      - name: Run lint
        run: pnpm lint

      - name: Check vinext compatibility
        run: pnpx vinext check

      - name: Verify connected Mkety content database
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: pnpm db:smoke:mkety-content

      - name: Configure isolated candidate Worker
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'wrangler.jsonc';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.name = process.env.CANDIDATE_WORKER_NAME;
          config.preview_urls = true;
          config.vars = { ...(config.vars || {}), SKIP_ENV_VALIDATION: 'true' };
          delete config.route;
          delete config.routes;
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          NODE

      - name: Build Cloudflare candidate
        run: pnpm build

      - name: Validate Cloudflare package
        run: pnpm run deploy --dry-run

      - name: Find generated server Worker config
        id: worker-config
        shell: bash
        run: |
          set -euo pipefail
          CONFIG_PATH="$(node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          function walk(directory) {
            const entries = fs.readdirSync(directory, { withFileTypes: true });
            const results = [];
            for (const entry of entries) {
              const fullPath = path.join(directory, entry.name);
              if (entry.isDirectory()) results.push(...walk(fullPath));
              else if (entry.name === 'wrangler.json') results.push(fullPath);
            }
            return results;
          }

          const configs = walk('dist').flatMap((configPath) => {
            try {
              return [{ path: configPath, config: JSON.parse(fs.readFileSync(configPath, 'utf8')) }];
            } catch {
              return [];
            }
          });

          const selected =
            configs.find(({ config }) => config.main && config.name === process.env.CANDIDATE_WORKER_NAME) ??
            configs.find(({ config, path: configPath }) => config.main && !configPath.includes(`${path.sep}client${path.sep}`));

          if (!selected) process.exit(2);
          process.stdout.write(selected.path);
          NODE
          )"
          if [ -z "$CONFIG_PATH" ]; then
            echo 'No generated server Worker wrangler.json with a main entry was found under dist/.'
            find dist -type f -name wrangler.json -print || true
            exit 1
          fi
          echo "path=$CONFIG_PATH" >> "$GITHUB_OUTPUT"
          echo "Using generated server Worker config: $CONFIG_PATH"

      - name: Deploy isolated candidate Worker
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          CONFIG_PATH='${{ steps.worker-config.outputs.path }}'
          pnpm exec wrangler deploy --config "$CONFIG_PATH" 2>&1 | tee /tmp/mkety-candidate-deploy.log
          CANDIDATE_URL="$(grep -Eo 'https://[^[:space:]]+workers\.dev' /tmp/mkety-candidate-deploy.log | tail -n 1 || true)"
          if [ -z "$CANDIDATE_URL" ]; then
            echo 'Cloudflare deployment completed without a discoverable workers.dev URL.'
            exit 1
          fi
          echo "url=$CANDIDATE_URL" >> "$GITHUB_OUTPUT"
          echo "Candidate URL: $CANDIDATE_URL"

      - name: Attach staging database secret to candidate Worker
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$STAGING_DATABASE_URL" | pnpm exec wrangler secret put DATABASE_URL --name "$CANDIDATE_WORKER_NAME"

      - name: Smoke candidate public routes
        shell: bash
        env:
          CANDIDATE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          routes=(
            '/'
            '/platform'
            '/workspaces'
            '/solutions'
            '/academy'
            '/pricing'
            '/enterprise'
            '/about'
            '/docs'
            '/privacy'
            '/terms'
            '/contact'
            '/sitemap.xml'
            '/robots.txt'
          )

          for route in "${routes[@]}"; do
            ok=false
            for attempt in 1 2 3 4 5; do
              code="$(curl -L -sS -o /tmp/mkety-response -w '%{http_code}' "$CANDIDATE_URL$route" || true)"
              if [ "$code" = '200' ]; then
                ok=true
                break
              fi
              sleep 2
            done
            if [ "$ok" != 'true' ]; then
              echo "Candidate route failed: $route (last HTTP $code)"
              exit 1
            fi
            if grep -Eqi 'Next\.js SaaS AI Template|Auth\.js v5|OpenNext|Vercel' /tmp/mkety-response; then
              echo "Candidate route contains quarantined legacy public wording: $route"
              exit 1
            fi
            echo "OK $route"
          done

      - name: Publish candidate evidence
        shell: bash
        env:
          CANDIDATE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          echo "Mkety public candidate SHA: $GITHUB_SHA"
          echo "Mkety public candidate URL: $CANDIDATE_URL"
          echo 'No mkety.com route or custom-domain binding was configured by this workflow.'
