name: Mkety Public Candidate Deploy

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/mkety-public-candidate-deploy.yml'
      - 'migrations/**'
      - 'src/shared/db/migrations/**'
      - 'src/shared/db/schema/**'
      - 'src/app/**'
      - 'src/features/platform-content/**'
      - 'src/features/public-assistant/**'
      - 'src/features/enterprise-checkout/**'
      - 'src/features/billing/**'
      - 'src/features/payments/**'
      - 'scripts/migrate-mkety-platform-content.ts'
      - 'scripts/smoke-mkety-platform-content.ts'
      - 'wrangler.jsonc'
      - 'vite.config.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'

permissions:
  contents: read

env:
  CANDIDATE_WORKER_NAME: mkety-public-candidate

jobs:
  candidate:
    name: Verify and deploy isolated public candidate
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: mkety-staging-content-db
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      NOWPAYMENTS_API_KEY: ${{ secrets.NOWPAYMENTS_API_KEY }}
      NOWPAYMENTS_IPN_SECRET: ${{ secrets.NOWPAYMENTS_IPN_SECRET }}
      FLUTTERWAVE_PUBLIC_KEY: ${{ secrets.FLUTTERWAVE_PUBLIC_KEY }}
      FLUTTERWAVE_STANDARD_SECRET_KEY: ${{ secrets.FLUTTERWAVE_STANDARD_SECRET_KEY }}
      FLUTTERWAVE_STANDARD_WEBHOOK_HASH: ${{ secrets.FLUTTERWAVE_STANDARD_WEBHOOK_HASH }}
      FLUTTERWAVE_CHECKOUT_BROKER_SECRET: ${{ secrets.FLUTTERWAVE_CHECKOUT_BROKER_SECRET }}
      KORA_PUBLIC_KEY: ${{ secrets.KORA_PUBLIC_KEY }}
      KORA_SECRET_KEY: ${{ secrets.KORA_SECRET_KEY }}
      MKETY_MEDIA_FLUTTERWAVE_WEBHOOK_URL: ${{ secrets.MKETY_MEDIA_FLUTTERWAVE_WEBHOOK_URL || vars.MKETY_MEDIA_FLUTTERWAVE_WEBHOOK_URL }}
      MKETY_MEDIA_KORA_WEBHOOK_URL: ${{ secrets.MKETY_MEDIA_KORA_WEBHOOK_URL || vars.MKETY_MEDIA_KORA_WEBHOOK_URL }}
      MKETY_HOST_FLUTTERWAVE_WEBHOOK_URL: ${{ secrets.MKETY_HOST_FLUTTERWAVE_WEBHOOK_URL || vars.MKETY_HOST_FLUTTERWAVE_WEBHOOK_URL }}
      MKETY_HOST_KORA_WEBHOOK_URL: ${{ secrets.MKETY_HOST_KORA_WEBHOOK_URL || vars.MKETY_HOST_KORA_WEBHOOK_URL }}
      MKETY_PLATFORM_CONTROL_TENANT_SLUG: ${{ secrets.MKETY_PLATFORM_CONTROL_TENANT_SLUG || vars.MKETY_PLATFORM_CONTROL_TENANT_SLUG || 'mkety-ops' }}
      MKETY_PLATFORM_ADMIN_EMAILS: ${{ secrets.MKETY_PLATFORM_ADMIN_EMAILS || 'support@mkety.com,hello@mkety.com' }}
      MKETY_PUBLIC_AI_VISITOR_SECRET: ${{ secrets.MKETY_PUBLIC_AI_VISITOR_SECRET }}
      MKETY_PUBLIC_OPENAI_API_KEY: ${{ secrets.MKETY_PUBLIC_OPENAI_API_KEY }}
      MKETY_PUBLIC_AZURE_OPENAI_API_KEY: ${{ secrets.MKETY_PUBLIC_AZURE_OPEN_AI_API_KEY || secrets.MKETY_PUBLIC_AZURE_OPENAI_API_KEY }}
      MKETY_PUBLIC_AZURE_OPENAI_ENDPOINT: ${{ secrets.MKETY_PUBLIC_AZURE_OPEN_AI_ENDPOINT || secrets.MKETY_PUBLIC_AZURE_OPENAI_ENDPOINT || vars.MKETY_PUBLIC_AZURE_OPEN_AI_ENDPOINT || vars.MKETY_PUBLIC_AZURE_OPENAI_ENDPOINT }}
      MKETY_PUBLIC_AZURE_OPENAI_DEPLOYMENT: ${{ secrets.MKETY_PUBLIC_AZURE_OPEN_AI_MODEL || secrets.MKETY_PUBLIC_AZURE_OPENAI_MODEL || secrets.MKETY_PUBLIC_AZURE_OPEN_AI_DEPLOYMENT || secrets.MKETY_PUBLIC_AZURE_OPENAI_DEPLOYMENT || vars.MKETY_PUBLIC_AZURE_OPEN_AI_MODEL || vars.MKETY_PUBLIC_AZURE_OPENAI_MODEL || vars.MKETY_PUBLIC_AZURE_OPEN_AI_DEPLOYMENT || vars.MKETY_PUBLIC_AZURE_OPENAI_DEPLOYMENT }}
      MKETY_PUBLIC_GEMINI_API_KEY: ${{ secrets.MKETY_PUBLIC_GEMINI_API_KEY }}
      MKETY_PUBLIC_VERTEX_PROJECT_ID: ${{ secrets.MKETY_PUBLIC_VERTEX_PROJECT_ID }}
      MKETY_PUBLIC_VERTEX_LOCATION: ${{ secrets.MKETY_PUBLIC_VERTEX_LOCATION }}
      MKETY_PUBLIC_VERTEX_ACCESS_TOKEN: ${{ secrets.MKETY_PUBLIC_VERTEX_ACCESS_TOKEN }}
      MKETY_PUBLIC_CLOUDFLARE_AI_API_TOKEN: ${{ secrets.MKETY_PUBLIC_CLOUDFLARE_AI_API_TOKEN }}
      MKETY_PUBLIC_BEDROCK_ACCESS_KEY_ID: ${{ secrets.MKETY_PUBLIC_BEDROCK_ACCESS_KEY_ID }}
      MKETY_PUBLIC_BEDROCK_SECRET_ACCESS_KEY: ${{ secrets.MKETY_PUBLIC_BEDROCK_SECRET_ACCESS_KEY }}
      MKETY_PUBLIC_BEDROCK_SESSION_TOKEN: ${{ secrets.MKETY_PUBLIC_BEDROCK_SESSION_TOKEN }}
      MKETY_PUBLIC_BEDROCK_REGION: ${{ secrets.MKETY_PUBLIC_BEDROCK_REGION }}
      SKIP_ENV_VALIDATION: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate candidate secrets
        shell: bash
        run: |
          set -euo pipefail
          for variable in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID STAGING_DATABASE_URL MKETY_PUBLIC_AI_VISITOR_SECRET; do
            if [ -z "${!variable:-}" ]; then
              echo "$variable is not configured as a repository secret/configuration."
              exit 1
            fi
          done
          if [ "${#MKETY_PUBLIC_AI_VISITOR_SECRET}" -lt 32 ]; then
            echo 'MKETY_PUBLIC_AI_VISITOR_SECRET must contain at least 32 characters.'
            exit 1
          fi

      - name: Select configured Public Mkety AI providers
        id: public-ai
        shell: bash
        run: |
          set -euo pipefail
          providers=()
          # Prefer Azure/Foundry when configured. This prevents an exhausted
          # legacy OpenAI key from becoming primary while a healthy Foundry
          # deployment is available.
          if [ -n "${MKETY_PUBLIC_AZURE_OPENAI_API_KEY:-}" ] && [ -n "${MKETY_PUBLIC_AZURE_OPENAI_ENDPOINT:-}" ] && [ -n "${MKETY_PUBLIC_AZURE_OPENAI_DEPLOYMENT:-}" ]; then providers+=(azure-openai); fi
          if [ -n "${MKETY_PUBLIC_OPENAI_API_KEY:-}" ]; then providers+=(openai); fi
          if [ -n "${MKETY_PUBLIC_GEMINI_API_KEY:-}" ]; then providers+=(gemini); fi
          if [ -n "${MKETY_PUBLIC_VERTEX_PROJECT_ID:-}" ] && [ -n "${MKETY_PUBLIC_VERTEX_LOCATION:-}" ] && [ -n "${MKETY_PUBLIC_VERTEX_ACCESS_TOKEN:-}" ]; then providers+=(vertex); fi
          if [ -n "${MKETY_PUBLIC_CLOUDFLARE_AI_API_TOKEN:-}" ]; then providers+=(cloudflare-ai); fi
          if [ -n "${MKETY_PUBLIC_BEDROCK_ACCESS_KEY_ID:-}" ] && [ -n "${MKETY_PUBLIC_BEDROCK_SECRET_ACCESS_KEY:-}" ]; then providers+=(bedrock); fi
          if [ "${#providers[@]}" -eq 0 ]; then
            echo 'No dedicated Public Mkety AI provider is configured in staging.'
            exit 1
          fi
          primary="${providers[0]}"
          fallback=''
          if [ "${#providers[@]}" -gt 1 ]; then fallback="$(IFS=,; echo "${providers[*]:1}")"; fi
          echo "primary=$primary" >> "$GITHUB_OUTPUT"
          echo "fallback=$fallback" >> "$GITHUB_OUTPUT"
          echo "Configured Public Mkety AI provider count: ${#providers[@]}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Run type-check
        run: pnpm type-check

      - name: Run lint
        run: pnpm lint

      - name: Check vinext compatibility
        run: pnpx vinext check

      - name: Apply and verify connected Mkety content database
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: |
          set -euo pipefail
          timeout --signal=TERM 360s pnpm db:migrate
          timeout --signal=TERM 180s pnpm db:migrate:mkety-content
          timeout --signal=TERM 180s pnpm db:seed:mkety-content
          timeout --signal=TERM 180s pnpm db:seed:billing-catalog
          timeout --signal=TERM 180s pnpm db:smoke:mkety-content
          timeout --signal=TERM 180s pnpm db:smoke:billing-catalog
          DATABASE_URL="$DATABASE_URL" pnpm exec tsx scripts/verify-managed-ai-selection.ts

      - name: Require operational Enterprise payment gateway
        id: enterprise-payment
        shell: bash
        run: |
          set -euo pipefail
          for variable in NOWPAYMENTS_API_KEY NOWPAYMENTS_IPN_SECRET; do
            if [ -z "${!variable:-}" ]; then
              echo "$variable is required for the operational NOWPayments Enterprise gateway."
              exit 1
            fi
          done
          echo 'nowpayments_ready=true' >> "$GITHUB_OUTPUT"
          echo 'NOWPayments is configured for candidate verification. Flutterwave and Kora are optional until their complete provider credentials are configured; NOWPayments remains the required primary crypto path.'

      - name: Verify NOWPayments API key without creating a payment
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/nowpayments-currencies.json -w '%{http_code}' -H "x-api-key: $NOWPAYMENTS_API_KEY" https://api.nowpayments.io/v1/currencies || true)"
          if [ "$code" != '200' ]; then
            echo "NOWPayments API credential check expected HTTP 200; received $code."
            exit 1
          fi
          node -e "const x=require('/tmp/nowpayments-currencies.json'); if(!x||typeof x!=='object') process.exit(1)"
          echo 'NOWPayments API key accepted by the live API; no invoice or payment was created.'

      - name: Configure isolated candidate Worker
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          config.name = process.env.CANDIDATE_WORKER_NAME;
          config.workers_dev = true;
          config.preview_urls = true;
          config.vars = { ...(config.vars || {}), SKIP_ENV_VALIDATION: 'true' };
          delete config.route;
          delete config.routes;
          fs.writeFileSync('wrangler.jsonc', JSON.stringify(config, null, 2) + '\n');
          NODE

      - name: Build Cloudflare candidate
        run: pnpm build

      - name: Validate Cloudflare package
        run: pnpm run deploy --dry-run

      - name: Verify isolated candidate Worker config
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          if (config.name !== process.env.CANDIDATE_WORKER_NAME) throw new Error(`Unexpected candidate Worker name: ${config.name}`);
          if ('route' in config || 'routes' in config) throw new Error('Candidate Worker must not contain a custom-domain route binding.');
          if (config.workers_dev !== true) throw new Error('Candidate Worker must deploy to the account Workers.dev namespace.');
          if (config.preview_urls !== true) throw new Error('Candidate Worker must keep workers.dev preview URLs enabled.');
          console.log('Candidate Worker is isolated from production custom-domain routes and enabled for Workers.dev.');
          NODE

      - name: Deploy isolated candidate Worker
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          pnpm run deploy 2>&1 | tee /tmp/mkety-candidate-deploy.log
          CANDIDATE_URL="$(grep -Eo 'https://[^[:space:]]+workers\.dev' /tmp/mkety-candidate-deploy.log | tail -n 1 || true)"
          if [ -z "$CANDIDATE_URL" ]; then
            echo 'Cloudflare deployment completed without a discoverable workers.dev URL.'
            exit 1
          fi
          echo "url=$CANDIDATE_URL" >> "$GITHUB_OUTPUT"
          echo "Candidate URL: $CANDIDATE_URL"

      - name: Attach candidate runtime secrets
        shell: bash
        env:
          PUBLIC_AI_PRIMARY: ${{ steps.public-ai.outputs.primary }}
          PUBLIC_AI_FALLBACK: ${{ steps.public-ai.outputs.fallback }}
        run: |
          set -euo pipefail
          put_secret() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | pnpm exec wrangler secret put "$name" --name "$CANDIDATE_WORKER_NAME" >/dev/null
              echo "Attached runtime secret: $name"
            fi
          }
          put_secret DATABASE_URL "$STAGING_DATABASE_URL"
          put_secret NOWPAYMENTS_API_KEY "$NOWPAYMENTS_API_KEY"
          put_secret NOWPAYMENTS_IPN_SECRET "$NOWPAYMENTS_IPN_SECRET"
          put_secret FLUTTERWAVE_PUBLIC_KEY "${FLUTTERWAVE_PUBLIC_KEY:-}"
          put_secret FLUTTERWAVE_STANDARD_SECRET_KEY "${FLUTTERWAVE_STANDARD_SECRET_KEY:-}"
          put_secret FLUTTERWAVE_STANDARD_WEBHOOK_HASH "${FLUTTERWAVE_STANDARD_WEBHOOK_HASH:-}"
          put_secret FLUTTERWAVE_CHECKOUT_BROKER_SECRET "${FLUTTERWAVE_CHECKOUT_BROKER_SECRET:-}"
          put_secret KORA_PUBLIC_KEY "${KORA_PUBLIC_KEY:-}"
          put_secret KORA_SECRET_KEY "${KORA_SECRET_KEY:-}"
          put_secret MKETY_MEDIA_FLUTTERWAVE_WEBHOOK_URL "${MKETY_MEDIA_FLUTTERWAVE_WEBHOOK_URL:-}"
          put_secret MKETY_MEDIA_KORA_WEBHOOK_URL "${MKETY_MEDIA_KORA_WEBHOOK_URL:-}"
          put_secret MKETY_HOST_FLUTTERWAVE_WEBHOOK_URL "${MKETY_HOST_FLUTTERWAVE_WEBHOOK_URL:-}"
          put_secret MKETY_HOST_KORA_WEBHOOK_URL "${MKETY_HOST_KORA_WEBHOOK_URL:-}"
          put_secret MKETY_PLATFORM_CONTROL_TENANT_SLUG "${MKETY_PLATFORM_CONTROL_TENANT_SLUG:-}"
          put_secret MKETY_PLATFORM_ADMIN_EMAILS "${MKETY_PLATFORM_ADMIN_EMAILS:-}"
          put_secret MKETY_DEPLOY_CLOUDFLARE_API_TOKEN "$CLOUDFLARE_API_TOKEN"
          put_secret MKETY_DEPLOY_CLOUDFLARE_ACCOUNT_ID "$CLOUDFLARE_ACCOUNT_ID"
          put_secret MKETY_PUBLIC_AI_VISITOR_SECRET "$MKETY_PUBLIC_AI_VISITOR_SECRET"
          put_secret MKETY_PUBLIC_AI_ENABLED 'true'
          put_secret MKETY_PUBLIC_AI_PRIMARY_PROVIDER "$PUBLIC_AI_PRIMARY"
          put_secret MKETY_PUBLIC_AI_FALLBACK_PROVIDERS "$PUBLIC_AI_FALLBACK"
          put_secret MKETY_PUBLIC_OPENAI_API_KEY "${MKETY_PUBLIC_OPENAI_API_KEY:-}"
          put_secret MKETY_PUBLIC_AZURE_OPENAI_API_KEY "${MKETY_PUBLIC_AZURE_OPENAI_API_KEY:-}"
          put_secret MKETY_PUBLIC_AZURE_OPENAI_ENDPOINT "${MKETY_PUBLIC_AZURE_OPENAI_ENDPOINT:-}"
          put_secret MKETY_PUBLIC_AZURE_OPENAI_DEPLOYMENT "${MKETY_PUBLIC_AZURE_OPENAI_DEPLOYMENT:-}"
          put_secret MKETY_PUBLIC_GEMINI_API_KEY "${MKETY_PUBLIC_GEMINI_API_KEY:-}"
          put_secret MKETY_PUBLIC_VERTEX_PROJECT_ID "${MKETY_PUBLIC_VERTEX_PROJECT_ID:-}"
          put_secret MKETY_PUBLIC_VERTEX_LOCATION "${MKETY_PUBLIC_VERTEX_LOCATION:-}"
          put_secret MKETY_PUBLIC_VERTEX_ACCESS_TOKEN "${MKETY_PUBLIC_VERTEX_ACCESS_TOKEN:-}"
          put_secret MKETY_PUBLIC_CLOUDFLARE_ACCOUNT_ID "$CLOUDFLARE_ACCOUNT_ID"
          put_secret MKETY_PUBLIC_CLOUDFLARE_AI_API_TOKEN "${MKETY_PUBLIC_CLOUDFLARE_AI_API_TOKEN:-}"
          put_secret MKETY_PUBLIC_BEDROCK_ACCESS_KEY_ID "${MKETY_PUBLIC_BEDROCK_ACCESS_KEY_ID:-}"
          put_secret MKETY_PUBLIC_BEDROCK_SECRET_ACCESS_KEY "${MKETY_PUBLIC_BEDROCK_SECRET_ACCESS_KEY:-}"
          put_secret MKETY_PUBLIC_BEDROCK_SESSION_TOKEN "${MKETY_PUBLIC_BEDROCK_SESSION_TOKEN:-}"
          put_secret MKETY_PUBLIC_BEDROCK_REGION "${MKETY_PUBLIC_BEDROCK_REGION:-}"
          put_secret MKETY_AI_GATEWAY_ID 'mkety-ai-benchmark'

      - name: Prepare ephemeral managed-AI commercial acceptance fixture
        id: ai-commercial-fixture
        shell: bash
        env:
          AI_ACCEPTANCE_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          AI_ACCEPTANCE_FIXTURE_STATE: /tmp/mkety-ai-commercial-fixture.json
        run: |
          set -euo pipefail
          echo "::add-mask::$AI_ACCEPTANCE_DATABASE_URL"
          pnpm exec tsx scripts/stage-ai-commercial-fixture.ts setup >/tmp/mkety-ai-fixture-setup.json
          api_key="$(node -e "const x=require('/tmp/mkety-ai-commercial-fixture.json');process.stdout.write(x.apiKey)")"
          echo "::add-mask::$api_key"
          echo "api_key=$api_key" >> "$GITHUB_OUTPUT"
          model="$(node -e 'const x=require("/tmp/mkety-ai-commercial-fixture.json");process.stdout.write(x.modelAlias)')"
          echo "model=$model" >> "$GITHUB_OUTPUT"

      - name: Run real managed-AI commercial accounting acceptance
        shell: bash
        env:
          AI_ACCEPTANCE_BASE_URL: ${{ steps.deploy.outputs.url }}
          AI_ACCEPTANCE_API_KEY: ${{ steps.ai-commercial-fixture.outputs.api_key }}
          AI_ACCEPTANCE_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          AI_ACCEPTANCE_MODEL: ${{ steps.ai-commercial-fixture.outputs.model }}
        run: |
          set -euo pipefail
          echo "::add-mask::$AI_ACCEPTANCE_API_KEY"
          echo "::add-mask::$AI_ACCEPTANCE_DATABASE_URL"
          pnpm exec tsx scripts/accept-mkety-ai-commercial.ts | tee /tmp/mkety-ai-commercial-acceptance.json
          node -e "const x=require('/tmp/mkety-ai-commercial-acceptance.json');if(x.ok!==true)process.exit(1)"

      - name: Restore staging AI policy and remove commercial fixture
        if: always()
        shell: bash
        env:
          AI_ACCEPTANCE_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          AI_ACCEPTANCE_FIXTURE_STATE: /tmp/mkety-ai-commercial-fixture.json
        run: |
          set -euo pipefail
          echo "::add-mask::$AI_ACCEPTANCE_DATABASE_URL"
          pnpm exec tsx scripts/stage-ai-commercial-fixture.ts cleanup

      - name: Smoke candidate public routes and production copy
        shell: bash
        env:
          CANDIDATE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          routes=(
            '/' '/platform' '/workspaces' '/domains' '/solutions' '/academy' '/pricing' '/enterprise' '/mail' '/trust' '/infrastructure'
            '/about' '/docs' '/privacy' '/terms' '/contact' '/sitemap.xml' '/robots.txt' '/llms.txt'
          )
          quarantine='Next\.js SaaS AI Template|Auth\.js v5|OpenNext|Vercel|under development|\bWIP\b|github\.com/MketyDigital|MketyDigital|mksaas|origin\.mkety\.com'
          for route in "${routes[@]}"; do
            ok=false
            code='000'
            for attempt in 1 2 3 4 5; do
              code="$(curl --connect-timeout 10 --max-time 60 -L -sS -o /tmp/mkety-response -w '%{http_code}' "$CANDIDATE_URL$route" || true)"
              echo "Candidate smoke $route attempt $attempt: HTTP $code"
              if [ "$code" = '200' ]; then ok=true; break; fi
              sleep 2
            done
            if [ "$ok" != 'true' ]; then
              echo "Candidate route failed: $route (last HTTP $code)"
              head -c 400 /tmp/mkety-response 2>/dev/null || true
              echo
              exit 1
            fi
            python3 -c "import re; p='/tmp/mkety-response'; b=open(p,'r',encoding='utf-8',errors='replace').read(); b=re.sub(r'<script\\b[^>]*>.*?</script>', '', b, flags=re.I|re.S); b=re.sub(r'<style\\b[^>]*>.*?</style>', '', b, flags=re.I|re.S); open('/tmp/mkety-visible-response','w',encoding='utf-8').write(b)"
            match="$(grep -Eio "$quarantine" /tmp/mkety-visible-response | head -n 1 || true)"
            if [ -n "$match" ]; then
              echo "Candidate route contains non-production or internal wording: $route (matched: $match)"
              exit 1
            fi
            echo "OK $route"
          done


          fetch_candidate_page() {
            path="$1"
            output="$2"
            code='000'
            for attempt in 1 2 3 4 5; do
              code="$(curl --connect-timeout 10 --max-time 60 -L -sS -o "$output" -w '%{http_code}' "$CANDIDATE_URL$path" || true)"
              echo "Candidate content fetch $path attempt $attempt: HTTP $code"
              if [ "$code" = '200' ]; then return 0; fi
              sleep 2
            done
            echo "Candidate content fetch failed: $path (last HTTP $code)"
            head -c 400 "$output" 2>/dev/null || true
            echo
            return 1
          }

          fetch_candidate_page '/academy' /tmp/mkety-academy-page.html
          grep -Fq 'Courses &amp; tiers' /tmp/mkety-academy-page.html || grep -Fq 'Courses & tiers' /tmp/mkety-academy-page.html || { echo 'Academy page missing Courses & tiers section.'; exit 1; }
          grep -Fq 'Ready to learn?' /tmp/mkety-academy-page.html || { echo 'Academy page missing ready-to-learn handoff.'; exit 1; }
          grep -Fq 'Ask Mkety AI about Academy' /tmp/mkety-academy-page.html || { echo 'Academy page missing AI-first discovery CTA.'; exit 1; }
          grep -Fq 'academy.mkety.com' /tmp/mkety-academy-page.html || { echo 'Academy page missing learning-access destination.'; exit 1; }

          fetch_candidate_page '/domains' /tmp/mkety-domains-page.html
          grep -Fq 'Mkety Domains' /tmp/mkety-domains-page.html || { echo 'Domains page missing Mkety Domains product identity.'; exit 1; }
          grep -Fq 'Mkety DNS' /tmp/mkety-domains-page.html || { echo 'Domains page missing Mkety DNS product identity.'; exit 1; }
          grep -Fq 'live' /tmp/mkety-domains-page.html || { echo 'Domains page missing live-pricing positioning.'; exit 1; }

          fetch_candidate_page '/pricing' /tmp/mkety-pricing-page.html
          # Contract literal: data-plan-price="starter:$5.99"
          # Contract literal: Starter price card missing exact USD-formatted $5.99 amount.
          grep -Fq "data-plan-price=\"starter:\$5.99\"" /tmp/mkety-pricing-page.html || { echo "Starter price card missing exact USD-formatted \$5.99 amount."; exit 1; }
          grep -Fq 'Trading Workspace' /tmp/mkety-pricing-page.html || { echo 'Pricing page missing Trading Workspace.'; exit 1; }
          grep -Fq 'Custom / Enterprise' /tmp/mkety-pricing-page.html || { echo 'Pricing page missing Trading Custom / Enterprise positioning.'; exit 1; }


          fetch_candidate_page '/mail' /tmp/mkety-mail-page.html
          grep -Fq 'Mail Starter' /tmp/mkety-mail-page.html || { echo 'Candidate Mail page missing Mail Starter.'; exit 1; }
          grep -Fq "\$4.99" /tmp/mkety-mail-page.html || { echo 'Candidate Mail page missing Mail Starter price.'; exit 1; }
          grep -Fq 'Mail Growth' /tmp/mkety-mail-page.html || { echo 'Candidate Mail page missing Mail Growth.'; exit 1; }
          grep -Fq "\$9.99" /tmp/mkety-mail-page.html || { echo 'Candidate Mail page missing Mail Growth price.'; exit 1; }
          grep -Fq 'Mail Business' /tmp/mkety-mail-page.html || { echo 'Candidate Mail page missing Mail Business.'; exit 1; }
          grep -Fq "\$24.99" /tmp/mkety-mail-page.html || { echo 'Candidate Mail page missing Mail Business price.'; exit 1; }
          grep -Fq 'Enterprise Mail' /tmp/mkety-mail-page.html || { echo 'Candidate Mail page missing Enterprise Mail.'; exit 1; }
          grep -Fq 'Marketing' /tmp/mkety-mail-page.html || { echo 'Candidate Mail page missing Marketing Coming Soon boundary.'; exit 1; }

          fetch_candidate_page '/enterprise' /tmp/mkety-enterprise-page.html
          grep -Fq 'Enterprise AI' /tmp/mkety-enterprise-page.html || { echo 'Candidate Enterprise page missing Enterprise AI.'; exit 1; }
          grep -Fq 'Enterprise Mail' /tmp/mkety-enterprise-page.html || { echo 'Candidate Enterprise page missing Enterprise Mail.'; exit 1; }

          fetch_candidate_page '/workspaces' /tmp/mkety-workspaces-page.html
          grep -Fq 'Trading Workspace' /tmp/mkety-workspaces-page.html || { echo 'Workspaces page missing Trading Workspace.'; exit 1; }
          grep -Fq 'Custom / Enterprise' /tmp/mkety-workspaces-page.html || { echo 'Workspaces page missing Trading Custom / Enterprise positioning.'; exit 1; }

          fetch_candidate_page '/' /tmp/mkety-home-page.html
          if grep -Fq 'academy.mkety.com' /tmp/mkety-home-page.html; then echo 'Homepage must not bypass AI-first Academy discovery.'; exit 1; fi

          for image in class1.jpg class2.jpg class3.jpg class4.jpg class5.jpg; do
            headers="$(mktemp)"
            code="$(curl --connect-timeout 10 --max-time 60 -sS -D "$headers" -o /tmp/mkety-academy-image -w '%{http_code}' "$CANDIDATE_URL/academy-hubs/$image" || true)"
            [ "$code" = '200' ] || { echo "Academy image failed: $image HTTP $code"; exit 1; }
            content_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {sub(/^[^:]*:[[:space:]]*/, "");gsub(/\r/,"");v=$0} END{print v}' "$headers")"
            printf '%s' "$content_type" | grep -Eqi '^image/' || { echo "Academy asset is not an image: $image ($content_type)"; exit 1; }
          done

          fetch_candidate_page '/docs' /tmp/mkety-docs-index.html
          python3 <<'PY' >/tmp/mkety-doc-links
          import re
          html=open('/tmp/mkety-docs-index.html','r',encoding='utf-8',errors='replace').read()
          links=sorted(set(re.findall(r'href=["\'](/docs/[^"\'#?]+)', html)))
          for link in links:
              print(link)
          PY
          [ -s /tmp/mkety-doc-links ] || { echo 'Docs index rendered no article links.'; exit 1; }
          while IFS= read -r doc_path; do
            [ -n "$doc_path" ] || continue
            fetch_candidate_page "$doc_path" /tmp/mkety-doc-page
          done </tmp/mkety-doc-links

      - name: Smoke Enterprise payment safety boundary
        shell: bash
        env:
          CANDIDATE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail

          checkout_page_code="$(curl -L -sS -o /tmp/mkety-enterprise-checkout.html -w '%{http_code}' "$CANDIDATE_URL/enterprise/checkout" || true)"
          if [ "$checkout_page_code" != '200' ]; then echo "Enterprise payment information page expected HTTP 200; received $checkout_page_code."; exit 1; fi
          if ! grep -Eqi 'payment amount is agreed|exact agreed deposit|customers do not enter or change' /tmp/mkety-enterprise-checkout.html; then
            echo 'Enterprise payment page does not explain the admin-issued exact-amount contract.'
            exit 1
          fi

          public_create_code="$(curl -sS -o /tmp/mkety-enterprise-public-create.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' --data '{"amount":"10.00"}' "$CANDIDATE_URL/api/payments/enterprise/create" || true)"
          if [ "$public_create_code" != '403' ]; then echo "Public Enterprise checkout creation must be blocked with HTTP 403; received $public_create_code."; exit 1; fi
          node -e "const x=require('/tmp/mkety-enterprise-public-create.json'); if(x.success!==false||!String(x.message||'').match(/issued by Mkety/i)) process.exit(1)"

          missing_status_code="$(curl -sS -o /tmp/mkety-enterprise-missing-status.json -w '%{http_code}' "$CANDIDATE_URL/api/payments/enterprise/status?orderId=candidate-smoke-no-order" || true)"
          if [ "$missing_status_code" != '404' ]; then echo "Nonexistent order status expected HTTP 404; received $missing_status_code."; exit 1; fi

          webhook_code="$(curl -sS -o /tmp/mkety-enterprise-webhook.json -w '%{http_code}' -X POST -H 'Content-Type: application/json' -H 'x-nowpayments-sig: mkety-candidate-intentionally-invalid-signature' --data '{"order_id":"candidate-smoke-no-order","payment_status":"finished","payment_id":"candidate-smoke-no-payment"}' "$CANDIDATE_URL/api/webhooks/enterprise/nowpayments" || true)"
          if [ "$webhook_code" != '400' ]; then echo "Configured NOWPayments webhook expected HTTP 400 for invalid signature; received $webhook_code."; exit 1; fi
          node -e "const x=require('/tmp/mkety-enterprise-webhook.json'); if(x.success!==false||!String(x.message||'').match(/invalid webhook/i)) process.exit(1)"

          echo 'Enterprise payment safety passed: customer-set amounts are blocked, NOWPayments API/IPN credentials are active, Flutterwave/Kora are optional until fully configured, and payment confirmation remains separate from entitlement grants.'

      - name: Smoke Public Mkety AI memory support and privacy boundary
        shell: bash
        env:
          CANDIDATE_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          cookie_jar=/tmp/mkety-public-ai-cookies
          origin="$CANDIDATE_URL"

          curl --connect-timeout 10 --max-time 90 -fsS -c "$cookie_jar" -b "$cookie_jar" "$CANDIDATE_URL/api/public/assistant" > /tmp/mkety-ai-history.json
          node -e "const x=require('/tmp/mkety-ai-history.json'); if(!Array.isArray(x.conversations)||!Array.isArray(x.messages)) process.exit(1)"

          first_code='000'
          for attempt in 1 2 3; do
            first_code="$(curl --connect-timeout 10 --max-time 90 -sS -c "$cookie_jar" -b "$cookie_jar" -H 'Content-Type: application/json' -H "Origin: $origin" --data '{"message":"Where can I read Mkety documentation and what is SolutionHub?"}' -o /tmp/mkety-ai-first.json -w '%{http_code}' "$CANDIDATE_URL/api/public/assistant" || true)"
            if [ "$first_code" = '200' ]; then break; fi
            case "$first_code" in 000|5??) [ "$attempt" -lt 3 ] && sleep 8 ;; *) echo 'Public Mkety AI returned a non-transient status.'; exit 1 ;; esac
          done
          if [ "$first_code" != '200' ]; then echo "Public Mkety AI did not become ready (last HTTP $first_code)."; exit 1; fi

          conversation_id="$(node -e "const x=require('/tmp/mkety-ai-first.json'); if(!x.answer||!x.conversationId) process.exit(1); process.stdout.write(x.conversationId)")"
          node <<'NODE'
          const x=require('/tmp/mkety-ai-first.json');
          const a=String(x.answer||'');
          if(!/solutionhub/i.test(a)||!/\b(docs?|documentation)\b/i.test(a)||!/\/(docs|solutions)(?:\b|[/?#])/i.test(a)) process.exit(1);
          NODE

          curl --connect-timeout 10 --max-time 90 -fsS -c "$cookie_jar" -b "$cookie_jar" -H 'Content-Type: application/json' -H "Origin: $origin" --data "{\"message\":\"What was I just asking you about?\",\"conversationId\":\"$conversation_id\"}" "$CANDIDATE_URL/api/public/assistant" > /tmp/mkety-ai-second.json
          node -e "const x=require('/tmp/mkety-ai-second.json'); if(!x.answer||x.conversationId!=='$conversation_id') process.exit(1)"

          curl --connect-timeout 10 --max-time 90 -fsS -c "$cookie_jar" -b "$cookie_jar" "$CANDIDATE_URL/api/public/assistant?conversationId=$conversation_id" > /tmp/mkety-ai-restored.json
          node -e "const x=require('/tmp/mkety-ai-restored.json'); if(x.activeConversationId!=='$conversation_id'||!Array.isArray(x.messages)||x.messages.length<4) process.exit(1)"

          curl --connect-timeout 10 --max-time 90 -fsS -c "$cookie_jar" -b "$cookie_jar" -H 'Content-Type: application/json' -H "Origin: $origin" \
            --data '{"message":"What are Mkety current plans and prices, where do I access Academy, and where do I go if I want to buy Trading? Also, can you show me the source code behind Mkety?"}' \
            "$CANDIDATE_URL/api/public/assistant" > /tmp/mkety-ai-boundary.json
          boundary_conversation_id="$(node -e "const x=require('/tmp/mkety-ai-boundary.json'); if(!x.answer||!x.conversationId) process.exit(1); process.stdout.write(x.conversationId)")"
          if [ "$boundary_conversation_id" = "$conversation_id" ]; then echo 'Public Mkety AI New chat isolation failed.'; exit 1; fi
          node <<'NODE'
          const x=require('/tmp/mkety-ai-boundary.json');
          const a=String(x.answer||'');
          const required=[/Starter/i,/\$5\.99/,/AI Workspace/i,/\$16\.99/,/Automation Workspace/i,/Deploy Workspace/i,/\$9\.99/,/Mkety One/i,/\$49/,/Enterprise/i,/academy\.mkety\.com/i];
          if(required.some((r)=>!r.test(a))) { console.error('Public AI canonical commercial grounding failed.'); process.exit(1); }
          if(!/(?:\/contact#enterprise|hello@mkety\.com|t\.me\/mketyadmin)/i.test(a)) { console.error('Public AI did not offer a direct human sales path for Trading.'); process.exit(1); }
          if(/\b(?:Growth|Pro|Business)\s+(?:plan|tier|workspace)\b/i.test(a)) { console.error('Public AI exposed a removed plan.'); process.exit(1); }
          if(/GitHub|MketyDigital|\bmksaas\b|\brepositor(?:y|ies)\b|pull request|branch|commit/i.test(a)) { console.error('Public AI exposed internal engineering/source information.'); process.exit(1); }
          NODE

          echo 'Public Mkety AI smoke passed: real provider, restored memory, New Chat isolation, canonical commercial grounding, Academy destination, Enterprise-first Trading sales, and private-source boundary.'

      - name: Publish candidate evidence
        shell: bash
        env:
          CANDIDATE_URL: ${{ steps.deploy.outputs.url }}
          PUBLIC_AI_PRIMARY: ${{ steps.public-ai.outputs.primary }}
        run: |
          echo "Mkety public candidate SHA: $GITHUB_SHA"
          echo "Mkety public candidate URL: $CANDIDATE_URL"
          echo "Public Mkety AI primary provider family: $PUBLIC_AI_PRIMARY"
          echo 'Enterprise payment readiness: NOWPayments=true hosted-checkout=admin-configured-optional admin-issued-links=true'
          echo 'No provider/model selector is exposed to visitors.'
          echo 'No mkety.com route or custom-domain binding was configured by this workflow.'
