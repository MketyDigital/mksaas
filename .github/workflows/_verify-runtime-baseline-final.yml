name: Final clean runtime baseline verification

on:
  push:
    branches:
      - fix/cloudflare-deployment-baseline
    paths:
      - '.github/workflows/_verify-runtime-baseline-final.yml'

permissions:
  contents: write

concurrency:
  group: verify-runtime-baseline-final
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cloudflare-deployment-baseline
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm type-check
      - run: pnpm lint
      - name: Verify vinext compatibility
        run: pnpx vinext check
      - name: Build authoritative Cloudflare runtime
        env:
          SKIP_ENV_VALIDATION: 'true'
        run: pnpm build
      - name: Validate Cloudflare deployment packaging without deploying
        env:
          SKIP_ENV_VALIDATION: 'true'
        run: pnpm deploy -- --dry-run
      - name: Remove one-time verifier
        run: |
          git config user.name "Mkety Baseline Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/_verify-runtime-baseline-final.yml
          git commit -m "ci: remove completed runtime baseline verifier"
          git pull --rebase origin fix/cloudflare-deployment-baseline
          git push origin HEAD:fix/cloudflare-deployment-baseline
