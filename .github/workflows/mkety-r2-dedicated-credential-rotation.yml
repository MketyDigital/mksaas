name: Mkety R2 Dedicated Credential Rotation

on:
  workflow_dispatch:
  push:
    branches:
      - fix/production-db-private-runner
    paths:
      - '.github/workflows/mkety-r2-dedicated-credential-rotation.yml'

permissions:
  contents: read

jobs:
  rotate:
    name: Rotate Coolify R2 storage to bucket-scoped credentials
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COOLIFY_URL: https://deploy.mkety.com
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_S3_API: ${{ secrets.R2_S3_API }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      R2_BUCKET: mkety-production-db-backups
      COOLIFY_STORAGE_NAME: mkety-r2-production-backups
      POSTGRES_UUID: hgxwkiyxgbmb2i3pl57kmxc8
      POSTGRES_BACKUP_UUID: slamhu8pudyyj3qldejcgbr2

    steps:
      - name: Validate dedicated credentials and endpoint
        id: r2
        shell: bash
        run: |
          set -euo pipefail
          for name in COOLIFY_API_TOKEN R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY; do
            [ -n "${!name:-}" ] || { echo "$name is required."; exit 1; }
          done
          echo "::add-mask::$R2_ACCESS_KEY_ID"
          echo "::add-mask::$R2_SECRET_ACCESS_KEY"
          endpoint="${R2_S3_API:-}"
          if [ -z "$endpoint" ]; then
            [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || { echo 'R2_S3_API or CLOUDFLARE_ACCOUNT_ID is required.'; exit 1; }
            endpoint="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          fi
          ENDPOINT="$endpoint" node <<'NODE'
          const u = new URL(process.env.ENDPOINT);
          if (u.protocol !== 'https:') throw new Error('R2 endpoint must use HTTPS.');
          if (!u.hostname.endsWith('.r2.cloudflarestorage.com')) throw new Error('R2 endpoint must be a Cloudflare R2 S3 endpoint.');
          if (u.username || u.password) throw new Error('R2 endpoint must not contain credentials.');
          NODE
          echo "endpoint=$endpoint" >> "$GITHUB_OUTPUT"
          curl --proto '=https' --tlsv1.2 -fsS "${COOLIFY_URL%/}/api/v1/health" >/dev/null

      - name: Verify bucket-scoped R2 credentials with real object I/O
        shell: bash
        env:
          R2_ENDPOINT: ${{ steps.r2.outputs.endpoint }}
        run: |
          set -euo pipefail
          if ! command -v aws >/dev/null 2>&1; then
            python3 -m pip install --user --quiet awscli
            export PATH="$HOME/.local/bin:$PATH"
          fi
          probe="credential-rotation-healthcheck/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          printf 'mkety-r2-dedicated-credential-check\n' >/tmp/r2-probe.txt
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" AWS_DEFAULT_REGION=auto
          aws s3api put-object --endpoint-url "$R2_ENDPOINT" --bucket "$R2_BUCKET" --key "$probe" --body /tmp/r2-probe.txt >/dev/null
          aws s3api head-object --endpoint-url "$R2_ENDPOINT" --bucket "$R2_BUCKET" --key "$probe" >/dev/null
          aws s3api delete-object --endpoint-url "$R2_ENDPOINT" --bucket "$R2_BUCKET" --key "$probe" >/dev/null
          echo 'Dedicated R2 credentials have verified bucket object read/write access.'

      - name: Rotate existing Coolify S3 storage credentials
        id: storage
        shell: bash
        env:
          R2_ENDPOINT: ${{ steps.r2.outputs.endpoint }}
        run: |
          set -euo pipefail
          base="${COOLIFY_URL%/}/api/v1"
          auth=(-H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Accept: application/json')
          curl --proto '=https' --tlsv1.2 -fsS "${auth[@]}" "$base/s3-storages" -o /tmp/storages.json
          storage_uuid="$(NAME="$COOLIFY_STORAGE_NAME" node <<'NODE'
          const raw=require('/tmp/storages.json'); const list=Array.isArray(raw)?raw:(raw.data||raw.storages||[]);
          const x=Array.isArray(list)?list.find(s=>s?.name===process.env.NAME):null;
          if(!x?.uuid) process.exit(1); process.stdout.write(x.uuid);
          NODE
          )"
          echo "storage_uuid=$storage_uuid" >> "$GITHUB_OUTPUT"
          NAME="$COOLIFY_STORAGE_NAME" ENDPOINT="$R2_ENDPOINT" BUCKET="$R2_BUCKET" KEY="$R2_ACCESS_KEY_ID" SECRET="$R2_SECRET_ACCESS_KEY" node <<'NODE' >/tmp/storage-patch.json
          process.stdout.write(JSON.stringify({
            name:process.env.NAME,
            description:'Private off-site backups for Mkety production PostgreSQL (bucket-scoped R2 credentials)',
            endpoint:process.env.ENDPOINT,
            bucket:process.env.BUCKET,
            region:'auto',
            key:process.env.KEY,
            secret:process.env.SECRET,
            is_usable:true
          }));
          NODE
          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/storage-patch-response.json -w '%{http_code}' \
            -X PATCH "${auth[@]}" -H 'Content-Type: application/json' \
            --data-binary @/tmp/storage-patch.json "$base/s3-storages/$storage_uuid")"
          [ "$code" = '200' ] || { echo "Coolify S3 credential rotation failed with HTTP $code."; cat /tmp/storage-patch-response.json; exit 2; }
          echo 'Coolify R2 destination rotated to dedicated credentials.'

      - name: Trigger fresh local plus R2 Postgres backup
        id: backup
        shell: bash
        env:
          STORAGE_UUID: ${{ steps.storage.outputs.storage_uuid }}
        run: |
          set -euo pipefail
          base="${COOLIFY_URL%/}/api/v1"
          auth=(-H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Accept: application/json')
          curl --proto '=https' --tlsv1.2 -fsS "${auth[@]}" "$base/databases/$POSTGRES_UUID/backups/$POSTGRES_BACKUP_UUID/executions" -o /tmp/before.json
          previous_uuid="$(node <<'NODE'
          const raw=require('/tmp/before.json'); const list=raw.executions||raw.data||raw||[];
          const sorted=Array.isArray(list)?[...list].sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0)):[];
          if(sorted[0]?.uuid) process.stdout.write(sorted[0].uuid);
          NODE
          )"
          echo "previous_uuid=$previous_uuid" >> "$GITHUB_OUTPUT"
          STORAGE_UUID="$STORAGE_UUID" node <<'NODE' >/tmp/backup-patch.json
          process.stdout.write(JSON.stringify({enabled:true,save_s3:true,s3_storage_uuid:process.env.STORAGE_UUID,backup_now:true,database_backup_retention_amount_locally:7,database_backup_retention_amount_s3:30,timeout:3600}));
          NODE
          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/backup-patch-response.json -w '%{http_code}' \
            -X PATCH "${auth[@]}" -H 'Content-Type: application/json' --data-binary @/tmp/backup-patch.json \
            "$base/databases/$POSTGRES_UUID/backups/$POSTGRES_BACKUP_UUID")"
          [ "$code" = '200' ] || { echo "Postgres backup trigger failed with HTTP $code."; exit 3; }

      - name: Verify fresh backup execution and R2 object
        shell: bash
        env:
          PREVIOUS_UUID: ${{ steps.backup.outputs.previous_uuid }}
          R2_ENDPOINT: ${{ steps.r2.outputs.endpoint }}
        run: |
          set -euo pipefail
          base="${COOLIFY_URL%/}/api/v1"
          auth=(-H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Accept: application/json')
          found='no'
          for i in $(seq 1 75); do
            curl --proto '=https' --tlsv1.2 -fsS "${auth[@]}" "$base/databases/$POSTGRES_UUID/backups/$POSTGRES_BACKUP_UUID/executions" -o /tmp/current.json
            read -r uuid status size <<<"$(node <<'NODE'
          const raw=require('/tmp/current.json'); const list=raw.executions||raw.data||raw||[];
          const sorted=Array.isArray(list)?[...list].sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0)):[];
          const x=sorted[0]||{}; process.stdout.write([x.uuid||'',x.status||'',Number(x.size||0)].join(' '));
          NODE
            )"
            if [ -n "$uuid" ] && [ "$uuid" != "$PREVIOUS_UUID" ]; then
              case "${status,,}" in
                success|successful|succeeded|completed) [ "$size" -gt 0 ] || exit 4; found='yes'; break ;;
                failed|failure|error) echo "Fresh backup failed: $status"; exit 5 ;;
              esac
            fi
            sleep 4
          done
          [ "$found" = 'yes' ] || { echo 'No new successful backup execution appeared.'; exit 6; }
          if ! command -v aws >/dev/null 2>&1; then python3 -m pip install --user --quiet awscli; export PATH="$HOME/.local/bin:$PATH"; fi
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" AWS_DEFAULT_REGION=auto
          aws s3 ls --recursive --endpoint-url "$R2_ENDPOINT" "s3://$R2_BUCKET/" >/tmp/r2-list.txt
          count="$(wc -l </tmp/r2-list.txt | tr -d ' ')"
          [ "$count" -gt 0 ] || { echo 'Fresh backup succeeded but R2 contains no objects.'; exit 7; }
          echo "Dedicated R2 credential rotation verified with $count object(s) visible."
