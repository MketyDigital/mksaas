name: Mkety Hyperdrive VPC Provision

on:
  push:
    branches:
      - ops/redis-auth-diagnostic-20260914
    paths:
      - '.github/workflows/mkety-hyperdrive-vpc-provision.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      EXPECTED_HYPERDRIVE_NAME: mkety-production-db
      EXPECTED_VPC_SERVICE_ID: 01a09c2e-8da9-7e70-867f-8003470d8ab5
    steps:
      - name: Validate inputs and inventory exact Hyperdrive
        id: inventory
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$PRODUCTION_DATABASE_URL"
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Accept: application/json')

          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/vpc.json -w '%{http_code}' "${auth[@]}" "$api/connectivity/directory/services?per_page=100")"
          [ "$code" = 200 ] || { echo "Workers VPC inventory failed with HTTP $code."; exit 2; }
          EXPECTED_VPC_SERVICE_ID="$EXPECTED_VPC_SERVICE_ID" node <<'NODE'
          const x=require('/tmp/vpc.json');
          if(!x.success || !Array.isArray(x.result)) process.exit(2);
          const matches=x.result.filter(s=>s.service_id===process.env.EXPECTED_VPC_SERVICE_ID);
          if(matches.length!==1) {
            console.error(`Expected exactly one Workers VPC service id; found ${matches.length}.`);
            process.exit(3);
          }
          const s=matches[0];
          if(s.name!=='mkety-production-postgres') {
            console.error('Workers VPC service name does not match production Postgres service.');
            process.exit(4);
          }
          console.log('MKETY_VPC_SERVICE_OK=true');
          NODE

          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/hd.json -w '%{http_code}' "${auth[@]}" "$api/hyperdrive/configs?per_page=100")"
          [ "$code" = 200 ] || { echo "Hyperdrive inventory failed with HTTP $code."; exit 5; }
          EXPECTED_HYPERDRIVE_NAME="$EXPECTED_HYPERDRIVE_NAME" EXPECTED_VPC_SERVICE_ID="$EXPECTED_VPC_SERVICE_ID" node <<'NODE' >/tmp/inventory.env
          const x=require('/tmp/hd.json');
          if(!x.success || !Array.isArray(x.result)) process.exit(2);
          const matches=x.result.filter(h=>h.name===process.env.EXPECTED_HYPERDRIVE_NAME);
          console.error(`MKETY_HYPERDRIVE_PRECREATE_COUNT=${matches.length}`);
          if(matches.length>1) {
            console.error('Refusing to continue: duplicate production Hyperdrives exist.');
            process.exit(3);
          }
          if(matches.length===1) {
            const h=matches[0];
            if(h.origin?.service_id!==process.env.EXPECTED_VPC_SERVICE_ID) {
              console.error('Refusing to mutate: existing production Hyperdrive points to a different VPC service.');
              process.exit(4);
            }
            console.log('already_exists=true');
            console.error('MKETY_HYPERDRIVE_ALREADY_EXISTS=true');
          } else {
            console.log('already_exists=false');
          }
          NODE
          cat /tmp/inventory.env >> "$GITHUB_OUTPUT"

      - name: Create exact production Hyperdrive
        if: steps.inventory.outputs.already_exists == 'false'
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          DB_URL="$PRODUCTION_DATABASE_URL" EXPECTED_HYPERDRIVE_NAME="$EXPECTED_HYPERDRIVE_NAME" EXPECTED_VPC_SERVICE_ID="$EXPECTED_VPC_SERVICE_ID" node <<'NODE' >/tmp/create.json
          const u=new URL(process.env.DB_URL);
          const dec=s=>decodeURIComponent(s||'');
          const database=dec(u.pathname.replace(/^\//,'').split('/')[0]);
          const user=dec(u.username);
          const password=dec(u.password);
          if(!database || !user || !password) {
            console.error('Production database URL is missing database/user/password components.');
            process.exit(2);
          }
          process.stdout.write(JSON.stringify({
            name: process.env.EXPECTED_HYPERDRIVE_NAME,
            origin: {
              service_id: process.env.EXPECTED_VPC_SERVICE_ID,
              database,
              user,
              password,
              scheme: 'postgresql'
            },
            caching: {disabled:true}
          }));
          NODE
          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/create-response.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @/tmp/create.json "$api/hyperdrive/configs")"
          [ "$code" = 200 ] || { echo "Hyperdrive creation failed with HTTP $code."; node -e "const x=require('/tmp/create-response.json'); console.log(JSON.stringify(x.errors||[]))"; exit 6; }
          node <<'NODE'
          const x=require('/tmp/create-response.json');
          if(!x.success || !x.result?.id) process.exit(2);
          console.log('MKETY_HYPERDRIVE_CREATED=true');
          NODE
          rm -f /tmp/create.json

      - name: Verify exactly one production Hyperdrive
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/final.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Accept: application/json' \
            "$api/hyperdrive/configs?per_page=100")"
          [ "$code" = 200 ] || { echo "Final Hyperdrive inventory failed with HTTP $code."; exit 7; }
          EXPECTED_HYPERDRIVE_NAME="$EXPECTED_HYPERDRIVE_NAME" EXPECTED_VPC_SERVICE_ID="$EXPECTED_VPC_SERVICE_ID" node <<'NODE'
          const x=require('/tmp/final.json');
          if(!x.success || !Array.isArray(x.result)) process.exit(2);
          const matches=x.result.filter(h=>h.name===process.env.EXPECTED_HYPERDRIVE_NAME);
          console.log(`MKETY_HYPERDRIVE_COUNT=${matches.length}`);
          if(matches.length!==1) process.exit(3);
          const h=matches[0];
          if(h.origin?.service_id!==process.env.EXPECTED_VPC_SERVICE_ID) process.exit(4);
          if(!['postgres','postgresql'].includes(h.origin?.scheme)) process.exit(5);
          if(h.caching?.disabled!==true) process.exit(6);
          console.log('MKETY_HYPERDRIVE_VPC_SERVICE_OK=true');
          console.log('MKETY_HYPERDRIVE_CACHE_DISABLED=true');
          console.log('MKETY_HYPERDRIVE_OK=true');
          NODE
