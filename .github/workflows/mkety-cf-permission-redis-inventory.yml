name: Mkety CF Permission + Redis Inventory

on:
  push:
    branches:
      - ops/precutover-diagnostics-20260913

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      COOLIFY_URL: https://deploy.mkety.com
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Show sanitized Cloudflare Connectivity Directory response
        shell: bash
        run: |
          set -euo pipefail
          url="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/connectivity/directory/services?per_page=5"
          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/cf.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Accept: application/json' "$url")"
          HTTP_CODE="$code" node <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('/tmp/cf.json','utf8'));
          const out = {
            http_status: Number(process.env.HTTP_CODE),
            success: p.success === true,
            errors: Array.isArray(p.errors) ? p.errors.map(e => ({ code: e.code ?? null, message: e.message ?? null })) : [],
            messages: Array.isArray(p.messages) ? p.messages.map(e => ({ code: e.code ?? null, message: e.message ?? null })) : [],
            result_count: Array.isArray(p.result) ? p.result.length : 0
          };
          console.log(JSON.stringify(out, null, 2));
          NODE

      - name: Inventory Redis resources without secrets
        shell: bash
        run: |
          set -euo pipefail
          base="${COOLIFY_URL%/}/api/v1"
          curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Accept: application/json' "$base/databases" -o /tmp/databases.json
          node <<'NODE'
          const fs = require('node:fs');
          const raw = JSON.parse(fs.readFileSync('/tmp/databases.json','utf8'));
          const list = Array.isArray(raw) ? raw : [];
          const redis = list.filter(x =>
            String(x?.image || '').toLowerCase().includes('redis') ||
            Object.prototype.hasOwnProperty.call(x || {}, 'redis_conf') ||
            Object.prototype.hasOwnProperty.call(x || {}, 'redis_password')
          );
          const out = redis.map(x => ({
            uuid: x.uuid,
            name: x.name,
            status: x.status,
            image: x.image,
            is_public: x.is_public,
            public_port_present: Boolean(x.public_port),
            enable_ssl: x.enable_ssl ?? null,
            redis_conf_present: Boolean(String(x.redis_conf || '').trim()),
            redis_conf_summary: String(x.redis_conf || '')
              .split(/\r?\n/)
              .map(s => s.trim())
              .filter(Boolean)
              .filter(s => /^(appendonly|appendfsync|save|dir|dbfilename|aof-use-rdb-preamble)\b/i.test(s))
              .map(s => s.replace(/\s+/g,' '))
          }));
          console.log(JSON.stringify({redis_count: out.length, redis: out}, null, 2));
          NODE
