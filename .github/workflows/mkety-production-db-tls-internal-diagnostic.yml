name: Mkety Production DB TLS Internal Diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mkety-production-db-tls-internal-diagnostic.yml
      - ops/coolify-db-tls-diagnostic/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Inspect production PostgreSQL TLS from private network
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      COOLIFY_URL: https://deploy.mkety.com
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      PROJECT_UUID: 0zqhpkprlhtvlacmsgmfyyhs
      ENVIRONMENT_UUID: rtebcetyfvzlaiqitzcp0gl8
      SERVER_UUID: ynkdc4tx6bi7cyxf0kuy8kte
      POSTGRES_UUID: hgxwkiyxgbmb2i3pl57kmxc8
      APP_NAME: mkety-db-tls-diagnostic
    steps:
      - uses: actions/checkout@v4

      - name: Resolve private DB URL without disclosure
        shell: bash
        run: |
          set -euo pipefail
          : "${COOLIFY_API_TOKEN:?required}"
          base="${COOLIFY_URL%/}/api/v1"
          curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" "$base/databases/$POSTGRES_UUID" -o /tmp/db.json
          DATABASE_URL="$(node <<'NODE'
          const d=require('/tmp/db.json');
          if(d.is_public!==false||d.enable_ssl!==true||!String(d.status||'').toLowerCase().includes('healthy')||!d.internal_db_url) throw new Error('Production DB preflight failed');
          process.stdout.write(String(d.internal_db_url));
          NODE
          )"
          echo "::add-mask::$DATABASE_URL"
          echo "DATABASE_URL=$DATABASE_URL" >> "$GITHUB_ENV"

      - name: Create ephemeral private-network diagnostic app
        id: app
        shell: bash
        run: |
          set -euo pipefail
          base="${COOLIFY_URL%/}/api/v1"
          node <<'NODE' >/tmp/create.json
          process.stdout.write(JSON.stringify({
            project_uuid:process.env.PROJECT_UUID,
            server_uuid:process.env.SERVER_UUID,
            environment_uuid:process.env.ENVIRONMENT_UUID,
            git_repository:'https://github.com/MketyDigital/mksaas',
            git_branch:'main',
            git_commit_sha:process.env.GITHUB_SHA,
            build_pack:'dockerfile',
            dockerfile_location:'/ops/coolify-db-tls-diagnostic/Dockerfile',
            ports_exposes:'3000',
            name:process.env.APP_NAME+'-'+process.env.GITHUB_SHA.slice(0,8),
            autogenerate_domain:false,
            connect_to_docker_network:true,
            instant_deploy:false
          }));
          NODE
          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/create-response.json -w '%{http_code}' -X POST             -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Content-Type: application/json'             --data-binary @/tmp/create.json "$base/applications/public")"
          [ "$code" = 201 ] || { echo "Diagnostic app create failed HTTP $code"; exit 1; }
          uuid="$(node -e "const x=require('/tmp/create-response.json');if(!x.uuid)process.exit(1);process.stdout.write(x.uuid)")"
          echo "uuid=$uuid" >> "$GITHUB_OUTPUT"

      - name: Inject private DB URL
        shell: bash
        env:
          APP_UUID: ${{ steps.app.outputs.uuid }}
        run: |
          set -euo pipefail
          base="${COOLIFY_URL%/}/api/v1"
          DB="$DATABASE_URL" node <<'NODE' >/tmp/env.json
          process.stdout.write(JSON.stringify({key:'DATABASE_URL',value:process.env.DB,is_preview:false,is_literal:true,is_multiline:false,is_shown_once:true}));
          NODE
          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/env-response.json -w '%{http_code}' -X POST             -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Content-Type: application/json'             --data-binary @/tmp/env.json "$base/applications/$APP_UUID/envs")"
          if [ "$code" != 201 ]; then
            code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/env-response.json -w '%{http_code}' -X PATCH               -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Content-Type: application/json'               --data-binary @/tmp/env.json "$base/applications/$APP_UUID/envs")"
          fi
          [ "$code" = 201 ] || { echo "DATABASE_URL upsert failed HTTP $code"; exit 1; }

      - name: Deploy and collect safe TLS facts
        shell: bash
        env:
          APP_UUID: ${{ steps.app.outputs.uuid }}
        run: |
          set -euo pipefail
          base="${COOLIFY_URL%/}/api/v1"
          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/deploy.json -w '%{http_code}' -X POST             -H "Authorization: Bearer $COOLIFY_API_TOKEN" "$base/deploy?uuid=$APP_UUID&force=true")"
          [ "$code" = 200 ] || { echo "Deploy failed HTTP $code"; exit 1; }
          dep="$(node -e "const x=require('/tmp/deploy.json');const d=Array.isArray(x.deployments)?x.deployments[0]:null;if(!d?.deployment_uuid)process.exit(1);process.stdout.write(d.deployment_uuid)")"
          for i in $(seq 1 120); do
            curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" "$base/deployments/$dep" -o /tmp/dep.json
            s="$(node -e "const x=require('/tmp/dep.json');process.stdout.write(String(x.status||''))")"
            case "${s,,}" in
              finished|success|successful|succeeded|completed) break ;;
              failed|failure|error|cancelled|canceled) echo "Deployment failed: $s"; exit 1 ;;
            esac
            sleep 3
          done

          found=0
          for i in $(seq 1 80); do
            curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN"               "$base/applications/$APP_UUID/logs?lines=300&show_timestamps=false" -o /tmp/logs.json || true
            node <<'NODE' >/tmp/safe.log
          const fs=require('node:fs');
          let raw=''; try{raw=String(JSON.parse(fs.readFileSync('/tmp/logs.json','utf8')).logs||'')}catch{}
          const safe=raw.split(/\r?\n/).filter(line=>
            /MKETY_TLS_DIAG_|server_version=|^ssl=|ssl_min_protocol_version=|ssl_max_protocol_version=|ssl_ciphers=|ssl_prefer_server_ciphers=|ssl_cert_file=|ssl_key_file=|tls12_exit=|tls13_exit=|subject=|issuer=|notBefore=|notAfter=|Protocol *:|Cipher *:|Verify return code:/.test(line)
          ).map(line=>line.replace(/serial=.*/,'serial=[redacted]')).join('\n');
          process.stdout.write(safe);
          NODE
            if grep -Fq 'MKETY_TLS_DIAG_OK=true' /tmp/safe.log; then found=1; break; fi
            sleep 3
          done
          cat /tmp/safe.log
          [ "$found" = 1 ] || { echo 'TLS diagnostic did not complete.'; exit 1; }

      - name: Cleanup diagnostic app
        if: always() && steps.app.outputs.uuid != ''
        shell: bash
        env:
          APP_UUID: ${{ steps.app.outputs.uuid }}
        run: |
          set +e
          curl --proto '=https' --tlsv1.2 -sS -X DELETE -H "Authorization: Bearer $COOLIFY_API_TOKEN"             "${COOLIFY_URL%/}/api/v1/applications/$APP_UUID" >/dev/null
          echo 'Diagnostic app cleanup requested.'
