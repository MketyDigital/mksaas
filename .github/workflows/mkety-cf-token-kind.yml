name: Mkety Cloudflare Token Kind

on:
  push:
    branches:
      - ops/precutover-diagnostics-20260913

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Verify token against user and account endpoints
        shell: bash
        run: |
          set -euo pipefail
          user_code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/user.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Accept: application/json' 'https://api.cloudflare.com/client/v4/user/tokens/verify')"
          account_code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/account.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Accept: application/json' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/tokens/verify")"
          USER_CODE="$user_code" ACCOUNT_CODE="$account_code" node <<'NODE'
          const fs=require('node:fs');
          const safe=(path,code)=>{let p={};try{p=JSON.parse(fs.readFileSync(path,'utf8'))}catch{};return {http_status:Number(code),success:p.success===true,status:p.result?.status??null,errors:Array.isArray(p.errors)?p.errors.map(e=>({code:e.code??null,message:e.message??null})):[]}};
          console.log(JSON.stringify({user_token_verify:safe('/tmp/user.json',process.env.USER_CODE),account_token_verify:safe('/tmp/account.json',process.env.ACCOUNT_CODE)},null,2));
          NODE
