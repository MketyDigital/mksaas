name: Legacy cleanup verification

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/_legacy-cleanup-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mkety-automation-webhook-trigger
          fetch-depth: 0
      - name: Audit legacy runtime/auth/template references
        shell: bash
        run: |
          set -euo pipefail
          echo '=== Auth0 / NextAuth / Auth.js references ==='
          git grep -nEi 'auth0|nextauth|next-auth|next_auth|AUTH_SECRET|NEXTAUTH_' -- ':!docs/superpowers/**' ':!*.lock' || true
          echo '=== OpenNext / obsolete Cloudflare references ==='
          git grep -nEi 'opennext|open-next|\.open-next|@opennextjs|CLOUDFLARE_WORKER_NAME|mksaas' -- ':!docs/superpowers/**' ':!pnpm-lock.yaml' || true
          echo '=== obvious template-era branding ==='
          git grep -nEi 'saas template|SaaS Template|template logo|boilerplate' -- ':!docs/superpowers/**' ':!pnpm-lock.yaml' || true
          echo '=== temp workflow files ==='
          find .github/workflows -maxdepth 1 -type f -name '_*' -print | sort
