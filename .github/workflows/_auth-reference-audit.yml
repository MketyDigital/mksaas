name: Restore verified invite service contract

on:
  push:
    branches:
      - feat/mkety-auth-zitadel-vinext

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mkety-auth-zitadel-vinext
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Restore last verified invite service and apply Mkety origin change only
        shell: bash
        run: |
          git show 0733138cf482ea39065e18eec4051c1f50f96372:src/features/admin/services/invite-service.ts > src/features/admin/services/invite-service.ts
          python - <<'PY'
          from pathlib import Path
          path = Path('src/features/admin/services/invite-service.ts')
          text = path.read_text()
          old = "  const baseUrl = process.env.NEXTAUTH_URL || 'http://localhost:3000';\n  return `${baseUrl}/t/${tenantSlug}/invite/${token}`;"
          new = "  const baseUrl = process.env.NEXT_PUBLIC_APP_URL || 'http://localhost:3000';\n  return `${baseUrl.replace(/\\/$/, '')}/t/${tenantSlug}/invite/${token}`;"
          if old not in text:
              raise SystemExit('Expected verified invite URL helper not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify type contract restored
        run: pnpm type-check
      - name: Verify active legacy Auth references remain absent
        shell: bash
        run: |
          set -o pipefail
          git grep -n -I -E '(auth0|Auth0|AUTH0_|next-auth|NextAuth|nextauth|@auth/|NEXTAUTH_|Next\.js SaaS AI Template|next-saas-ai-starter)' -- ':!pnpm-lock.yaml' \
            | grep -v -E '^(docs/superpowers/|docs/AUTHENTICATION\.md:|docs/MKETY_AUTH_SOURCE_OF_TRUTH\.md:|docs/HANDOFF_MKETY_AUTH_ZITADEL_CLOUDFLARE\.md:|docs/DEPLOYMENT\.md:|\.envrc\.example:|src/features/auth/components/__tests__/LoginForm\.test\.tsx:|\.github/workflows/_auth-reference-audit\.yml:|\.github/workflows/_auth-cleanup-final-verify\.yml:)' \
            | tee /tmp/active-forbidden.txt || true
          test ! -s /tmp/active-forbidden.txt
      - name: Commit only repaired invite service
        shell: bash
        run: |
          git config user.name 'Mkety Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add src/features/admin/services/invite-service.ts
          git diff --cached --quiet && exit 0
          git commit --no-verify -m 'fix(auth): preserve verified invite service contract'
          git push origin HEAD:feat/mkety-auth-zitadel-vinext
