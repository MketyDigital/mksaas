name: Clean active template and legacy Auth references

on:
  push:
    branches:
      - feat/mkety-auth-zitadel-vinext

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mkety-auth-zitadel-vinext
          fetch-depth: 0
      - name: Replace active template branding and stale config references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          files = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          brand_exclusions = ('docs/superpowers/',)

          for name in files:
              if name.startswith(brand_exclusions):
                  continue
              path = Path(name)
              try:
                  text = path.read_text()
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text.replace('Next.js SaaS AI Template', 'Mkety Platform')
              if updated != text:
                  path.write_text(updated)

          targeted_replacements = {
              'docs/PROJECT_CONFIGURATION.md': [
                  ('`AUTH0_*`', '`MKETY_AUTH_*`'),
                  ('Auth0 configuration', 'Mkety Auth OIDC configuration'),
                  ('Optional (for SSO)', 'Required for provider-backed sign-in'),
              ],
              'docs/PROJECT_STRUCTURE.md': [
                  ('auth/[...nextauth]/    # Auth.js handlers', 'auth/                 # Mkety login/callback/logout/session routes'),
              ],
              'README.md': [
                  ('- 🔐 **Auth.js v5 + Auth0** — SSO, database sessions, development credentials provider', '- 🔐 **Mkety Auth + ZITADEL adapter** — provider-neutral OIDC, Mkety-owned hashed sessions, DB-backed authorization'),
                  ('| Framework    | Next.js 15 (App Router, RSC, Turbopack)               |', '| Framework    | Next.js 16 App Router + vinext on Cloudflare Workers     |'),
                  ('| Auth         | Auth.js v5 + Auth0 (SSO) + database sessions          |', '| Auth         | Mkety Auth + replaceable ZITADEL OIDC adapter            |'),
              ],
              'docs/API.md': [
                  ('- **Auth0** - Production SSO provider', '- **Mkety Auth** - provider-neutral application auth/session boundary with ZITADEL as the initial OIDC adapter'),
              ],
              'docs/GLOSSARY.md': [
                  ('A **User** is an authentication entity managed by Auth.js (NextAuth). It represents a system access account with credentials (email, OAuth providers, etc.). A user can belong to multiple tenants and have different roles in each one.', 'A **User** is Mkety’s internal application identity. External identities are mapped through the provider-neutral Mkety Auth boundary, while tenant membership, roles, and permissions remain authoritative in Mkety data.'),
              ],
              'src/app/landing-data.ts': [
                  ("'SSO (Auth0)'", "'Enterprise SSO'"),
              ],
          }

          for name, replacements in targeted_replacements.items():
              path = Path(name)
              if not path.exists():
                  continue
              text = path.read_text()
              for old, new in replacements:
                  text = text.replace(old, new)
              path.write_text(text)
          PY

      - name: Reject active legacy Auth or template references
        shell: bash
        run: |
          set -o pipefail
          echo '=== ACTIVE_FORBIDDEN_REFERENCES ==='
          git grep -n -I -E '(auth0|Auth0|AUTH0_|next-auth|NextAuth|nextauth|@auth/|NEXTAUTH_|Next\.js SaaS AI Template|next-saas-ai-starter)' -- ':!pnpm-lock.yaml' \
            | grep -v -E '^(docs/superpowers/|docs/AUTHENTICATION\.md:|docs/MKETY_AUTH_SOURCE_OF_TRUTH\.md:|docs/HANDOFF_MKETY_AUTH_ZITADEL_CLOUDFLARE\.md:|docs/DEPLOYMENT\.md:|\.envrc\.example:|src/features/auth/components/__tests__/LoginForm\.test\.tsx:|\.github/workflows/_auth-reference-audit\.yml:)' \
            | tee /tmp/active-forbidden.txt || true
          test ! -s /tmp/active-forbidden.txt

          echo '=== LOCKFILE_FORBIDDEN_REFERENCES ==='
          git grep -n -I -E '(auth0|Auth0|AUTH0_|next-auth|NextAuth|nextauth|@auth/|NEXTAUTH_)' -- pnpm-lock.yaml \
            | tee /tmp/lock-forbidden.txt || true
          test ! -s /tmp/lock-forbidden.txt

      - name: Commit cleansing changes
        shell: bash
        run: |
          git config user.name 'Mkety Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit --no-verify -m 'chore: cleanse template and legacy auth references'
          git push origin HEAD:feat/mkety-auth-zitadel-vinext
