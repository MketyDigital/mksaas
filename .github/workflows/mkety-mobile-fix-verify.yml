name: Mkety Mobile Fix Verify

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/mkety-mobile-fix-verify.yml'

permissions:
  contents: read

env:
  VERIFIED_SHA: 115dfca03206e47cf0a4b4a24d217b8d9b2e8e76
  SKIP_ENV_VALIDATION: 'true'

jobs:
  verify:
    name: Verify MketyOS mobile containment exact SHA
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.VERIFIED_SHA }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm type-check
      - run: pnpm lint
      - run: pnpx vinext check
      - run: pnpm build
      - name: Assert mobile containment contract
        shell: bash
        run: |
          set -euo pipefail
          file=src/features/platform-content/components/public/MketyPublicExperience.tsx
          grep -Fq 'grid-cols-[minmax(0,1fr)]' "$file"
          grep -Fq 'overflow-x-clip' "$file"
          grep -Fq '[overflow-wrap:anywhere]' "$file"
          grep -Fq 'w-full max-w-full min-w-0' "$file"
          grep -Fq '<a href="/login">Sign In</a>' src/features/platform-content/components/public/MketyPublicHeader.tsx
          grep -Fq '<a href="/signup">Get Started</a>' src/features/platform-content/components/public/MketyPublicHeader.tsx
          echo 'MketyOS mobile containment and full-document auth navigation contracts verified.'
