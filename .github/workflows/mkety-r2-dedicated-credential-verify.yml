name: Mkety R2 Dedicated Credential Verify

on:
  workflow_dispatch:
  push:
    branches:
      - fix/production-db-private-runner
    paths:
      - '.github/workflows/mkety-r2-dedicated-credential-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      COOLIFY_URL: https://deploy.mkety.com
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_S3_API: ${{ secrets.R2_S3_API }}
      R2_BUCKET: mkety-production-db-backups
      POSTGRES_UUID: hgxwkiyxgbmb2i3pl57kmxc8
      POSTGRES_BACKUP_UUID: slamhu8pudyyj3qldejcgbr2

    steps:
      - name: Validate dedicated R2 credentials and current Coolify backup policy
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          for name in COOLIFY_API_TOKEN R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_S3_API; do
            [ -n "${!name:-}" ] || { echo "$name is required."; exit 1; }
          done
          echo "::add-mask::$R2_ACCESS_KEY_ID"
          echo "::add-mask::$R2_SECRET_ACCESS_KEY"
          endpoint="$R2_S3_API"
          ENDPOINT="$endpoint" node <<'NODE'
          const u=new URL(process.env.ENDPOINT);
          if(u.protocol!=='https:' || !u.hostname.endsWith('.r2.cloudflarestorage.com')) throw new Error('Invalid R2 S3 endpoint.');
          NODE
          if ! command -v aws >/dev/null 2>&1; then python3 -m pip install --user --quiet awscli; export PATH="$HOME/.local/bin:$PATH"; fi
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" AWS_DEFAULT_REGION=auto
          aws s3api list-objects-v2 --endpoint-url "$endpoint" --bucket "$R2_BUCKET" --max-keys 100 >/tmp/r2-objects.json
          key_count="$(node -e "const x=require('/tmp/r2-objects.json'); process.stdout.write(String(x.KeyCount||0))")"
          [ "$key_count" -gt 0 ] || { echo 'R2 bucket is reachable but contains no backup objects.'; exit 2; }

          base="${COOLIFY_URL%/}/api/v1"
          curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            "$base/databases/$POSTGRES_UUID/backups" -o /tmp/backups.json
          node <<'NODE'
          const raw=require('/tmp/backups.json'); const list=Array.isArray(raw)?raw:(raw.data||raw.backups||[]);
          const b=list.find(x=>x?.uuid===process.env.POSTGRES_BACKUP_UUID);
          if(!b) throw new Error('Expected production backup policy not found.');
          if(b.enabled===false || b.save_s3!==true) throw new Error('Production backup policy is not enabled for S3/R2.');
          console.log(`Verified production backup policy: ${b.frequency}, local retention=${b.database_backup_retention_amount_locally}, R2 retention=${b.database_backup_retention_amount_s3}.`);
          NODE
          echo "Verified dedicated R2 access and $key_count existing off-site object(s)."
