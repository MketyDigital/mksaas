name: Mkety Production Backup Repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mkety-production-backup-repair.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    name: Create clean R2-backed production backup policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      COOLIFY_URL: https://deploy.mkety.com
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      POSTGRES_UUID: hgxwkiyxgbmb2i3pl57kmxc8
      LEGACY_BACKUP_UUID: slamhu8pudyyj3qldejcgbr2
      S3_STORAGE_UUID: o5p5dqqkijve7tsg1dxf1xnb

    steps:
      - name: Validate production database and existing R2 target
        shell: bash
        run: |
          set -euo pipefail
          : "${COOLIFY_API_TOKEN:?required}"
          base="${COOLIFY_URL%/}/api/v1"
          curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" "$base/databases/$POSTGRES_UUID" -o /tmp/db.json
          curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" "$base/s3-storages/$S3_STORAGE_UUID" -o /tmp/s3.json
          node <<'NODE'
          const db=require('/tmp/db.json'), s3=require('/tmp/s3.json');
          if(db.name!=='mkety-postgres'||db.is_public!==false||!String(db.status||'').toLowerCase().includes('healthy')) throw new Error('Production Postgres preflight failed.');
          if(s3.uuid!==process.env.S3_STORAGE_UUID||s3.is_usable!==true||s3.bucket!=='mkety-production-db-backups') throw new Error('Expected usable Mkety R2 storage not found.');
          console.log('Production Postgres and R2 target verified.');
          NODE

      - name: Create fresh R2-backed backup policy and request backup now
        id: create
        shell: bash
        run: |
          set -euo pipefail
          base="${COOLIFY_URL%/}/api/v1"
          cat >/tmp/new-backup.json <<JSON
          {
            "frequency":"0 2 * * *",
            "enabled":true,
            "save_s3":true,
            "s3_storage_uuid":"$S3_STORAGE_UUID",
            "backup_now":true,
            "dump_all":false,
            "database_backup_retention_amount_locally":7,
            "database_backup_retention_amount_s3":30,
            "timeout":3600
          }
          JSON
          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/create-response.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @/tmp/new-backup.json "$base/databases/$POSTGRES_UUID/backups")"
          [ "$code" = '201' ] || { echo "Creating replacement backup policy failed with HTTP $code."; exit 1; }
          new_uuid="$(node -e "const x=require('/tmp/create-response.json'); if(!x.uuid) process.exit(1); process.stdout.write(x.uuid)")"
          echo "uuid=$new_uuid" >> "$GITHUB_OUTPUT"
          echo "NEW_BACKUP_UUID=$new_uuid" >> "$GITHUB_ENV"
          echo "Created replacement backup policy $new_uuid and requested immediate backup."

      - name: Verify replacement policy persisted with R2 target
        shell: bash
        run: |
          set -euo pipefail
          base="${COOLIFY_URL%/}/api/v1"
          curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" "$base/databases/$POSTGRES_UUID/backups" -o /tmp/backups.json
          NEW="$NEW_BACKUP_UUID" node <<'NODE'
          const raw=require('/tmp/backups.json');
          const list=Array.isArray(raw)?raw:Array.isArray(raw?.data)?raw.data:Array.isArray(raw?.backups)?raw.backups:[];
          const b=list.find(x=>x?.uuid===process.env.NEW);
          const target=b?.s3_storage_uuid||b?.s3_storage?.uuid||null;
          console.log('NEW_BACKUP_POLICY_SAFE '+JSON.stringify({
            uuid:b?.uuid||null,enabled:b?.enabled!==false,saveS3:b?.save_s3===true,
            hasExpectedR2:target===process.env.S3_STORAGE_UUID,
            localRetention:Number(b?.database_backup_retention_amount_locally||0),
            s3Retention:Number(b?.database_backup_retention_amount_s3||0)
          }));
          if(!b||b.enabled===false||b.save_s3!==true||target!==process.env.S3_STORAGE_UUID) throw new Error('Replacement R2 backup policy did not persist correctly.');
          if(Number(b.database_backup_retention_amount_locally||0)<7||Number(b.database_backup_retention_amount_s3||0)<30) throw new Error('Replacement retention is below policy.');
          NODE

      - name: Disable malformed legacy backup policy
        shell: bash
        run: |
          set -euo pipefail
          base="${COOLIFY_URL%/}/api/v1"
          printf '%s' '{"enabled":false}' >/tmp/disable.json
          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/disable-response.json -w '%{http_code}' \
            -X PATCH -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @/tmp/disable.json "$base/databases/$POSTGRES_UUID/backups/$LEGACY_BACKUP_UUID")"
          [ "$code" = '200' ] || { echo "Legacy backup disable failed with HTTP $code."; exit 1; }
          echo 'Malformed legacy backup policy disabled.'
