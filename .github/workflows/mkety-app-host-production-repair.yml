name: Mkety App Host Production Repair
# Preview smoke checks reachability; live auth assertions run after app.mkety.com binding.
# A workflow-file change intentionally triggers a fresh dedicated app-host deployment on main.

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/mkety-app-host-production-repair.yml'
      - 'src/app/app/**'
      - 'src/app/ops/**'
      - 'src/app/(auth)/**'
      - 'src/app/api/auth/**'
      - 'src/app/api/tenants/**/enterprise-ai/**'
      - 'src/features/ai-runtime/components/EnterpriseAiCheckoutForm.tsx'
      - 'src/features/billing/gateways/**'
      - 'src/features/payments/**'
      - 'src/features/platform-content/server/authorization.ts'
      - 'src/shared/lib/auth/**'
      - 'src/shared/lib/auth.ts'
      - 'src/shared/db/request.ts'
      - 'src/shared/db/cloudflare.ts'
      - 'src/proxy.ts'
      - 'wrangler.jsonc'
  workflow_dispatch:
    inputs:
      verified_sha:
        description: Exact certified current main SHA
        required: true
        type: string
      confirmation:
        description: Type REPAIR APP.MKETY.COM
        required: true
        type: string

concurrency:
  group: mkety-app-host-production-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RELEASE_BRANCH: main
  APP_WORKER_NAME: mkety-app-host
  MKETY_HYPERDRIVE_NAME: mkety-production-db-v2
  MKETY_AUTH_REDIRECT_URI: https://app.mkety.com/api/auth/callback
  MKETY_AUTH_POST_LOGOUT_REDIRECT_URI: https://app.mkety.com/login
  NEXT_PUBLIC_APP_URL: https://app.mkety.com
  TARGET_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.verified_sha || github.sha }}

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ZITADEL_MANAGEMENT_TOKEN: ${{ secrets.ZITADEL_MANAGEMENT_PAT }}
      MKETY_AUTH_ISSUER: ${{ secrets.ZITADEL_URL || vars.ZITADEL_URL }}
      ZITADEL_PROJECT_ID: ${{ secrets.ZITADEL_PROJECT_ID }}
      CONFIGURED_MKETY_AUTH_SESSION_SECRET: ${{ secrets.MKETY_AUTH_SESSION_SECRET }}
      MKETY_DOMAIN_RELAY_URL: ${{ secrets.MKETY_DOMAIN_RELAY_URL || vars.MKETY_DOMAIN_RELAY_URL }}
      MKETY_DOMAIN_RELAY_SECRET: ${{ secrets.MKETY_DOMAIN_RELAY_SECRET }}
      MKETY_PLATFORM_CONTROL_TENANT_SLUG: ${{ secrets.MKETY_PLATFORM_CONTROL_TENANT_SLUG || vars.MKETY_PLATFORM_CONTROL_TENANT_SLUG || 'mkety-ops' }}
      MKETY_PLATFORM_ADMIN_EMAILS: ${{ secrets.MKETY_PLATFORM_ADMIN_EMAILS || vars.MKETY_PLATFORM_ADMIN_EMAILS }}
      NOWPAYMENTS_API_KEY: ${{ secrets.NOWPAYMENTS_API_KEY }}
      NOWPAYMENTS_IPN_SECRET: ${{ secrets.NOWPAYMENTS_IPN_SECRET }}
      FLUTTERWAVE_PUBLIC_KEY: ${{ secrets.FLUTTERWAVE_PUBLIC_KEY }}
      FLUTTERWAVE_STANDARD_SECRET_KEY: ${{ secrets.FLUTTERWAVE_STANDARD_SECRET_KEY }}
      FLUTTERWAVE_STANDARD_WEBHOOK_HASH: ${{ secrets.FLUTTERWAVE_STANDARD_WEBHOOK_HASH }}
      FLUTTERWAVE_CHECKOUT_BROKER_SECRET: ${{ secrets.FLUTTERWAVE_CHECKOUT_BROKER_SECRET }}
      KORA_PUBLIC_KEY: ${{ secrets.KORA_PUBLIC_KEY }}
      KORA_SECRET_KEY: ${{ secrets.KORA_SECRET_KEY }}
    steps:
      - name: Authorize exact production SHA
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "${{ inputs.confirmation }}" = "REPAIR APP.MKETY.COM" ] || {
              echo "Exact production promotion confirmation is required." >&2
              exit 1
            }
          else
            [ "${{ github.ref_name }}" = "$RELEASE_BRANCH" ] || {
              echo "One-time app-host promotion is restricted to main." >&2
              exit 1
            }
          fi
          case "$TARGET_SHA" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) ;;
            *) echo "verified_sha must be a full 40-character commit SHA." >&2; exit 1 ;;
          esac

      - name: Checkout exact certified main release
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 1

      - name: Verify SHA matches current main
        shell: bash
        run: |
          set -euo pipefail
          certified_head="$(git ls-remote origin "refs/heads/$RELEASE_BRANCH" | awk '{print $1}')"
          [ -n "$certified_head" ] || { echo "main head was not found." >&2; exit 1; }
          [ "$certified_head" = "${{ env.TARGET_SHA }}" ] || {
            echo "Refusing production promotion: verified SHA does not match current main." >&2
            exit 1
          }

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate production management credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ZITADEL_MANAGEMENT_TOKEN MKETY_AUTH_ISSUER ZITADEL_PROJECT_ID MKETY_PLATFORM_CONTROL_TENANT_SLUG MKETY_PLATFORM_ADMIN_EMAILS NOWPAYMENTS_API_KEY NOWPAYMENTS_IPN_SECRET; do
            [ -n "${!name:-}" ] || { echo "Missing production configuration: $name" >&2; exit 1; }
          done
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"
          echo "::add-mask::$ZITADEL_MANAGEMENT_TOKEN"

      - name: Resolve production Hyperdrive
        id: hyperdrive
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/hyperdrive/configs?per_page=100")"
          HYPERDRIVES="$response" NAME="$MKETY_HYPERDRIVE_NAME" node <<'NODE' >/tmp/app-hyperdrive-id
          const p=JSON.parse(process.env.HYPERDRIVES||'{}');
          if(!p.success||!Array.isArray(p.result)) throw new Error('Hyperdrive lookup failed');
          const matches=p.result.filter(x=>x.name===process.env.NAME);
          if(matches.length!==1) throw new Error('Expected exactly one production Hyperdrive named '+process.env.NAME);
          process.stdout.write(matches[0].id);
          NODE
          echo "id=$(cat /tmp/app-hyperdrive-id)" >> "$GITHUB_OUTPUT"

      - name: Reconcile app.mkety.com callback into production ZITADEL application
        id: zitadel
        env:
          ZITADEL_APPLICATION_NAME: Mkety Platform Production
        run: pnpm exec tsx scripts/provision-zitadel-redirects.ts

      - name: Configure dedicated app-host Worker
        env:
          MKETY_HYPERDRIVE_ID: ${{ steps.hyperdrive.outputs.id }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs');
          const config=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          config.name=process.env.APP_WORKER_NAME;
          config.workers_dev=true;
          config.preview_urls=true;
          config.keep_vars=true;
          config.hyperdrive=[{binding:'MKETY_DB',id:process.env.MKETY_HYPERDRIVE_ID}];
          config.vars={...(config.vars||{}),NEXT_PUBLIC_APP_URL:'https://app.mkety.com'};
          delete config.route;
          delete config.routes;
          fs.writeFileSync('wrangler.jsonc',JSON.stringify(config,null,2)+'\n');
          NODE

      - name: Build and validate dedicated app-host Worker
        shell: bash
        run: |
          set -euo pipefail
          pnpm build
          pnpm run deploy --dry-run

      - name: Deploy dedicated app-host Worker without hostname binding
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          pnpm run deploy 2>&1 | tee /tmp/mkety-app-host-deploy.log
          url="$(grep -Eo 'https://[^[:space:]]+workers\.dev' /tmp/mkety-app-host-deploy.log | tail -n 1 || true)"
          [ -n "$url" ] || { echo "Dedicated app Worker deployed without a workers.dev URL." >&2; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Prepare durable app-host session secret
        id: session
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CONFIGURED_MKETY_AUTH_SESSION_SECRET:-}" ]; then
            echo "::add-mask::$CONFIGURED_MKETY_AUTH_SESSION_SECRET"
            echo "SESSION_SECRET=$CONFIGURED_MKETY_AUTH_SESSION_SECRET" >> "$GITHUB_ENV"
            echo "write=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pnpm exec wrangler secret list --name "$APP_WORKER_NAME" --format json >/tmp/app-worker-secrets.json
          exists="$(node -e "const fs=require('fs');const raw=fs.readFileSync('/tmp/app-worker-secrets.json','utf8');const m=raw.match(/\[\s*(?:\{|\])/);const a=m?JSON.parse(raw.slice(m.index)):[];process.stdout.write(a.some(x=>x.name==='MKETY_AUTH_SESSION_SECRET')?'true':'false')")"
          if [ "$exists" = true ]; then
            echo "write=false" >> "$GITHUB_OUTPUT"
          else
            secret="$(openssl rand -hex 32)"
            echo "::add-mask::$secret"
            echo "SESSION_SECRET=$secret" >> "$GITHUB_ENV"
            echo "write=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Attach app-host auth runtime bindings
        env:
          CLIENT_ID: ${{ steps.zitadel.outputs.client_id }}
          WRITE_SESSION_SECRET: ${{ steps.session.outputs.write }}
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$CLIENT_ID" ] || { echo "ZITADEL did not return a client id." >&2; exit 1; }
          put_secret() {
            local name="$1"; local value="$2"
            [ -n "$value" ] || { echo "Missing runtime value: $name" >&2; exit 1; }
            printf '%s' "$value" | pnpm exec wrangler secret put "$name" --name "$APP_WORKER_NAME" >/dev/null
          }
          put_secret MKETY_AUTH_PROVIDER zitadel
          put_secret MKETY_AUTH_ISSUER "$MKETY_AUTH_ISSUER"
          put_secret MKETY_AUTH_CLIENT_ID "$CLIENT_ID"
          put_secret MKETY_AUTH_REDIRECT_URI "$MKETY_AUTH_REDIRECT_URI"
          put_secret MKETY_AUTH_POST_LOGOUT_REDIRECT_URI "$MKETY_AUTH_POST_LOGOUT_REDIRECT_URI"
          put_secret MKETY_PLATFORM_CONTROL_TENANT_SLUG "$MKETY_PLATFORM_CONTROL_TENANT_SLUG"
          put_secret MKETY_PLATFORM_ADMIN_EMAILS "$MKETY_PLATFORM_ADMIN_EMAILS"
          put_secret NOWPAYMENTS_API_KEY "$NOWPAYMENTS_API_KEY"
          put_secret NOWPAYMENTS_IPN_SECRET "$NOWPAYMENTS_IPN_SECRET"
          if [ -n "${FLUTTERWAVE_PUBLIC_KEY:-}" ] || [ -n "${FLUTTERWAVE_STANDARD_SECRET_KEY:-}" ] || [ -n "${FLUTTERWAVE_STANDARD_WEBHOOK_HASH:-}" ]; then
            if [ -z "${FLUTTERWAVE_PUBLIC_KEY:-}" ] || [ -z "${FLUTTERWAVE_STANDARD_SECRET_KEY:-}" ] || [ -z "${FLUTTERWAVE_STANDARD_WEBHOOK_HASH:-}" ]; then
              echo "Flutterwave Enterprise payment secrets must be configured together." >&2
              exit 1
            fi
            put_secret FLUTTERWAVE_PUBLIC_KEY "$FLUTTERWAVE_PUBLIC_KEY"
            put_secret FLUTTERWAVE_STANDARD_SECRET_KEY "$FLUTTERWAVE_STANDARD_SECRET_KEY"
            put_secret FLUTTERWAVE_STANDARD_WEBHOOK_HASH "$FLUTTERWAVE_STANDARD_WEBHOOK_HASH"
            put_secret FLUTTERWAVE_CHECKOUT_BROKER_SECRET "$FLUTTERWAVE_CHECKOUT_BROKER_SECRET"
          fi
          if [ -n "${KORA_PUBLIC_KEY:-}" ] || [ -n "${KORA_SECRET_KEY:-}" ]; then
            if [ -z "${KORA_PUBLIC_KEY:-}" ] || [ -z "${KORA_SECRET_KEY:-}" ]; then
              echo "Kora Enterprise payment secrets must be configured together." >&2
              exit 1
            fi
            put_secret KORA_PUBLIC_KEY "$KORA_PUBLIC_KEY"
            put_secret KORA_SECRET_KEY "$KORA_SECRET_KEY"
          fi
          if [ -n "${MKETY_DOMAIN_RELAY_URL:-}" ] || [ -n "${MKETY_DOMAIN_RELAY_SECRET:-}" ]; then
            if [ -z "${MKETY_DOMAIN_RELAY_URL:-}" ] || [ -z "${MKETY_DOMAIN_RELAY_SECRET:-}" ]; then
              echo "MKETY_DOMAIN_RELAY_URL and MKETY_DOMAIN_RELAY_SECRET must be configured together." >&2
              exit 1
            fi
            put_secret MKETY_DOMAIN_RELAY_URL "$MKETY_DOMAIN_RELAY_URL"
            put_secret MKETY_DOMAIN_RELAY_SECRET "$MKETY_DOMAIN_RELAY_SECRET"
          fi
          if [ "$WRITE_SESSION_SECRET" = true ]; then
            put_secret MKETY_AUTH_SESSION_SECRET "$SESSION_SECRET"
          fi
          printf '%s' '{"DATABASE_URL":null}' | pnpm exec wrangler secret bulk --name "$APP_WORKER_NAME" >/dev/null

      - name: Smoke dedicated Worker before DNS mutation
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          set -euo pipefail
          # Before the Custom Domain is attached, the Worker is running under a
          # workers.dev hostname. Host-bound auth behavior is therefore not a
          # valid production assertion yet. Prove the deployed Worker is alive
          # and serving the app bundle here; the next live-host step validates
          # the exact app.mkety.com /app -> /login -> ZITADEL handoff.
          code="$(curl -sS --connect-timeout 10 --max-time 30 -o /dev/null -w '%{http_code}' "$PREVIEW_URL/login" || true)"
          if [ "$code" -lt 200 ] || [ "$code" -ge 500 ]; then
            echo "Dedicated app Worker preview is not reachable (HTTP $code)." >&2
            exit 1
          fi

      - name: Back up app.mkety.com DNS and Custom Domain state
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          zones="$(curl -fsS "${auth[@]}" "$api/zones?name=mkety.com&status=active")"
          zone_id="$(ZONES="$zones" node -e "const p=JSON.parse(process.env.ZONES||'{}');if(!p.success||!Array.isArray(p.result)||p.result.length!==1)process.exit(1);process.stdout.write(p.result[0].id)")"
          echo "zone_id=$zone_id" >> "$GITHUB_OUTPUT"
          curl -fsS "${auth[@]}" "$api/zones/$zone_id/dns_records?name=app.mkety.com" >/tmp/app-dns-before.json
          curl -fsS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" >/tmp/app-domains-before.json
          preexisting_service="$(DOMAINS="$(cat /tmp/app-domains-before.json)" node -e "const p=JSON.parse(process.env.DOMAINS||'{}');const d=(p.result||[]).find(x=>x.hostname==='app.mkety.com');process.stdout.write(d?.service||'')")"
          if [ -n "$preexisting_service" ]; then
            echo "preexisting_bound=true" >> "$GITHUB_OUTPUT"
            echo "preexisting_service=$preexisting_service" >> "$GITHUB_OUTPUT"
          else
            echo "preexisting_bound=false" >> "$GITHUB_OUTPUT"
            echo "preexisting_service=" >> "$GITHUB_OUTPUT"
          fi

      - name: Replace bad app DNS with dedicated Worker Custom Domain
        id: bind
        env:
          ZONE_ID: ${{ steps.snapshot.outputs.zone_id }}
          PREEXISTING_BOUND: ${{ steps.snapshot.outputs.preexisting_bound }}
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')

          restore() {
            set +e
            if [ "$PREEXISTING_BOUND" = "true" ]; then
              echo 'Preserving pre-existing app.mkety.com Worker Custom Domain during rollback.'
              return 0
            fi
            domains="$(curl -sS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains")"
            app_id="$(DOMAINS="$domains" WORKER="$APP_WORKER_NAME" node -e "const p=JSON.parse(process.env.DOMAINS||'{}');const d=(p.result||[]).find(x=>x.hostname==='app.mkety.com'&&x.service===process.env.WORKER);process.stdout.write(d?.id||'')")"
            [ -z "$app_id" ] || curl -sS -X DELETE "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains/$app_id" >/dev/null || true

            current="$(curl -sS "${auth[@]}" "$api/zones/$ZONE_ID/dns_records?name=app.mkety.com")"
            CURRENT="$current" node -e "const p=JSON.parse(process.env.CURRENT||'{}');for(const r of p.result||[]) console.log(r.id)" | while read -r id; do
              [ -z "$id" ] || curl -sS -X DELETE "${auth[@]}" "$api/zones/$ZONE_ID/dns_records/$id" >/dev/null || true
            done

            DNS_BACKUP="$(cat /tmp/app-dns-before.json)" ZONE_ID="$ZONE_ID" CLOUDFLARE_API_TOKEN="$CLOUDFLARE_API_TOKEN" node <<'NODE'
          const {execFileSync}=require('child_process');
          const backup=JSON.parse(process.env.DNS_BACKUP||'{}');
          for(const r of backup.result||[]){
            if(!['A','AAAA','CNAME'].includes(r.type)) continue;
            const body=JSON.stringify({type:r.type,name:r.name,content:r.content,ttl:r.ttl||1,proxied:Boolean(r.proxied)});
            execFileSync('curl',['-fsS','-X','POST','-H','Authorization: Bearer '+process.env.CLOUDFLARE_API_TOKEN,'-H','Content-Type: application/json','--data',body,'https://api.cloudflare.com/client/v4/zones/'+process.env.ZONE_ID+'/dns_records'],{stdio:'ignore'});
          }
          NODE
          }
          trap 'status=$?; restore; exit "$status"' ERR

          domains="$(curl -fsS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains")"
          conflict="$(DOMAINS="$domains" node -e "const p=JSON.parse(process.env.DOMAINS||'{}');const d=(p.result||[]).find(x=>x.hostname==='app.mkety.com');if(d)process.stdout.write(JSON.stringify(d))")"
          if [ -n "$conflict" ]; then
            owner="$(ROW="$conflict" node -e "process.stdout.write(JSON.parse(process.env.ROW).service||'')")"
            [ "$owner" = "$APP_WORKER_NAME" ] || { echo "app.mkety.com already belongs to another Worker: $owner" >&2; false; }
          else
            current="$(curl -fsS "${auth[@]}" "$api/zones/$ZONE_ID/dns_records?name=app.mkety.com")"
            CURRENT="$current" node -e "const p=JSON.parse(process.env.CURRENT||'{}');for(const r of p.result||[]) if(['A','AAAA','CNAME'].includes(r.type)) console.log(r.id)" | while read -r id; do
              [ -z "$id" ] || curl -fsS -X DELETE "${auth[@]}" "$api/zones/$ZONE_ID/dns_records/$id" >/dev/null
            done
            body="$(ZONE_ID="$ZONE_ID" WORKER="$APP_WORKER_NAME" node -e "process.stdout.write(JSON.stringify({hostname:'app.mkety.com',service:process.env.WORKER,zone_id:process.env.ZONE_ID,zone_name:'mkety.com'}))")"
            response="$(curl -fsS -X PUT "${auth[@]}" --data "$body" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains")"
            RESPONSE="$response" node -e "const p=JSON.parse(process.env.RESPONSE||'{}');if(!p.success||!p.result?.id)process.exit(1)"
          fi

          trap - ERR
          echo "bound=true" >> "$GITHUB_OUTPUT"

      - name: Verify live app host and branded auth handoff
        env:
          ZONE_ID: ${{ steps.snapshot.outputs.zone_id }}
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 60); do
            root_headers=/tmp/app-live-root.headers
            root_code="$(curl -sS --connect-timeout 10 --max-time 25 -D "$root_headers" -o /dev/null -w '%{http_code}' 'https://app.mkety.com/' || true)"
            root_location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$root_headers")"
            if [ "$root_code" -ge 300 ] 2>/dev/null && [ "$root_code" -lt 400 ] 2>/dev/null; then
              if ROOT_LOCATION="$root_location" node -e "const u=new URL(process.env.ROOT_LOCATION,'https://app.mkety.com/');if(u.origin!=='https://app.mkety.com'||u.pathname!=='/app')process.exit(1)"; then
                ready=1
                break
              fi
            fi
            sleep 5
          done
          [ "$ready" = 1 ] || { echo "app.mkety.com did not become ready." >&2; exit 1; }

          app_headers=/tmp/app-live-entry.headers
          app_code="$(curl -sS --connect-timeout 10 --max-time 25 -D "$app_headers" -o /dev/null -w '%{http_code}' 'https://app.mkety.com/app')"
          app_location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$app_headers")"
          if [ "$app_code" -lt 300 ] || [ "$app_code" -ge 400 ] || [ -z "$app_location" ]; then
            echo "Unauthenticated /app did not redirect." >&2
            exit 1
          fi
          APP_LOCATION="$app_location" node -e "const u=new URL(process.env.APP_LOCATION,'https://app.mkety.com/app');if(u.origin!=='https://app.mkety.com'||u.pathname!=='/login')process.exit(1)"

          auth_headers=/tmp/app-live-auth.headers
          auth_code="$(curl -sS --connect-timeout 10 --max-time 30 -D "$auth_headers" -o /dev/null -w '%{http_code}' 'https://app.mkety.com/api/auth/login?returnTo=/app&intent=signin')"
          auth_location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$auth_headers")"
          if [ "$auth_code" -lt 300 ] || [ "$auth_code" -ge 400 ] || [ -z "$auth_location" ]; then
            echo "Auth first hop did not redirect." >&2
            exit 1
          fi
          AUTH_LOCATION="$auth_location" node -e "const u=new URL(process.env.AUTH_LOCATION);if(u.origin!=='https://auth.mkety.com'||!u.pathname.startsWith('/ui/v2/login/'))process.exit(1)"

      - name: Disable dedicated Worker preview exposure
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          response="$(curl -fsS -X DELETE "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$APP_WORKER_NAME/subdomain")"
          RESPONSE="$response" node - <<'NODE'
          const p=JSON.parse(process.env.RESPONSE||'{}');
          if(!p.success||p.result?.enabled!==false||p.result?.previews_enabled!==false){
            throw new Error('Cloudflare did not confirm workers.dev and preview URLs are disabled.');
          }
          NODE

      - name: Roll back app host binding if post-binding acceptance failed
        if: failure() && steps.bind.outputs.bound == 'true'
        env:
          ZONE_ID: ${{ steps.snapshot.outputs.zone_id }}
          PREEXISTING_BOUND: ${{ steps.snapshot.outputs.preexisting_bound }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PREEXISTING_BOUND" = "true" ]; then
            echo 'Post-binding acceptance failed, but app.mkety.com was already bound before this run; preserving the pre-existing binding.'
            exit 0
          fi
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')

          domains="$(curl -fsS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains")"
          app_id="$(DOMAINS="$domains" WORKER="$APP_WORKER_NAME" node -e "const p=JSON.parse(process.env.DOMAINS||'{}');const d=(p.result||[]).find(x=>x.hostname==='app.mkety.com'&&x.service===process.env.WORKER);process.stdout.write(d?.id||'')")"
          if [ -n "$app_id" ]; then
            curl -fsS -X DELETE "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains/$app_id" >/dev/null
          fi

          current="$(curl -fsS "${auth[@]}" "$api/zones/$ZONE_ID/dns_records?name=app.mkety.com")"
          CURRENT="$current" node -e "const p=JSON.parse(process.env.CURRENT||'{}');for(const r of p.result||[]) console.log(r.id)" | while read -r id; do
            [ -z "$id" ] || curl -fsS -X DELETE "${auth[@]}" "$api/zones/$ZONE_ID/dns_records/$id" >/dev/null
          done

          DNS_BACKUP="$(cat /tmp/app-dns-before.json)" ZONE_ID="$ZONE_ID" CLOUDFLARE_API_TOKEN="$CLOUDFLARE_API_TOKEN" node <<'NODE'
          const {execFileSync}=require('child_process');
          const backup=JSON.parse(process.env.DNS_BACKUP||'{}');
          for(const r of backup.result||[]){
            if(!['A','AAAA','CNAME'].includes(r.type)) continue;
            const body=JSON.stringify({type:r.type,name:r.name,content:r.content,ttl:r.ttl||1,proxied:Boolean(r.proxied)});
            execFileSync('curl',['-fsS','-X','POST','-H','Authorization: Bearer '+process.env.CLOUDFLARE_API_TOKEN,'-H','Content-Type: application/json','--data',body,'https://api.cloudflare.com/client/v4/zones/'+process.env.ZONE_ID+'/dns_records'],{stdio:'ignore'});
          }
          NODE
          echo 'Post-binding acceptance failed; restored the pre-repair app.mkety.com DNS state.'

      - name: Publish repair evidence
        shell: bash
        run: |
          {
            echo '## app.mkety.com production repair'
            echo
            echo "- Exact production SHA: \`${TARGET_SHA}\`"
            echo "- Dedicated Worker: \`mkety-app-host\`"
            echo '- Public mkety.com/www Worker: unchanged'
            echo '- Production DB: existing MKETY_DB Hyperdrive'
            echo '- ZITADEL callback/logout: app.mkety.com reconciled non-destructively'
            echo '- app.mkety.com Worker Custom Domain: verified/preserved'
            echo '- Live root/app/auth handoff: verified'
          } >> "$GITHUB_STEP_SUMMARY"
