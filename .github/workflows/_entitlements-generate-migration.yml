name: Entitlements Migration Generation

on:
  push:
    branches:
      - feat/mkety-entitlements-core
    paths:
      - 'src/shared/db/schema/**'
      - '.github/workflows/_entitlements-generate-migration.yml'

permissions:
  contents: write

concurrency:
  group: entitlements-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate Entitlements Drizzle migration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SKIP_ENV_VALIDATION: 'true'
      DATABASE_URL: postgresql://localhost/placeholder

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Drizzle migration
        run: pnpm db:generate

      - name: Commit exact generated migration state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shared/db/migrations/0012_*.sql src/shared/db/migrations/meta/0012_snapshot.json src/shared/db/migrations/meta/_journal.json
          git diff --cached --stat
          git diff --cached --quiet && { echo "No generated migration changes found"; exit 1; }
          git commit -m "feat: generate Entitlements migration"
          git push
