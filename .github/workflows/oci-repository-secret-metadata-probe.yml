name: OCI Repository Secret Metadata Probe

on:
  push:
    branches:
      - fix/oci-mail-ingress-20260929
    paths:
      - '.github/workflows/oci-repository-secret-metadata-probe.yml'

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    env:
      GH_ADMIN_TOKEN: ${{ secrets.DANGER_GITHUB_API_TOKEN }}
    steps:
      - name: List OCI-related repository secret names only
        shell: bash
        run: |
          set -euo pipefail
          [ -n "$GH_ADMIN_TOKEN" ] || { echo 'DANGER_GITHUB_API_TOKEN=MISSING'; exit 1; }
          code="$(curl -sS -o /tmp/secrets.json -w '%{http_code}'             -H "Authorization: Bearer $GH_ADMIN_TOKEN"             -H 'Accept: application/vnd.github+json'             -H 'X-GitHub-Api-Version: 2022-11-28'             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/secrets?per_page=100")"
          echo "SECRET_METADATA_HTTP=$code"
          [ "$code" = 200 ] || exit 1
          node <<'NODE'
          const fs=require('node:fs');
          const x=JSON.parse(fs.readFileSync('/tmp/secrets.json','utf8'));
          const names=(x.secrets||[]).map(s=>String(s.name||'')).filter(Boolean).sort();
          const relevant=names.filter(n=>/(OCI|ORACLE)/i.test(n));
          console.log('OCI_SECRET_NAME_COUNT='+relevant.length);
          for(const name of relevant) console.log(name);
          NODE
