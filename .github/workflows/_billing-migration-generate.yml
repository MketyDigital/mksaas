name: Billing Migration Generate

on:
  push:
    branches:
      - feat/mkety-billing-core-foundation

permissions:
  contents: write

jobs:
  generate:
    if: "${{ !contains(github.event.head_commit.message, 'chore: generate billing core migration') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Assert pre-Billing migration tail
        run: |
          test -f src/shared/db/migrations/0010_automation_webhook_trigger.sql
          test ! -e src/shared/db/migrations/0011_billing_core_foundation.sql
          node - <<'NODE'
          const journal = require('./src/shared/db/migrations/meta/_journal.json');
          const tags = journal.entries.map((entry) => entry.tag);
          if (tags.at(-2) !== '0009_mkety_auth' || tags.at(-1) !== '0010_automation_webhook_trigger') {
            throw new Error(`Unexpected migration tail: ${tags.slice(-3).join(' -> ')}`);
          }
          NODE

      - name: Generate Billing migration
        run: pnpm db:generate --name=billing_core_foundation

      - name: Assert exactly one Billing migration was generated
        run: |
          test -f src/shared/db/migrations/0011_billing_core_foundation.sql
          count="$(find src/shared/db/migrations -maxdepth 1 -type f -name '0011_*.sql' | wc -l | tr -d ' ')"
          test "$count" = "1"
          test -f src/shared/db/migrations/meta/0011_snapshot.json
          node - <<'NODE'
          const journal = require('./src/shared/db/migrations/meta/_journal.json');
          const tags = journal.entries.map((entry) => entry.tag);
          if (tags.at(-1) !== '0011_billing_core_foundation') {
            throw new Error(`Unexpected generated migration tail: ${tags.slice(-3).join(' -> ')}`);
          }
          NODE

      - name: Reject unrelated destructive SQL
        run: |
          if grep -Eiq 'DROP TABLE|DROP COLUMN|TRUNCATE|ALTER TABLE .* DROP|RENAME TO' src/shared/db/migrations/0011_billing_core_foundation.sql; then
            echo 'Unexpected destructive SQL in Billing migration.' >&2
            cat src/shared/db/migrations/0011_billing_core_foundation.sql >&2
            exit 1
          fi
          grep -q 'billing_plans' src/shared/db/migrations/0011_billing_core_foundation.sql
          grep -q 'billing_subscriptions' src/shared/db/migrations/0011_billing_core_foundation.sql
          grep -q 'billing_settlements' src/shared/db/migrations/0011_billing_core_foundation.sql
          grep -q 'billing_ledger_entries' src/shared/db/migrations/0011_billing_core_foundation.sql

      - name: Verify migration baseline and Drizzle metadata
        run: |
          pnpm db:check:migrations
          pnpm exec drizzle-kit check

      - name: Prove forward generation is a no-op
        run: |
          before="$(git status --porcelain --untracked-files=all src/shared/db/migrations)"
          pnpm db:generate --name=forward_probe
          after="$(git status --porcelain --untracked-files=all src/shared/db/migrations)"
          test "$before" = "$after"
          test ! -e src/shared/db/migrations/0012_forward_probe.sql

      - name: Commit generated migration metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f src/shared/db/migrations/0011_billing_core_foundation.sql src/shared/db/migrations/meta/_journal.json src/shared/db/migrations/meta/0011_snapshot.json
          staged="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            'src/shared/db/migrations/0011_billing_core_foundation.sql' \
            'src/shared/db/migrations/meta/0011_snapshot.json' \
            'src/shared/db/migrations/meta/_journal.json' | sort)"
          test "$staged" = "$expected" || {
            echo 'Unexpected staged Billing migration file set:' >&2
            printf '%s\n' "$staged" >&2
            exit 1
          }
          HUSKY=0 git commit -m 'chore: generate billing core migration'
          git push origin HEAD:feat/mkety-billing-core-foundation
