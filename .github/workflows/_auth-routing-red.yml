name: Auth routing GREEN

on:
  push:
    branches:
      - feat/mkety-auth-zitadel-vinext

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify both DB-backed tenant routing regressions
        run: pnpm exec jest --runInBand --detectOpenHandles --runTestsByPath 'src/app/team/page.test.ts' 'src/app/(auth)/select-tenant/page.test.ts'
