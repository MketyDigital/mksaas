name: Mkety Coolify Production DB Executor

on:
  workflow_dispatch:
    inputs:
      verified_sha:
        description: Exact Git SHA to migrate
        required: false
        type: string
  push:
    branches:
      - fix/production-db-private-runner
    paths:
      - '.github/workflows/mkety-coolify-production-db-executor.yml'
      - 'ops/coolify-migration/Dockerfile'

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      COOLIFY_URL: https://deploy.mkety.com
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      PROJECT_UUID: 0zqhpkprlhtvlacmsgmfyyhs
      ENVIRONMENT_UUID: rtebcetyfvzlaiqitzcp0gl8
      SERVER_UUID: ynkdc4tx6bi7cyxf0kuy8kte
      RELEASE_BRANCH: feat/mkety-public-site-production
      TARGET_SHA: ${{ inputs.verified_sha || github.sha }}

    steps:
      - name: Validate inputs and secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'verified_sha must be an exact 40-character Git SHA.'; exit 1; }
          [ -n "${COOLIFY_API_TOKEN:-}" ] || { echo 'COOLIFY_TOKEN is required.'; exit 1; }
          [ -n "${DATABASE_URL:-}" ] || { echo 'PRODUCTION_DATABASE_URL is required.'; exit 1; }
          curl --proto '=https' --tlsv1.2 -fsS "${COOLIFY_URL%/}/api/v1/health" >/dev/null

      - name: Create exact-SHA isolated task host
        id: app
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' >/tmp/create-app.json
          process.stdout.write(JSON.stringify({
            project_uuid:process.env.PROJECT_UUID,
            server_uuid:process.env.SERVER_UUID,
            environment_uuid:process.env.ENVIRONMENT_UUID,
            git_repository:'https://github.com/MketyDigital/mksaas',
            git_branch:process.env.RELEASE_BRANCH,
            git_commit_sha:process.env.TARGET_SHA,
            build_pack:'dockerfile',
            dockerfile_location:'/ops/coolify-migration/Dockerfile',
            ports_exposes:'3000',
            name:`mkety-db-migrate-${process.env.TARGET_SHA.slice(0,12)}`,
            description:`Ephemeral exact-SHA production DB task host for ${process.env.TARGET_SHA}`,
            autogenerate_domain:false,
            connect_to_docker_network:true,
            instant_deploy:false
          }));
          NODE
          base="${COOLIFY_URL%/}/api/v1"
          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/create-response.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @/tmp/create-app.json "$base/applications/public")"
          [ "$code" = '201' ] || { echo "Coolify task host creation failed with HTTP $code."; cat /tmp/create-response.json; exit 2; }
          app_uuid="$(node -e "const x=require('/tmp/create-response.json'); if(!x.uuid) process.exit(1); process.stdout.write(x.uuid)")"
          echo "app_uuid=$app_uuid" >> "$GITHUB_OUTPUT"

      - name: Inject private database URL
        shell: bash
        env:
          APP_UUID: ${{ steps.app.outputs.app_uuid }}
        run: |
          set -euo pipefail
          base="${COOLIFY_URL%/}/api/v1"
          DB="$DATABASE_URL" node <<'NODE' >/tmp/db-env.json
          process.stdout.write(JSON.stringify({key:'DATABASE_URL',value:process.env.DB,is_preview:false,is_literal:true,is_multiline:false,is_shown_once:true}));
          NODE
          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/env-response.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @/tmp/db-env.json "$base/applications/$APP_UUID/envs")"
          [ "$code" = '201' ] || { echo "Adding migration database secret failed with HTTP $code."; exit 3; }

      - name: Deploy and wait for healthy task host
        id: deploy
        shell: bash
        env:
          APP_UUID: ${{ steps.app.outputs.app_uuid }}
        run: |
          set -euo pipefail
          base="${COOLIFY_URL%/}/api/v1"
          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/start.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $COOLIFY_API_TOKEN" "$base/applications/$APP_UUID/start?force=true&instant_deploy=true")"
          [ "$code" = '200' ] || { echo "Starting migration task host failed with HTTP $code."; exit 4; }
          deployment_uuid="$(node -e "const x=require('/tmp/start.json'); if(!x.deployment_uuid) process.exit(1); process.stdout.write(x.deployment_uuid)")"
          echo "deployment_uuid=$deployment_uuid" >> "$GITHUB_OUTPUT"

          deployment_done='no'
          for i in $(seq 1 120); do
            curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" "$base/deployments/$deployment_uuid" -o /tmp/deployment.json
            deployment_status="$(node -e "const x=require('/tmp/deployment.json'); process.stdout.write(String(x.status||''))")"
            case "${deployment_status,,}" in
              finished|success|successful|succeeded|completed) deployment_done='yes'; break ;;
              failed|failure|error|cancelled|canceled) echo "Migration task-host deployment failed: $deployment_status"; exit 5 ;;
            esac
            sleep 5
          done
          [ "$deployment_done" = 'yes' ] || { echo 'Timed out waiting for Coolify task-host deployment.'; exit 6; }

          ready='no'
          for i in $(seq 1 30); do
            curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" "$base/applications/$APP_UUID" -o /tmp/app.json
            status="$(node -e "const x=require('/tmp/app.json'); process.stdout.write(String(x.status||''))")"
            case "${status,,}" in
              running:healthy|running:unknown|running) ready='yes'; break ;;
              exited:*|failed|error) echo "Migration task host failed after completed deployment: $status"; exit 7 ;;
            esac
            sleep 3
          done
          [ "$ready" = 'yes' ] || { echo 'Timed out waiting for migration task host health.'; exit 8; }
          echo "Migration task host is running at exact SHA $TARGET_SHA."

      - name: Create and execute one-off migration task
        id: task
        shell: bash
        env:
          APP_UUID: ${{ steps.app.outputs.app_uuid }}
        run: |
          set -euo pipefail
          base="${COOLIFY_URL%/}/api/v1"
          cat >/tmp/task.json <<'JSON'
          {
            "name": "mkety-production-db-release-migration",
            "command": "pnpm db:migrate && pnpm db:migrate:mkety-content && pnpm db:seed:mkety-content && pnpm db:smoke:mkety-content",
            "frequency": "0 0 1 1 *",
            "timeout": 1800,
            "enabled": true
          }
          JSON
          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/task-create.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @/tmp/task.json "$base/applications/$APP_UUID/scheduled-tasks")"
          [ "$code" = '201' ] || { echo "Creating migration task failed with HTTP $code."; cat /tmp/task-create.json; exit 9; }
          task_uuid="$(node -e "const x=require('/tmp/task-create.json'); if(!x.uuid) process.exit(1); process.stdout.write(x.uuid)")"
          echo "task_uuid=$task_uuid" >> "$GITHUB_OUTPUT"
          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/task-execute.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            "$base/applications/$APP_UUID/scheduled-tasks/$task_uuid/execute")"
          [ "$code" = '200' ] || { echo "Executing migration task failed with HTTP $code."; cat /tmp/task-execute.json; exit 10; }
          echo 'Production migration task queued inside private Coolify network.'

      - name: Verify one-off migration execution
        shell: bash
        env:
          APP_UUID: ${{ steps.app.outputs.app_uuid }}
          TASK_UUID: ${{ steps.task.outputs.task_uuid }}
        run: |
          set -euo pipefail
          base="${COOLIFY_URL%/}/api/v1"
          found='no'
          for i in $(seq 1 180); do
            curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
              "$base/applications/$APP_UUID/scheduled-tasks/$TASK_UUID/executions" -o /tmp/executions.json
            read -r status duration <<<"$(node -e "const x=require('/tmp/executions.json'); const a=Array.isArray(x)?x:(x.data||[]); const e=a[0]||{}; process.stdout.write([String(e.status||''),String(e.duration||0)].join(' '))")"
            case "${status,,}" in
              success|successful|succeeded|completed)
                found='yes'
                echo "Production DB migration task succeeded (duration=${duration}s) for $TARGET_SHA."
                break
                ;;
              failed|failure|error)
                echo 'Production DB migration task failed inside Coolify.'
                exit 11
                ;;
            esac
            sleep 5
          done
          [ "$found" = 'yes' ] || { echo 'Timed out waiting for production DB migration task.'; exit 12; }

      - name: Delete ephemeral migration task host
        if: always() && steps.app.outputs.app_uuid != ''
        shell: bash
        env:
          APP_UUID: ${{ steps.app.outputs.app_uuid }}
        run: |
          set +e
          curl --proto '=https' --tlsv1.2 -sS -X DELETE -H "Authorization: Bearer $COOLIFY_API_TOKEN" "${COOLIFY_URL%/}/api/v1/applications/$APP_UUID" >/dev/null
          echo 'Ephemeral migration task host cleanup requested.'
