name: Mkety Coolify Production DB Executor

on:
  workflow_dispatch:
    inputs:
      verified_sha:
        description: Exact Git SHA to migrate
        required: true
        type: string

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      COOLIFY_URL: https://deploy.mkety.com
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      PROJECT_UUID: 0zqhpkprlhtvlacmsgmfyyhs
      ENVIRONMENT_UUID: rtebcetyfvzlaiqitzcp0gl8
      SERVER_UUID: ynkdc4tx6bi7cyxf0kuy8kte
      RELEASE_BRANCH: feat/mkety-public-site-production

    steps:
      - name: Validate inputs and secrets
        shell: bash
        env:
          VERIFIED_SHA: ${{ inputs.verified_sha }}
        run: |
          set -euo pipefail
          [[ "$VERIFIED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'verified_sha must be an exact 40-character Git SHA.'; exit 1; }
          [ -n "${COOLIFY_API_TOKEN:-}" ] || { echo 'COOLIFY_TOKEN is required.'; exit 1; }
          [ -n "${DATABASE_URL:-}" ] || { echo 'PRODUCTION_DATABASE_URL is required.'; exit 1; }
          curl --proto '=https' --tlsv1.2 -fsS "${COOLIFY_URL%/}/api/v1/health" >/dev/null

      - name: Create isolated no-domain migration application
        id: app
        shell: bash
        env:
          VERIFIED_SHA: ${{ inputs.verified_sha }}
        run: |
          set -euo pipefail
          node <<'NODE' >/tmp/create-app.json
          process.stdout.write(JSON.stringify({
            project_uuid:process.env.PROJECT_UUID,
            server_uuid:process.env.SERVER_UUID,
            environment_uuid:process.env.ENVIRONMENT_UUID,
            git_repository:'https://github.com/MketyDigital/mksaas',
            git_branch:process.env.RELEASE_BRANCH,
            build_pack:'dockerfile',
            dockerfile_location:'/ops/coolify-migration/Dockerfile',
            name:`mkety-db-migrate-${process.env.VERIFIED_SHA.slice(0,12)}`,
            description:`Ephemeral exact-SHA production DB migration executor for ${process.env.VERIFIED_SHA}`,
            autogenerate_domain:false,
            connect_to_docker_network:true,
            instant_deploy:false
          }));
          NODE
          base="${COOLIFY_URL%/}/api/v1"
          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/create-response.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @/tmp/create-app.json "$base/applications/public")"
          [ "$code" = '201' ] || { echo "Coolify migration app creation failed with HTTP $code."; cat /tmp/create-response.json; exit 2; }
          app_uuid="$(node -e "const x=require('/tmp/create-response.json'); if(!x.uuid) process.exit(1); process.stdout.write(x.uuid)")"
          echo "app_uuid=$app_uuid" >> "$GITHUB_OUTPUT"

      - name: Pin exact SHA and inject private database URL
        shell: bash
        env:
          APP_UUID: ${{ steps.app.outputs.app_uuid }}
          VERIFIED_SHA: ${{ inputs.verified_sha }}
        run: |
          set -euo pipefail
          base="${COOLIFY_URL%/}/api/v1"
          printf '{"git_commit_sha":"%s","autogenerate_domain":false,"connect_to_docker_network":true}' "$VERIFIED_SHA" >/tmp/app-patch.json
          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/app-patch-response.json -w '%{http_code}' \
            -X PATCH -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @/tmp/app-patch.json "$base/applications/$APP_UUID")"
          [ "$code" = '200' ] || { echo "Pinning migration app SHA failed with HTTP $code."; exit 3; }
          DB="$DATABASE_URL" node <<'NODE' >/tmp/db-env.json
          process.stdout.write(JSON.stringify({key:'DATABASE_URL',value:process.env.DB,is_preview:false,is_literal:true,is_multiline:false,is_shown_once:true}));
          NODE
          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/env-response.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @/tmp/db-env.json "$base/applications/$APP_UUID/envs")"
          [ "$code" = '201' ] || { echo "Adding migration database secret failed with HTTP $code."; exit 4; }

      - name: Deploy migration application
        id: deploy
        shell: bash
        env:
          APP_UUID: ${{ steps.app.outputs.app_uuid }}
        run: |
          set -euo pipefail
          base="${COOLIFY_URL%/}/api/v1"
          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/start.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $COOLIFY_API_TOKEN" "$base/applications/$APP_UUID/start?force=true&instant_deploy=true")"
          [ "$code" = '200' ] || { echo "Starting migration app failed with HTTP $code."; cat /tmp/start.json; exit 5; }
          deployment_uuid="$(node -e "const x=require('/tmp/start.json'); if(!x.deployment_uuid) process.exit(1); process.stdout.write(x.deployment_uuid)")"
          echo "deployment_uuid=$deployment_uuid" >> "$GITHUB_OUTPUT"

      - name: Verify migration success marker
        shell: bash
        env:
          APP_UUID: ${{ steps.app.outputs.app_uuid }}
          DEPLOYMENT_UUID: ${{ steps.deploy.outputs.deployment_uuid }}
        run: |
          set -euo pipefail
          base="${COOLIFY_URL%/}/api/v1"
          for i in $(seq 1 120); do
            curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" "$base/deployments/$DEPLOYMENT_UUID" -o /tmp/deployment.json
            status="$(node -e "const x=require('/tmp/deployment.json'); process.stdout.write(String(x.status||''))")"
            case "${status,,}" in
              failed|failure|error|cancelled|canceled) echo "Migration deployment failed: $status"; exit 6 ;;
            esac
            code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/logs.json -w '%{http_code}' -H "Authorization: Bearer $COOLIFY_API_TOKEN" "$base/applications/$APP_UUID/logs?lines=300")"
            if [ "$code" = '200' ] && node -e "const x=require('/tmp/logs.json'); process.exit(String(x.logs||'').includes('MKETY_PRODUCTION_DB_MIGRATION_OK')?0:1)"; then
              echo 'Production DB migrations, content migrations, seed, and smoke succeeded inside Coolify.'
              exit 0
            fi
            sleep 5
          done
          echo 'Timed out waiting for migration success marker.'
          exit 7

      - name: Delete ephemeral migration application
        if: always() && steps.app.outputs.app_uuid != ''
        shell: bash
        env:
          APP_UUID: ${{ steps.app.outputs.app_uuid }}
        run: |
          set +e
          curl --proto '=https' --tlsv1.2 -sS -X DELETE -H "Authorization: Bearer $COOLIFY_API_TOKEN" "${COOLIFY_URL%/}/api/v1/applications/$APP_UUID" >/dev/null
          echo 'Ephemeral migration application cleanup requested.'
