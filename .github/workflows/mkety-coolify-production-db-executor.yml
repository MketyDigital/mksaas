name: Mkety Coolify Production DB Executor

on:
  workflow_dispatch:
    inputs:
      verified_sha:
        description: Exact Git SHA to migrate
        required: false
        type: string
  push:
    branches:
      - fix/production-db-private-runner
    paths:
      - '.github/workflows/mkety-coolify-production-db-executor.yml'
      - 'ops/coolify-migration/Dockerfile'
      - 'ops/coolify-migration/run.sh'

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      COOLIFY_URL: https://deploy.mkety.com
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      PROJECT_UUID: 0zqhpkprlhtvlacmsgmfyyhs
      ENVIRONMENT_UUID: rtebcetyfvzlaiqitzcp0gl8
      SERVER_UUID: ynkdc4tx6bi7cyxf0kuy8kte
      RELEASE_BRANCH: feat/mkety-public-site-production
      TARGET_SHA: ${{ inputs.verified_sha || github.sha }}

    steps:
      - name: Validate inputs and secrets
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'verified_sha must be an exact 40-character Git SHA.'; exit 1; }
          [ -n "${COOLIFY_API_TOKEN:-}" ] || { echo 'COOLIFY_TOKEN is required.'; exit 1; }
          [ -n "${DATABASE_URL:-}" ] || { echo 'PRODUCTION_DATABASE_URL is required.'; exit 1; }
          curl --proto '=https' --tlsv1.2 -fsS "${COOLIFY_URL%/}/api/v1/health" >/dev/null

      - name: Create exact-SHA isolated migration host
        id: app
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' >/tmp/create-app.json
          process.stdout.write(JSON.stringify({
            project_uuid:process.env.PROJECT_UUID,
            server_uuid:process.env.SERVER_UUID,
            environment_uuid:process.env.ENVIRONMENT_UUID,
            git_repository:'https://github.com/MketyDigital/mksaas',
            git_branch:process.env.RELEASE_BRANCH,
            git_commit_sha:process.env.TARGET_SHA,
            build_pack:'dockerfile',
            dockerfile_location:'/ops/coolify-migration/Dockerfile',
            ports_exposes:'3000',
            name:`mkety-db-migrate-${process.env.TARGET_SHA.slice(0,12)}`,
            description:`Ephemeral exact-SHA production DB migration host for ${process.env.TARGET_SHA}`,
            autogenerate_domain:false,
            connect_to_docker_network:true,
            instant_deploy:false
          }));
          NODE
          base="${COOLIFY_URL%/}/api/v1"
          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/create-response.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @/tmp/create-app.json "$base/applications/public")"
          [ "$code" = '201' ] || { echo "Coolify migration host creation failed with HTTP $code."; exit 2; }
          app_uuid="$(node -e "const x=require('/tmp/create-response.json'); if(!x.uuid) process.exit(1); process.stdout.write(x.uuid)")"
          echo "app_uuid=$app_uuid" >> "$GITHUB_OUTPUT"

      - name: Inject private database URL
        shell: bash
        env:
          APP_UUID: ${{ steps.app.outputs.app_uuid }}
        run: |
          set -euo pipefail
          base="${COOLIFY_URL%/}/api/v1"
          DB="$DATABASE_URL" node <<'NODE' >/tmp/db-env.json
          process.stdout.write(JSON.stringify({key:'DATABASE_URL',value:process.env.DB,is_preview:false,is_literal:true,is_multiline:false,is_shown_once:true}));
          NODE
          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/env-response.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @/tmp/db-env.json "$base/applications/$APP_UUID/envs")"
          [ "$code" = '201' ] || { echo "Adding migration database secret failed with HTTP $code."; exit 3; }

      - name: Deploy exact SHA and verify migration success
        shell: bash
        env:
          APP_UUID: ${{ steps.app.outputs.app_uuid }}
        run: |
          set -euo pipefail
          base="${COOLIFY_URL%/}/api/v1"
          diagnose_failure() {
            curl --proto '=https' --tlsv1.2 -sS -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
              "$base/applications/$APP_UUID/logs?lines=160&show_timestamps=false" -o /tmp/app-logs.json || true
            node <<'NODE'
          const fs=require('node:fs');
          let logs='';
          try { logs=String(JSON.parse(fs.readFileSync('/tmp/app-logs.json','utf8')).logs||''); } catch {}
          const stages=[...logs.matchAll(/MKETY_DB_STAGE=([a-z-]+)/g)].map(m=>m[1]);
          const oks=new Set([...logs.matchAll(/MKETY_DB_STAGE_OK=([a-z-]+)/g)].map(m=>m[1]));
          const last=stages.length?stages[stages.length-1]:'unknown';
          const completed=stages.filter(s=>oks.has(s));
          let cls='unclassified';
          if (/EAI_AGAIN|ENOTFOUND|getaddrinfo/i.test(logs)) cls='dns';
          else if (/ECONNREFUSED|ETIMEDOUT|timeout.*connect/i.test(logs)) cls='network';
          else if (/password authentication failed|authentication failed|28P01/i.test(logs)) cls='authentication';
          else if (/ssl|tls|certificate/i.test(logs)) cls='tls';
          else if (/duplicate key|unique constraint|23505/i.test(logs)) cls='constraint';
          else if (/does not exist|undefined table|undefined column|42P01|42703/i.test(logs)) cls='schema';
          else if (/permission denied|42501/i.test(logs)) cls='database-permission';
          else if (/command not found|ERR_PNPM|pnpm:/i.test(logs)) cls='runtime-command';
          console.log(`Safe migration diagnostic: last_stage=${last}; completed=${completed.join(',')||'none'}; class=${cls}`);
          NODE
          }

          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/deploy.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $COOLIFY_API_TOKEN" "$base/deploy?uuid=$APP_UUID&force=true")"
          [ "$code" = '200' ] || { echo "Deploying migration host failed with HTTP $code."; exit 4; }
          deployment_uuid="$(node -e "const x=require('/tmp/deploy.json'); const d=Array.isArray(x.deployments)?x.deployments[0]:null; if(!d?.deployment_uuid) process.exit(1); process.stdout.write(d.deployment_uuid)")"

          deployment_done='no'
          for i in $(seq 1 120); do
            curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" "$base/deployments/$deployment_uuid" -o /tmp/deployment.json
            deployment_status="$(node -e "const x=require('/tmp/deployment.json'); process.stdout.write(String(x.status||''))")"
            case "${deployment_status,,}" in
              finished|success|successful|succeeded|completed) deployment_done='yes'; break ;;
              failed|failure|error|cancelled|canceled)
                diagnose_failure
                echo "Migration-host deployment failed: $deployment_status"
                exit 5
                ;;
            esac
            sleep 5
          done
          if [ "$deployment_done" != 'yes' ]; then diagnose_failure; echo 'Timed out waiting for Coolify migration-host deployment.'; exit 6; fi

          ready='no'
          for i in $(seq 1 60); do
            curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" "$base/applications/$APP_UUID" -o /tmp/app.json
            status="$(node -e "const x=require('/tmp/app.json'); process.stdout.write(String(x.status||''))")"
            case "${status,,}" in
              running:healthy|running:unknown|running) ready='yes'; break ;;
              exited:*|failed|error)
                diagnose_failure
                echo "Production DB migration/seed/smoke failed inside Coolify: $status"
                exit 7
                ;;
            esac
            sleep 3
          done
          if [ "$ready" != 'yes' ]; then diagnose_failure; echo 'Timed out waiting for production DB migration/seed/smoke completion.'; exit 8; fi
          echo "Production DB migration, content migration, seed, and smoke succeeded for exact SHA $TARGET_SHA."

      - name: Delete ephemeral migration host
        if: always() && steps.app.outputs.app_uuid != ''
        shell: bash
        env:
          APP_UUID: ${{ steps.app.outputs.app_uuid }}
        run: |
          set +e
          curl --proto '=https' --tlsv1.2 -sS -X DELETE -H "Authorization: Bearer $COOLIFY_API_TOKEN" "${COOLIFY_URL%/}/api/v1/applications/$APP_UUID" >/dev/null
          echo 'Ephemeral migration host cleanup requested.'
