# One-time dependency regeneration for the vinext migration. No build/test/deploy runs here.
# ESM-incompatible CommonJS config/stub files must be migrated to .cjs before this workflow runs.
name: Finalize vinext dependency graph

on:
  push:
    branches:
      - feat/cloudflare-vinext-migration
    paths:
      - '.github/workflows/vinext-dependency-finalize.yml'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: feat/cloudflare-vinext-migration

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install current locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Remove legacy authentication and OpenNext packages
        run: pnpm remove next-auth @auth/drizzle-adapter @opennextjs/cloudflare

      - name: Install current vinext runtime packages
        run: pnpm add --save-exact vinext@latest @vinext/cloudflare@latest react-server-dom-webpack@latest react@latest react-dom@latest

      - name: Install current vinext Cloudflare build packages
        run: pnpm add --save-dev --save-exact vite@latest @vitejs/plugin-react@latest @vitejs/plugin-rsc@latest @cloudflare/vite-plugin@latest wrangler@latest

      - name: Upgrade Storybook for Vite 8 compatibility
        run: pnpm add --save-dev --save-exact storybook@latest @storybook/nextjs@latest @storybook/nextjs-vite@latest @storybook/react@latest

      - name: Normalize package scripts and ESM mode
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'package.json';
          const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
          pkg.type = 'module';
          pkg.scripts = {
            ...pkg.scripts,
            build: 'vinext build',
            'build:next': 'NODE_ENV=production next build',
            'dev:vinext': 'vinext dev --port 3001',
            'build:vinext': 'vinext build',
            'start:vinext': 'vinext start',
            'deploy:vinext': 'vinext-cloudflare deploy',
            'deploy:vinext:skip-build': 'vinext-cloudflare deploy --skip-build'
          };
          fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          NODE
          pnpm install --lockfile-only

      - name: Commit generated dependency graph
        run: |
          git config user.name "Mkety CI"
          git config user.email "actions@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Dependency graph already current."
            exit 0
          fi
          git commit -m "build: migrate dependency graph to vinext"
          git push origin HEAD:feat/cloudflare-vinext-migration
