name: Mkety Public AI Read-only Worker Inspection

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/mkety-public-ai-readonly-inspection.yml'

permissions:
  contents: read

jobs:
  inspect:
    if: contains(github.event.head_commit.message, '[public-ai-diagnostic]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER: mkety-platform
    steps:
      - name: Read active production Worker version metadata
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo 'Cloudflare API token is not configured.'; exit 1; }
          [[ "${CLOUDFLARE_ACCOUNT_ID:-}" =~ ^[0-9a-fA-F]{32}$ ]] || { echo 'Cloudflare account ID is malformed.'; exit 1; }
          node <<'NODE'
          const base='https://api.cloudflare.com/client/v4/accounts/'+encodeURIComponent(process.env.CLOUDFLARE_ACCOUNT_ID)+'/workers/scripts/'+encodeURIComponent(process.env.WORKER);
          const headers={authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,accept:'application/json'};
          const response=await fetch(base+'/deployments?per_page=5',{headers,signal:AbortSignal.timeout(20000)});
          if(!response.ok) throw new Error('Could not read production Worker deployment metadata.');
          const body=await response.json();
          if(body.success!==true) throw new Error('Cloudflare rejected the Worker metadata read.');
          const rows=body.result?.deployments||[];
          if(!rows.length) throw new Error('No Worker deployment metadata was returned.');
          for(const [index,deployment] of rows.entries()) {
            const active=(deployment.versions||[]).filter(v=>Number(v.percentage)>0);
            console.log(JSON.stringify({
              deployment:index+1,
              created_on:deployment.created_on||null,
              active_versions:active.map(v=>({version_id:v.version_id,percentage:Number(v.percentage)}))
            }));
          }
          const current=(rows[0].versions||[]).filter(v=>Number(v.percentage)>0);
          if(current.length!==1||Number(current[0].percentage)!==100) {
            throw new Error('The active Worker deployment is not a single 100% version.');
          }
          console.log('Read-only Worker inspection passed; no Worker, route, secret, or DNS changes were made.');
          NODE
