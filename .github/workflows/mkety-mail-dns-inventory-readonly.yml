name: Read-only Mkety Mail and ZITADEL preflight

on:
  push:
    branches:
      - codex/mail-dns-audit-20261007
    paths:
      - .github/workflows/mkety-mail-dns-inventory-readonly.yml

permissions:
  contents: read

jobs:
  mail-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ZITADEL_TOKEN: ${{ secrets.ZITADEL_MANAGEMENT_PAT }}
      ZITADEL_URL: ${{ vars.ZITADEL_URL || secrets.ZITADEL_URL }}
      ZITADEL_PROJECT_ID: ${{ secrets.ZITADEL_PROJECT_ID }}
    steps:
      - name: Inventory current Mkety mail DNS records (GET only)
        shell: bash
        run: |
          set -euo pipefail
          : "${CF_TOKEN:?CLOUDFLARE_API_TOKEN is required}"
          : "${CF_ACCOUNT_ID:?CLOUDFLARE_ACCOUNT_ID is required}"
          echo "::add-mask::$CF_TOKEN"
          echo "::add-mask::$CF_ACCOUNT_ID"
          api='https://api.cloudflare.com/client/v4'
          zones="$(curl --proto '=https' --tlsv1.2 --connect-timeout 8 --max-time 20 -fsS \
            -H "Authorization: Bearer $CF_TOKEN" \
            "$api/zones?name=mkety.com&status=active&per_page=50")"
          zone_id="$(printf '%s' "$zones" | jq -er --arg account "$CF_ACCOUNT_ID" \
            '[.result[] | select(.account.id == $account)] | if length == 1 then .[0].id else error("expected exactly one mkety.com zone in configured account") end')"
          first_page="$(curl --proto '=https' --tlsv1.2 --connect-timeout 8 --max-time 20 -fsS \
            -H "Authorization: Bearer $CF_TOKEN" \
            "$api/zones/$zone_id/dns_records?per_page=100&page=1")"
          pages="$(printf '%s' "$first_page" | jq -er '.result_info.total_pages // 1')"
          : > /tmp/mail-dns-records.ndjson
          routing_code="$(curl --proto '=https' --tlsv1.2 --connect-timeout 8 --max-time 20 -sS -o /tmp/email-routing.json -w '%{http_code}' \\
            -H "Authorization: Bearer $CF_TOKEN" \\
            "$api/zones/$zone_id/email/routing" || true)"
          page=1
          while [ "$page" -le "$pages" ]; do
            if [ "$page" -eq 1 ]; then
              response="$first_page"
            else
              response="$(curl --proto '=https' --tlsv1.2 --connect-timeout 8 --max-time 20 -fsS \
                -H "Authorization: Bearer $CF_TOKEN" \
                "$api/zones/$zone_id/dns_records?per_page=100&page=$page")"
            fi
            printf '%s' "$response" | jq -c '.result[]' >> /tmp/mail-dns-records.ndjson
            page=$((page + 1))
          done
          CF_EMAIL_ROUTING_HTTP="$routing_code" node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          const lines = fs.readFileSync('/tmp/mail-dns-records.ndjson', 'utf8').trim().split('\n').filter(Boolean);
          const records = lines.map((line) => JSON.parse(line)).filter((r) => {
            const name = String(r.name || '').toLowerCase();
            if (r.type === 'MX') return true;
            if (r.type === 'TXT' && name === 'mkety.com' && /^v=spf1\b/i.test(r.content || '')) return true;
            if (r.type === 'TXT' && name === '_dmarc.mkety.com') return true;
            if (r.type === 'TXT' && name.endsWith('._domainkey.mkety.com')) return true;
            return /^(mail|smtp|imap|autoconfig|autodiscover)\.mkety\.com$/.test(name)
              && ['A', 'AAAA', 'CNAME'].includes(r.type);
          }).map((r) => ({
            name: r.name,
            type: r.type,
            priority: r.priority ?? null,
            proxied: r.proxied ?? null,
            content: r.type === 'TXT' && String(r.name).toLowerCase().endsWith('._domainkey.mkety.com')
              ? '[DKIM key omitted; record presence shown]'
              : r.content,
          }));
          const apexSpf = records.some((r) => r.name === 'mkety.com' && r.type === 'TXT' && /^v=spf1\b/i.test(r.content || ''));
          console.log('## Read-only Cloudflare mail DNS inventory for mkety.com');
          console.log('');
          console.log('Fetched through Cloudflare API GET requests only. No DNS records were created, updated, or deleted.');
          console.log('');
          console.log(`Cloudflare Email Routing settings: HTTP ${process.env.CF_EMAIL_ROUTING_HTTP}; enabled=${routing.result?.enabled ?? 'unknown'}; status=${routing.result?.status ?? 'unknown'}`);
          console.log('');
          console.log(`Apex SPF present: ${apexSpf ? 'yes' : 'no'}`);
          console.log('');
          if (!records.length) {
            console.log('No matching MX, SPF, DKIM, DMARC, or mail-host records were found.');
          } else {
            console.log('| Name | Type | Priority | Proxied | Content |');
            console.log('| --- | --- | ---: | --- | --- |');
            for (const r of records) {
              const content = String(r.content ?? '').replaceAll('|', '\\|').replaceAll('\n', ' ');
              console.log(`| ${r.name} | ${r.type} | ${r.priority ?? ''} | ${r.proxied ?? ''} | ${content} |`);
            }
          }
          NODE
          cat "$GITHUB_STEP_SUMMARY"
          echo 'Cloudflare DNS inventory complete. Only GET requests were issued; no changes were made.'

      - name: Inspect live ZITADEL login and SMTP provider state (read-only)
        shell: bash
        run: |
          set -euo pipefail
          for name in ZITADEL_TOKEN ZITADEL_URL ZITADEL_PROJECT_ID; do
            [ -n "${!name:-}" ] || { echo "::error::Missing $name"; exit 1; }
          done
          echo "::add-mask::$ZITADEL_TOKEN"
          echo "::add-mask::$ZITADEL_PROJECT_ID"
          issuer="${ZITADEL_URL%/}"
          project="$(curl --proto '=https' --tlsv1.2 --connect-timeout 8 --max-time 20 -fsS \
            -X POST "$issuer/zitadel.project.v2.ProjectService/GetProject" \
            -H "Authorization: Bearer $ZITADEL_TOKEN" \
            -H 'Connect-Protocol-Version: 1' -H 'Content-Type: application/json' \
            --data "{\"projectId\":\"$ZITADEL_PROJECT_ID\"}")"
          org_id="$(PROJECT="$project" node -e "const x=JSON.parse(process.env.PROJECT||'{}');if(!x.project?.organizationId)process.exit(1);process.stdout.write(x.project.organizationId)")"
          echo "::add-mask::$org_id"
          login="$(curl --proto '=https' --tlsv1.2 --connect-timeout 8 --max-time 20 -fsS \
            "$issuer/v2/settings/login?ctx.orgId=$org_id" -H "Authorization: Bearer $ZITADEL_TOKEN")"
          policy="$(curl --proto '=https' --tlsv1.2 --connect-timeout 8 --max-time 20 -fsS \
            "$issuer/management/v1/policies/login" -H "Authorization: Bearer $ZITADEL_TOKEN" -H "x-zitadel-orgid: $org_id")"
          email_code="$(curl --proto '=https' --tlsv1.2 --connect-timeout 8 --max-time 20 -sS -o /tmp/zitadel-email.json -w '%{http_code}' \
            "$issuer/admin/v1/email" -H "Authorization: Bearer $ZITADEL_TOKEN" -H 'Accept: application/json' || true)"
          smtp_code="$(curl --proto '=https' --tlsv1.2 --connect-timeout 8 --max-time 20 -sS -o /tmp/zitadel-smtp.json -w '%{http_code}' \
            "$issuer/admin/v1/smtp" -H "Authorization: Bearer $ZITADEL_TOKEN" -H 'Accept: application/json' || true)"
          LOGIN="$login" POLICY="$policy" EMAIL_CODE="$email_code" SMTP_CODE="$smtp_code" node <<'NODE' | tee -a "$GITHUB_STEP_SUMMARY"
          const fs = require('node:fs');
          const login = JSON.parse(process.env.LOGIN || '{}').settings || {};
          const policyResponse = JSON.parse(process.env.POLICY || '{}');
          const policy = policyResponse.policy || {};
          let email = {}; let legacy = {};
          try { email = JSON.parse(fs.readFileSync('/tmp/zitadel-email.json', 'utf8') || '{}'); } catch {}
          try { legacy = JSON.parse(fs.readFileSync('/tmp/zitadel-smtp.json', 'utf8') || '{}'); } catch {}
          const cfg = email.config || {};
          const smtp = cfg.smtp || legacy.smtpConfig || {};
          const safe = {
            login: {
              allowRegister: policy.allowRegister ?? login.allowRegister ?? null,
              allowUsernamePassword: policy.allowUsernamePassword ?? login.allowUsernamePassword ?? null,
              allowLocalAuthentication: login.allowLocalAuthentication ?? null,
            },
            emailProvider: {
              modernEndpointHttp: process.env.EMAIL_CODE,
              legacyEndpointHttp: process.env.SMTP_CODE,
              state: cfg.state || smtp.state || null,
              kind: cfg.smtp ? 'smtp' : cfg.http ? 'http' : legacy.smtpConfig ? 'legacy-smtp' : 'unknown',
              description: cfg.description || smtp.description || null,
              host: smtp.host || null,
              senderAddress: smtp.senderAddress || null,
              tls: typeof smtp.tls === 'boolean' ? smtp.tls : null,
              userConfigured: Boolean(smtp.user),
              passwordReturned: Boolean(smtp.password),
            },
          };
          console.log('');
          console.log('## Read-only ZITADEL Mail provider state');
          console.log('');
          console.log('Only read operations were issued. SMTP passwords are never output.');
          console.log('');
          console.log('```json');
          console.log(JSON.stringify(safe, null, 2));
          console.log('```');
          NODE
