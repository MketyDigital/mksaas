name: Mkety Cloudflare Environment Scope Diagnostic

on:
  push:
    branches:
      - ops/precutover-diagnostics-20260913
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Diagnose staging Cloudflare scope safely
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]
          token_fp="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -c1-12)"
          account_fp="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | sha256sum | cut -c1-12)"
          response="$(curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Accept: application/json' "https://api.cloudflare.com/client/v4/zones?name=mkety.com&account.id=$CLOUDFLARE_ACCOUNT_ID&status=active&per_page=50")"
          RESPONSE="$response" node <<'NODE'
          const p=JSON.parse(process.env.RESPONSE||'{}');
          if(p.success!==true || !Array.isArray(p.result)) throw new Error('Staging zone lookup failed.');
          console.log(`MKETY_CF_STAGING_ZONE_COUNT=${p.result.length}`);
          NODE
          echo "MKETY_CF_STAGING_TOKEN_FP=$token_fp"
          echo "MKETY_CF_STAGING_ACCOUNT_FP=$account_fp"

  production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Diagnose production Cloudflare scope safely
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]
          token_fp="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -c1-12)"
          account_fp="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | sha256sum | cut -c1-12)"
          response="$(curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Accept: application/json' "https://api.cloudflare.com/client/v4/zones?name=mkety.com&account.id=$CLOUDFLARE_ACCOUNT_ID&status=active&per_page=50")"
          RESPONSE="$response" node <<'NODE'
          const p=JSON.parse(process.env.RESPONSE||'{}');
          if(p.success!==true || !Array.isArray(p.result)) throw new Error('Production zone lookup failed.');
          console.log(`MKETY_CF_PRODUCTION_ZONE_COUNT=${p.result.length}`);
          NODE
          echo "MKETY_CF_PRODUCTION_TOKEN_FP=$token_fp"
          echo "MKETY_CF_PRODUCTION_ACCOUNT_FP=$account_fp"
