name: Mkety Candidate Certification Launcher

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/mkety-certify-candidate-launcher.yml'

permissions:
  actions: write
  contents: read

env:
  CANDIDATE_SHA: a250ce1ceb24dc39be9b8b6da67a5a881b31cf45
  CERT_BRANCH: certify/a250ce1

jobs:
  dispatch:
    name: Dispatch exact candidate certification workflows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify certification branch and dispatch gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          encoded_branch="$(node -e "process.stdout.write(encodeURIComponent(process.env.CERT_BRANCH))")"
          branch="$(curl -fsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/branches/$encoded_branch")"
          BRANCH="$branch" node <<'NODE'
          const payload = JSON.parse(process.env.BRANCH || '{}');
          if (payload?.commit?.sha !== process.env.CANDIDATE_SHA) {
            throw new Error(`Certification branch mismatch: expected ${process.env.CANDIDATE_SHA}, got ${payload?.commit?.sha || 'unknown'}`);
          }
          console.log(`Certification branch pinned to exact candidate: ${process.env.CANDIDATE_SHA}`);
          NODE

          dispatch() {
            local workflow="$1"
            local code
            code="$(curl -sS -o /tmp/dispatch.json -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H 'Content-Type: application/json' \
              --data "$(node -e 'process.stdout.write(JSON.stringify({ref:process.env.CERT_BRANCH}))')" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/dispatches")"
            if [ "$code" != '204' ]; then
              echo "Dispatch failed for $workflow with HTTP $code"
              cat /tmp/dispatch.json
              exit 1
            fi
            echo "Dispatched $workflow on $CERT_BRANCH"
          }

          dispatch 'mkety-content-db-smoke.yml'
          dispatch 'mkety-public-ai-runtime-diagnostic.yml'
          dispatch 'mkety-production-preflight.yml'
          dispatch 'mkety-public-candidate-deploy.yml'
