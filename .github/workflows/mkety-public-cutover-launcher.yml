name: Mkety Public Cutover Launcher

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/mkety-public-cutover-launcher.yml'

permissions:
  actions: write
  contents: read

env:
  VERIFIED_SHA: a250ce1ceb24dc39be9b8b6da67a5a881b31cf45
  CONFIRMATION: CUTOVER MKETY PUBLIC
  RELEASE_BRANCH: feat/mkety-public-site-production
  CUTOVER_MODE: worker-custom-domains-v7

jobs:
  dispatch:
    name: Dispatch guarded production cutover
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify certified release branch and dispatch cutover
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          branches="$(curl -fsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/branches?per_page=100")"

          BRANCHES="$branches" node <<'NODE'
          const branches = JSON.parse(process.env.BRANCHES || '[]');
          const release = Array.isArray(branches)
            ? branches.find((branch) => branch?.name === process.env.RELEASE_BRANCH)
            : undefined;
          if (!release?.commit?.sha) {
            throw new Error(`Could not resolve release branch ${process.env.RELEASE_BRANCH}.`);
          }
          if (release.commit.sha !== process.env.VERIFIED_SHA) {
            throw new Error(
              `Release branch mismatch: expected ${process.env.VERIFIED_SHA}, got ${release.commit.sha}.`,
            );
          }
          console.log(`Release branch pinned to certified SHA: ${release.commit.sha}`);
          NODE

          wait_for_workflow_success() {
            local workflow="$1"
            local label="$2"
            local attempt response status conclusion

            for attempt in $(seq 1 40); do
              response="$(curl -fsS                 -H "Authorization: Bearer $GH_TOKEN"                 -H 'Accept: application/vnd.github+json'                 -H 'X-GitHub-Api-Version: 2022-11-28'                 "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$VERIFIED_SHA&per_page=20")"

              status="$(RESPONSE="$response" node -e "const x=JSON.parse(process.env.RESPONSE||'{}'); const runs=Array.isArray(x.workflow_runs)?x.workflow_runs:[]; const exact=runs.find(r=>r.head_sha===process.env.VERIFIED_SHA); process.stdout.write(exact?.status||'missing')")"
              conclusion="$(RESPONSE="$response" node -e "const x=JSON.parse(process.env.RESPONSE||'{}'); const runs=Array.isArray(x.workflow_runs)?x.workflow_runs:[]; const exact=runs.find(r=>r.head_sha===process.env.VERIFIED_SHA); process.stdout.write(exact?.conclusion||'')")"

              if [ "$status" = 'completed' ] && [ "$conclusion" = 'success' ]; then
                echo "Certified $label for $VERIFIED_SHA."
                return 0
              fi

              if [ "$status" = 'completed' ] && [ -n "$conclusion" ] && [ "$conclusion" != 'success' ]; then
                echo "$label completed with non-success conclusion: $conclusion"
                return 1
              fi

              echo "Waiting for $label certification (status=$status, attempt=$attempt/40)..."
              sleep 15
            done

            echo "Timed out waiting for $label certification."
            return 1
          }

          wait_for_workflow_success 'mkety-content-db-smoke.yml' 'content DB smoke'
          wait_for_workflow_success 'mkety-public-ai-runtime-diagnostic.yml' 'Public AI runtime diagnostic'
          wait_for_workflow_success 'mkety-production-preflight.yml' 'production routing preflight'
          wait_for_workflow_success 'mkety-public-candidate-deploy.yml' 'public candidate'

          node <<'NODE' >/tmp/cutover-dispatch.json
          process.stdout.write(JSON.stringify({
            ref: 'main',
            inputs: {
              "verified_sha": process.env.VERIFIED_SHA,
              "confirmation": process.env.CONFIRMATION,
            },
          }));
          NODE

          code="$(curl -sS -o /tmp/cutover-dispatch-response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            --data @/tmp/cutover-dispatch.json \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/mkety-public-production-cutover.yml/dispatches")"

          if [ "$code" != '204' ]; then
            echo "Production cutover dispatch failed with HTTP $code."
            cat /tmp/cutover-dispatch-response.json
            exit 1
          fi

          echo "Dispatched guarded production cutover for $VERIFIED_SHA."
