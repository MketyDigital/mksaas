name: Mkety Public Cutover Launcher
# final public production closure 2026-09-24

# final public UX/support/docs/auth production release 2026-09-24
# final certified production cutover 2026-09-23
# exact-SHA CI certification dispatch added 2026-09-24
# release repinned to CI-dispatchable SHA 758ce73 2026-09-24
# standalone exact-SHA test/typecheck/lint/build certification added 2026-09-24
# vinext certification added 2026-09-23
# certify public ui + academy assets follow-up 2026-09-20
# rerun certified cutover with Platform Control production fallback 2026-09-23
# rerun certified cutover with VPC-backed Hyperdrive v2 2026-09-23

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/mkety-public-cutover-launcher.yml'

permissions:
  actions: write
  contents: read
  statuses: write

env:
  VERIFIED_SHA: 2d1c7f22211a1717163bfb29b3ab850ac6de8cc9
  CONFIRMATION: CUTOVER MKETY PUBLIC
  RELEASE_BRANCH: feat/mkety-public-site-production
  CERT_BRANCH: certify/2d1c7f2
  CUTOVER_MODE: worker-custom-domains-v7

jobs:
  dispatch:
    name: Dispatch guarded production cutover
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify certified release branch and dispatch cutover
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          publish_context() {
            local context="$1"
            local state="$2"
            local description="$3"
            CONTEXT="$context" STATE="$state" DESCRIPTION="$description" node <<'NODE' >/tmp/release-status.json
          process.stdout.write(JSON.stringify({
            state: process.env.STATE,
            context: process.env.CONTEXT,
            description: String(process.env.DESCRIPTION || '').slice(0, 140),
          }));
          NODE
            curl -fsS               -X POST               -H "Authorization: Bearer $GH_TOKEN"               -H 'Accept: application/vnd.github+json'               -H 'X-GitHub-Api-Version: 2022-11-28'               -H 'Content-Type: application/json'               --data @/tmp/release-status.json               "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$VERIFIED_SHA" >/dev/null
          }

          publish_status() {
            publish_context 'mkety/release-orchestrator' "$1" "$2"
          }

          on_error() {
            publish_status failure "Release orchestration failed before production cutover completed."
          }
          trap on_error ERR
          publish_status pending "Dispatching and verifying exact-SHA certification."

          branches="$(curl -fsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/branches?per_page=100")"

          BRANCHES="$branches" node <<'NODE'
          const branches = JSON.parse(process.env.BRANCHES || '[]');
          const release = Array.isArray(branches)
            ? branches.find((branch) => branch?.name === process.env.RELEASE_BRANCH)
            : undefined;
          if (!release?.commit?.sha) {
            throw new Error(`Could not resolve release branch ${process.env.RELEASE_BRANCH}.`);
          }
          if (release.commit.sha !== process.env.VERIFIED_SHA) {
            throw new Error(
              `Release branch mismatch: expected ${process.env.VERIFIED_SHA}, got ${release.commit.sha}.`,
            );
          }
          console.log(`Release branch pinned to certified SHA: ${release.commit.sha}`);
          NODE

          dispatch_certification() {
            local workflow="$1"
            local context="$2"
            local code
            publish_context "$context" pending "Dispatching exact-SHA certification workflow."
            code="$(curl -sS -o /tmp/cert-dispatch.json -w '%{http_code}'               -X POST               -H "Authorization: Bearer $GH_TOKEN"               -H 'Accept: application/vnd.github+json'               -H 'X-GitHub-Api-Version: 2022-11-28'               -H 'Content-Type: application/json'               --data "$(node -e 'process.stdout.write(JSON.stringify({ref:process.env.CERT_BRANCH}))')"               "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/dispatches")"
            if [ "$code" != '204' ]; then
              echo "Certification dispatch failed for $workflow with HTTP $code."
              cat /tmp/cert-dispatch.json
              publish_context "$context" failure "Certification workflow dispatch failed."
              return 1
            fi
            echo "Dispatched $workflow on $CERT_BRANCH."
          }

          dispatch_certification 'tests.yml' 'mkety/cert-tests'
          dispatch_certification 'type-check.yml' 'mkety/cert-typecheck'
          dispatch_certification 'lint.yml' 'mkety/cert-lint'
          dispatch_certification 'build.yml' 'mkety/cert-build'
          dispatch_certification 'ci.yml' 'mkety/cert-ci'
          dispatch_certification 'mkety-cloudflare-vinext-smoke.yml' 'mkety/cert-vinext'
          dispatch_certification 'mkety-content-db-smoke.yml' 'mkety/cert-content-db'
          dispatch_certification 'mkety-public-ai-runtime-diagnostic.yml' 'mkety/cert-public-ai'
          dispatch_certification 'mkety-production-preflight.yml' 'mkety/cert-preflight'
          dispatch_certification 'mkety-public-candidate-deploy.yml' 'mkety/cert-candidate'
          publish_status pending "Certification workflows dispatched; waiting for exact-SHA success."

          wait_for_workflow_success() {
            local workflow="$1"
            local label="$2"
            local context="$3"
            local attempt response status conclusion

            for attempt in $(seq 1 40); do
              response="$(curl -fsS                 -H "Authorization: Bearer $GH_TOKEN"                 -H 'Accept: application/vnd.github+json'                 -H 'X-GitHub-Api-Version: 2022-11-28'                 "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$VERIFIED_SHA&per_page=20")"

              status="$(RESPONSE="$response" node -e "const x=JSON.parse(process.env.RESPONSE||'{}'); const runs=Array.isArray(x.workflow_runs)?x.workflow_runs:[]; const exact=runs.find(r=>r.head_sha===process.env.VERIFIED_SHA); process.stdout.write(exact?.status||'missing')")"
              conclusion="$(RESPONSE="$response" node -e "const x=JSON.parse(process.env.RESPONSE||'{}'); const runs=Array.isArray(x.workflow_runs)?x.workflow_runs:[]; const exact=runs.find(r=>r.head_sha===process.env.VERIFIED_SHA); process.stdout.write(exact?.conclusion||'')")"

              if [ "$status" = 'completed' ] && [ "$conclusion" = 'success' ]; then
                publish_context "$context" success "$label certification passed."
                echo "Certified $label for $VERIFIED_SHA."
                return 0
              fi

              if [ "$status" = 'completed' ] && [ -n "$conclusion" ] && [ "$conclusion" != 'success' ]; then
                publish_context "$context" failure "$label certification ended with $conclusion."
                echo "$label completed with non-success conclusion: $conclusion"
                return 1
              fi

              echo "Waiting for $label certification (status=$status, attempt=$attempt/40)..."
              sleep 15
            done

            publish_context "$context" failure "$label certification timed out."
            echo "Timed out waiting for $label certification."
            return 1
          }

          wait_for_workflow_success 'tests.yml' 'tests' 'mkety/cert-tests'
          wait_for_workflow_success 'type-check.yml' 'typecheck' 'mkety/cert-typecheck'
          wait_for_workflow_success 'lint.yml' 'lint' 'mkety/cert-lint'
          wait_for_workflow_success 'build.yml' 'build' 'mkety/cert-build'
          wait_for_workflow_success 'ci.yml' 'CI' 'mkety/cert-ci'
          wait_for_workflow_success 'mkety-cloudflare-vinext-smoke.yml' 'Cloudflare vinext smoke' 'mkety/cert-vinext'
          wait_for_workflow_success 'mkety-content-db-smoke.yml' 'content DB smoke' 'mkety/cert-content-db'
          wait_for_workflow_success 'mkety-public-ai-runtime-diagnostic.yml' 'Public AI runtime diagnostic' 'mkety/cert-public-ai'
          wait_for_workflow_success 'mkety-production-preflight.yml' 'production routing preflight' 'mkety/cert-preflight'
          wait_for_workflow_success 'mkety-public-candidate-deploy.yml' 'public candidate' 'mkety/cert-candidate'
          publish_status pending "Exact-SHA certification passed; dispatching guarded production cutover."

          node <<'NODE' >/tmp/cutover-dispatch.json
          process.stdout.write(JSON.stringify({
            ref: 'main',
            inputs: {
              "verified_sha": process.env.VERIFIED_SHA,
              "confirmation": process.env.CONFIRMATION,
            },
          }));
          NODE

          code="$(curl -sS -o /tmp/cutover-dispatch-response.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -H 'Content-Type: application/json' \
            --data @/tmp/cutover-dispatch.json \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/mkety-public-production-cutover.yml/dispatches")"

          if [ "$code" != '204' ]; then
            echo "Production cutover dispatch failed with HTTP $code."
            cat /tmp/cutover-dispatch-response.json
            exit 1
          fi

          publish_status pending "Guarded production cutover dispatched; awaiting production workflow."
          trap - ERR
          echo "Dispatched guarded production cutover for $VERIFIED_SHA."
