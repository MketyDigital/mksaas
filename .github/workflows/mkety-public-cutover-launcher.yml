name: Mkety Public Cutover Launcher

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notice:
    name: Production cutover launcher notice
    runs-on: ubuntu-latest
    steps:
      - name: Explain deployment control plane
        shell: bash
        run: |
          set -euo pipefail
          echo 'Production cutover is intentionally dispatched only through the certified cutover workflow after exact-SHA gates pass.'
          echo 'This launcher performs no mutation and cannot bind production routes.'
