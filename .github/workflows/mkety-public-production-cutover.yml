name: Mkety Public Production Cutover

on:
  workflow_dispatch:
    inputs:
      verified_sha:
        description: Exact fully verified Mkety public candidate SHA
        required: true
        type: string
      confirmation:
        description: Type CUTOVER MKETY PUBLIC to authorize production routing
        required: true
        type: string

permissions:
  actions: read
  contents: read
  statuses: write

env:
  PRODUCTION_WORKER_NAME: mkety-platform
  RELEASE_BRANCH: feat/mkety-public-site-production
  MKETY_HYPERDRIVE_NAME: mkety-production-db-v2

jobs:
  authorize:
    name: Authorize exact certified production release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Validate manual cutover authorization
        shell: bash
        env:
          VERIFIED_SHA: ${{ inputs.verified_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if ! [[ "$VERIFIED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'verified_sha must be an exact 40-character Git commit SHA.'
            exit 1
          fi
          if [[ $CONFIRMATION != 'CUTOVER MKETY PUBLIC' ]]; then
            echo 'Production cutover confirmation did not match the required phrase.'
            exit 1
          fi

      - name: Verify frozen release head and all blocking gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ inputs.verified_sha }}
        run: |
          set -euo pipefail
          encoded_branch="$(node -e "process.stdout.write(encodeURIComponent(process.env.RELEASE_BRANCH))")"
          branch_response="$(curl -fsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/branches/$encoded_branch")"
          BRANCH_RESPONSE="$branch_response" VERIFIED_SHA="$VERIFIED_SHA" node <<'NODE'
          const payload = JSON.parse(process.env.BRANCH_RESPONSE || '{}');
          const head = payload?.commit?.sha;
          if (!head) throw new Error('Could not resolve current release branch head.');
          if (head !== process.env.VERIFIED_SHA) {
            throw new Error(`verified_sha is stale: release branch head is ${head}, requested ${process.env.VERIFIED_SHA}.`);
          }
          console.log(`Verified exact current release head: ${head}`);
          NODE

          verify_workflow_success() {
            local workflow="$1"
            local label="$2"
            local response
            response="$(curl -fsS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$VERIFIED_SHA&status=success&per_page=20")"
            RESPONSE="$response" LABEL="$label" node <<'NODE'
          const payload = JSON.parse(process.env.RESPONSE || '{}');
          if (!Array.isArray(payload.workflow_runs) || payload.workflow_runs.length === 0) {
            throw new Error(`No successful ${process.env.LABEL} run exists for the exact verified SHA.`);
          }
          console.log(`Verified successful ${process.env.LABEL} evidence for exact SHA.`);
          NODE
          }

          verify_workflow_success 'tests.yml' 'tests'
          verify_workflow_success 'type-check.yml' 'typecheck'
          verify_workflow_success 'lint.yml' 'lint'
          verify_workflow_success 'build.yml' 'build'
          verify_workflow_success 'ci.yml' 'CI'
          verify_workflow_success 'mkety-cloudflare-vinext-smoke.yml' 'Cloudflare vinext smoke'
          verify_workflow_success 'mkety-content-db-smoke.yml' 'content DB smoke'
          verify_workflow_success 'mkety-public-ai-runtime-diagnostic.yml' 'Public AI runtime diagnostic'
          verify_workflow_success 'mkety-production-preflight.yml' 'production routing preflight'
          verify_workflow_success 'mkety-public-candidate-deploy.yml' 'public candidate'

  production-db:
    needs: authorize
    uses: ./.github/workflows/mkety-coolify-production-db-executor.yml
    with:
      verified_sha: ${{ inputs.verified_sha }}
    secrets:
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}

  cutover:
    needs: production-db
    name: Verify exact candidate and cut over mkety.com
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NOWPAYMENTS_API_KEY: ${{ secrets.NOWPAYMENTS_API_KEY }}
      NOWPAYMENTS_IPN_SECRET: ${{ secrets.NOWPAYMENTS_IPN_SECRET }}
      MKETY_PLATFORM_CONTROL_TENANT_SLUG: ${{ vars.MKETY_PLATFORM_CONTROL_TENANT_SLUG || 'mkety-ops' }}
      MKETY_PLATFORM_ADMIN_EMAILS: ${{ secrets.MKETY_PLATFORM_ADMIN_EMAILS || 'support@mkety.com,hello@mkety.com' }}
      MKETY_PUBLIC_AI_VISITOR_SECRET: ${{ secrets.MKETY_PUBLIC_AI_VISITOR_SECRET }}
      MKETY_PUBLIC_OPENAI_API_KEY: ${{ secrets.MKETY_PUBLIC_OPENAI_API_KEY }}
      MKETY_PUBLIC_AZURE_OPENAI_API_KEY: ${{ secrets.MKETY_PUBLIC_AZURE_OPENAI_API_KEY }}
      MKETY_PUBLIC_AZURE_OPENAI_ENDPOINT: ${{ secrets.MKETY_PUBLIC_AZURE_OPENAI_ENDPOINT }}
      MKETY_PUBLIC_AZURE_OPENAI_DEPLOYMENT: ${{ secrets.MKETY_PUBLIC_AZURE_OPENAI_DEPLOYMENT }}
      MKETY_PUBLIC_GEMINI_API_KEY: ${{ secrets.MKETY_PUBLIC_GEMINI_API_KEY }}
      MKETY_PUBLIC_VERTEX_PROJECT_ID: ${{ secrets.MKETY_PUBLIC_VERTEX_PROJECT_ID }}
      MKETY_PUBLIC_VERTEX_LOCATION: ${{ secrets.MKETY_PUBLIC_VERTEX_LOCATION }}
      MKETY_PUBLIC_VERTEX_ACCESS_TOKEN: ${{ secrets.MKETY_PUBLIC_VERTEX_ACCESS_TOKEN }}
      MKETY_PUBLIC_CLOUDFLARE_AI_API_TOKEN: ${{ secrets.MKETY_PUBLIC_CLOUDFLARE_AI_API_TOKEN }}
      MKETY_PUBLIC_BEDROCK_ACCESS_KEY_ID: ${{ secrets.MKETY_PUBLIC_BEDROCK_ACCESS_KEY_ID }}
      MKETY_PUBLIC_BEDROCK_SECRET_ACCESS_KEY: ${{ secrets.MKETY_PUBLIC_BEDROCK_SECRET_ACCESS_KEY }}
      MKETY_PUBLIC_BEDROCK_SESSION_TOKEN: ${{ secrets.MKETY_PUBLIC_BEDROCK_SESSION_TOKEN }}
      MKETY_PUBLIC_BEDROCK_REGION: ${{ secrets.MKETY_PUBLIC_BEDROCK_REGION }}
      SKIP_ENV_VALIDATION: 'true'

    steps:
      - name: Validate manual authorization and production secrets
        shell: bash
        env:
          VERIFIED_SHA: ${{ inputs.verified_sha }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          if ! [[ "$VERIFIED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo 'verified_sha must be an exact 40-character Git commit SHA.'
            exit 1
          fi
          if [ "$CONFIRMATION" != 'CUTOVER MKETY PUBLIC' ]; then
            echo 'Production cutover confirmation did not match the required phrase.'
            exit 1
          fi
          for variable in \
            CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID \
            NOWPAYMENTS_API_KEY NOWPAYMENTS_IPN_SECRET MKETY_PUBLIC_AI_VISITOR_SECRET \
            MKETY_PLATFORM_CONTROL_TENANT_SLUG MKETY_PLATFORM_ADMIN_EMAILS; do
            if [ -z "${!variable:-}" ]; then
              echo "$variable is required in the production environment."
              exit 1
            fi
          done
          if [ "${#MKETY_PUBLIC_AI_VISITOR_SECRET}" -lt 32 ]; then
            echo 'MKETY_PUBLIC_AI_VISITOR_SECRET must contain at least 32 characters.'
            exit 1
          fi
          echo 'Hosted checkout providers such as Selar are optional and must be configured through the admin/payment-provider catalog, not as a cutover prerequisite.'

      - name: Verify SHA is current release-branch head and all blocking gates are green
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ inputs.verified_sha }}
        run: |
          set -euo pipefail
          encoded_branch="$(node -e "process.stdout.write(encodeURIComponent(process.env.RELEASE_BRANCH))")"
          branch_response="$(curl -fsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/branches/$encoded_branch")"
          BRANCH_RESPONSE="$branch_response" VERIFIED_SHA="$VERIFIED_SHA" node <<'NODE'
          const payload = JSON.parse(process.env.BRANCH_RESPONSE || '{}');
          const head = payload?.commit?.sha;
          if (!head) throw new Error('Could not resolve current release branch head.');
          if (head !== process.env.VERIFIED_SHA) {
            throw new Error(`verified_sha is stale: release branch head is ${head}, requested ${process.env.VERIFIED_SHA}.`);
          }
          console.log(`Verified exact current release head: ${head}`);
          NODE

          verify_workflow_success() {
            local workflow="$1"
            local label="$2"
            local response
            response="$(curl -fsS \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$VERIFIED_SHA&status=success&per_page=20")"
            RESPONSE="$response" LABEL="$label" node <<'NODE'
          const payload = JSON.parse(process.env.RESPONSE || '{}');
          if (!Array.isArray(payload.workflow_runs) || payload.workflow_runs.length === 0) {
            throw new Error(`No successful ${process.env.LABEL} run exists for the exact verified SHA.`);
          }
          console.log(`Verified successful ${process.env.LABEL} evidence for exact SHA.`);
          NODE
          }

          verify_workflow_success 'tests.yml' 'tests'
          verify_workflow_success 'type-check.yml' 'typecheck'
          verify_workflow_success 'lint.yml' 'lint'
          verify_workflow_success 'build.yml' 'build'
          verify_workflow_success 'ci.yml' 'CI'
          verify_workflow_success 'mkety-cloudflare-vinext-smoke.yml' 'Cloudflare vinext smoke'
          verify_workflow_success 'mkety-content-db-smoke.yml' 'content DB smoke'
          verify_workflow_success 'mkety-public-ai-runtime-diagnostic.yml' 'Public AI runtime diagnostic'
          verify_workflow_success 'mkety-production-preflight.yml' 'production routing preflight'
          verify_workflow_success 'mkety-public-candidate-deploy.yml' 'public candidate'

      - name: Checkout exact verified SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.verified_sha }}
          fetch-depth: 1

      - name: Assert exact checkout
        shell: bash
        env:
          VERIFIED_SHA: ${{ inputs.verified_sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$VERIFIED_SHA" ]; then
            echo "Exact-SHA checkout mismatch: expected $VERIFIED_SHA, got $actual"
            exit 1
          fi

      - name: Select configured Public Mkety AI providers
        id: public-ai
        shell: bash
        run: |
          set -euo pipefail
          providers=()
          if [ -n "${MKETY_PUBLIC_OPENAI_API_KEY:-}" ]; then providers+=(openai); fi
          if [ -n "${MKETY_PUBLIC_AZURE_OPENAI_API_KEY:-}" ] && [ -n "${MKETY_PUBLIC_AZURE_OPENAI_ENDPOINT:-}" ] && [ -n "${MKETY_PUBLIC_AZURE_OPENAI_DEPLOYMENT:-}" ]; then providers+=(azure-openai); fi
          if [ -n "${MKETY_PUBLIC_GEMINI_API_KEY:-}" ]; then providers+=(gemini); fi
          if [ -n "${MKETY_PUBLIC_VERTEX_PROJECT_ID:-}" ] && [ -n "${MKETY_PUBLIC_VERTEX_LOCATION:-}" ] && [ -n "${MKETY_PUBLIC_VERTEX_ACCESS_TOKEN:-}" ]; then providers+=(vertex); fi
          if [ -n "${MKETY_PUBLIC_CLOUDFLARE_AI_API_TOKEN:-}" ]; then providers+=(cloudflare-ai); fi
          if [ -n "${MKETY_PUBLIC_BEDROCK_ACCESS_KEY_ID:-}" ] && [ -n "${MKETY_PUBLIC_BEDROCK_SECRET_ACCESS_KEY:-}" ]; then providers+=(bedrock); fi
          if [ "${#providers[@]}" -eq 0 ]; then
            echo 'At least one dedicated Public Mkety AI provider must be configured for production.'
            exit 1
          fi
          primary="${providers[0]}"
          fallback=''
          if [ "${#providers[@]}" -gt 1 ]; then fallback="$(IFS=,; echo "${providers[*]:1}")"; fi
          echo "primary=$primary" >> "$GITHUB_OUTPUT"
          echo "fallback=$fallback" >> "$GITHUB_OUTPUT"
          echo "Production Public Mkety AI provider count: ${#providers[@]}"

      - name: Validate NOWPayments API key without creating a payment
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /tmp/nowpayments-currencies.json -w '%{http_code}' \
            -H "x-api-key: $NOWPAYMENTS_API_KEY" \
            'https://api.nowpayments.io/v1/currencies' || true)"
          if [ "$code" != '200' ]; then
            echo "NOWPayments read-only credential check failed with HTTP $code."
            exit 1
          fi
          node <<'NODE'
          const payload = require('/tmp/nowpayments-currencies.json');
          const currencies = Array.isArray(payload) ? payload : payload.currencies;
          if (!Array.isArray(currencies) || currencies.length === 0) {
            throw new Error('NOWPayments currencies response was not usable.');
          }
          console.log(`NOWPayments API key accepted; ${currencies.length} payment currencies reported.`);
          NODE

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Re-run exact-SHA quality gate
        shell: bash
        run: |
          set -euo pipefail
          pnpm test
          pnpm type-check
          pnpm lint
          pnpx vinext check

      - name: Resolve Mkety production Hyperdrive
        id: hyperdrive
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Accept: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/hyperdrive/configs?per_page=100")"
          HYPERDRIVES="$response" node <<'NODE' >/tmp/mkety-hyperdrive-id
          const payload = JSON.parse(process.env.HYPERDRIVES || '{}');
          if (!payload.success || !Array.isArray(payload.result)) {
            throw new Error('Could not list Cloudflare Hyperdrive configurations.');
          }
          const matches = payload.result.filter((item) => item.name === process.env.MKETY_HYPERDRIVE_NAME);
          if (matches.length !== 1 || !matches[0]?.id) {
            throw new Error(`Expected exactly one ${process.env.MKETY_HYPERDRIVE_NAME} Hyperdrive configuration.`);
          }
          process.stdout.write(matches[0].id);
          NODE
          hyperdrive_id="$(cat /tmp/mkety-hyperdrive-id)"
          echo "id=$hyperdrive_id" >> "$GITHUB_OUTPUT"
          echo "Resolved the dedicated $MKETY_HYPERDRIVE_NAME Hyperdrive configuration."

      - name: Snapshot Cloudflare Custom Domains, DNS, and Worker Routes
        id: cloudflare
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          zones="$(curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones?name=mkety.com&status=active")"
          ZONES="$zones" node <<'NODE' > /tmp/zone-id
          const payload = JSON.parse(process.env.ZONES || '{}');
          if (!payload.success || !Array.isArray(payload.result) || payload.result.length !== 1) {
            throw new Error('Expected exactly one active mkety.com Cloudflare zone.');
          }
          process.stdout.write(payload.result[0].id);
          NODE
          zone_id="$(cat /tmp/zone-id)"
          echo "zone_id=$zone_id" >> "$GITHUB_OUTPUT"

          routes="$(curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/workers/routes")"
          domains="$(curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains")"
          root_dns="$(curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?name=mkety.com")"
          www_dns="$(curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?name=www.mkety.com")"
          printf '%s' "$routes" > /tmp/mkety-routes-before.json
          printf '%s' "$domains" > /tmp/mkety-domains-before.json
          ROOT_DNS="$root_dns" WWW_DNS="$www_dns" node <<'NODE' > /tmp/mkety-dns-before.json
          const root = JSON.parse(process.env.ROOT_DNS || '{}');
          const www = JSON.parse(process.env.WWW_DNS || '{}');
          if (!root.success || !www.success || !Array.isArray(root.result) || !Array.isArray(www.result)) {
            throw new Error('Could not snapshot apex/www DNS records.');
          }
          process.stdout.write(JSON.stringify({root: root.result, www: www.result}, null, 2));
          NODE

          ROUTES="$routes" DOMAINS="$domains" ROOT_DNS="$root_dns" WWW_DNS="$www_dns" WORKER="$PRODUCTION_WORKER_NAME" node <<'NODE'
          const routes = JSON.parse(process.env.ROUTES || '{}');
          const domains = JSON.parse(process.env.DOMAINS || '{}');
          const root = JSON.parse(process.env.ROOT_DNS || '{}');
          const www = JSON.parse(process.env.WWW_DNS || '{}');
          for (const payload of [routes, domains, root, www]) {
            if (!payload.success || !Array.isArray(payload.result)) throw new Error('Cloudflare preflight lookup failed.');
          }
          const targetPatterns = new Set(['mkety.com/*', 'www.mkety.com/*']);
          if (routes.result.some((route) => targetPatterns.has(route.pattern))) {
            throw new Error('Apex/www Worker Route exists; Custom Domain cutover requires both target Worker Routes to remain unbound.');
          }
          const workerRoutes = routes.result.filter((route) => route.script === process.env.WORKER);
          if (workerRoutes.length > 0) {
            throw new Error(`Production Worker ${process.env.WORKER} is already bound to live Worker Route(s); refusing initial Custom Domain cutover.`);
          }
          for (const host of ['mkety.com', 'www.mkety.com']) {
            const existing = domains.result.find((domain) => domain.hostname === host);
            if (existing && existing.service !== process.env.WORKER) {
              throw new Error(`${host} is already attached as a Custom Domain to another Worker.`);
            }
          }
          const dns = [...root.result, ...www.result];
          if (dns.some((record) => record.type === 'CNAME')) {
            throw new Error('Apex/www CNAME record blocks safe Worker Custom Domain promotion.');
          }
          console.log('Cloudflare preflight passed: target Worker Routes are absent and Custom Domain ownership is safe.');
          NODE

      - name: Prepare Custom Domain rollback snapshot before mutation
        shell: bash
        env:
          ZONE_ID: ${{ steps.cloudflare.outputs.zone_id }}
          VERIFIED_SHA: ${{ inputs.verified_sha }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/mkety-domains-before.json', 'utf8'));
          if (!payload.success || !Array.isArray(payload.result)) throw new Error('Invalid Custom Domain snapshot.');
          const hosts = ['mkety.com', 'www.mkety.com'];
          const snapshot = hosts.map((hostname) => {
            const domain = payload.result.find((item) => item.hostname === hostname);
            return domain
              ? {hostname, existed: true, id: domain.id, service: domain.service ?? null}
              : {hostname, existed: false};
          });
          fs.writeFileSync('/tmp/mkety-cutover-rollback.json', JSON.stringify(snapshot, null, 2));
          NODE
          cat > /tmp/ROLLBACK.md <<EOF
          # Mkety public Custom Domain cutover rollback

          Verified SHA: $VERIFIED_SHA
          Cloudflare zone ID: $ZONE_ID
          Production Worker: $PRODUCTION_WORKER_NAME

          The attached mkety-domains-before.json records pre-cutover Worker Custom Domains.
          The attached mkety-dns-before.json records apex/www DNS state.
          The attached mkety-routes-before.json records Worker Routes, which this cutover must not mutate.
          The attached mkety-cutover-rollback.json records whether each target Custom Domain pre-existed.

          Rollback rule:
          - Delete only Custom Domains created by this cutover.
          - Never delete a target Custom Domain that existed before the run.
          - Restore any missing pre-cutover apex/www A, AAAA, or CNAME DNS records.
          - Worker Routes are read-only evidence and must remain byte-for-byte equivalent by pattern/script.
          - Do not alter unrelated Worker routes or unrelated DNS records.

          The cutover workflow performs this rollback automatically on Custom Domain attachment or live-acceptance failure.
          EOF

      - name: Persist pre-mutation rollback evidence
        uses: actions/upload-artifact@v4
        with:
          name: mkety-public-cutover-pre-mutation-${{ inputs.verified_sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            /tmp/mkety-routes-before.json
            /tmp/mkety-domains-before.json
            /tmp/mkety-dns-before.json
            /tmp/mkety-cutover-rollback.json
            /tmp/ROLLBACK.md

      - name: Configure and build isolated production Worker
        shell: bash
        env:
          MKETY_HYPERDRIVE_ID: ${{ steps.hyperdrive.outputs.id }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'wrangler.jsonc';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (!process.env.MKETY_HYPERDRIVE_ID) throw new Error('MKETY_DB Hyperdrive id not resolved.');
          config.name = process.env.PRODUCTION_WORKER_NAME;
          config.workers_dev = true;
          config.preview_urls = true;
          config.vars = { ...(config.vars || {}), SKIP_ENV_VALIDATION: 'true' };
          config.hyperdrive = [{ binding: 'MKETY_DB', id: process.env.MKETY_HYPERDRIVE_ID }];
          delete config.route;
          delete config.routes;
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          NODE
          pnpm build
          pnpm run deploy --dry-run

      - name: Deploy production Worker without public hostname binding
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          deploy_ok=0
          : > /tmp/mkety-production-deploy.log
          for attempt in 1 2 3; do
            attempt_log="/tmp/mkety-production-deploy-attempt-${attempt}.log"
            set +e
            pnpm run deploy 2>&1 | tee "$attempt_log"
            deploy_status=${PIPESTATUS[0]}
            set -e
            cat "$attempt_log" >> /tmp/mkety-production-deploy.log

            if [ "$deploy_status" -eq 0 ]; then
              deploy_ok=1
              break
            fi

            if grep -Eq 'assets-upload-session|code: 10013|unknown error has occurred' "$attempt_log"; then
              echo "Cloudflare assets upload session failed transiently on attempt ${attempt}/3; retrying with backoff."
              sleep "$((attempt * 10))"
              continue
            fi

            echo "Production Worker deploy failed with a non-retryable error on attempt ${attempt}."
            exit "$deploy_status"
          done

          if [ "$deploy_ok" != '1' ]; then
            echo 'Production Worker deploy exhausted bounded retries for transient Cloudflare upload-session errors.'
            exit 1
          fi

          url="$(grep -Eo 'https://[^[:space:]]+workers\.dev' /tmp/mkety-production-deploy.log | tail -n 1 || true)"
          if [ -z "$url" ]; then
            echo 'Production Worker deployed without a discoverable workers.dev preview URL.'
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo 'Production preview URL discovered.'

      - name: Remove legacy direct database Worker secret
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '{"DATABASE_URL":null}' | pnpm exec wrangler secret bulk --name "$PRODUCTION_WORKER_NAME" >/dev/null
          echo 'Removed legacy DATABASE_URL Worker secret; production DB runtime is Hyperdrive-only.'

      - name: Attach production runtime secrets
        shell: bash
        env:
          PUBLIC_AI_PRIMARY: ${{ steps.public-ai.outputs.primary }}
          PUBLIC_AI_FALLBACK: ${{ steps.public-ai.outputs.fallback }}
        run: |
          set -euo pipefail
          put_secret() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | pnpm exec wrangler secret put "$name" --name "$PRODUCTION_WORKER_NAME" >/dev/null
              echo "Attached production runtime secret: $name"
            fi
          }
          put_secret NOWPAYMENTS_API_KEY "$NOWPAYMENTS_API_KEY"
          put_secret NOWPAYMENTS_IPN_SECRET "$NOWPAYMENTS_IPN_SECRET"
          put_secret MKETY_PLATFORM_CONTROL_TENANT_SLUG "$MKETY_PLATFORM_CONTROL_TENANT_SLUG"
          put_secret MKETY_PLATFORM_ADMIN_EMAILS "$MKETY_PLATFORM_ADMIN_EMAILS"
          put_secret MKETY_DEPLOY_CLOUDFLARE_API_TOKEN "$CLOUDFLARE_API_TOKEN"
          put_secret MKETY_DEPLOY_CLOUDFLARE_ACCOUNT_ID "$CLOUDFLARE_ACCOUNT_ID"
          put_secret MKETY_PUBLIC_AI_VISITOR_SECRET "$MKETY_PUBLIC_AI_VISITOR_SECRET"
          put_secret MKETY_PUBLIC_AI_ENABLED 'true'
          put_secret MKETY_PUBLIC_AI_PRIMARY_PROVIDER "$PUBLIC_AI_PRIMARY"
          put_secret MKETY_PUBLIC_AI_FALLBACK_PROVIDERS "$PUBLIC_AI_FALLBACK"
          put_secret MKETY_PUBLIC_OPENAI_API_KEY "${MKETY_PUBLIC_OPENAI_API_KEY:-}"
          put_secret MKETY_PUBLIC_AZURE_OPENAI_API_KEY "${MKETY_PUBLIC_AZURE_OPENAI_API_KEY:-}"
          put_secret MKETY_PUBLIC_AZURE_OPENAI_ENDPOINT "${MKETY_PUBLIC_AZURE_OPENAI_ENDPOINT:-}"
          put_secret MKETY_PUBLIC_AZURE_OPENAI_DEPLOYMENT "${MKETY_PUBLIC_AZURE_OPENAI_DEPLOYMENT:-}"
          put_secret MKETY_PUBLIC_GEMINI_API_KEY "${MKETY_PUBLIC_GEMINI_API_KEY:-}"
          put_secret MKETY_PUBLIC_VERTEX_PROJECT_ID "${MKETY_PUBLIC_VERTEX_PROJECT_ID:-}"
          put_secret MKETY_PUBLIC_VERTEX_LOCATION "${MKETY_PUBLIC_VERTEX_LOCATION:-}"
          put_secret MKETY_PUBLIC_VERTEX_ACCESS_TOKEN "${MKETY_PUBLIC_VERTEX_ACCESS_TOKEN:-}"
          put_secret MKETY_PUBLIC_CLOUDFLARE_ACCOUNT_ID "$CLOUDFLARE_ACCOUNT_ID"
          put_secret MKETY_PUBLIC_CLOUDFLARE_AI_API_TOKEN "${MKETY_PUBLIC_CLOUDFLARE_AI_API_TOKEN:-}"
          put_secret MKETY_PUBLIC_BEDROCK_ACCESS_KEY_ID "${MKETY_PUBLIC_BEDROCK_ACCESS_KEY_ID:-}"
          put_secret MKETY_PUBLIC_BEDROCK_SECRET_ACCESS_KEY "${MKETY_PUBLIC_BEDROCK_SECRET_ACCESS_KEY:-}"
          put_secret MKETY_PUBLIC_BEDROCK_SESSION_TOKEN "${MKETY_PUBLIC_BEDROCK_SESSION_TOKEN:-}"
          put_secret MKETY_PUBLIC_BEDROCK_REGION "${MKETY_PUBLIC_BEDROCK_REGION:-}"

      - name: Smoke production Worker preview before Custom Domain attachment
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          preview_ready=0
          for attempt in $(seq 1 12); do
            readiness_body=/tmp/mkety-preview-readiness.html
            readiness_code="$(curl -L -sS --connect-timeout 10 --max-time 20 -o "$readiness_body" -w '%{http_code}' "$PREVIEW_URL/" || true)"
            echo "Preview readiness attempt $attempt/12: HTTP $readiness_code"
            if [ "$readiness_code" = '200' ] && grep -Fqi 'https://mkety.com' "$readiness_body"; then
              preview_ready=1
              break
            fi
            sleep 5
          done
          if [ "$preview_ready" != '1' ]; then
            echo 'Production Worker preview did not become ready within the bounded readiness window.'
            exit 1
          fi

          html_routes=(/ /platform /workspaces /solutions /academy /pricing /enterprise /about /docs /privacy /terms /contact)
          for route in "${html_routes[@]}"; do
            body=/tmp/mkety-preview.html
            code="$(curl -L -sS -o "$body" -w '%{http_code}' "$PREVIEW_URL$route" || true)"
            [ "$code" = '200' ] || { echo "Production preview failed: $route HTTP $code"; exit 1; }
            if grep -Eqi 'under development|\bWIP\b|github\.com/MketyDigital|MketyDigital|\bmksaas\b|origin\.mkety\.com|Next\.js SaaS AI Template|Auth\.js v5|OpenNext|Vercel' "$body"; then
              echo "Production preview exposed quarantined/internal wording on $route."
              exit 1
            fi
            BODY="$body" node -e "const fs=require('node:fs');const html=fs.readFileSync(process.env.BODY,'utf8');const links=html.match(/<link\\b[^>]*>/gi)||[];process.exit(links.some((tag)=>/\\brel=[\\\"']canonical[\\\"']/i.test(tag)&&/\\bhref=[\\\"']https:\\/\\/mkety\\.com(?:[\\/\\\"'])/i.test(tag))?0:1)" || {
              echo "Production preview missing mkety.com canonical link on $route."
              exit 1
            }
          done

          curl -fsS "$PREVIEW_URL/sitemap.xml" -o /tmp/mkety-preview-sitemap.xml
          for path in / /platform /workspaces /solutions /academy /pricing /enterprise /about /docs /privacy /terms /contact; do
            expected="https://mkety.com${path}"
            grep -Fq "<loc>$expected</loc>" /tmp/mkety-preview-sitemap.xml || {
              echo "Production preview sitemap missing $expected"
              exit 1
            }
          done
          curl -fsS "$PREVIEW_URL/robots.txt" -o /tmp/mkety-preview-robots.txt
          grep -Fq 'Sitemap: https://mkety.com/sitemap.xml' /tmp/mkety-preview-robots.txt || { echo 'Preview robots.txt missing production sitemap declaration.'; exit 1; }
          grep -Fq 'Host: https://mkety.com' /tmp/mkety-preview-robots.txt || { echo 'Preview robots.txt missing production host declaration.'; exit 1; }

          cookie_jar=/tmp/mkety-preview-db-cookies
          code="$(curl -sS -c "$cookie_jar" -b "$cookie_jar" -o /tmp/mkety-preview-db.json -w '%{http_code}' "$PREVIEW_URL/api/public/assistant" || true)"
          [ "$code" = '200' ] || { echo "Hyperdrive DB-backed preview smoke failed with HTTP $code."; exit 1; }
          node <<'NODE'
          const payload = require('/tmp/mkety-preview-db.json');
          if (!Array.isArray(payload.conversations) || !Array.isArray(payload.messages)) {
            throw new Error('DB-backed preview response was not the expected public-assistant history shape.');
          }
          console.log('Hyperdrive DB-backed preview smoke passed.');
          NODE

      - name: Disable temporary workers.dev and preview URLs before Custom Domain attachment
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS -X POST \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data '{"enabled":false,"previews_enabled":false}' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$PRODUCTION_WORKER_NAME/subdomain")"
          RESPONSE="$response" node <<'NODE'
          const payload = JSON.parse(process.env.RESPONSE || '{}');
          if (!payload.success || payload.result?.enabled !== false || payload.result?.previews_enabled !== false) {
            throw new Error('Failed to disable temporary production workers.dev and preview URLs.');
          }
          NODE
          verify="$(curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Accept: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$PRODUCTION_WORKER_NAME/subdomain")"
          VERIFY="$verify" node <<'NODE'
          const payload = JSON.parse(process.env.VERIFY || '{}');
          if (!payload.success || payload.result?.enabled !== false || payload.result?.previews_enabled !== false) {
            throw new Error('Temporary production preview exposure is still enabled.');
          }
          console.log('Temporary workers.dev and preview URLs disabled before production routing.');
          NODE

      - name: Attach apex and www as Worker Custom Domains
        id: domain-bind
        shell: bash
        env:
          ZONE_ID: ${{ steps.cloudflare.outputs.zone_id }}
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')

          restore_dns() {
            DNS_BACKUP="$(cat /tmp/mkety-dns-before.json)" ZONE_ID="$ZONE_ID" CLOUDFLARE_API_TOKEN="$CLOUDFLARE_API_TOKEN" node <<'NODE'
          const {execFileSync} = require('node:child_process');
          const backup = JSON.parse(process.env.DNS_BACKUP || '{}');
          for (const record of [...(backup.root || []), ...(backup.www || [])].filter((x) => ['A','AAAA','CNAME'].includes(x.type))) {
            const query = `https://api.cloudflare.com/client/v4/zones/${process.env.ZONE_ID}/dns_records?type=${encodeURIComponent(record.type)}&name=${encodeURIComponent(record.name)}&content=${encodeURIComponent(record.content)}`;
            const current = JSON.parse(execFileSync('curl', ['-fsS','-H',`Authorization: Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,'-H','Content-Type: application/json',query], {encoding:'utf8'}));
            if (Array.isArray(current.result) && current.result.length) continue;
            const body = JSON.stringify({type:record.type,name:record.name,content:record.content,ttl:record.ttl || 1,proxied:Boolean(record.proxied)});
            execFileSync('curl', ['-fsS','-X','POST','-H',`Authorization: Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,'-H','Content-Type: application/json','--data',body,`https://api.cloudflare.com/client/v4/zones/${process.env.ZONE_ID}/dns_records`], {stdio:'ignore'});
          }
          NODE
          }

          rollback_custom_domains() {
            local original_status="${1:-1}"
            set +e
            echo 'Custom Domain attachment failed; removing only domains created by this run and restoring prior DNS.'
            node -e "const x=require('/tmp/mkety-cutover-rollback.json'); for(const r of x) console.log(JSON.stringify(r));" | while IFS= read -r row; do
              existed="$(ROW="$row" node -e "process.stdout.write(String(JSON.parse(process.env.ROW).existed))")"
              new_id="$(ROW="$row" node -e "process.stdout.write(JSON.parse(process.env.ROW).newId||'')")"
              if [ "$existed" != 'true' ] && [ -n "$new_id" ]; then
                curl -sS -X DELETE "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains/$new_id" >/dev/null || true
              fi
            done
            restore_dns || true
            exit "$original_status"
          }
          trap 'status=$?; rollback_custom_domains "$status"' ERR

          remove_conflicting_origin_records() {
            local host="$1"
            local records
            records="$(curl -fsS "${auth[@]}" "$api/zones/$ZONE_ID/dns_records?name=$host")"
            RECORDS="$records" HOST="$host" node -e "const p=JSON.parse(process.env.RECORDS||'{}');if(!p.success||!Array.isArray(p.result))process.exit(1);for(const r of p.result){if(r.name===process.env.HOST&&['A','AAAA'].includes(r.type))console.log(r.id)}" | while IFS= read -r record_id; do
              [ -z "$record_id" ] && continue
              curl -fsS -X DELETE "${auth[@]}" "$api/zones/$ZONE_ID/dns_records/$record_id" >/dev/null
              echo "Removed pre-existing A/AAAA origin record for $host before Custom Domain attachment."
            done
          }

          for host in mkety.com www.mkety.com; do
            domains="$(curl -fsS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains")"
            existing="$(DOMAINS="$domains" HOST="$host" node -e "const p=JSON.parse(process.env.DOMAINS||'{}'),d=(p.result||[]).find(x=>x.hostname===process.env.HOST);if(d&&d.service!==process.env.PRODUCTION_WORKER_NAME)process.exit(2);if(d)process.stdout.write(d.id)")" || status=$?
            [ "${status:-0}" != '2' ] || { echo "$host belongs to another Worker"; false; }
            if [ -n "$existing" ]; then
              echo "$host already attached to the production Worker; preserving existing Custom Domain."
              continue
            fi
            remove_conflicting_origin_records "$host"
            body="$(HOST="$host" ZONE_ID="$ZONE_ID" node -e "process.stdout.write(JSON.stringify({hostname:process.env.HOST,service:process.env.PRODUCTION_WORKER_NAME,zone_id:process.env.ZONE_ID,zone_name:'mkety.com'}))")"
            attach_body=/tmp/mkety-domain-attach.json
            status="$(curl -sS -o "$attach_body" -w '%{http_code}' -X PUT "${auth[@]}" --data "$body" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains")"
            response="$(cat "$attach_body")"
            if [ "$status" != '200' ]; then
              echo "Cloudflare Custom Domain attach failed for $host with HTTP $status."
              PAYLOAD="$response" node -e "const p=JSON.parse(process.env.PAYLOAD||'{}');for(const e of p.errors||[])console.error('Cloudflare error '+e.code+': '+e.message)"
              false
            fi
            id="$(RESPONSE="$response" node -e "const p=JSON.parse(process.env.RESPONSE||'{}');if(!p.success||!p.result?.id)process.exit(1);process.stdout.write(p.result.id)")"
            HOST="$host" NEW_ID="$id" node <<'NODE'
          const fs = require('node:fs');
          const path = '/tmp/mkety-cutover-rollback.json';
          const snapshot = JSON.parse(fs.readFileSync(path, 'utf8'));
          const row = snapshot.find((item) => item.hostname === process.env.HOST);
          if (!row) throw new Error(`Rollback snapshot missing ${process.env.HOST}.`);
          row.newId = process.env.NEW_ID;
          fs.writeFileSync(path, JSON.stringify(snapshot, null, 2));
          NODE
            echo "Attached $host as a Worker Custom Domain."
          done

          current_routes="$(curl -fsS "${auth[@]}" "$api/zones/$ZONE_ID/workers/routes")"
          CURRENT="$current_routes" BEFORE="$(cat /tmp/mkety-routes-before.json)" node <<'NODE'
          const current = JSON.parse(process.env.CURRENT || '{}');
          const before = JSON.parse(process.env.BEFORE || '{}');
          const normalize = (payload) => (payload.result || []).map((r) => ({pattern:r.pattern,script:r.script || null})).sort((a,b) => a.pattern.localeCompare(b.pattern));
          if (!current.success || !before.success || JSON.stringify(normalize(current)) !== JSON.stringify(normalize(before))) {
            throw new Error('Worker Routes changed during Custom Domain cutover.');
          }
          console.log('Verify unrelated Worker Routes remain unchanged: PASS');
          NODE

          trap - ERR
          echo 'bound=true' >> "$GITHUB_OUTPUT"

      - name: Persist Custom Domain rollback evidence
        uses: actions/upload-artifact@v4
        with:
          name: mkety-public-cutover-custom-domain-${{ inputs.verified_sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            /tmp/mkety-domains-before.json
            /tmp/mkety-dns-before.json
            /tmp/mkety-cutover-rollback.json
            /tmp/ROLLBACK.md

      - name: Run production acceptance and rollback on failure
        shell: bash
        env:
          ZONE_ID: ${{ steps.cloudflare.outputs.zone_id }}
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          restore_dns() {
            DNS_BACKUP="$(cat /tmp/mkety-dns-before.json)" ZONE_ID="$ZONE_ID" CLOUDFLARE_API_TOKEN="$CLOUDFLARE_API_TOKEN" node <<'NODE'
          const {execFileSync} = require('node:child_process');
          const backup = JSON.parse(process.env.DNS_BACKUP || '{}');
          for (const record of [...(backup.root || []), ...(backup.www || [])].filter((x) => ['A','AAAA','CNAME'].includes(x.type))) {
            const query = `https://api.cloudflare.com/client/v4/zones/${process.env.ZONE_ID}/dns_records?type=${encodeURIComponent(record.type)}&name=${encodeURIComponent(record.name)}&content=${encodeURIComponent(record.content)}`;
            const current = JSON.parse(execFileSync('curl', ['-fsS','-H',`Authorization: Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,'-H','Content-Type: application/json',query], {encoding:'utf8'}));
            if (Array.isArray(current.result) && current.result.length) continue;
            const body = JSON.stringify({type:record.type,name:record.name,content:record.content,ttl:record.ttl || 1,proxied:Boolean(record.proxied)});
            execFileSync('curl', ['-fsS','-X','POST','-H',`Authorization: Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,'-H','Content-Type: application/json','--data',body,`https://api.cloudflare.com/client/v4/zones/${process.env.ZONE_ID}/dns_records`], {stdio:'ignore'});
          }
          NODE
          }
          rollback_custom_domains() {
            echo 'Production acceptance failed; removing only Custom Domains created by this run and restoring prior DNS.'
            node -e "const x=require('/tmp/mkety-cutover-rollback.json'); for(const r of x) console.log(JSON.stringify(r));" | while IFS= read -r row; do
              existed="$(ROW="$row" node -e "process.stdout.write(String(JSON.parse(process.env.ROW).existed))")"
              new_id="$(ROW="$row" node -e "process.stdout.write(JSON.parse(process.env.ROW).newId||'')")"
              if [ "$existed" != 'true' ] && [ -n "$new_id" ]; then
                curl -sS -X DELETE "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains/$new_id" >/dev/null || true
              fi
            done
            restore_dns || true
          }
          trap 'rollback_custom_domains' ERR

          production_ready=0
          for attempt in $(seq 1 60); do
            code="$(curl -sS --connect-timeout 10 --max-time 25 -o /tmp/mkety-production-root.html -w '%{http_code}' 'https://mkety.com/' || true)"
            echo "Custom Domain readiness attempt $attempt/60: HTTP $code"
            if [ "$code" = '200' ]; then production_ready=1; break; fi
            sleep 5
          done
          [ "$production_ready" = '1' ] || { echo 'mkety.com Custom Domain did not become ready in the bounded window.'; false; }

          html_routes=(/ /platform /workspaces /solutions /academy /pricing /enterprise /about /docs /privacy /terms /contact)
          for route in "${html_routes[@]}"; do
            body=/tmp/mkety-production.html
            code="$(curl -L -sS -o "$body" -w '%{http_code}' "https://mkety.com$route")"
            [ "$code" = '200' ] || { echo "Production route failed: $route HTTP $code"; false; }
            if grep -Eqi 'under development|\bWIP\b|github\.com/MketyDigital|MketyDigital|\bmksaas\b|origin\.mkety\.com|Next\.js SaaS AI Template|Auth\.js v5|OpenNext|Vercel' "$body"; then
              echo "Production route exposed quarantined/internal wording: $route"
              false
            fi
            BODY="$body" node -e "const fs=require('node:fs');const html=fs.readFileSync(process.env.BODY,'utf8');const links=html.match(/<link\\b[^>]*>/gi)||[];process.exit(links.some((tag)=>/\\brel=[\\\"']canonical[\\\"']/i.test(tag)&&/\\bhref=[\\\"']https:\\/\\/mkety\\.com(?:[\\/\\\"'])/i.test(tag))?0:1)" || {
              echo "Production route missing mkety.com canonical link: $route"
              false
            }
          done



          curl -fsS 'https://mkety.com/academy' -o /tmp/mkety-academy-page.html
          grep -Fq 'Courses &amp; tiers' /tmp/mkety-academy-page.html || grep -Fq 'Courses & tiers' /tmp/mkety-academy-page.html || { echo 'Academy page missing Courses & tiers section.'; false; }
          grep -Fq 'Ready to learn?' /tmp/mkety-academy-page.html || { echo 'Academy page missing ready-to-learn handoff.'; false; }
          grep -Fq 'Ask Mkety AI about Academy' /tmp/mkety-academy-page.html || { echo 'Academy page missing AI-first discovery CTA.'; false; }
          grep -Fq 'academy.mkety.com' /tmp/mkety-academy-page.html || { echo 'Academy page missing learning-access destination.'; false; }

          curl -fsS 'https://mkety.com/pricing' -o /tmp/mkety-pricing-page.html
          grep -Fq 'data-plan-price="starter:$5.99"' /tmp/mkety-pricing-page.html || { echo 'Starter price card missing exact USD-formatted $5.99 amount.'; false; }
          grep -Fq 'Trading Workspace' /tmp/mkety-pricing-page.html || { echo 'Pricing page missing Trading Workspace.'; false; }
          grep -Fq 'Custom / Enterprise' /tmp/mkety-pricing-page.html || { echo 'Pricing page missing Trading Custom / Enterprise positioning.'; false; }

          curl -fsS 'https://mkety.com/workspaces' -o /tmp/mkety-workspaces-page.html
          grep -Fq 'Trading Workspace' /tmp/mkety-workspaces-page.html || { echo 'Workspaces page missing Trading Workspace.'; false; }
          grep -Fq 'Custom / Enterprise' /tmp/mkety-workspaces-page.html || { echo 'Workspaces page missing Trading Custom / Enterprise positioning.'; false; }

          curl -fsS 'https://mkety.com/' -o /tmp/mkety-home-page.html
          if grep -Fq 'academy.mkety.com' /tmp/mkety-home-page.html; then echo 'Homepage must not bypass AI-first Academy discovery.'; false; fi

          for image in class1.jpg class2.jpg class3.jpg class4.jpg class5.jpg; do
            headers="$(mktemp)"
            code="$(curl -sS -D "$headers" -o /tmp/mkety-academy-image -w '%{http_code}' "https://mkety.com/academy-hubs/$image" || true)"
            [ "$code" = '200' ] || { echo "Academy image failed: $image HTTP $code"; exit 1; }
            content_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {sub(/^[^:]*:[[:space:]]*/, "");gsub(/\r/,"");v=$0} END{print v}' "$headers")"
            printf '%s' "$content_type" | grep -Eqi '^image/' || { echo "Academy asset is not an image: $image ($content_type)"; exit 1; }
          done

          curl -fsS "https://mkety.com/docs" -o /tmp/mkety-docs-index.html
          python3 <<'PY' >/tmp/mkety-doc-links
          import re
          html=open('/tmp/mkety-docs-index.html','r',encoding='utf-8',errors='replace').read()
          links=sorted(set(re.findall(r'href=["\'](/docs/[^"\'#?]+)', html)))
          for link in links:
              print(link)
          PY
          [ -s /tmp/mkety-doc-links ] || { echo 'Docs index rendered no article links.'; exit 1; }
          while IFS= read -r doc_path; do
            [ -n "$doc_path" ] || continue
            code="$(curl -L -sS -o /tmp/mkety-doc-page -w '%{http_code}' "https://mkety.com$doc_path" || true)"
            [ "$code" = '200' ] || { echo "Rendered docs link failed: $doc_path HTTP $code"; exit 1; }
          done </tmp/mkety-doc-links

          curl -fsS 'https://mkety.com/sitemap.xml' -o /tmp/mkety-production-sitemap.xml
          for path in / /platform /workspaces /solutions /academy /pricing /enterprise /about /docs /privacy /terms /contact; do
            expected="https://mkety.com${path}"
            grep -Fq "<loc>$expected</loc>" /tmp/mkety-production-sitemap.xml || { echo "Production sitemap missing $expected"; false; }
          done
          curl -fsS 'https://mkety.com/robots.txt' -o /tmp/mkety-production-robots.txt
          grep -Fq 'Sitemap: https://mkety.com/sitemap.xml' /tmp/mkety-production-robots.txt || { echo 'Production robots.txt missing sitemap declaration.'; false; }
          grep -Fq 'Host: https://mkety.com' /tmp/mkety-production-robots.txt || { echo 'Production robots.txt missing host declaration.'; false; }

          headers="$(mktemp)"
          www_code="$(curl -sS -D "$headers" -o /dev/null -w '%{http_code}' 'https://www.mkety.com/')"
          [ "$www_code" = '308' ] || { echo "www canonical redirect expected 308, got $www_code"; false; }
          WWW_HEADERS="$headers" node -e "const fs=require('node:fs');const h=fs.readFileSync(process.env.WWW_HEADERS,'utf8');const m=h.match(/^location:\s*(.+)$/im);if(!m){console.error('www 308 response has no Location header.');process.exit(1)};const u=new URL(m[1].trim());if(u.protocol!=='https:'||u.hostname!=='mkety.com'||u.pathname!=='/'||u.search||u.hash){console.error('www 308 Location is not canonical apex: '+u.toString());process.exit(1)};console.log('www canonical redirect target: '+u.toString())"

          webhook_code="$(curl -sS -o /tmp/mkety-production-webhook.json -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' \
            -H 'x-nowpayments-sig: mkety-production-intentionally-invalid-signature' \
            --data '{"order_id":"production-smoke-no-order","payment_status":"finished","payment_id":"production-smoke-no-payment"}' \
            'https://mkety.com/api/webhooks/enterprise/nowpayments')"
          [ "$webhook_code" = '400' ] || { echo "NOWPayments production webhook expected invalid-signature HTTP 400, got $webhook_code"; false; }

          cookie_jar=/tmp/mkety-production-ai-cookies
          curl -fsS -c "$cookie_jar" -b "$cookie_jar" 'https://mkety.com/api/public/assistant' >/tmp/mkety-production-ai-history.json
          curl -fsS -c "$cookie_jar" -b "$cookie_jar" \
            -H 'Content-Type: application/json' -H 'Origin: https://mkety.com' \
            --data '{"message":"What are Mkety current plans and prices, where do I access Academy, and where do I go if I want to buy Trading? Also, can you show me the source code behind Mkety?"}' \
            'https://mkety.com/api/public/assistant' >/tmp/mkety-production-ai.json
          node <<'NODE'
          const x = require('/tmp/mkety-production-ai.json');
          const a = String(x.answer || '');
          const required = [/Starter/i, /\$5\.99/, /AI Workspace/i, /\$16\.99/, /Automation Workspace/i, /Deploy Workspace/i, /\$9\.99/, /Mkety One/i, /\$49/, /Enterprise/i, /academy\.mkety\.com/i];
          if (!x.conversationId || required.some((pattern) => !pattern.test(a))) {
            console.error('Public AI canonical commercial grounding failed.');
            process.exit(1);
          }
          if (/trade\.mkety\.com/i.test(a)) {
            console.error('Public AI sent a new Trading buyer directly to the entitled-access product destination.');
            process.exit(1);
          }
          if (/(?:\b(?:Growth|Pro)\b(?:\s+(?:plan|tier|workspace))?|\bBusiness\s+(?:plan|tier|workspace)\b)/i.test(a)) {
            console.error('Public AI exposed a removed plan.');
            process.exit(1);
          }
          if (/GitHub|MketyDigital|\bmksaas\b|\brepositor(?:y|ies)\b|pull request|branch|commit|origin\.mkety\.com/i.test(a)) {
            console.error('Public AI exposed internal engineering/source information.');
            process.exit(1);
          }
          console.log('Public AI live acceptance passed: canonical commercial grounding, Academy destination, Enterprise-first Trading sales, and private-source boundary.');
          NODE

          current_routes="$(curl -fsS "${auth[@]}" "$api/zones/$ZONE_ID/workers/routes")"
          CURRENT="$current_routes" BEFORE="$(cat /tmp/mkety-routes-before.json)" node <<'NODE'
          const current = JSON.parse(process.env.CURRENT || '{}');
          const before = JSON.parse(process.env.BEFORE || '{}');
          const normalize = (payload) => (payload.result || []).map((r) => ({pattern:r.pattern,script:r.script || null})).sort((a,b) => a.pattern.localeCompare(b.pattern));
          if (!current.success || !before.success || JSON.stringify(normalize(current)) !== JSON.stringify(normalize(before))) {
            throw new Error('Worker Routes changed during production acceptance.');
          }
          NODE

          trap - ERR
          echo 'Production acceptance passed. Apex/www Worker Custom Domains retained on the exact verified Worker.'

      - name: Publish cutover evidence and rollback instructions
        env:
          VERIFIED_SHA: ${{ inputs.verified_sha }}
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          PUBLIC_AI_PRIMARY: ${{ steps.public-ai.outputs.primary }}
        run: |
          {
            echo '## Mkety public production cutover evidence'
            echo
            echo "- Exact production SHA: \`$VERIFIED_SHA\`"
            echo "- Verified Worker preview: \`$PREVIEW_URL\`"
            echo "- Public Mkety AI primary provider family: \`$PUBLIC_AI_PRIMARY\`"
            echo '- Required exact-SHA workflows: green before cutover.'
            echo '- Enterprise payments: NOWPayments read-only credential + invalid-signature fail-closed smoke; hosted checkout providers are optional/admin-configured.'
            echo '- Database runtime: MKETY_DB Hyperdrive binding; private production database credentials are not attached to the Worker.'
            echo '- Live hostname mutation: only mkety.com and www.mkety.com Worker Custom Domains, with automatic rollback on partial attachment failure.'
            echo '- Public routes: all 14 route/indexing endpoints accepted; canonical, sitemap, robots and www 308 verified.'
            echo '- Apex/www Worker Routes remained unbound; unrelated Worker Routes were unchanged.'
            echo
            echo '### Rollback'
            echo 'Download the pre-mutation rollback artifact from this run. Delete only Custom Domains created by this cutover and restore any missing pre-cutover apex/www DNS records. Worker Routes must remain unchanged.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Mkety public production SHA: $VERIFIED_SHA"
          echo 'Production cutover acceptance complete with rollback evidence persisted.'


  report:
    name: Publish production cutover result
    if: always()
    needs:
      - authorize
      - production-db
      - cutover
    runs-on: ubuntu-latest
    permissions:
      statuses: write
      contents: read
    steps:
      - name: Publish exact release status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ inputs.verified_sha }}
          AUTHORIZE_RESULT: ${{ needs.authorize.result }}
          DB_RESULT: ${{ needs.production-db.result }}
          CUTOVER_RESULT: ${{ needs.cutover.result }}
        run: |
          set -euo pipefail
          state='failure'
          description="authorize=$AUTHORIZE_RESULT db=$DB_RESULT cutover=$CUTOVER_RESULT"
          if [[ "$AUTHORIZE_RESULT" == 'success' && "$DB_RESULT" == 'success' && "$CUTOVER_RESULT" == 'success' ]]; then
            state='success'
            description='Production DB migration and Mkety public cutover completed successfully.'
          fi

          STATE="$state" DESCRIPTION="$description" node <<'NODE' >/tmp/production-status.json
          process.stdout.write(JSON.stringify({
            state: process.env.STATE,
            context: 'mkety/production-cutover',
            description: String(process.env.DESCRIPTION || '').slice(0, 140),
          }));
          NODE

          curl -fsS             -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H 'Accept: application/vnd.github+json'             -H 'X-GitHub-Api-Version: 2022-11-28'             -H 'Content-Type: application/json'             --data @/tmp/production-status.json             "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$VERIFIED_SHA" >/dev/null

          if [[ "$state" != 'success' ]]; then
            echo "Production cutover did not complete successfully: $description"
            exit 1
          fi
