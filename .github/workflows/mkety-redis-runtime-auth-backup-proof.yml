name: Mkety Redis Default User Backup Proof

on:
  push:
    branches:
      - ops/redis-auth-diagnostic-20260914
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      COOLIFY_URL: https://deploy.mkety.com
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      PROJECT_UUID: 0zqhpkprlhtvlacmsgmfyyhs
      ENVIRONMENT_UUID: rtebcetyfvzlaiqitzcp0gl8
      SERVER_UUID: ynkdc4tx6bi7cyxf0kuy8kte
      REDIS_UUID: i5hrrr4riyslz7hekhu5glkd
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_S3_API: ${{ secrets.R2_S3_API }}
      R2_BUCKET: mkety-production-db-backups
    steps:
      - name: Build Redis URL with default ACL user without logging secrets
        shell: bash
        run: |
          set -euo pipefail
          base="${COOLIFY_URL%/}/api/v1"
          curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Accept: application/json' "$base/databases/$REDIS_UUID" -o /tmp/redis.json
          curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Accept: application/json' "$base/databases/$REDIS_UUID/envs" -o /tmp/redis-envs.json
          node <<'NODE'
          const fs=require('node:fs');
          const db=JSON.parse(fs.readFileSync('/tmp/redis.json','utf8'));
          const envs=JSON.parse(fs.readFileSync('/tmp/redis-envs.json','utf8'));
          const active=Array.isArray(envs)?envs.filter(x=>x&&x.is_preview!==true):[];
          const get=(key)=>{const e=active.find(x=>String(x.key||'').toUpperCase()===key);const v=e?.real_value??e?.value??null;return v==null?null:String(v)};
          const password=get('REDIS_PASSWORD');
          const configuredUsername=get('REDIS_USERNAME');
          if(!db.internal_db_url||!password) throw new Error('Redis stored connection metadata is incomplete');
          const u=new URL(db.internal_db_url);
          const storedPassword=decodeURIComponent(u.password||'');
          console.log(`MKETY_REDIS_STORED_PASSWORD_MATCHES_ENV=${storedPassword===password}`);
          console.log(`MKETY_REDIS_CONFIGURED_USERNAME_IS_DEFAULT=${configuredUsername==='default'}`);
          console.log(`MKETY_REDIS_CUSTOM_CONFIG_PRESENT=${Boolean(db.redis_conf)}`);
          u.username='default';
          u.password=password;
          fs.writeFileSync('/tmp/redis-url',u.toString(),{mode:0o600});
          console.log('MKETY_REDIS_DEFAULT_USER_CANDIDATE_READY=true');
          NODE
          redis_url="$(cat /tmp/redis-url)"
          echo "::add-mask::$redis_url"

      - name: Create isolated Redis proof executor
        id: executor
        shell: bash
        run: |
          set -euo pipefail
          base="${COOLIFY_URL%/}/api/v1"
          node <<'NODE' >/tmp/create-app.json
          const dockerfile=['FROM redis:7-alpine','RUN apk add --no-cache aws-cli coreutils nodejs','CMD ["sleep", "infinity"]',''].join('\n');
          process.stdout.write(JSON.stringify({project_uuid:process.env.PROJECT_UUID,server_uuid:process.env.SERVER_UUID,environment_uuid:process.env.ENVIRONMENT_UUID,dockerfile:Buffer.from(dockerfile,'utf8').toString('base64'),ports_exposes:'3000',name:`mkety-redis-default-user-proof-${process.env.GITHUB_SHA.slice(0,12)}`,description:`Ephemeral Redis default-user backup proof ${process.env.GITHUB_SHA}`}));
          NODE
          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/create-response.json -w '%{http_code}' -X POST -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/create-app.json "$base/applications/dockerfile")"
          [ "$code" = '201' ] || { echo "Executor creation failed with HTTP $code"; cat /tmp/create-response.json; exit 2; }
          app_uuid="$(node -e "const x=require('/tmp/create-response.json');if(!x.uuid)process.exit(1);process.stdout.write(x.uuid)")"
          echo "app_uuid=$app_uuid" >> "$GITHUB_OUTPUT"
          echo MKETY_REDIS_EXECUTOR_CREATED=true

      - name: Inject proof settings
        shell: bash
        env:
          APP_UUID: ${{ steps.executor.outputs.app_uuid }}
        run: |
          set -euo pipefail
          base="${COOLIFY_URL%/}/api/v1"
          redis_url="$(cat /tmp/redis-url)"
          echo "::add-mask::$redis_url"
          cat > /tmp/run.sh <<'SH'
          set -eu
          key="redis/mkety-production-redis-proof-$(date -u +%Y%m%dT%H%M%SZ).rdb"
          out=/tmp/mkety-redis.rdb
          case "$REDIS_URL" in
            rediss://*) source_keys="$(redis-cli --tls -u "$REDIS_URL" DBSIZE 2>/dev/null | tr -d '\r')"; redis-cli --tls -u "$REDIS_URL" --rdb "$out" >/dev/null ;;
            *) source_keys="$(redis-cli -u "$REDIS_URL" DBSIZE 2>/dev/null | tr -d '\r')"; redis-cli -u "$REDIS_URL" --rdb "$out" >/dev/null ;;
          esac
          case "$source_keys" in ''|*[!0-9]*) echo MKETY_REDIS_BACKUP_ERROR=default-user-auth-or-dbsize-failed; exit 9 ;; esac
          echo MKETY_REDIS_DEFAULT_USER_AUTH_OK=true
          echo MKETY_REDIS_RUNTIME_AUTH_OK=true
          bytes="$(wc -c < "$out" | tr -d ' ')"
          test "$bytes" -gt 0 || { echo MKETY_REDIS_BACKUP_ERROR=empty-snapshot; exit 10; }
          sha="$(sha256sum "$out" | awk '{print $1}')"
          echo MKETY_REDIS_BACKUP_STAGE_OK=snapshot
          echo "MKETY_REDIS_BACKUP_KEY=$key"
          echo "MKETY_REDIS_BACKUP_SNAPSHOT_BYTES=$bytes"
          endpoint="${R2_S3_API%/}"
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID" AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY" AWS_DEFAULT_REGION=auto AWS_EC2_METADATA_DISABLED=true AWS_REQUEST_CHECKSUM_CALCULATION=WHEN_REQUIRED AWS_RESPONSE_CHECKSUM_VALIDATION=WHEN_REQUIRED
          aws --region auto --endpoint-url "$endpoint" s3 cp "$out" "s3://$R2_BUCKET/$key" >/dev/null
          echo MKETY_REDIS_BACKUP_STAGE_OK=upload
          aws --region auto --endpoint-url "$endpoint" s3api head-object --bucket "$R2_BUCKET" --key "$key" >/tmp/head.json
          remote_bytes="$(node -e "const x=require('/tmp/head.json');process.stdout.write(String(x.ContentLength||0))")"
          test "$remote_bytes" = "$bytes" || { echo "MKETY_REDIS_BACKUP_ERROR=remote-size-mismatch local=$bytes remote=$remote_bytes"; exit 11; }
          mkdir -p /tmp/restore
          aws --region auto --endpoint-url "$endpoint" s3 cp "s3://$R2_BUCKET/$key" /tmp/restore/dump.rdb >/dev/null
          remote_sha="$(sha256sum /tmp/restore/dump.rdb | awk '{print $1}')"
          test "$remote_sha" = "$sha" || { echo MKETY_REDIS_BACKUP_ERROR=sha-mismatch; exit 12; }
          redis-server --port 6380 --bind 127.0.0.1 --protected-mode no --appendonly no --save '' --dir /tmp/restore --dbfilename dump.rdb --daemonize yes
          ready=no
          for i in $(seq 1 30); do if redis-cli -h 127.0.0.1 -p 6380 PING 2>/dev/null | grep -qx PONG; then ready=yes; break; fi; sleep 1; done
          [ "$ready" = yes ] || { echo MKETY_REDIS_BACKUP_ERROR=restore-server-not-ready; exit 13; }
          restored_keys="$(redis-cli -h 127.0.0.1 -p 6380 DBSIZE | tr -d '\r')"
          test "$restored_keys" = "$source_keys" || { echo "MKETY_REDIS_BACKUP_ERROR=restore-dbsize-mismatch source=$source_keys restored=$restored_keys"; exit 14; }
          echo "MKETY_REDIS_BACKUP_REMOTE_BYTES=$remote_bytes"
          echo "MKETY_REDIS_BACKUP_SOURCE_KEYS=$source_keys"
          echo "MKETY_REDIS_BACKUP_RESTORED_KEYS=$restored_keys"
          echo MKETY_REDIS_BACKUP_STAGE_OK=download
          echo MKETY_REDIS_BACKUP_STAGE_OK=restore
          echo MKETY_REDIS_BACKUP_OK=true
          SH
          base64 -w0 /tmp/run.sh >/tmp/run.b64
          put_env(){ local key="$1" value="$2"; KEY="$key" VALUE="$value" node -e 'process.stdout.write(JSON.stringify({key:process.env.KEY,value:process.env.VALUE,is_preview:false,is_literal:true,is_multiline:false,is_shown_once:true}))' >/tmp/env.json; code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/env-response.json -w '%{http_code}' -X POST -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/env.json "$base/applications/$APP_UUID/envs")"; [ "$code" = '201' ] || { echo "Failed to inject $key (HTTP $code)"; exit 3; }; }
          put_env REDIS_URL "$redis_url"
          put_env R2_ACCESS_KEY_ID "$R2_ACCESS_KEY_ID"
          put_env R2_SECRET_ACCESS_KEY "$R2_SECRET_ACCESS_KEY"
          put_env R2_S3_API "$R2_S3_API"
          put_env R2_BUCKET "$R2_BUCKET"
          put_env SCRIPT_B64 "$(cat /tmp/run.b64)"
          echo MKETY_REDIS_EXECUTOR_CONFIG_OK=true

      - name: Deploy executor and execute proof
        shell: bash
        env:
          APP_UUID: ${{ steps.executor.outputs.app_uuid }}
        run: |
          set -euo pipefail
          base="${COOLIFY_URL%/}/api/v1"
          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/deploy.json -w '%{http_code}' -X POST -H "Authorization: Bearer $COOLIFY_API_TOKEN" "$base/deploy?uuid=$APP_UUID&force=true")"
          [ "$code" = '200' ] || { echo "Executor deploy failed with HTTP $code"; cat /tmp/deploy.json; exit 4; }
          deployment_uuid="$(node -e "const x=require('/tmp/deploy.json');const d=Array.isArray(x.deployments)?x.deployments[0]:null;if(!d?.deployment_uuid)process.exit(1);process.stdout.write(d.deployment_uuid)")"
          finished=no
          for i in $(seq 1 180); do curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" "$base/deployments/$deployment_uuid" -o /tmp/deployment.json; status="$(node -e "process.stdout.write(String(require('/tmp/deployment.json').status||''))")"; echo "deployment_status=$status"; case "${status,,}" in finished|success|successful|succeeded|completed) finished=yes; break ;; failed|failure|error|cancelled|canceled) echo "Executor deployment failed: $status"; exit 5 ;; esac; sleep 5; done
          [ "$finished" = yes ] || { echo 'Executor deployment timed out'; exit 5; }
          node <<'NODE' >/tmp/task.json
          process.stdout.write(JSON.stringify({name:'mkety-redis-default-user-backup-proof',command:'echo $SCRIPT_B64 | base64 -d | sh',frequency:'0 0 * * *',timeout:600,enabled:false}));
          NODE
          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/task-response.json -w '%{http_code}' -X POST -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/task.json "$base/applications/$APP_UUID/scheduled-tasks")"
          [ "$code" = '201' ] || { echo "Proof task create failed HTTP $code"; cat /tmp/task-response.json; exit 6; }
          task_uuid="$(node -e "const x=require('/tmp/task-response.json');if(!x.uuid)process.exit(1);process.stdout.write(x.uuid)")"
          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/execute-response.txt -w '%{http_code}' -X POST -H "Authorization: Bearer $COOLIFY_API_TOKEN" "$base/applications/$APP_UUID/scheduled-tasks/$task_uuid/execute")"
          [ "$code" = '200' ] || { echo "Proof task execute failed HTTP $code"; cat /tmp/execute-response.txt; exit 7; }
          completed=no
          for i in $(seq 1 150); do curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" "$base/applications/$APP_UUID/scheduled-tasks/$task_uuid/executions" -o /tmp/executions.json; status="$(node -e "const xs=require('/tmp/executions.json');const e=Array.isArray(xs)?xs[0]:null;process.stdout.write(String(e?.status||''))")"; echo "task_status=$status"; case "${status,,}" in success|successful|succeeded|completed) completed=yes; break ;; failed|failure|error) node -e "const xs=require('/tmp/executions.json');const e=Array.isArray(xs)?xs[0]:null;console.log(String(e?.message||'').split(/\\r?\\n/).filter(l=>l.includes('MKETY_REDIS_')||l.includes('WRONGPASS')||l.includes('NOAUTH')).join('\\n'))"; exit 8 ;; esac; sleep 5; done
          [ "$completed" = yes ] || { echo 'Redis proof task timed out'; exit 9; }
          node <<'NODE'
          const xs=require('/tmp/executions.json'); const e=Array.isArray(xs)?xs[0]:null; const msg=String(e?.message||'');
          console.log(msg.split(/\r?\n/).filter(l=>l.includes('MKETY_REDIS_')).join('\n'));
          const required=['MKETY_REDIS_DEFAULT_USER_AUTH_OK=true','MKETY_REDIS_RUNTIME_AUTH_OK=true','MKETY_REDIS_BACKUP_STAGE_OK=snapshot','MKETY_REDIS_BACKUP_STAGE_OK=upload','MKETY_REDIS_BACKUP_STAGE_OK=download','MKETY_REDIS_BACKUP_STAGE_OK=restore','MKETY_REDIS_BACKUP_OK=true'];
          if(!required.every(m=>msg.includes(m))) process.exit(1);
          NODE

      - name: Delete isolated Redis proof executor
        if: always() && steps.executor.outputs.app_uuid != ''
        shell: bash
        env:
          APP_UUID: ${{ steps.executor.outputs.app_uuid }}
        run: |
          set +e
          curl --proto '=https' --tlsv1.2 -sS -X DELETE -H "Authorization: Bearer $COOLIFY_API_TOKEN" "${COOLIFY_URL%/}/api/v1/applications/$APP_UUID" >/dev/null
          echo 'Ephemeral Redis proof executor cleanup requested.'
