name: Mkety Redis Credential Drift Inventory

on:
  push:
    branches:
      - ops/redis-auth-diagnostic-20260914
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      COOLIFY_URL: https://deploy.mkety.com
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      PROJECT_UUID: 0zqhpkprlhtvlacmsgmfyyhs
      ENVIRONMENT_UUID: rtebcetyfvzlaiqitzcp0gl8
      REDIS_UUID: i5hrrr4riyslz7hekhu5glkd
    steps:
      - name: Inspect Redis control-plane versus running-state metadata
        shell: bash
        run: |
          set -euo pipefail
          base="${COOLIFY_URL%/}/api/v1"
          curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Accept: application/json' "$base/databases/$REDIS_UUID" -o /tmp/redis.json
          curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Accept: application/json' "$base/databases/$REDIS_UUID/envs" -o /tmp/redis-envs.json
          curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Accept: application/json' "$base/databases/$REDIS_UUID/storages" -o /tmp/redis-storages.json
          node <<'NODE'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const db=JSON.parse(fs.readFileSync('/tmp/redis.json','utf8'));
          const envs=JSON.parse(fs.readFileSync('/tmp/redis-envs.json','utf8'));
          const storages=JSON.parse(fs.readFileSync('/tmp/redis-storages.json','utf8'));
          const active=Array.isArray(envs)?envs.filter(x=>x&&x.is_preview!==true):[];
          const get=(key)=>{const e=active.find(x=>String(x.key||'').toUpperCase()===key); const v=e?.real_value??e?.value??null; return v==null?null:String(v)};
          const pass=get('REDIS_PASSWORD');
          const user=get('REDIS_USERNAME')||'default';
          if(!db.internal_db_url || !pass) throw new Error('Redis stored connection metadata is incomplete');
          const u=new URL(db.internal_db_url);
          const storedPass=decodeURIComponent(u.password||'');
          const storedUser=decodeURIComponent(u.username||'');
          const persistent=Array.isArray(storages?.persistent_storages)?storages.persistent_storages:[];
          const files=Array.isArray(storages?.file_storages)?storages.file_storages:[];
          const summary={
            status:db.status||null,
            is_public:db.is_public===true,
            created_at:db.created_at||null,
            updated_at:db.updated_at||null,
            started_at:db.started_at||null,
            last_online_at:db.last_online_at||null,
            last_restart_at:db.last_restart_at||null,
            last_restart_type:db.last_restart_type||null,
            restart_count:Number(db.restart_count||0),
            config_hash_present:Boolean(db.config_hash),
            redis_conf_present:Boolean(db.redis_conf),
            stored_password_matches_env:storedPass===pass,
            stored_username_matches_env:!storedUser||storedUser===user,
            username_is_default:user==='default',
            persistent_storage_count:persistent.length,
            persistent_storages:persistent.map(s=>({uuid:s.uuid||null,name:s.name||null,mount_path:s.mount_path||null,host_path_present:Boolean(s.host_path),backup_schedule_present:Boolean(s.backup||s.storage_backup||s.backup_schedule)})),
            file_storage_count:files.length
          };
          console.log(JSON.stringify(summary,null,2));
          fs.writeFileSync('/tmp/redis-control-plane-sanitized.json',JSON.stringify(summary,null,2));
          // Keep only an in-run fingerprint for equality checks; never print it.
          fs.writeFileSync('/tmp/stored-pass.sha256',crypto.createHash('sha256').update(pass).digest('hex'));
          NODE

      - name: Inventory Mkety production application Redis credential candidates
        shell: bash
        run: |
          set -euo pipefail
          base="${COOLIFY_URL%/}/api/v1"
          curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Accept: application/json' "$base/projects/$PROJECT_UUID/$ENVIRONMENT_UUID" -o /tmp/environment.json
          curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Accept: application/json' "$base/applications" -o /tmp/applications.json
          env_id="$(node -e "const x=require('/tmp/environment.json');if(!x.id)process.exit(1);process.stdout.write(String(x.id))")"
          ENV_ID="$env_id" node <<'NODE' >/tmp/app-uuids
          const apps=require('/tmp/applications.json');
          const id=Number(process.env.ENV_ID);
          for(const a of (Array.isArray(apps)?apps:[])) if(Number(a.environment_id)===id && a.uuid) console.log(a.uuid);
          NODE
          : >/tmp/app-candidates.ndjson
          app_count=0
          while IFS= read -r uuid; do
            [ -n "$uuid" ] || continue
            app_count=$((app_count+1))
            curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Accept: application/json' "$base/applications/$uuid/envs" -o "/tmp/app-env-$uuid.json"
            APP_UUID="$uuid" node <<'NODE' >>/tmp/app-candidates.ndjson
          const fs=require('node:fs');
          const envs=JSON.parse(fs.readFileSync(`/tmp/app-env-${process.env.APP_UUID}.json`,'utf8'));
          const active=Array.isArray(envs)?envs.filter(x=>x&&x.is_preview!==true&&x.is_runtime!==false):[];
          for(const e of active){
            const key=String(e.key||'');
            if(!/(REDIS|CACHE)/i.test(key)) continue;
            const value=e.real_value??e.value??null;
            if(value==null) continue;
            console.log(JSON.stringify({scope:'application',resource:process.env.APP_UUID,key,value:String(value)}));
          }
          NODE
          done </tmp/app-uuids
          curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Accept: application/json' "$base/projects/$PROJECT_UUID/envs" -o /tmp/project-envs.json || echo '[]' >/tmp/project-envs.json
          curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Accept: application/json' "$base/projects/$PROJECT_UUID/environments/$ENVIRONMENT_UUID/envs" -o /tmp/environment-envs.json || echo '[]' >/tmp/environment-envs.json
          APP_COUNT="$app_count" node <<'NODE'
          const fs=require('node:fs');
          const crypto=require('node:crypto');
          const storedHash=fs.readFileSync('/tmp/stored-pass.sha256','utf8').trim();
          let rows=[];
          const addShared=(file,scope)=>{let xs=[];try{xs=JSON.parse(fs.readFileSync(file,'utf8'))}catch{};for(const e of (Array.isArray(xs)?xs:[])){const key=String(e?.key||'');if(!/(REDIS|CACHE)/i.test(key))continue;const value=e?.real_value??e?.value??null;if(value!=null)rows.push({scope,resource:scope,key,value:String(value)})}};
          if(fs.existsSync('/tmp/app-candidates.ndjson')) for(const line of fs.readFileSync('/tmp/app-candidates.ndjson','utf8').split(/\r?\n/).filter(Boolean)){try{rows.push(JSON.parse(line))}catch{}}
          addShared('/tmp/project-envs.json','project-shared');
          addShared('/tmp/environment-envs.json','environment-shared');
          const candidates=[];
          const seen=new Set();
          const add=(label,url)=>{try{const u=new URL(url);if(!/^rediss?:$/.test(u.protocol)||!u.hostname)return;const pass=decodeURIComponent(u.password||'');if(!pass)return;const sig=crypto.createHash('sha256').update(`${u.protocol}//${u.username}:${pass}@${u.hostname}:${u.port||'6379'}/${u.pathname}`).digest('hex');if(seen.has(sig))return;seen.add(sig);candidates.push({label,url,password_differs_from_stored:crypto.createHash('sha256').update(pass).digest('hex')!==storedHash})}catch{}};
          for(const r of rows){const v=String(r.value||'').trim();if(/^rediss?:\/\//i.test(v))add(`${r.scope}:${r.resource}:${r.key}`,v)}
          // Also pair REDIS_PASSWORD with a Redis URL/host from the same resource when possible.
          const groups=new Map();
          for(const r of rows){const k=`${r.scope}:${r.resource}`;if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r)}
          const db=JSON.parse(fs.readFileSync('/tmp/redis.json','utf8')); const baseUrl=new URL(db.internal_db_url);
          for(const [group,items] of groups){
            const p=items.find(x=>String(x.key).toUpperCase()==='REDIS_PASSWORD'); if(!p)continue;
            const user=String(items.find(x=>String(x.key).toUpperCase()==='REDIS_USERNAME')?.value||'default');
            const host=String(items.find(x=>String(x.key).toUpperCase()==='REDIS_HOST')?.value||baseUrl.hostname);
            const port=String(items.find(x=>String(x.key).toUpperCase()==='REDIS_PORT')?.value||baseUrl.port||'6379');
            const u=new URL(baseUrl.toString());u.hostname=host;u.port=port;u.username=user;u.password=String(p.value);add(`${group}:REDIS_PASSWORD`,u.toString());
          }
          const alt=candidates.filter(x=>x.password_differs_from_stored);
          const safe={production_application_count:Number(process.env.APP_COUNT||0),redis_related_env_entry_count:rows.length,credential_candidate_count:candidates.length,alternate_password_candidate_count:alt.length,candidate_sources:candidates.map(x=>({label:x.label,password_differs_from_stored:x.password_differs_from_stored}))};
          console.log(JSON.stringify(safe,null,2));
          fs.writeFileSync('/tmp/redis-app-candidates-sanitized.json',JSON.stringify(safe,null,2));
          // Secret-bearing candidate URLs are kept only as a masked workflow artifact on the runner, never uploaded/logged.
          fs.writeFileSync('/tmp/redis-candidates.json',JSON.stringify(candidates.map(({label,url})=>({label,url}))),{mode:0o600});
          console.log(`MKETY_REDIS_ALTERNATE_CREDENTIAL_CANDIDATES=${alt.length}`);
          NODE

      - name: Upload sanitized drift inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mkety-redis-credential-drift-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            /tmp/redis-control-plane-sanitized.json
            /tmp/redis-app-candidates-sanitized.json
