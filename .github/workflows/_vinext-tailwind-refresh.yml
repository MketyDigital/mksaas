name: Temporary vinext Tailwind dependency refresh

on:
  push:
    branches:
      - fix/cloudflare-deployment-baseline
    paths:
      - '.github/workflows/_vinext-tailwind-refresh.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cloudflare-deployment-baseline
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Add Tailwind Vite integration
        run: pnpm add -D '@tailwindcss/vite@^4.1.18'
      - name: Commit manifest and lockfile
        run: |
          git config user.name "Mkety Baseline Bot"
          git config user.email "actions@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "build: integrate Tailwind v4 with vinext Vite"
          git push origin HEAD:fix/cloudflare-deployment-baseline
