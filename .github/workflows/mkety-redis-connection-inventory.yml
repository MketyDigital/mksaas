name: Mkety Redis Connection Inventory

on:
  push:
    branches:
      - ops/precutover-diagnostics-20260913

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      COOLIFY_URL: https://deploy.mkety.com
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      REDIS_UUID: i5hrrr4riyslz7hekhu5glkd
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Verify Cloudflare token status
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/token.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Accept: application/json' 'https://api.cloudflare.com/client/v4/user/tokens/verify')"
          HTTP_CODE="$code" node <<'NODE'
          const fs=require('node:fs'); const p=JSON.parse(fs.readFileSync('/tmp/token.json','utf8'));
          console.log(JSON.stringify({http_status:Number(process.env.HTTP_CODE),success:p.success===true,status:p.result?.status??null},null,2));
          NODE

      - name: Inspect Redis metadata shape without values
        shell: bash
        run: |
          set -euo pipefail
          base="${COOLIFY_URL%/}/api/v1"
          curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Accept: application/json' "$base/databases/$REDIS_UUID" -o /tmp/redis.json
          node <<'NODE'
          const fs=require('node:fs'); const x=JSON.parse(fs.readFileSync('/tmp/redis.json','utf8'));
          const interesting=['redis_password','internal_db_url','external_db_url','redis_conf','destination','destination_uuid','docker_compose','ports_mappings','volume_name','persistent_storage'];
          const presence={};
          for (const k of interesting) presence[k]={present:Object.prototype.hasOwnProperty.call(x,k),nonempty:x[k]!==null&&x[k]!==undefined&&String(x[k]).length>0};
          console.log(JSON.stringify({uuid:x.uuid,name:x.name,status:x.status,is_public:x.is_public===true,keys:Object.keys(x).sort(),presence},null,2));
          NODE
