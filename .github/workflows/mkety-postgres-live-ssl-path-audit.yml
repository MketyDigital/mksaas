name: Mkety Postgres Live SSL Path Audit

on:
  push:
    branches:
      - ops/redis-auth-diagnostic-20260914
    paths:
      - '.github/workflows/mkety-postgres-live-ssl-path-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      COOLIFY_URL: https://deploy.mkety.com
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      PROJECT_UUID: 0zqhpkprlhtvlacmsgmfyyhs
      ENVIRONMENT_UUID: rtebcetyfvzlaiqitzcp0gl8
      SERVER_UUID: ynkdc4tx6bi7cyxf0kuy8kte
      POSTGRES_UUID: hgxwkiyxgbmb2i3pl57kmxc8
    steps:
      - name: Resolve database connection
        shell: bash
        run: |
          set -euo pipefail
          base="${COOLIFY_URL%/}/api/v1"
          curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" "$base/databases/$POSTGRES_UUID" -o /tmp/db.json
          node <<'NODE' >/tmp/db.env
          const x=require('/tmp/db.json');if(!x.internal_db_url)process.exit(2);const u=new URL(x.internal_db_url);
          console.log('DB_URL='+x.internal_db_url);console.log('DB_HOST='+u.hostname);console.log('DB_PORT='+(u.port||'5432'));
          NODE
          while IFS='=' read -r k v; do echo "::add-mask::$v"; echo "$k=$v" >> "$GITHUB_ENV"; done </tmp/db.env

      - name: Create isolated read-only auditor
        id: app
        shell: bash
        run: |
          set -euo pipefail
          base="${COOLIFY_URL%/}/api/v1"
          node <<'NODE' >/tmp/create.json
          const dockerfile=['FROM alpine:3.20','RUN apk add --no-cache openssl postgresql-client coreutils grep','CMD ["sleep", "infinity"]',''].join('\n');
          process.stdout.write(JSON.stringify({project_uuid:process.env.PROJECT_UUID,server_uuid:process.env.SERVER_UUID,environment_uuid:process.env.ENVIRONMENT_UUID,dockerfile:Buffer.from(dockerfile).toString('base64'),name:`mkety-pg-live-ssl-audit-${process.env.GITHUB_SHA.slice(0,10)}`,description:'Read-only PostgreSQL live SSL path audit',ports_exposes:'3000'}));
          NODE
          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/create-r.json -w '%{http_code}' -X POST -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/create.json "$base/applications/dockerfile")"; [ "$code" = 201 ]
          uuid="$(node -e "const x=require('/tmp/create-r.json');if(!x.uuid)process.exit(1);process.stdout.write(x.uuid)")"; echo "uuid=$uuid" >> "$GITHUB_OUTPUT"

      - name: Mount database host directory and audit paths
        shell: bash
        env:
          APP_UUID: ${{ steps.app.outputs.uuid }}
        run: |
          set -euo pipefail
          base="${COOLIFY_URL%/}/api/v1"
          HOST_PATH="/data/coolify/databases/$POSTGRES_UUID" node -e 'process.stdout.write(JSON.stringify({type:"persistent",name:`mkety-pg-live-ssl-audit-${process.env.GITHUB_SHA.slice(0,10)}`,mount_path:"/db",host_path:process.env.HOST_PATH}))' >/tmp/storage.json
          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/storage-r.json -w '%{http_code}' -X POST -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/storage.json "$base/applications/$APP_UUID/storages")"; [ "$code" = 201 ]
          cat >/tmp/audit.sh <<'SH'
          set -eu
          echo MKETY_LIVE_SSL_CERT_SETTING="$(psql "$DB_URL" -Atqc 'SHOW ssl_cert_file;')"
          echo MKETY_LIVE_SSL_KEY_SETTING="$(psql "$DB_URL" -Atqc 'SHOW ssl_key_file;')"
          echo MKETY_LIVE_SSL_CA_SETTING="$(psql "$DB_URL" -Atqc 'SHOW ssl_ca_file;')"
          echo MKETY_LIVE_SSL_CONFIG_FILE="$(psql "$DB_URL" -Atqc 'SHOW config_file;')"
          echo MKETY_LIVE_SSL_DATA_DIR="$(psql "$DB_URL" -Atqc 'SHOW data_directory;')"
          echo MKETY_LIVE_SSL_SELECTED_COMPOSE_LINES_BEGIN
          grep -nE '(^[[:space:]]*(volumes|command):|ssl|server\.(crt|key)|postgresql\.conf|PGDATA)' /db/docker-compose.yml | sed -E 's/(PASSWORD|SECRET|TOKEN|DATABASE_URL|POSTGRES_PASSWORD)[^[:space:]]*/REDACTED/Ig' || true
          echo MKETY_LIVE_SSL_SELECTED_COMPOSE_LINES_END
          openssl s_client -starttls postgres -connect "$DB_HOST:$DB_PORT" -showcerts </dev/null >/tmp/tls.txt 2>&1
          sed -n '/-----BEGIN CERTIFICATE-----/,/-----END CERTIFICATE-----/p' /tmp/tls.txt | sed -n '1,/-----END CERTIFICATE-----/p' >/tmp/served.pem
          echo MKETY_LIVE_SSL_SERVED_BYTES="$(wc -c </tmp/served.pem | tr -d ' ')"
          echo MKETY_LIVE_SSL_HOST_CERT_BYTES="$(wc -c </db/ssl/server.crt | tr -d ' ')"
          host_fp="$(openssl x509 -in /db/ssl/server.crt -noout -fingerprint -sha256 | sed 's/.*=//')"; served_fp="$(openssl x509 -in /tmp/served.pem -noout -fingerprint -sha256 | sed 's/.*=//')"
          [ "$host_fp" = "$served_fp" ] && echo MKETY_LIVE_SSL_HOST_SERVED_MATCH=true || echo MKETY_LIVE_SSL_HOST_SERVED_MATCH=false
          echo MKETY_LIVE_SSL_AUDIT_OK=true
          SH
          base64 -w0 /tmp/audit.sh >/tmp/script.b64
          put_env(){ KEY="$1" VALUE="$2" node -e 'process.stdout.write(JSON.stringify({key:process.env.KEY,value:process.env.VALUE,is_preview:false,is_literal:true,is_multiline:false,is_shown_once:true}))' >/tmp/env.json; code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/env-r.json -w '%{http_code}' -X POST -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/env.json "$base/applications/$APP_UUID/envs")"; [ "$code" = 201 ]; }
          put_env DB_URL "$DB_URL"; put_env DB_HOST "$DB_HOST"; put_env DB_PORT "$DB_PORT"; put_env SCRIPT_B64 "$(cat /tmp/script.b64)"
          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/deploy.json -w '%{http_code}' -X POST -H "Authorization: Bearer $COOLIFY_API_TOKEN" "$base/deploy?uuid=$APP_UUID&force=true")"; [ "$code" = 200 ]
          duuid="$(node -e "const x=require('/tmp/deploy.json');const d=x.deployments?.[0];if(!d?.deployment_uuid)process.exit(1);process.stdout.write(d.deployment_uuid)")"
          for i in $(seq 1 120); do curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" "$base/deployments/$duuid" -o /tmp/d.json; s="$(node -e "process.stdout.write(String(require('/tmp/d.json').status||''))")"; case "${s,,}" in finished|success|successful|succeeded|completed) break;; failed|failure|error|cancelled|canceled) exit 12;; esac; sleep 3; done
          node -e 'process.stdout.write(JSON.stringify({name:"mkety-pg-live-ssl-audit",command:"echo $SCRIPT_B64 | base64 -d | sh",frequency:"0 0 * * *",timeout:300,enabled:false}))' >/tmp/task-body.json
          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/task-r.json -w '%{http_code}' -X POST -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/task-body.json "$base/applications/$APP_UUID/scheduled-tasks")"; [ "$code" = 201 ]
          tid="$(node -e "const x=require('/tmp/task-r.json');if(!x.uuid)process.exit(1);process.stdout.write(x.uuid)")"
          curl --proto '=https' --tlsv1.2 -fsS -X POST -H "Authorization: Bearer $COOLIFY_API_TOKEN" "$base/applications/$APP_UUID/scheduled-tasks/$tid/execute" >/dev/null
          for i in $(seq 1 90); do curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" "$base/applications/$APP_UUID/scheduled-tasks/$tid/executions" -o /tmp/e.json; s="$(node -e "const x=require('/tmp/e.json');process.stdout.write(String(x?.[0]?.status||''))")"; case "${s,,}" in success) break;; failed|failure|error) exit 13;; esac; sleep 3; done
          node - <<'NODE'
          const x=require('/tmp/e.json');const m=String(x?.[0]?.message||'');console.log(m.split(/\r?\n/).filter(l=>l.includes('MKETY_LIVE_SSL_')||/ssl|server\.(crt|key)|volumes|postgresql\.conf|PGDATA/i.test(l)).join('\n'));if(!m.includes('MKETY_LIVE_SSL_AUDIT_OK=true'))process.exit(1);
          NODE

      - name: Cleanup
        if: always() && steps.app.outputs.uuid != ''
        shell: bash
        env:
          APP_UUID: ${{ steps.app.outputs.uuid }}
        run: |
          curl --proto '=https' --tlsv1.2 -sS -X DELETE -H "Authorization: Bearer $COOLIFY_API_TOKEN" "${COOLIFY_URL%/}/api/v1/applications/$APP_UUID" >/dev/null || true
