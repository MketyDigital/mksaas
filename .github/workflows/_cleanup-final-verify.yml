name: Verify immutable cleanup baseline

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/_cleanup-final-verify.yml'

permissions:
  contents: read

env:
  CI: 'true'
  SKIP_ENV_VALIDATION: 'true'
  DATABASE_URL: postgresql://verify:verify@localhost:5432/verify
  EXPECTED_SHA: c713d8b05af57b042c0ee52db9597d6a04f16f1c

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
      - name: Verify immutable checkout
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify cleanup invariants
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eiq 'next-auth|auth0' package.json
          ! grep -Eq 'AUTH_SECRET=' .devcontainer/scripts/post-create.sh .env.example .envrc.example
          grep -q 'MKETY_AUTH_SESSION_SECRET' .devcontainer/scripts/post-create.sh
          ! grep -Eiq 'open-next|\.open-next|opennext' .gitignore eslint.config.mjs tsconfig.json package.json
          ! grep -Eiq 'boilerplate|create-awesome-node-app|nextjs-saas-ai-template' README.md src/app/_landing-components/LandingFooter.tsx src/app/layout.tsx
          grep -q '"name": "mkety-platform"' wrangler.jsonc
          grep -q '"preview"' wrangler.jsonc
          grep -q 'mkety-platform-preview' docs/AUTHENTICATION.md docs/MKETY_AUTH_SOURCE_OF_TRUTH.md
          ! grep -q 'CLOUDFLARE_WORKER_NAME' docs/AUTHENTICATION.md docs/MKETY_AUTH_SOURCE_OF_TRUTH.md
      - name: Verify migrations
        run: |
          pnpm db:check:migrations
          pnpm exec drizzle-kit check
      - name: Run full tests
        run: pnpm test
      - name: Run type-check
        run: pnpm type-check
      - name: Run lint
        run: pnpm lint
      - name: Check vinext compatibility
        run: pnpx vinext check
      - name: Build production artifact
        run: pnpm build
      - name: Validate isolated preview packaging
        run: pnpm run deploy --env preview --dry-run
