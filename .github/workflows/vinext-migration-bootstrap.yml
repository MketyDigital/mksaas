name: Vinext migration bootstrap

on:
  push:
    branches:
      - feat/cloudflare-vinext-migration
    paths:
      - '.github/workflows/vinext-migration-bootstrap.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run vinext compatibility check
        run: pnpm dlx vinext@latest check
