name: Usage Credits TDD

on:
  push:
    branches:
      - feat/mkety-usage-credits-core

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Usage/Credits targeted tests
        run: pnpm test -- src/features/usage-credits/meter-keys.test.ts src/shared/db/schema/usage-credits.test.ts
