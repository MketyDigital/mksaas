name: Mkety DomainNameAPI Direct OT&E Diagnostic

on:
  pull_request:
    paths:
      - 'src/features/domains/server/domainnameapi.ts'
      - 'scripts/verify-domainnameapi-ote-direct.ts'
      - '.github/workflows/mkety-domainnameapi-direct-ote-diagnostic.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: preview
    env:
      DOMAINNAMEAPI_OTE_USERNAME: ${{ secrets.DOMAINNAMEAPI_OTE_USERNAME }}
      DOMAINNAMEAPI_OTE_API_TOKEN: ${{ secrets.DOMAINNAMEAPI_OTE_API_TOKEN }}
      DOMAINNAMEAPI_LIVE_USERNAME: ${{ secrets.DOMAINNAMEAPI_USERNAME }}
      DOMAINNAMEAPI_LIVE_API_TOKEN: ${{ secrets.DOMAINNAMEAPI_API_TOKEN }}
      DOMAINNAMEAPI_OTE_BASE_URL: ${{ secrets.DOMAINNAMEAPI_OTE_BASE_URL || vars.DOMAINNAMEAPI_OTE_BASE_URL }}
      DOMAINNAMEAPI_NAME_SERVERS: ${{ secrets.DOMAINNAMEAPI_NAME_SERVERS || vars.DOMAINNAMEAPI_NAME_SERVERS }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect OT&E credentials
        id: credentials
        shell: bash
        run: |
          set -euo pipefail
          username="${DOMAINNAMEAPI_OTE_USERNAME:-}"
          token="${DOMAINNAMEAPI_OTE_API_TOKEN:-}"
          if [ -n "$username" ] && [ -n "$token" ]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'source=ote-specific' >> "$GITHUB_OUTPUT"
            echo "::add-mask::$username"
            echo "::add-mask::$token"
            echo "DOMAINNAMEAPI_USERNAME=$username" >> "$GITHUB_ENV"
            echo "DOMAINNAMEAPI_API_TOKEN=$token" >> "$GITHUB_ENV"
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'source=missing-ote-specific' >> "$GITHUB_OUTPUT"
          fi

      - name: Execute real DomainNameAPI OT&E quote
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/verify-domainnameapi-ote-direct.ts | tee /tmp/domainnameapi-direct-ote.json
          node -e "const x=require('/tmp/domainnameapi-direct-ote.json');if(x.ok!==true)process.exit(1)"

      - name: Publish OT&E diagnostic
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          let result=null;
          try{result=JSON.parse(fs.readFileSync('/tmp/domainnameapi-direct-ote.json','utf8'))}catch{}
          const credentials='${{ steps.credentials.outputs.available }}'==='true';
          const rows=['## DomainNameAPI direct OT&E diagnostic','',
            '- GitHub preview credentials available: '+credentials,
            '- Real OT&E quote executed: '+Boolean(result?.ok),
          ];
          if(result){
            rows.push('- Quote domain: '+result.domain);
            rows.push('- Availability response: '+result.available);
            rows.push('- Currency: '+result.currency);
          }
          if(!credentials){
            rows.push('- Blocker: add DOMAINNAMEAPI_OTE_USERNAME and DOMAINNAMEAPI_OTE_API_TOKEN to the preview GitHub Environment. Existing live DOMAINNAMEAPI_* credentials are intentionally not used against OT&E.');
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,rows.join('\n')+'\n');
          console.log(JSON.stringify({credentialsAvailable:credentials,result},null,2));
          NODE
