name: Mkety Platform Core Workspaces Smoke

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'src/app/(tenant)/t/[tenant]/projects/**'
      - 'src/features/projects/**'
      - 'docs/superpowers/specs/2026-09-05-mkety-platform-core-workspaces-design.md'
      - 'docs/superpowers/plans/2026-09-05-mkety-platform-core-workspaces.md'
      - '.github/workflows/mkety-platform-core-workspaces-smoke.yml'

concurrency:
  group: mkety-platform-core-workspaces-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace-smoke:
    name: Test Mkety workspace shell
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run workspace tests
        run: pnpm test -- src/features/projects/workspaces/registry.test.ts src/features/projects/workspaces/WorkspaceHub.test.tsx src/features/projects/workspaces/WorkspaceShell.test.tsx

      - name: Type-check
        run: pnpm type-check
