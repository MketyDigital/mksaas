name: Mkety Platform Core Workspaces Smoke

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'src/app/(tenant)/t/[tenant]/projects/**'
      - 'src/app/api/automation/webhooks/**'
      - 'src/features/projects/**'
      - 'src/features/ai/lib/agent-runtime.ts'
      - 'src/shared/db/schema/workflow-webhook*'
      - 'src/shared/db/migrations/**'
      - 'docs/superpowers/specs/2026-09-05-mkety-platform-core-workspaces-design.md'
      - 'docs/superpowers/plans/2026-09-05-mkety-platform-core-workspaces.md'
      - '.github/workflows/mkety-platform-core-workspaces-smoke.yml'

permissions:
  contents: read

concurrency:
  group: mkety-platform-core-workspaces-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace-smoke:
    name: Test Mkety workspace shell
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run workspace tests
        run: pnpm test -- src/features/projects/workspaces/registry.test.ts src/features/projects/workspaces/WorkspaceHub.test.tsx src/features/projects/workspaces/WorkspaceShell.test.tsx src/features/projects/workspaces/AiWorkspaceOverview.test.tsx src/features/projects/workspaces/AutomationWorkspaceOverview.test.tsx src/features/projects/workspaces/DeployWorkspaceOverview.test.tsx src/features/projects/workspaces/SolutionHubWorkspaceOverview.test.tsx src/features/projects/workspaces/TradingWorkspaceOverview.test.tsx src/features/projects/workspaces/automation/automation-model.test.ts src/features/projects/workspaces/automation/AutomationBuilderShell.test.tsx src/features/projects/workspaces/automation/workflow-drafts.test.ts src/features/projects/workspaces/automation/AutomationWorkflowDraftForm.test.tsx src/features/projects/workspaces/automation/workflow-edit-drafts.test.ts src/features/projects/workspaces/automation/AutomationWorkflowMetadataForm.test.tsx src/features/projects/workspaces/automation/workflow-nodes.test.ts src/features/projects/workspaces/automation/workflow-node-drafts.test.ts src/features/projects/workspaces/automation/AutomationWorkflowDraftNodeForm.test.tsx src/features/projects/workspaces/automation/workflow-node-config-drafts.test.ts src/features/projects/workspaces/automation/AutomationWorkflowNodeConfigDraftForm.test.tsx src/features/projects/workspaces/automation/workflow-node-structure-drafts.test.ts src/features/projects/workspaces/automation/AutomationWorkflowNodeStructureDraftForm.test.tsx src/features/projects/workspaces/automation/workflow-preflight.test.ts src/features/projects/workspaces/automation/AutomationWorkflowPreflightPanel.test.tsx src/features/projects/workspaces/automation/workflow-runtime-readiness.test.ts src/features/projects/workspaces/automation/http-action-runtime.test.ts src/features/projects/workspaces/automation/agent-dependency-readiness.test.ts src/features/ai/lib/agent-runtime.test.ts src/features/projects/workspaces/automation/agent-action-runtime.test.ts src/features/projects/workspaces/automation/internal-execution-kernel.test.ts src/features/projects/workspaces/automation/manual-run-foundation.test.ts src/features/projects/workspaces/automation/AutomationWorkflowManualRunForm.test.tsx src/features/projects/workspaces/automation/webhook-security.test.ts src/features/projects/workspaces/automation/webhook-secret-crypto.test.ts src/shared/db/schema/workflow-webhooks.test.ts src/features/projects/workspaces/automation/webhook-endpoints.test.ts src/features/projects/workspaces/automation/webhook-delivery-admission.test.ts src/features/projects/workspaces/automation/workflow-execution-service.test.ts src/features/projects/workspaces/automation/webhook-ingress.test.ts src/features/projects/workspaces/automation/AutomationWorkflowWebhookPanel.test.tsx 'src/app/api/automation/webhooks/[endpointId]/route.test.ts'
      - name: Type-check
        run: pnpm type-check
