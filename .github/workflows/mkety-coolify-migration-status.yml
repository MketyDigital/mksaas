name: Mkety Coolify Migration Status

on:
  push:
    branches:
      - fix/production-db-private-runner
    paths:
      - '.github/workflows/mkety-coolify-migration-status.yml'

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COOLIFY_URL: https://deploy.mkety.com
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      TARGET_PREFIX: mkety-db-migrate-44b096f9f793
    steps:
      - name: Read sanitized current migration state
        shell: bash
        run: |
          set -euo pipefail
          base="${COOLIFY_URL%/}/api/v1"
          auth=(-H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Accept: application/json')
          curl --proto '=https' --tlsv1.2 -fsS "${auth[@]}" "$base/applications" -o /tmp/apps.json
          app_uuid="$(PREFIX="$TARGET_PREFIX" node <<'NODE'
          const raw=require('/tmp/apps.json'); const list=Array.isArray(raw)?raw:(raw.data||[]);
          const x=list.find(v=>String(v.name||'').startsWith(process.env.PREFIX));
          if(x?.uuid) process.stdout.write(x.uuid);
          NODE
          )"
          [ -n "$app_uuid" ] || { echo 'Current migration app not found (possibly already cleaned up).'; exit 0; }
          curl --proto '=https' --tlsv1.2 -fsS "${auth[@]}" "$base/applications/$app_uuid" -o /tmp/app.json
          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/logs.json -w '%{http_code}' "${auth[@]}" "$base/applications/$app_uuid/logs?lines=300&show_timestamps=false")"
          CODE="$code" node <<'NODE'
          const app=require('/tmp/app.json'); let raw=null; try{raw=require('/tmp/logs.json')}catch{}
          const text=typeof raw?.logs==='string'?raw.logs:JSON.stringify(raw||{});
          console.log(JSON.stringify({
            appStatus:app.status,
            gitCommitSha:app.git_commit_sha,
            logsHttpStatus:Number(process.env.CODE),
            logsResponseKeys:raw&&typeof raw==='object'?Object.keys(raw):[],
            apiMessage:typeof raw?.message==='string'?raw.message:null,
            hasSuccessMarker:text.includes('MKETY_PRODUCTION_DB_MIGRATION_OK'),
            hasFailureMarker:text.includes('MKETY_PRODUCTION_DB_MIGRATION_FAILED:'),
            textLength:text.length
          },null,2));
          NODE
