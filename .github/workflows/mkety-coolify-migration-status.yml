name: Mkety Coolify Migration Status

on:
  push:
    branches:
      - fix/production-db-private-runner
    paths:
      - '.github/workflows/mkety-coolify-migration-status.yml'

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      COOLIFY_URL: https://deploy.mkety.com
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      APP_UUID: pqatozdd8n8apza8zj0cmvap
    steps:
      - name: Read sanitized migration state and log shape
        shell: bash
        run: |
          set -euo pipefail
          base="${COOLIFY_URL%/}/api/v1"
          auth=(-H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Accept: application/json')
          curl --proto '=https' --tlsv1.2 -fsS "${auth[@]}" "$base/applications/$APP_UUID" -o /tmp/app.json
          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/logs.json -w '%{http_code}' "${auth[@]}" "$base/applications/$APP_UUID/logs?lines=300&show_timestamps=false")"
          CODE="$code" node <<'NODE'
          const fs=require('fs');
          const app=require('/tmp/app.json');
          let raw=null; try{raw=require('/tmp/logs.json')}catch{}
          const text=typeof raw==='string'?raw:
            typeof raw?.logs==='string'?raw.logs:
            typeof raw?.log==='string'?raw.log:
            typeof raw?.data==='string'?raw.data:
            Array.isArray(raw)?raw.map(x=>typeof x==='string'?x:(x?.message||x?.log||'')).join('\n'):
            JSON.stringify(raw||{});
          const safe={
            httpStatus:Number(process.env.CODE),
            appStatus:app.status,
            gitCommitSha:app.git_commit_sha,
            responseType:Array.isArray(raw)?'array':typeof raw,
            responseKeys:raw&&typeof raw==='object'&&!Array.isArray(raw)?Object.keys(raw):[],
            hasSuccessMarker:text.includes('MKETY_PRODUCTION_DB_MIGRATION_OK'),
            mentionsMigrationError:/error|failed|exception/i.test(text),
            textLength:text.length
          };
          console.log(JSON.stringify(safe,null,2));
          NODE
