name: Mkety Coolify Migration Status

on:
  push:
    branches:
      - fix/production-db-private-runner
    paths:
      - '.github/workflows/mkety-coolify-migration-status.yml'

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      COOLIFY_URL: https://deploy.mkety.com
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      APP_UUID: vbtfxvpm7n0ejkya6pqubfo9
    steps:
      - name: Read sanitized deployment state
        shell: bash
        run: |
          set -euo pipefail
          base="${COOLIFY_URL%/}/api/v1"
          auth=(-H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Accept: application/json')
          curl --proto '=https' --tlsv1.2 -fsS "${auth[@]}" "$base/applications/$APP_UUID" -o /tmp/app.json
          curl --proto '=https' --tlsv1.2 -fsS "${auth[@]}" "$base/deployments/applications/$APP_UUID?skip=0&take=5" -o /tmp/deployments.json
          node <<'NODE'
          const app=require('/tmp/app.json');
          const raw=require('/tmp/deployments.json');
          const list=Array.isArray(raw)?raw:(raw.data||[]);
          const latest=list[0]||{};
          const logs=String(latest.logs||'');
          const safeHints=logs.split(/\r?\n/).filter(line=>/error|failed|failure|exit code|not found|permission|health/i.test(line)).slice(-8).map(line=>line.replace(/https?:\/\/\S+/g,'[url]'));
          console.log(JSON.stringify({
            appStatus:app.status,
            gitCommitSha:app.git_commit_sha,
            deploymentUuid:latest.deployment_uuid||null,
            deploymentStatus:latest.status||null,
            deploymentCreatedAt:latest.created_at||null,
            deploymentUpdatedAt:latest.updated_at||null,
            safeHints
          },null,2));
          NODE
