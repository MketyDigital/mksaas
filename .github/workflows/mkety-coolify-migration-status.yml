name: Mkety Coolify Migration Status

on:
  push:
    branches:
      - fix/production-db-private-runner
    paths:
      - '.github/workflows/mkety-coolify-migration-status.yml'

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      COOLIFY_URL: https://deploy.mkety.com
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      TARGET_PREFIX: mkety-db-migrate-71d6d73dec44
    steps:
      - name: Read sanitized current migration state
        shell: bash
        run: |
          set -euo pipefail
          base="${COOLIFY_URL%/}/api/v1"
          auth=(-H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Accept: application/json')
          curl --proto '=https' --tlsv1.2 -fsS "${auth[@]}" "$base/applications" -o /tmp/apps.json
          PREFIX="$TARGET_PREFIX" node <<'NODE'
          const raw=require('/tmp/apps.json'); const list=Array.isArray(raw)?raw:(raw.data||[]);
          const matches=list.filter(v=>String(v.name||'').startsWith(process.env.PREFIX));
          console.log(JSON.stringify(matches.map(v=>({uuid:v.uuid,name:v.name,status:v.status,git_commit_sha:v.git_commit_sha})),null,2));
          NODE
