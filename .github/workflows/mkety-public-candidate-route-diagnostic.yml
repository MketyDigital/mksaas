name: Mkety Public Candidate Route Diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/mkety-public-candidate-route-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CANDIDATE_WORKER_NAME: mkety-public-candidate

jobs:
  diagnose:
    name: Diagnose isolated candidate public routes
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 24
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Resolve workers.dev URL
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          for variable in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!variable:-}" ]; then
              echo "$variable is required."
              exit 1
            fi
          done
          response="$(curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
          subdomain="$(RESPONSE="$response" node -e "const x=JSON.parse(process.env.RESPONSE||'{}'); if(!x.success||!x.result?.subdomain) process.exit(1); process.stdout.write(x.result.subdomain)")"
          url="https://$CANDIDATE_WORKER_NAME.$subdomain.workers.dev"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo 'Resolved isolated candidate workers.dev URL.'

      - name: Diagnose candidate public routes and production copy
        shell: bash
        env:
          CANDIDATE_URL: ${{ steps.candidate.outputs.url }}
        run: |
          set -euo pipefail
          diagnostic=/tmp/mkety-candidate-route-smoke.log
          : > "$diagnostic"
          report() { printf '%s\n' "$*" | tee -a "$diagnostic"; }
          routes=(
            '/' '/platform' '/workspaces' '/solutions' '/academy' '/pricing' '/enterprise'
            '/about' '/docs' '/privacy' '/terms' '/contact' '/sitemap.xml' '/robots.txt'
          )
          quarantine='Next\.js SaaS AI Template|Auth\.js v5|OpenNext|Vercel|under development|\bWIP\b|GitHub|MketyDigital|mksaas|mklms|origin\.mkety\.com'
          for route in "${routes[@]}"; do
            ok=false
            code='000'
            for attempt in 1 2 3 4 5; do
              code="$(curl -L -sS -o /tmp/mkety-response -w '%{http_code}' "$CANDIDATE_URL$route" || true)"
              report "Candidate smoke $route attempt $attempt: HTTP $code"
              if [ "$code" = '200' ]; then ok=true; break; fi
              sleep 2
            done
            if [ "$ok" != 'true' ]; then
              report "Candidate route failed: $route (last HTTP $code)"
              head -c 400 /tmp/mkety-response 2>/dev/null | tr '\n' ' ' | tee -a "$diagnostic" || true
              printf '\n' | tee -a "$diagnostic"
              exit 1
            fi
            python3 -c "import re; p='/tmp/mkety-response'; b=open(p,'r',encoding='utf-8',errors='replace').read(); b=re.sub(r'<script\\b[^>]*>.*?</script>', '', b, flags=re.I|re.S); b=re.sub(r'<style\\b[^>]*>.*?</style>', '', b, flags=re.I|re.S); open('/tmp/mkety-visible-response','w',encoding='utf-8').write(b)"
            match="$(grep -Eio "$quarantine" /tmp/mkety-visible-response | head -n 1 || true)"
            if [ -n "$match" ]; then
              report "Candidate route contains non-production or internal wording: $route (matched: $match)"
              MATCH="$match" python3 -c "import os,re; body=open('/tmp/mkety-visible-response','r',encoding='utf-8',errors='replace').read(); needle=os.environ['MATCH']; m=re.search(re.escape(needle),body,re.I); print('Context:',re.sub(r'\\s+',' ',body[max(0,m.start()-160):min(len(body),m.end()+160)])) if m else None" | tee -a "$diagnostic"
              exit 1
            fi
            report "OK $route"
          done

      - name: Upload route diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mkety-candidate-route-smoke-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: /tmp/mkety-candidate-route-smoke.log
