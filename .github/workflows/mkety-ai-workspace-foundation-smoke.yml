name: Mkety AI Workspace Foundation Smoke

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'src/app/(tenant)/t/[tenant]/projects/**'
      - 'src/features/projects/workspaces/ai/**'
      - 'docs/superpowers/specs/2026-09-05-mkety-ai-workspace-foundation-design.md'
      - 'docs/superpowers/plans/2026-09-05-mkety-ai-workspace-foundation.md'
      - '.github/workflows/mkety-ai-workspace-foundation-smoke.yml'

concurrency:
  group: mkety-ai-workspace-foundation-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-workspace-smoke:
    name: Test Mkety AI workspace foundation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run AI workspace tests
        run: pnpm test -- src/features/projects/workspaces/ai/AiWorkspaceStatusPanel.test.tsx src/features/projects/workspaces/ai/AiWorkspaceReadiness.test.tsx src/features/projects/workspaces/ai/AiAgentSummaryGrid.test.tsx src/features/projects/workspaces/ai/AgentBuilderStatusPanel.test.tsx

      - name: Type-check
        run: pnpm type-check
