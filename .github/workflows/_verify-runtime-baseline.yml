name: Final runtime baseline verification

on:
  push:
    branches:
      - fix/cloudflare-deployment-baseline
    paths:
      - '.github/workflows/_verify-runtime-baseline.yml'

permissions:
  contents: write

concurrency:
  group: verify-runtime-baseline
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cloudflare-deployment-baseline
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm type-check
      - run: pnpm lint
      - name: Verify vinext compatibility
        run: pnpx vinext check
      - name: Build authoritative Cloudflare runtime
        env:
          SKIP_ENV_VALIDATION: 'true'
        run: pnpm build
      - name: Verify generated Worker entry
        run: |
          node --input-type=module <<'EOF'
          import { existsSync, readFileSync, readdirSync, statSync } from 'node:fs';
          import { dirname, join, resolve } from 'node:path';
          const configs = [];
          const walk = (dir) => {
            for (const name of readdirSync(dir)) {
              const path = join(dir, name);
              if (statSync(path).isDirectory()) walk(path);
              else if (name === 'wrangler.json') configs.push(path);
            }
          };
          walk('dist');
          const deployment = configs.map((configPath) => {
            const config = JSON.parse(readFileSync(configPath, 'utf8'));
            if (!config.main) return null;
            const workerEntry = resolve(dirname(configPath), config.main);
            return existsSync(workerEntry) ? { configPath, workerEntry } : null;
          }).find(Boolean);
          if (!deployment) throw new Error(`No generated Worker entry found. Wrangler configs: ${configs.join(', ')}`);
          console.log(`Verified ${deployment.configPath} -> ${deployment.workerEntry}`);
          EOF
      - name: Self-clean verification workflow
        run: |
          git config user.name "Mkety Baseline Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/_verify-runtime-baseline.yml
          git commit -m "ci: remove completed runtime baseline verifier"
          git pull --rebase origin fix/cloudflare-deployment-baseline
          git push origin HEAD:fix/cloudflare-deployment-baseline
