name: Migration baseline strictness GREEN

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/_migration-generate-probe.yml'

permissions:
  contents: read

jobs:
  green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Healthy baseline passes
        run: |
          pnpm db:check:migrations
          pnpm exec drizzle-kit check
      - name: Remove latest journal entry to simulate drift
        run: |
          cp src/shared/db/migrations/meta/_journal.json /tmp/journal.json
          node - <<'NODE'
          const fs = require('fs');
          const p = 'src/shared/db/migrations/meta/_journal.json';
          const j = JSON.parse(fs.readFileSync(p, 'utf8'));
          const removed = j.entries.pop();
          if (removed?.tag !== '0009_mkety_auth') {
            throw new Error(`Expected to remove 0009_mkety_auth, got ${removed?.tag}`);
          }
          fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          NODE
      - name: GREEN - baseline check rejects SQL missing from journal
        run: |
          set +e
          output="$(pnpm db:check:migrations 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          test "$status" -ne 0
          printf '%s\n' "$output" | grep -F 'Drizzle journal is missing SQL migrations: 0009_mkety_auth'
      - name: Restore and prove healthy baseline still passes
        run: |
          cp /tmp/journal.json src/shared/db/migrations/meta/_journal.json
          pnpm db:check:migrations
          pnpm exec drizzle-kit check
