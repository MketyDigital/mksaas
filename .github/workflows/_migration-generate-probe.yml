name: Migration metadata forward-baseline probe

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/_migration-generate-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CI: 'true'
      DATABASE_URL: postgresql://probe:probe@localhost:5432/probe
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Preserve authoritative manual SQL bodies
        run: |
          cp src/shared/db/migrations/0008_workflows.sql /tmp/0008_workflows.sql
          cp src/shared/db/migrations/0009_mkety_auth.sql /tmp/0009_mkety_auth.sql
          rm src/shared/db/migrations/0008_workflows.sql
          rm src/shared/db/migrations/0009_mkety_auth.sql
      - name: Let Drizzle regenerate the missing 0008 and 0009 journal entries
        run: |
          pnpm db:generate --custom --name=workflows
          pnpm db:generate --custom --name=mkety_auth
          cp src/shared/db/migrations/meta/_journal.json /tmp/journal-through-0009.json
      - name: Restore authoritative manual SQL bodies
        run: |
          cp /tmp/0008_workflows.sql src/shared/db/migrations/0008_workflows.sql
          cp /tmp/0009_mkety_auth.sql src/shared/db/migrations/0009_mkety_auth.sql
          cmp /tmp/0008_workflows.sql src/shared/db/migrations/0008_workflows.sql
          cmp /tmp/0009_mkety_auth.sql src/shared/db/migrations/0009_mkety_auth.sql
      - name: Capture current schema snapshot with Drizzle
        run: |
          pnpm db:generate --name=current_schema_capture
          test -f src/shared/db/migrations/0010_current_schema_capture.sql
          test -f src/shared/db/migrations/meta/0010_snapshot.json
          cp src/shared/db/migrations/meta/0010_snapshot.json src/shared/db/migrations/meta/0009_snapshot.json
          cp /tmp/journal-through-0009.json src/shared/db/migrations/meta/_journal.json
          rm src/shared/db/migrations/0010_current_schema_capture.sql
          rm src/shared/db/migrations/meta/0010_snapshot.json
      - name: Verify forward baseline metadata shape
        run: |
          test -f src/shared/db/migrations/meta/0008_snapshot.json
          test -f src/shared/db/migrations/meta/0009_snapshot.json
          node - <<'NODE'
          const fs = require('fs');
          const journal = JSON.parse(fs.readFileSync('src/shared/db/migrations/meta/_journal.json', 'utf8'));
          const tags = journal.entries.map((entry) => entry.tag);
          if (tags.at(-2) !== '0008_workflows' || tags.at(-1) !== '0009_mkety_auth') {
            throw new Error(`Unexpected journal tail: ${tags.slice(-3).join(', ')}`);
          }
          if (journal.entries.at(-1)?.idx !== 9) {
            throw new Error(`Expected journal to end at idx 9, got ${journal.entries.at(-1)?.idx}`);
          }
          NODE
      - name: Prove forward generation is now a no-op
        run: |
          before="$(find src/shared/db/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort | sha256sum | cut -d' ' -f1)"
          pnpm db:generate --name=forward_probe
          after="$(find src/shared/db/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort | sha256sum | cut -d' ' -f1)"
          test "$before" = "$after"
          test ! -e src/shared/db/migrations/0010_forward_probe.sql
      - name: Validate migration baseline and Drizzle consistency
        run: |
          pnpm db:check:migrations
          pnpm exec drizzle-kit check
      - name: Show repair-only drift
        if: always()
        run: |
          echo '=== git status ==='
          git status --short
          echo '=== changed summary ==='
          git diff --stat || true
          echo '=== journal tail ==='
          node - <<'NODE'
          const fs = require('fs');
          const p = 'src/shared/db/migrations/meta/_journal.json';
          if (fs.existsSync(p)) {
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            console.log(j.entries.slice(-3));
          }
          NODE
          echo '=== SQL body hashes (must match backups) ==='
          sha256sum /tmp/0008_workflows.sql src/shared/db/migrations/0008_workflows.sql || true
          sha256sum /tmp/0009_mkety_auth.sql src/shared/db/migrations/0009_mkety_auth.sql || true
