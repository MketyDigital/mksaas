name: Migration baseline strictness RED

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/_migration-generate-probe.yml'

permissions:
  contents: read

jobs:
  red:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Remove latest journal entry to simulate drift
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const p = 'src/shared/db/migrations/meta/_journal.json';
          const j = JSON.parse(fs.readFileSync(p, 'utf8'));
          const removed = j.entries.pop();
          if (removed?.tag !== '0009_mkety_auth') {
            throw new Error(`Expected to remove 0009_mkety_auth, got ${removed?.tag}`);
          }
          fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          NODE
      - name: RED - baseline check must reject SQL missing from journal
        run: |
          if pnpm db:check:migrations; then
            echo 'RED CONFIRMED: current guard incorrectly accepts SQL that is missing from the Drizzle journal.' >&2
            exit 1
          fi
          echo 'Guard already rejects the drift; RED expectation was not reproduced.' >&2
          exit 2
