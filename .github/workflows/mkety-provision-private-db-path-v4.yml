name: Mkety Provision Private DB Path V4

on:
  push:
    branches: [ops/precutover-diagnostics-20260913]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      COOLIFY_URL: https://deploy.mkety.com
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_UUID: 0zqhpkprlhtvlacmsgmfyyhs
      ENVIRONMENT_UUID: rtebcetyfvzlaiqitzcp0gl8
      SERVER_UUID: ynkdc4tx6bi7cyxf0kuy8kte
      POSTGRES_UUID: hgxwkiyxgbmb2i3pl57kmxc8
      TUNNEL_ID: 3ced1d56-8418-42e5-830b-f7ce9cd6fde4
      TUNNEL_NAME: mkety-production-vpc
      DB_HOSTNAME: db-runtime.mkety.com
      CA_CERT_NAME: mkety-production-coolify-ca
      ACCESS_TOKEN_NAME: mkety-production-hyperdrive-ca
      ACCESS_APP_NAME: mkety-production-postgres
      ACCESS_POLICY_NAME: mkety-production-hyperdrive-ca-only
      HYPERDRIVE_NAME: mkety-production-db
      ZONE_NAME: mkety.com
    steps:
      - uses: actions/checkout@v4

      - name: Resolve private PostgreSQL metadata
        shell: bash
        run: |
          set -euo pipefail
          base="${COOLIFY_URL%/}/api/v1"
          curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Accept: application/json' "$base/databases/$POSTGRES_UUID" -o /tmp/db.json
          node <<'NODE' >/tmp/db.env
          const x=require('/tmp/db.json');
          if(x.is_public!==false) throw new Error('Production PostgreSQL unexpectedly public.');
          if(x.enable_ssl!==true) throw new Error('Production PostgreSQL TLS is not enabled.');
          if(!String(x.status||'').includes('healthy')) throw new Error('Production PostgreSQL is not healthy.');
          if(!x.internal_db_url) throw new Error('Private PostgreSQL URL missing.');
          const u=new URL(x.internal_db_url);
          const vals={DB_NAME:decodeURIComponent(u.pathname.replace(/^\//,'')),DB_USER:decodeURIComponent(u.username),DB_PASSWORD:decodeURIComponent(u.password),DB_INTERNAL_HOST:u.hostname,DB_INTERNAL_PORT:u.port||'5432'};
          for(const [k,v] of Object.entries(vals)) console.log(`${k}=${v}`);
          NODE
          while IFS='=' read -r k v; do echo "::add-mask::$v"; echo "$k=$v" >> "$GITHUB_ENV"; done </tmp/db.env
          echo 'MKETY_DB_ORIGIN_PREFLIGHT_OK=true'

      - name: Verify tunnel DNS Access app and protected inventory
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          acct="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Accept: application/json')
          curl --proto '=https' --tlsv1.2 -fsS "${auth[@]}" "$acct/cfd_tunnel/$TUNNEL_ID" -o /tmp/tunnel.json
          curl --proto '=https' --tlsv1.2 -fsS "${auth[@]}" "$acct/cfd_tunnel/$TUNNEL_ID/configurations" -o /tmp/tunnel-config.json
          curl --proto '=https' --tlsv1.2 -fsS "${auth[@]}" "$acct/hyperdrive/configs?per_page=100" -o /tmp/hyperdrives.json
          curl --proto '=https' --tlsv1.2 -fsS "${auth[@]}" "$acct/access/service_tokens?per_page=100" -o /tmp/tokens.json
          curl --proto '=https' --tlsv1.2 -fsS "${auth[@]}" "$acct/access/apps?per_page=100" -o /tmp/apps.json
          curl --proto '=https' --tlsv1.2 -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones?name=$ZONE_NAME&account.id=$CLOUDFLARE_ACCOUNT_ID&status=active&per_page=50" -o /tmp/zones.json
          zone_id="$(node -e "const p=require('/tmp/zones.json');const a=p.result||[];if(a.length!==1)process.exit(1);process.stdout.write(a[0].id)")"
          curl --proto '=https' --tlsv1.2 -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?name=$DB_HOSTNAME&per_page=100" -o /tmp/dns.json
          node <<'NODE'
          const t=require('/tmp/tunnel.json');
          if(t.success!==true||t.result?.id!==process.env.TUNNEL_ID||t.result?.name!==process.env.TUNNEL_NAME||String(t.result?.status).toLowerCase()!=='healthy') throw new Error('Dedicated tunnel mismatch.');
          const ingress=require('/tmp/tunnel-config.json').result?.config?.ingress||[];const r=ingress.filter(x=>x.hostname===process.env.DB_HOSTNAME);if(r.length!==1||!String(r[0].service||'').startsWith('tcp://'))throw new Error('DB tunnel ingress missing.');
          const dns=require('/tmp/dns.json').result||[];const expected=`${process.env.TUNNEL_ID}.cfargotunnel.com`;if(dns.length!==1||dns[0].type!=='CNAME'||String(dns[0].content).toLowerCase()!==expected.toLowerCase()||dns[0].proxied!==true)throw new Error('DB DNS mismatch.');
          const hd=require('/tmp/hyperdrives.json').result||[];const protectedMap=new Map([['mklms-fresh','bb7c9f70c2fe402080c22e06d0c0f305'],['mklms-mkety-academy-cached','6d6c69493e404097907fb8e7719d09a2'],['mklms-mkety-academy-fresh','c6033fd6696444ea97c7c2c93707b3bc'],['mklms-public-cache','14a4baf3773d41c88e4600967ab3b68d']]);for(const [name,id] of protectedMap){const x=hd.find(v=>v.name===name);if(!x||x.id!==id)throw new Error(`Protected Hyperdrive changed: ${name}`);}const target=hd.filter(x=>x.name===process.env.HYPERDRIVE_NAME);if(target.length!==0)throw new Error(`Expected no target before V4 creation; found ${target.length}`);
          NODE
          token_count="$(ACCESS_TOKEN_NAME="$ACCESS_TOKEN_NAME" node -e "const a=(require('/tmp/tokens.json').result||[]).filter(x=>x.name===process.env.ACCESS_TOKEN_NAME);if(a.length>1)process.exit(2);process.stdout.write(String(a.length))")"
          echo "token_count=$token_count" >> "$GITHUB_OUTPUT"
          if [ "$token_count" = 1 ]; then token_id="$(ACCESS_TOKEN_NAME="$ACCESS_TOKEN_NAME" node -e "const a=(require('/tmp/tokens.json').result||[]).filter(x=>x.name===process.env.ACCESS_TOKEN_NAME);process.stdout.write(a[0].id)")"; echo "token_id=$token_id" >> "$GITHUB_OUTPUT"; fi
          app_id="$(ACCESS_APP_NAME="$ACCESS_APP_NAME" DB_HOSTNAME="$DB_HOSTNAME" node -e "const a=(require('/tmp/apps.json').result||[]).filter(x=>x.name===process.env.ACCESS_APP_NAME);if(a.length!==1||(a[0].domain||'')!==process.env.DB_HOSTNAME)process.exit(2);process.stdout.write(a[0].id)")"
          echo "app_id=$app_id" >> "$GITHUB_OUTPUT"
          echo 'MKETY_V4_PREFLIGHT_OK=true'

      - name: Create supported Coolify CA probe and mount host CA
        id: caprobe
        shell: bash
        run: |
          set -euo pipefail
          base="${COOLIFY_URL%/}/api/v1"
          node <<'NODE' >/tmp/create.json
          const dockerfile=`FROM alpine:3.20\nRUN apk add --no-cache openssl\nCMD [\"sh\",\"-c\",\"set -eu; test -s /ca/coolify-ca.crt || { echo MKETY_CA_ERROR=missing-ca; exit 2; }; openssl x509 -in /ca/coolify-ca.crt -noout -checkend 86400 >/dev/null; openssl x509 -in /ca/coolify-ca.crt -noout -text | grep -q 'CA:TRUE' || { echo MKETY_CA_ERROR=not-ca; exit 3; }; if ! openssl s_client -starttls postgres -connect \\\"$DB_INTERNAL_HOST:$DB_INTERNAL_PORT\\\" -CAfile /ca/coolify-ca.crt -verify_return_error </dev/null >/tmp/pg-tls.txt 2>&1; then echo MKETY_CA_ERROR=postgres-chain-verification-failed; grep -E 'verify error|Verify return code' /tmp/pg-tls.txt | head -10 || true; exit 4; fi; grep -q 'Verify return code: 0 (ok)' /tmp/pg-tls.txt || { echo MKETY_CA_ERROR=postgres-chain-not-ok; exit 5; }; printf 'MKETY_CA_B64='; base64 /ca/coolify-ca.crt | tr -d '\\\\n'; printf '\\\\nMKETY_CA_CHAIN_OK=true\\\\n'; while true; do sleep 3600; done\"]\n`;
          process.stdout.write(JSON.stringify({project_uuid:process.env.PROJECT_UUID,server_uuid:process.env.SERVER_UUID,environment_uuid:process.env.ENVIRONMENT_UUID,dockerfile,build_pack:'dockerfile',name:`mkety-ca-probe-${process.env.GITHUB_SHA.slice(0,10)}`,description:'Ephemeral verified Coolify CA probe',autogenerate_domain:false,ports_exposes:'3000'}));
          NODE
          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/create-response.json -w '%{http_code}' -X POST -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/create.json "$base/applications/dockerfile")"
          [ "$code" = 201 ] || { echo "CA probe create failed HTTP $code"; cat /tmp/create-response.json; exit 20; }
          app_uuid="$(node -e "const x=require('/tmp/create-response.json');if(!x.uuid)process.exit(1);process.stdout.write(x.uuid)")"; echo "app_uuid=$app_uuid" >> "$GITHUB_OUTPUT"
          node <<'NODE' >/tmp/storage.json
          process.stdout.write(JSON.stringify({type:'persistent',name:`mkety-ca-${process.env.GITHUB_SHA.slice(0,10)}`,mount_path:'/ca/coolify-ca.crt',host_path:'/data/coolify/ssl/coolify-ca.crt'}));
          NODE
          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/storage-response.json -w '%{http_code}' -X POST -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/storage.json "$base/applications/$app_uuid/storages")"
          [ "$code" = 201 ] || { echo "CA host mount create failed HTTP $code"; cat /tmp/storage-response.json; exit 21; }
          for kv in "DB_INTERNAL_HOST=$DB_INTERNAL_HOST" "DB_INTERNAL_PORT=$DB_INTERNAL_PORT"; do
            k="${kv%%=*}"; v="${kv#*=}"; KEY="$k" VALUE="$v" node <<'NODE' >/tmp/env.json
          process.stdout.write(JSON.stringify({key:process.env.KEY,value:process.env.VALUE,is_preview:false,is_literal:true,is_multiline:false,is_shown_once:true}));
          NODE
            code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/env-response.json -w '%{http_code}' -X POST -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/env.json "$base/applications/$app_uuid/envs")"; [ "$code" = 201 ] || { echo "CA probe env create failed HTTP $code"; exit 22; }
          done
          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/deploy.json -w '%{http_code}' -X POST -H "Authorization: Bearer $COOLIFY_API_TOKEN" "$base/deploy?uuid=$app_uuid&force=true")"; [ "$code" = 200 ] || { echo "CA probe deploy failed HTTP $code"; exit 23; }
          deployment_uuid="$(node -e "const x=require('/tmp/deploy.json');const d=Array.isArray(x.deployments)?x.deployments[0]:null;if(!d?.deployment_uuid)process.exit(1);process.stdout.write(d.deployment_uuid)")"
          for i in $(seq 1 90); do curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" "$base/deployments/$deployment_uuid" -o /tmp/deployment.json; status="$(node -e "const x=require('/tmp/deployment.json');process.stdout.write(String(x.status||''))")"; case "${status,,}" in finished|success|successful|succeeded|completed) break;; failed|failure|error|cancelled|canceled) echo "CA probe deployment failed: $status"; exit 24;; esac; sleep 4; done
          found=no
          for i in $(seq 1 60); do curl --proto '=https' --tlsv1.2 -sS -H "Authorization: Bearer $COOLIFY_API_TOKEN" "$base/applications/$app_uuid/logs?lines=200&show_timestamps=false" -o /tmp/logs.json || true; if node -e "const x=require('/tmp/logs.json');process.exit(String(x.logs||'').includes('MKETY_CA_CHAIN_OK=true')?0:1)" 2>/dev/null; then found=yes; break; fi; sleep 3; done
          [ "$found" = yes ] || { echo 'CA probe did not prove PostgreSQL chain.'; node -e "const x=require('/tmp/logs.json');for(const l of String(x.logs||'').split(/\r?\n/))if(l.includes('MKETY_CA_ERROR='))console.log(l)" || true; exit 25; }
          node <<'NODE'
          const fs=require('node:fs');const x=require('/tmp/logs.json');const m=String(x.logs||'').match(/MKETY_CA_B64=([A-Za-z0-9+/=]+)/);if(!m)throw new Error('CA marker missing');fs.writeFileSync('/tmp/coolify-ca.b64',m[1]);
          NODE
          base64 -d /tmp/coolify-ca.b64 >/tmp/coolify-ca.crt
          openssl x509 -in /tmp/coolify-ca.crt -noout -checkend 86400 >/dev/null
          openssl x509 -in /tmp/coolify-ca.crt -noout -text | grep -q 'CA:TRUE'
          echo 'MKETY_COOLIFY_CA_CHAIN_OK=true'

      - name: Resolve or upload verified Coolify CA to Cloudflare
        id: cacert
        shell: bash
        run: |
          set -euo pipefail
          acct="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/certs.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Accept: application/json' "$acct/mtls_certificates?per_page=100")"
          [ "$code" = 200 ] || { echo "Cloudflare CA inventory failed HTTP $code"; node -e "const p=require('/tmp/certs.json');console.error(JSON.stringify({errors:p.errors||[]}))"; exit 30; }
          count="$(CA_CERT_NAME="$CA_CERT_NAME" node -e "const a=(require('/tmp/certs.json').result||[]).filter(x=>x.name===process.env.CA_CERT_NAME);if(a.length>1)process.exit(2);process.stdout.write(String(a.length))")"
          if [ "$count" = 0 ]; then
            CA_CERT_NAME="$CA_CERT_NAME" node <<'NODE' >/tmp/upload.json
          const fs=require('node:fs');process.stdout.write(JSON.stringify({name:process.env.CA_CERT_NAME,ca:true,certificates:fs.readFileSync('/tmp/coolify-ca.crt','utf8')}));
          NODE
            code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/upload-response.json -w '%{http_code}' -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/upload.json "$acct/mtls_certificates")"; case "$code" in 200|201) ;; *) echo "Cloudflare CA upload failed HTTP $code"; node -e "const p=require('/tmp/upload-response.json');console.error(JSON.stringify({errors:p.errors||[]}))"; exit 31;; esac
            ca_id="$(node -e "const p=require('/tmp/upload-response.json');if(p.success!==true||!p.result?.id||p.result?.ca!==true)process.exit(1);process.stdout.write(p.result.id)")"
          else ca_id="$(CA_CERT_NAME="$CA_CERT_NAME" node -e "const a=(require('/tmp/certs.json').result||[]).filter(x=>x.name===process.env.CA_CERT_NAME);if(a[0]?.ca!==true)process.exit(1);process.stdout.write(a[0].id)")"; fi
          echo "ca_id=$ca_id" >> "$GITHUB_OUTPUT"; echo 'MKETY_CLOUDFLARE_CA_OK=true'

      - name: Resolve fresh isolated Access token
        shell: bash
        env:
          TOKEN_COUNT: ${{ steps.preflight.outputs.token_count }}
          TOKEN_ID: ${{ steps.preflight.outputs.token_id }}
        run: |
          set -euo pipefail
          acct="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          if [ "$TOKEN_COUNT" = 0 ]; then printf '{"name":"%s","duration":"8760h"}' "$ACCESS_TOKEN_NAME" >/tmp/token.json; code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/token-response.json -w '%{http_code}' -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/token.json "$acct/access/service_tokens")"; else code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/token-response.json -w '%{http_code}' -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data '{}' "$acct/access/service_tokens/$TOKEN_ID/rotate")"; fi
          case "$code" in 200|201) ;; *) echo "Access token create/rotate failed HTTP $code"; exit 40;; esac
          node <<'NODE' >/tmp/token.env
          const p=require('/tmp/token-response.json');if(p.success!==true||!p.result?.id||!p.result?.client_id||!p.result?.client_secret)throw new Error('Token response incomplete');console.log(`ACCESS_TOKEN_ID=${p.result.id}`);console.log(`ACCESS_CLIENT_ID=${p.result.client_id}`);console.log(`ACCESS_CLIENT_SECRET=${p.result.client_secret}`);
          NODE
          while IFS='=' read -r k v; do echo "::add-mask::$v"; echo "$k=$v" >> "$GITHUB_ENV"; done </tmp/token.env
          echo 'MKETY_ACCESS_SERVICE_TOKEN_V4_OK=true'

      - name: Resolve or create isolated Service Auth policy
        shell: bash
        env:
          APP_ID: ${{ steps.preflight.outputs.app_id }}
        run: |
          set -euo pipefail
          acct="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$acct/access/apps/$APP_ID/policies?per_page=100" -o /tmp/policies.json
          count="$(ACCESS_POLICY_NAME="$ACCESS_POLICY_NAME" node -e "const a=(require('/tmp/policies.json').result||[]).filter(x=>x.name===process.env.ACCESS_POLICY_NAME);if(a.length>1)process.exit(2);process.stdout.write(String(a.length))")"
          if [ "$count" = 0 ]; then node <<'NODE' >/tmp/policy.json
          process.stdout.write(JSON.stringify({name:process.env.ACCESS_POLICY_NAME,decision:'non_identity',precedence:2,include:[{service_token:{token_id:process.env.ACCESS_TOKEN_ID}}],exclude:[],require:[]}));
          NODE
            code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/policy-response.json -w '%{http_code}' -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/policy.json "$acct/access/apps/$APP_ID/policies")"; case "$code" in 200|201) ;; *) echo "Access policy creation failed HTTP $code"; node -e "const p=require('/tmp/policy-response.json');console.error(JSON.stringify({errors:p.errors||[]}))"; exit 50;; esac
          else ACCESS_POLICY_NAME="$ACCESS_POLICY_NAME" ACCESS_TOKEN_ID="$ACCESS_TOKEN_ID" node <<'NODE'
          const p=(require('/tmp/policies.json').result||[]).find(x=>x.name===process.env.ACCESS_POLICY_NAME);const ids=(p.include||[]).map(x=>x.service_token?.token_id).filter(Boolean);if(p.decision!=='non_identity'||ids.length!==1||ids[0]!==process.env.ACCESS_TOKEN_ID)throw new Error('Existing V4 Access policy mismatch');
          NODE
          fi
          echo 'MKETY_ACCESS_POLICY_V4_OK=true'

      - name: Create Hyperdrive with verified private CA
        shell: bash
        env:
          CA_CERT_ID: ${{ steps.cacert.outputs.ca_id }}
        run: |
          set -euo pipefail
          acct="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          node <<'NODE' >/tmp/hd.json
          process.stdout.write(JSON.stringify({name:process.env.HYPERDRIVE_NAME,origin:{host:process.env.DB_HOSTNAME,database:process.env.DB_NAME,user:process.env.DB_USER,password:process.env.DB_PASSWORD,scheme:'postgres',access_client_id:process.env.ACCESS_CLIENT_ID,access_client_secret:process.env.ACCESS_CLIENT_SECRET},mtls:{ca_certificate_id:process.env.CA_CERT_ID,sslmode:'verify-ca'}}));
          NODE
          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/hd-response.json -w '%{http_code}' -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data-binary @/tmp/hd.json "$acct/hyperdrive/configs")"; case "$code" in 200|201) ;; *) echo "Hyperdrive verified-CA creation failed HTTP $code"; node -e "const p=require('/tmp/hd-response.json');console.error(JSON.stringify({errors:p.errors||[]}))"; exit 60;; esac
          node -e "const p=require('/tmp/hd-response.json');if(p.success!==true||!p.result?.id)process.exit(1);console.log('MKETY_HYPERDRIVE_ID='+p.result.id)"; echo 'MKETY_HYPERDRIVE_VERIFIED_CA_CREATE_OK=true'

      - name: Verify final private database chain and protected inventory
        shell: bash
        env:
          CA_CERT_ID: ${{ steps.cacert.outputs.ca_id }}
        run: |
          set -euo pipefail
          acct="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"; curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$acct/hyperdrive/configs?per_page=100" -o /tmp/final.json
          node <<'NODE'
          const hd=require('/tmp/final.json').result||[];const p=new Map([['mklms-fresh','bb7c9f70c2fe402080c22e06d0c0f305'],['mklms-mkety-academy-cached','6d6c69493e404097907fb8e7719d09a2'],['mklms-mkety-academy-fresh','c6033fd6696444ea97c7c2c93707b3bc'],['mklms-public-cache','14a4baf3773d41c88e4600967ab3b68d']]);for(const [n,id] of p){const x=hd.find(v=>v.name===n);if(!x||x.id!==id)throw new Error(`Protected Hyperdrive changed: ${n}`);}const a=hd.filter(x=>x.name===process.env.HYPERDRIVE_NAME);if(a.length!==1)throw new Error(`Expected exactly one target; found ${a.length}`);const x=a[0];if(x.origin?.host!==process.env.DB_HOSTNAME||x.origin?.service_id)throw new Error('Hyperdrive origin mismatch');if(x.mtls?.ca_certificate_id!==process.env.CA_CERT_ID||String(x.mtls?.sslmode||'').toLowerCase()!=='verify-ca')throw new Error('Hyperdrive verified CA mismatch');console.log(`MKETY_HYPERDRIVE_ID=${x.id}`);
          NODE
          echo 'MKETY_PRIVATE_DB_PATH_OK=true'

      - name: Delete ephemeral CA probe
        if: always() && steps.caprobe.outputs.app_uuid != ''
        shell: bash
        env:
          APP_UUID: ${{ steps.caprobe.outputs.app_uuid }}
        run: |
          curl --proto '=https' --tlsv1.2 -sS -X DELETE -H "Authorization: Bearer $COOLIFY_API_TOKEN" "${COOLIFY_URL%/}/api/v1/applications/$APP_UUID" >/dev/null || true
          echo 'Ephemeral CA probe cleanup requested.'
