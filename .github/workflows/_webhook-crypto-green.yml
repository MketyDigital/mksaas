name: Webhook crypto GREEN verification

on:
  push:
    branches:
      - feat/mkety-automation-webhook-trigger
    paths:
      - '.github/workflows/_webhook-crypto-green.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify webhook authenticated-encryption regressions
        run: pnpm test -- src/features/projects/workspaces/automation/webhook-secret-crypto.test.ts
