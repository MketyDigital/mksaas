name: Mkety ZITADEL Login V2 Schema Probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mkety-zitadel-login-v2-schema-probe.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      ZITADEL_ISSUER: ${{ vars.ZITADEL_URL }}
      ZITADEL_MANAGEMENT_TOKEN: ${{ secrets.ZITADEL_MANAGEMENT_PAT }}
      ZITADEL_PROJECT_ID: ${{ secrets.ZITADEL_PROJECT_ID }}
      AUTH_BASE_URI: https://auth.mkety.com/ui/v2/login

    steps:
      - name: Probe per-application Login V2 schema with disposable app
        id: probe
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          issuer="${ZITADEL_ISSUER%/}"
          echo "::add-mask::$ZITADEL_MANAGEMENT_TOKEN"
          name="mkety-login-v2-probe-${GITHUB_RUN_ID}"

          NAME="$name" BASE="$AUTH_BASE_URI" node <<'NODE' >/tmp/create.json
          process.stdout.write(JSON.stringify({
            name:process.env.NAME,
            redirectUris:['https://example.com/callback'],
            responseTypes:['OIDC_RESPONSE_TYPE_CODE'],
            grantTypes:['OIDC_GRANT_TYPE_AUTHORIZATION_CODE'],
            appType:'OIDC_APP_TYPE_WEB',
            authMethodType:'OIDC_AUTH_METHOD_TYPE_NONE',
            postLogoutRedirectUris:['https://example.com/logout'],
            version:'OIDC_VERSION_1_0',
            devMode:false,
            accessTokenType:'OIDC_TOKEN_TYPE_BEARER',
            loginVersion:{loginV1:{}}
          }));
          NODE

          code="$(curl --silent --show-error -o /tmp/create-response.json -w '%{http_code}' -X POST             "$issuer/management/v1/projects/$ZITADEL_PROJECT_ID/apps/oidc"             -H "Authorization: Bearer $ZITADEL_MANAGEMENT_TOKEN"             -H 'Content-Type: application/json' --data-binary @/tmp/create.json)"
          if [ "$code" != 200 ]; then
            CODE="$code" node <<'NODE'
          const fs=require('node:fs');let x={};try{x=JSON.parse(fs.readFileSync('/tmp/create-response.json','utf8'))}catch{}
          console.log('LOGIN_V2_SCHEMA_CREATE_SAFE '+JSON.stringify({http:process.env.CODE,code:x.code||null,message:x.message||null}));
          NODE
            exit 1
          fi

          app_id="$(node -e "const x=require('/tmp/create-response.json');if(!x.appId)process.exit(1);process.stdout.write(x.appId)")"
          echo "::add-mask::$app_id"
          echo "app_id=$app_id" >> "$GITHUB_OUTPUT"

          curl --fail-with-body --silent --show-error             "$issuer/management/v1/projects/$ZITADEL_PROJECT_ID/apps/$app_id"             -H "Authorization: Bearer $ZITADEL_MANAGEMENT_TOKEN" -o /tmp/app-before.json

          BASE="$AUTH_BASE_URI" node <<'NODE' >/tmp/update.json
          const p=require('/tmp/app-before.json'), o=p.app?.oidcConfig||{};
          const writable=[
            'redirectUris','responseTypes','grantTypes','appType','authMethodType',
            'postLogoutRedirectUris','devMode','accessTokenType','accessTokenRoleAssertion',
            'idTokenRoleAssertion','idTokenUserinfoAssertion','clockSkew','additionalOrigins',
            'skipNativeAppSuccessPage','backChannelLogoutUri','ios','android'
          ];
          const body={};
          for(const key of writable) if(o[key]!==undefined) body[key]=o[key];
          body.loginVersion={loginV2:{baseUri:process.env.BASE}};
          process.stdout.write(JSON.stringify(body));
          NODE

          update_code="$(curl --silent --show-error -o /tmp/update-response.json -w '%{http_code}' -X PUT             "$issuer/management/v1/projects/$ZITADEL_PROJECT_ID/apps/$app_id/oidc_config"             -H "Authorization: Bearer $ZITADEL_MANAGEMENT_TOKEN"             -H 'Content-Type: application/json' --data-binary @/tmp/update.json)"
          if [ "$update_code" != 200 ]; then
            CODE="$update_code" node <<'NODE'
          const fs=require('node:fs');let x={};try{x=JSON.parse(fs.readFileSync('/tmp/update-response.json','utf8'))}catch{}
          console.log('LOGIN_V2_SCHEMA_UPDATE_SAFE '+JSON.stringify({http:process.env.CODE,code:x.code||null,message:x.message||null}));
          NODE
            exit 1
          fi

          curl --fail-with-body --silent --show-error             "$issuer/management/v1/projects/$ZITADEL_PROJECT_ID/apps/$app_id"             -H "Authorization: Bearer $ZITADEL_MANAGEMENT_TOKEN" -o /tmp/app-after.json

          AUTH_BASE_URI="$AUTH_BASE_URI" node <<'NODE'
          const before=require('/tmp/app-before.json').app?.oidcConfig||{};
          const after=require('/tmp/app-after.json').app?.oidcConfig||{};
          const lv=after.loginVersion||null;
          console.log('LOGIN_V2_SCHEMA_READBACK '+JSON.stringify({
            hasOidcConfig:true,
            loginVersion:lv,
            redirectCount:Array.isArray(after.redirectUris)?after.redirectUris.length:0,
            logoutCount:Array.isArray(after.postLogoutRedirectUris)?after.postLogoutRedirectUris.length:0
          }));
          if(!lv?.loginV2) throw new Error('Disposable app did not retain loginV2');
          if(lv.loginV2.baseUri!==process.env.AUTH_BASE_URI) throw new Error('Disposable app baseUri mismatch');

          const ignore=new Set(['loginVersion','clientId','noneCompliant','complianceProblems']);
          const normalize=(o)=>Object.fromEntries(Object.entries(o).filter(([k])=>!ignore.has(k)).sort(([a],[b])=>a.localeCompare(b)));
          const b=JSON.stringify(normalize(before));
          const a=JSON.stringify(normalize(after));
          if(a!==b){
            console.log('LOGIN_V2_SCHEMA_PRESERVATION_SAFE '+JSON.stringify({
              beforeKeys:Object.keys(normalize(before)).sort(),
              afterKeys:Object.keys(normalize(after)).sort()
            }));
            throw new Error('Non-login OIDC configuration changed');
          }
          console.log('LOGIN_V2_SCHEMA_PRESERVATION_SAFE '+JSON.stringify({preserved:true,keys:Object.keys(normalize(after)).sort()}));
          NODE

          client_id="$(node -e "const x=require('/tmp/app-after.json').app?.oidcConfig||{};if(!x.clientId)process.exit(1);process.stdout.write(x.clientId)")"
          echo "::add-mask::$client_id"
          verifier="$(openssl rand -hex 32)"
          challenge="$(VERIFIER="$verifier" node -e "const crypto=require('node:crypto');process.stdout.write(crypto.createHash('sha256').update(process.env.VERIFIER).digest('base64url'))")"
          state="$(openssl rand -hex 16)"
          nonce="$(openssl rand -hex 16)"
          expected_origin="https://auth.mkety.com"

          routed=0
          for attempt in $(seq 1 12); do
            query="$(CLIENT_ID="$client_id" CHALLENGE="$challenge" STATE="$state" NONCE="$nonce" node <<'NODE'
          const q=new URLSearchParams({
            client_id:process.env.CLIENT_ID,
            redirect_uri:'https://example.com/callback',
            response_type:'code',
            scope:'openid profile email',
            state:process.env.STATE,
            nonce:process.env.NONCE,
            code_challenge:process.env.CHALLENGE,
            code_challenge_method:'S256',
            prompt:'login'
          });
          process.stdout.write(q.toString());
          NODE
            )"
            curl -sS --connect-timeout 10 --max-time 20 -D /tmp/authorize.headers -o /dev/null               "$issuer/oauth/v2/authorize?$query"
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/, "");sub(/\r$/,"");print;exit}' /tmp/authorize.headers)"
            if [ -n "$location" ] && LOCATION="$location" EXPECTED_ORIGIN="$expected_origin" node <<'NODE'
          const u=new URL(process.env.LOCATION, process.env.EXPECTED_ORIGIN);
          process.exit(u.origin===process.env.EXPECTED_ORIGIN && u.pathname.startsWith('/ui/v2/login')?0:1);
          NODE
            then
              routed=1
              LOCATION="$location" EXPECTED_ORIGIN="$expected_origin" node -e "const u=new URL(process.env.LOCATION,process.env.EXPECTED_ORIGIN);console.log('LOGIN_V2_AUTHORIZE_ROUTE_SAFE '+JSON.stringify({origin:u.origin,path:u.pathname,relative:!/^https?:\\/\\//i.test(process.env.LOCATION)}))"
              break
            fi
            echo "Disposable Login V2 routing propagation attempt $attempt/12 not ready."
            sleep 5
          done
          [ "$routed" = 1 ] || {
            LOCATION="$location" EXPECTED_ORIGIN="$expected_origin" node -e "let u;try{u=new URL(process.env.LOCATION,process.env.EXPECTED_ORIGIN)}catch{};console.log('LOGIN_V2_AUTHORIZE_ROUTE_SAFE '+JSON.stringify({routed:false,origin:u?.origin||null,path:u?.pathname||null}))"
            exit 1
          }

          cat >/tmp/status.json <<JSON
          {"state":"success","context":"mkety/zitadel-login-v2-schema","description":"Per-app Login V2 custom base URI schema verified on disposable OIDC app.","target_url":"https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"}
          JSON
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json'             -H 'Content-Type: application/json' --data @/tmp/status.json             "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

      - name: Delete disposable probe app
        if: always() && steps.probe.outputs.app_id != ''
        shell: bash
        env:
          APP_ID: ${{ steps.probe.outputs.app_id }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -X DELETE             "${ZITADEL_ISSUER%/}/management/v1/projects/$ZITADEL_PROJECT_ID/apps/$APP_ID"             -H "Authorization: Bearer $ZITADEL_MANAGEMENT_TOKEN" >/dev/null
          echo 'Disposable Login V2 probe app removed.'
