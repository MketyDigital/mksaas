name: Mkety Production Branded Auth Cutover

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mkety-production-branded-auth-cutover.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      ZITADEL_ISSUER: ${{ vars.ZITADEL_URL }}
      ZITADEL_MANAGEMENT_TOKEN: ${{ secrets.ZITADEL_MANAGEMENT_PAT }}
      ZITADEL_PROJECT_ID: ${{ secrets.ZITADEL_PROJECT_ID }}
      OIDC_APP_NAME: Mkety Platform Production
      AUTH_BASE_URI: https://auth.mkety.com/ui/v2/login
      AUTH_ORIGIN: https://auth.mkety.com

    steps:
      - name: Publish cutover locator
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat >/tmp/status.json <<JSON
          {"state":"pending","context":"mkety/branded-auth-cutover","description":"Switching Mkety Platform Production to auth.mkety.com with rollback guard.","target_url":"https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"}
          JSON
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json'             -H 'Content-Type: application/json' --data @/tmp/status.json             "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

      - name: Preflight branded login and active Mkety branding
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$ZITADEL_MANAGEMENT_TOKEN"
          ready="$(curl -sS --connect-timeout 8 --max-time 20 -o /tmp/ready -w '%{http_code}' "$AUTH_BASE_URI/ready" || true)"
          [ "$ready" = 200 ] || { echo "::error::auth.mkety.com readiness failed HTTP $ready"; exit 1; }

          login_code="$(curl -sS --connect-timeout 8 --max-time 20 -o /tmp/login -w '%{http_code}' "$AUTH_BASE_URI" || true)"
          [ "$login_code" -ge 200 ] && [ "$login_code" -lt 500 ] || { echo "::error::auth.mkety.com login surface unavailable"; exit 1; }
          ! grep -qi 'Instance not found' /tmp/login

          curl --fail-with-body --silent --show-error             -H "Authorization: Bearer $ZITADEL_MANAGEMENT_TOKEN"             "${ZITADEL_ISSUER%/}/admin/v1/policies/label" -o /tmp/branding.json
          node <<'NODE'
          const x=require('/tmp/branding.json').policy||{};
          const failures=[];
          if(String(x.primaryColor||'').toUpperCase()!=='#6D5DF6') failures.push('primaryColor');
          if(x.disableWatermark!==true) failures.push('disableWatermark');
          for(const k of ['logoUrl','logoUrlDark','iconUrl','iconUrlDark']) if(!x[k]) failures.push(k);
          if(failures.length) throw new Error('Mkety branding preflight failed: '+failures.join(','));
          console.log('BRANDED_AUTH_PREFLIGHT_SAFE '+JSON.stringify({
            loginReady:true,primaryColor:x.primaryColor,disableWatermark:x.disableWatermark,
            hasLogo:!!x.logoUrl,hasDarkLogo:!!x.logoUrlDark,hasIcon:!!x.iconUrl,hasDarkIcon:!!x.iconUrlDark
          }));
          NODE

      - name: Resolve production OIDC application and snapshot config
        id: app
        shell: bash
        run: |
          set -euo pipefail
          issuer="${ZITADEL_ISSUER%/}"
          apps="$(curl --fail-with-body --silent --show-error -X POST             "$issuer/zitadel.application.v2.ApplicationService/ListApplications"             -H "Authorization: Bearer $ZITADEL_MANAGEMENT_TOKEN"             -H 'Connect-Protocol-Version: 1' -H 'Content-Type: application/json' --data '{}')"
          app_id="$(APPS="$apps" node -e "const p=JSON.parse(process.env.APPS||'{}'),a=p.applications||[];const m=a.filter(x=>x.projectId===process.env.ZITADEL_PROJECT_ID&&x.name===process.env.OIDC_APP_NAME);if(m.length!==1)process.exit(1);process.stdout.write(m[0].applicationId)")"
          echo "::add-mask::$app_id"
          echo "app_id=$app_id" >> "$GITHUB_OUTPUT"

          curl --fail-with-body --silent --show-error             "$issuer/management/v1/projects/$ZITADEL_PROJECT_ID/apps/$app_id"             -H "Authorization: Bearer $ZITADEL_MANAGEMENT_TOKEN" -o /tmp/app-before.json

          node <<'NODE'
          const p=require('/tmp/app-before.json'), o=p.app?.oidcConfig||{};
          if(!o.clientId) throw new Error('Production OIDC config missing clientId');
          console.log('PRODUCTION_LOGIN_BEFORE_SAFE '+JSON.stringify({
            loginVersion:o.loginVersion||null,
            redirectCount:Array.isArray(o.redirectUris)?o.redirectUris.length:0,
            logoutCount:Array.isArray(o.postLogoutRedirectUris)?o.postLogoutRedirectUris.length:0,
            authMethodType:o.authMethodType||null
          }));
          NODE

      - name: Switch production app to Mkety branded Login V2
        id: switch
        shell: bash
        env:
          APP_ID: ${{ steps.app.outputs.app_id }}
        run: |
          set -euo pipefail
          issuer="${ZITADEL_ISSUER%/}"
          BASE="$AUTH_BASE_URI" node <<'NODE' >/tmp/update.json
          const p=require('/tmp/app-before.json'), o=p.app?.oidcConfig||{};
          const writable=[
            'redirectUris','responseTypes','grantTypes','appType','authMethodType',
            'postLogoutRedirectUris','devMode','accessTokenType','accessTokenRoleAssertion',
            'idTokenRoleAssertion','idTokenUserinfoAssertion','clockSkew','additionalOrigins',
            'skipNativeAppSuccessPage','backChannelLogoutUri','ios','android'
          ];
          const body={};
          for(const key of writable) if(o[key]!==undefined) body[key]=o[key];
          body.loginVersion={loginV2:{baseUri:process.env.BASE}};
          process.stdout.write(JSON.stringify(body));
          NODE
          code="$(curl --silent --show-error -o /tmp/update-response.json -w '%{http_code}' -X PUT             "$issuer/management/v1/projects/$ZITADEL_PROJECT_ID/apps/$APP_ID/oidc_config"             -H "Authorization: Bearer $ZITADEL_MANAGEMENT_TOKEN"             -H 'Content-Type: application/json' --data-binary @/tmp/update.json)"
          if [ "$code" != 200 ]; then
            CODE="$code" node <<'NODE'
          const fs=require('node:fs');let x={};try{x=JSON.parse(fs.readFileSync('/tmp/update-response.json','utf8'))}catch{}
          console.log('BRANDED_AUTH_SWITCH_SAFE '+JSON.stringify({http:process.env.CODE,code:x.code||null,message:x.message||null}));
          NODE
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Verify production OIDC config preservation
        shell: bash
        env:
          APP_ID: ${{ steps.app.outputs.app_id }}
        run: |
          set -euo pipefail
          issuer="${ZITADEL_ISSUER%/}"
          curl --fail-with-body --silent --show-error             "$issuer/management/v1/projects/$ZITADEL_PROJECT_ID/apps/$APP_ID"             -H "Authorization: Bearer $ZITADEL_MANAGEMENT_TOKEN" -o /tmp/app-after.json

          AUTH_BASE_URI="$AUTH_BASE_URI" node <<'NODE'
          const before=require('/tmp/app-before.json').app?.oidcConfig||{};
          const after=require('/tmp/app-after.json').app?.oidcConfig||{};
          if(after.loginVersion?.loginV2?.baseUri!==process.env.AUTH_BASE_URI) throw new Error('Production Login V2 base URI mismatch');
          const ignore=new Set(['loginVersion','clientId','noneCompliant','complianceProblems']);
          const normalize=(o)=>Object.fromEntries(Object.entries(o).filter(([k])=>!ignore.has(k)).sort(([a],[b])=>a.localeCompare(b)));
          if(JSON.stringify(normalize(before))!==JSON.stringify(normalize(after))) throw new Error('Production OIDC settings changed outside loginVersion');
          console.log('PRODUCTION_LOGIN_AFTER_SAFE '+JSON.stringify({
            loginVersion:after.loginVersion,
            nonLoginConfigPreserved:true,
            redirectCount:Array.isArray(after.redirectUris)?after.redirectUris.length:0,
            logoutCount:Array.isArray(after.postLogoutRedirectUris)?after.postLogoutRedirectUris.length:0
          }));
          NODE

      - name: Verify live Mkety sign-in and signup land on auth.mkety.com
        shell: bash
        run: |
          set -euo pipefail
          verify_flow() {
            local intent="$1"
            local headers="/tmp/$intent.headers"
            local first
            first="$(curl -sS --connect-timeout 10 --max-time 25 -D "$headers" -o /dev/null -w '%{http_code}'               "https://mkety.com/api/auth/login?returnTo=/select-tenant&intent=$intent")"
            [ "$first" -ge 300 ] && [ "$first" -lt 400 ] || { echo "::error::$intent did not start OIDC"; return 1; }
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/, "");sub(/\r$/,"");print;exit}' "$headers")"
            [ -n "$location" ] || return 1

            final="$(curl -LsS --connect-timeout 10 --max-time 35 -o /tmp/$intent.body -w '%{url_effective}|%{http_code}' "$location" || true)"
            FINAL="$final" INTENT="$intent" node <<'NODE'
          const raw=process.env.FINAL||'', i=raw.lastIndexOf('|');
          const href=i>=0?raw.slice(0,i):raw, code=i>=0?Number(raw.slice(i+1)):0;
          const u=new URL(href);
          if(u.origin!==process.env.AUTH_ORIGIN) throw new Error(process.env.INTENT+' did not land on Mkety auth origin: '+u.origin);
          if(!u.pathname.startsWith('/ui/v2/login')) throw new Error(process.env.INTENT+' branded login path mismatch: '+u.pathname);
          if(code<200||code>=500) throw new Error(process.env.INTENT+' branded login HTTP '+code);
          console.log('BRANDED_AUTH_REDIRECT_SAFE '+JSON.stringify({intent:process.env.INTENT,origin:u.origin,path:u.pathname,http:code}));
          NODE
            if grep -qi 'Instance not found' "/tmp/$intent.body"; then
              echo "::error::$intent branded login lost instance context"
              return 1
            fi
          }
          verify_flow signin
          verify_flow signup

      - name: Roll back production Login V2 on any post-switch failure
        if: failure() && steps.switch.outputs.changed == 'true'
        shell: bash
        env:
          APP_ID: ${{ steps.app.outputs.app_id }}
        run: |
          set +e
          issuer="${ZITADEL_ISSUER%/}"
          node <<'NODE' >/tmp/rollback.json
          const p=require('/tmp/app-before.json'), o=p.app?.oidcConfig||{};
          const writable=[
            'redirectUris','responseTypes','grantTypes','appType','authMethodType',
            'postLogoutRedirectUris','devMode','accessTokenType','accessTokenRoleAssertion',
            'idTokenRoleAssertion','idTokenUserinfoAssertion','clockSkew','additionalOrigins',
            'skipNativeAppSuccessPage','backChannelLogoutUri','ios','android','loginVersion'
          ];
          const body={};
          for(const key of writable) if(o[key]!==undefined) body[key]=o[key];
          process.stdout.write(JSON.stringify(body));
          NODE
          code="$(curl --silent --show-error -o /tmp/rollback-response.json -w '%{http_code}' -X PUT             "$issuer/management/v1/projects/$ZITADEL_PROJECT_ID/apps/$APP_ID/oidc_config"             -H "Authorization: Bearer $ZITADEL_MANAGEMENT_TOKEN"             -H 'Content-Type: application/json' --data-binary @/tmp/rollback.json)"
          echo "BRANDED_AUTH_ROLLBACK_SAFE HTTP $code"
          [ "$code" = 200 ]

      - name: Publish cutover result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=success
          desc='Mkety Platform Production now uses branded auth.mkety.com Login V2.'
          if [ "$JOB_STATUS" != success ]; then
            state=failure
            desc='Branded auth cutover failed; rollback guard executed when switch had occurred.'
          fi
          STATE="$state" DESC="$desc" node <<'NODE' >/tmp/status.json
          process.stdout.write(JSON.stringify({state:process.env.STATE,context:'mkety/branded-auth-cutover',description:process.env.DESC,target_url:`https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`}));
          NODE
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json'             -H 'Content-Type: application/json' --data @/tmp/status.json             "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null || true
