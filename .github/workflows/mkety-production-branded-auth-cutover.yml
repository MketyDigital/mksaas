name: Mkety Production Branded Auth Cutover
# final branded auth refresh 2026-09-24

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mkety-production-branded-auth-cutover.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      ZITADEL_ISSUER: ${{ vars.ZITADEL_URL }}
      ZITADEL_MANAGEMENT_TOKEN: ${{ secrets.ZITADEL_MANAGEMENT_PAT }}
      AUTH_BASE_URI: https://auth.mkety.com/ui/v2/login
      AUTH_ORIGIN: https://auth.mkety.com

    steps:
      - name: Publish cutover locator
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cat >/tmp/status.json <<JSON
          {"state":"pending","context":"mkety/branded-auth-cutover","description":"Switching instance Login V2 base URI to auth.mkety.com with rollback guard.","target_url":"https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"}
          JSON
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' --data @/tmp/status.json \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null

      - name: Preflight branded Login V2 and active Mkety branding
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$ZITADEL_MANAGEMENT_TOKEN"

          ready="$(curl -sS --connect-timeout 8 --max-time 20 -o /tmp/ready -w '%{http_code}' "$AUTH_BASE_URI/ready" || true)"
          [ "$ready" = 200 ] || { echo "::error::auth.mkety.com readiness failed HTTP $ready"; exit 1; }

          login_code="$(curl -sS --connect-timeout 8 --max-time 20 -o /tmp/login -w '%{http_code}' "$AUTH_BASE_URI" || true)"
          [ "$login_code" -ge 200 ] && [ "$login_code" -lt 500 ] || { echo "::error::auth.mkety.com login surface unavailable"; exit 1; }
          ! grep -qi 'Instance not found' /tmp/login

          curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $ZITADEL_MANAGEMENT_TOKEN" \
            "${ZITADEL_ISSUER%/}/admin/v1/policies/label" -o /tmp/branding.json
          node <<'NODE'
          const x=require('/tmp/branding.json').policy||{};
          const failures=[];
          if(String(x.primaryColor||'').toUpperCase()!=='#6D5DF6') failures.push('primaryColor');
          if(x.disableWatermark!==true) failures.push('disableWatermark');
          for(const k of ['logoUrl','logoUrlDark','iconUrl','iconUrlDark']) if(!x[k]) failures.push(k);
          if(failures.length) throw new Error('Mkety branding preflight failed: '+failures.join(','));
          console.log('BRANDED_AUTH_PREFLIGHT_SAFE '+JSON.stringify({
            loginReady:true,primaryColor:x.primaryColor,disableWatermark:x.disableWatermark,
            hasLogo:!!x.logoUrl,hasDarkLogo:!!x.logoUrlDark,hasIcon:!!x.iconUrl,hasDarkIcon:!!x.iconUrlDark
          }));
          NODE

      - name: Snapshot effective instance Login V2 feature
        id: snapshot
        shell: bash
        run: |
          set -euo pipefail
          issuer="${ZITADEL_ISSUER%/}"
          curl --fail-with-body --silent --show-error \
            "$issuer/v2/features/instance?inheritance=true" \
            -H "Authorization: Bearer $ZITADEL_MANAGEMENT_TOKEN" \
            -o /tmp/features-before.json

          node <<'NODE'
          const x=require('/tmp/features-before.json'), l=x.loginV2||{};
          if(l.required!==true) throw new Error('Expected existing instance Login V2 required=true');
          console.log('INSTANCE_LOGIN_V2_BEFORE_SAFE '+JSON.stringify({
            required:l.required,baseUri:l.baseUri??null,source:l.source??null
          }));
          NODE
          echo "snapshotted=true" >> "$GITHUB_OUTPUT"

      - name: Set instance Login V2 base URI to Mkety auth
        id: switch
        shell: bash
        run: |
          set -euo pipefail
          issuer="${ZITADEL_ISSUER%/}"
          BASE="$AUTH_BASE_URI" node <<'NODE' >/tmp/feature-update.json
          process.stdout.write(JSON.stringify({loginV2:{required:true,baseUri:process.env.BASE}}));
          NODE
          code="$(curl --silent --show-error -o /tmp/feature-update-response.json -w '%{http_code}' -X PUT \
            "$issuer/v2/features/instance" \
            -H "Authorization: Bearer $ZITADEL_MANAGEMENT_TOKEN" \
            -H 'Content-Type: application/json' --data-binary @/tmp/feature-update.json)"
          if [ "$code" != 200 ]; then
            CODE="$code" node <<'NODE'
          const fs=require('node:fs');let x={};try{x=JSON.parse(fs.readFileSync('/tmp/feature-update-response.json','utf8'))}catch{}
          console.log('INSTANCE_LOGIN_V2_SWITCH_SAFE '+JSON.stringify({http:process.env.CODE,code:x.code||null,message:x.message||null}));
          NODE
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Verify instance Login V2 setting
        shell: bash
        run: |
          set -euo pipefail
          issuer="${ZITADEL_ISSUER%/}"
          matched=0
          for attempt in $(seq 1 12); do
            curl --fail-with-body --silent --show-error \
              "$issuer/v2/features/instance?inheritance=true" \
              -H "Authorization: Bearer $ZITADEL_MANAGEMENT_TOKEN" \
              -o /tmp/features-after.json
            if AUTH_BASE_URI="$AUTH_BASE_URI" node <<'NODE'
          const x=require('/tmp/features-after.json'), l=x.loginV2||{};
          process.exit(l.required===true && l.baseUri===process.env.AUTH_BASE_URI ? 0 : 1);
          NODE
            then matched=1; break; fi
            sleep 3
          done
          [ "$matched" = 1 ] || { echo "::error::Instance Login V2 base URI did not converge"; exit 1; }
          node <<'NODE'
          const x=require('/tmp/features-after.json'), l=x.loginV2||{};
          console.log('INSTANCE_LOGIN_V2_AFTER_SAFE '+JSON.stringify({
            required:l.required,baseUri:l.baseUri??null,source:l.source??null
          }));
          NODE

      - name: Verify live Mkety sign-in and signup stay on auth.mkety.com
        shell: bash
        run: |
          set -euo pipefail
          verify_flow() {
            local intent="$1"
            local expected_path="$2"
            local ok=0
            for attempt in $(seq 1 15); do
              headers="/tmp/$intent.headers"
              first="$(curl -sS --connect-timeout 10 --max-time 25 -D "$headers" -o /dev/null -w '%{http_code}'                 "https://mkety.com/api/auth/login?returnTo=/select-tenant&intent=$intent" || true)"
              location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/, "");sub(/\r$/,"");print;exit}' "$headers")"
              if [ "$first" -ge 300 ] 2>/dev/null && [ "$first" -lt 400 ] 2>/dev/null && [ -n "$location" ] && LOCATION="$location" EXPECTED_PATH="$expected_path" AUTH_ORIGIN="$AUTH_ORIGIN" node <<'NODE'
          const u=new URL(process.env.LOCATION);
          const requestId=u.searchParams.get('requestId')||'';
          process.exit(
            u.origin===process.env.AUTH_ORIGIN &&
            u.pathname===process.env.EXPECTED_PATH &&
            requestId.startsWith('oidc_') ? 0 : 1
          );
          NODE
              then
                echo "BRANDED_AUTH_REDIRECT_SAFE intent=$intent location=$location"
                ok=1
                break
              fi
              echo "$intent propagation attempt $attempt/15 not ready."
              sleep 4
            done
            [ "$ok" = 1 ]
          }

          verify_flow signin /ui/v2/login/loginname
          verify_flow signup /ui/v2/login/register

      - name: Roll back instance Login V2 base URI on failure
        if: failure() && steps.switch.outputs.changed == 'true'
        shell: bash
        run: |
          set +e
          issuer="${ZITADEL_ISSUER%/}"
          node <<'NODE' >/tmp/feature-rollback.json
          const x=require('/tmp/features-before.json'), l=x.loginV2||{};
          const body={loginV2:{required:l.required===true}};
          body.loginV2.baseUri = typeof l.baseUri==='string' ? l.baseUri : '';
          process.stdout.write(JSON.stringify(body));
          NODE
          code="$(curl --silent --show-error -o /tmp/feature-rollback-response.json -w '%{http_code}' -X PUT \
            "$issuer/v2/features/instance" \
            -H "Authorization: Bearer $ZITADEL_MANAGEMENT_TOKEN" \
            -H 'Content-Type: application/json' --data-binary @/tmp/feature-rollback.json)"
          echo "INSTANCE_LOGIN_V2_ROLLBACK_SAFE HTTP $code"
          [ "$code" = 200 ]

      - name: Publish cutover result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=success
          desc='ZITADEL instance Login V2 now routes Mkety authentication through branded auth.mkety.com.'
          if [ "$JOB_STATUS" != success ]; then
            state=failure
            desc='Branded auth instance cutover failed; prior Login V2 base URI was restored when changed.'
          fi
          STATE="$state" DESC="$desc" node <<'NODE' >/tmp/status.json
          process.stdout.write(JSON.stringify({
            state:process.env.STATE,
            context:'mkety/branded-auth-cutover',
            description:process.env.DESC,
            target_url:`https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`
          }));
          NODE
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' --data @/tmp/status.json \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null || true
