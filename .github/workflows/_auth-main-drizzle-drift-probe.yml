name: Auth Main Drizzle Drift Probe

on:
  push:
    branches:
      - feat/mkety-auth-zitadel-vinext
    paths:
      - .github/workflows/_auth-main-drizzle-drift-probe.yml

permissions:
  contents: read

env:
  EXPECTED_MAIN_SHA: 0693b00fba639549d92c4dd82a2fcef618d0bd47
  EXPECTED_CONTENT_REPAIR_BLOB: 8b8be8e68785dec4bbdf39d3d680cfc9ad808fc2
  EXPECTED_DEPLOY_HELPER_BLOB: eb21835005713fd1ecbaccd1eee9bc23f8bc8abb
  SKIP_ENV_VALIDATION: 'true'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/mkety-auth-zitadel-vinext

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Reproduce guarded merged tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN_SHA"

          set +e
          git merge --no-commit --no-ff origin/main >/tmp/merge.out 2>&1
          merge_status=$?
          set -e
          conflicts="$(git diff --name-only --diff-filter=U || true)"
          if [ -n "$conflicts" ]; then
            while IFS= read -r path; do
              [ -z "$path" ] && continue
              case "$path" in
                .env.example|.mega-linter.yml|docs/README.md|jest.setup.tsx|src/app/layout.tsx)
                  git checkout --ours -- "$path"
                  git add "$path"
                  ;;
                *)
                  echo "Unexpected conflict: $path" >&2
                  exit 1
                  ;;
              esac
            done <<< "$conflicts"
          elif [ "$merge_status" -ne 0 ]; then
            cat /tmp/merge.out >&2
            exit "$merge_status"
          fi

          source_path="migrations/0004_platform_commercial_content_repair.sql"
          target_path="migrations/0009_platform_commercial_content_repair.sql"
          test "$(git rev-parse "origin/main:$source_path")" = "$EXPECTED_CONTENT_REPAIR_BLOB"
          git mv "$source_path" "$target_path"
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/migrate-mkety-platform-content.ts')
          text = path.read_text()
          needle = "  'migrations/0008_harden_rls_auto_enable.sql',\n"
          addition = needle + "  'migrations/0009_platform_commercial_content_repair.sql',\n"
          if text.count(needle) != 1 or '0009_platform_commercial_content_repair.sql' in text:
              raise SystemExit('unexpected content runner state')
          path.write_text(text.replace(needle, addition))
          PY
          git add "$target_path" scripts/migrate-mkety-platform-content.ts

          helper="scripts/deploy-vinext-cloudflare.sh"
          test "$(git rev-parse "origin/main:$helper")" = "$EXPECTED_DEPLOY_HELPER_BLOB"
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/deploy-vinext-cloudflare.sh')
          text = path.read_text()
          old = '''expected_worker_name="${CANDIDATE_WORKER_NAME:-}"
          if [ -z "$expected_worker_name" ]; then
            expected_worker_name="$(node -e "const fs=require('node:fs'); const c=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8')); process.stdout.write(c.name || '')")"
          fi
          '''
          new = '''expected_worker_name="${CANDIDATE_WORKER_NAME:-}"
          if [ -z "$expected_worker_name" ]; then
            expected_worker_name="$(node - <<'NODE'
          const fs = require('node:fs');
          const ts = require('typescript');
          const file = 'wrangler.jsonc';
          const parsed = ts.parseConfigFileTextToJson(file, fs.readFileSync(file, 'utf8'));
          if (parsed.error) {
            const message = ts.flattenDiagnosticMessageText(parsed.error.messageText, '\\n');
            throw new Error(`Unable to parse ${file}: ${message}`);
          }
          process.stdout.write(typeof parsed.config?.name === 'string' ? parsed.config.name : '');
          NODE
          )"
          fi
          '''
          if text.count(old) != 1:
              raise SystemExit('unexpected deploy helper state')
          path.write_text(text.replace(old, new))
          PY
          git add "$helper"

          git commit -m "probe: materialize reconciled Auth tree" >/dev/null

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Run forward generation and print bounded drift
        shell: bash
        run: |
          set -euo pipefail
          before_sha="$(git rev-parse HEAD)"
          echo "BASELINE_SHA=$before_sha"
          pnpm db:generate
          echo "DRIFT_STATUS_BEGIN"
          git status --short
          echo "DRIFT_STATUS_END"
          echo "DRIFT_NAMES_BEGIN"
          git diff --name-only
          git ls-files --others --exclude-standard
          echo "DRIFT_NAMES_END"
          echo "DRIFT_DIFF_BEGIN"
          git diff -- src/shared/db/migrations/meta/_journal.json src/shared/db/migrations/meta '*.sql' | head -n 500 || true
          echo "DRIFT_DIFF_END"
          # Diagnostic only: fail when drift exists so the result cannot be mistaken for a green gate.
          test -z "$(git status --porcelain)"
