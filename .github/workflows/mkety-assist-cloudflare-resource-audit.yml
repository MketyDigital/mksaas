name: Mkety Assist Cloudflare Resource Audit

on:
  push:
    branches:
      - 'audit/mkety-assist-cloudflare-resource-usage-20261019'
    paths:
      - .github/scripts/assist_resource_audit.mjs
      - .github/scripts/assist_resource_audit.test.mjs
      - .github/workflows/mkety-assist-cloudflare-resource-audit.yml
      - customer-apps/assist/wrangler.jsonc
  pull_request:
    paths:
      - .github/scripts/assist_resource_audit.mjs
      - .github/scripts/assist_resource_audit.test.mjs
      - .github/workflows/mkety-assist-cloudflare-resource-audit.yml
      - customer-apps/assist/wrangler.jsonc
  workflow_dispatch:
    inputs:
      window_days:
        description: Cloudflare usage window
        required: true
        default: "7"
        type: choice
        options:
          - "7"
          - "31"

permissions:
  contents: read

concurrency:
  group: mkety-assist-cloudflare-resource-audit
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test Assist audit safety and query scope
        run: node --test .github/scripts/assist_resource_audit.test.mjs

  audit:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MKETY_ASSIST_CF_SAAS_TOKEN: ${{ secrets.MKETY_ASSIST_CF_SAAS_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AUDIT_WINDOW_DAYS: ${{ inputs.window_days }}
      REPORT_PATH: ${{ runner.temp }}/assist-cloudflare-resource-audit.json
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require Cloudflare audit credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "${CLOUDFLARE_ACCOUNT_ID:-}" =~ ^[a-fA-F0-9]{32}$ ]] || { echo 'CLOUDFLARE_ACCOUNT_ID is required'; exit 1; }
          [[ -n "${CLOUDFLARE_API_TOKEN:-}" || -n "${MKETY_ASSIST_CF_SAAS_TOKEN:-}" ]] || { echo 'A Cloudflare read token is required'; exit 1; }
          [[ "$AUDIT_WINDOW_DAYS" == '7' || "$AUDIT_WINDOW_DAYS" == '31' ]] || { echo 'Unsupported audit window'; exit 1; }
          echo 'Scope is restricted to the Assist Worker, its D1 database, configured queues, and its Durable Object namespace.'
      - name: Run read-only Assist Cloudflare audit
        run: node .github/scripts/assist_resource_audit.mjs
      - name: Add audit summary
        if: always()
        run: |
          {
            echo '## Mkety Assist Cloudflare Resource Audit'
            echo
            echo "Window: ${AUDIT_WINDOW_DAYS} days"
            echo 'Scope: mkety-assist Worker, mkety-assist-prod D1, queues declared by Assist, and Assist Durable Objects.'
            echo 'Operations are read-only Cloudflare GETs and GraphQL queries. No D1 SQL, message payloads, deploys, or runtime changes.'
            echo 'The JSON artifact contains sanitized aggregate metrics and per-service access status.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload sanitized Assist audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mkety-assist-cloudflare-resource-audit-${{ github.run_id }}
          path: ${{ env.REPORT_PATH }}
          if-no-files-found: ignore
          retention-days: 14
