name: Mkety Content DB Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Migrate, seed, and smoke-test Mkety content DB
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      SKIP_ENV_VALIDATION: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate database secret
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "STAGING_DATABASE_URL is not set. Add it as a GitHub Actions secret before running this workflow."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply base Drizzle migrations
        run: pnpm db:migrate

      - name: Apply Mkety CMS migrations
        run: pnpm db:migrate:mkety-content

      - name: Seed Mkety CMS content
        run: pnpm db:seed:mkety-content

      - name: Smoke-test Mkety CMS content
        run: pnpm db:smoke:mkety-content
