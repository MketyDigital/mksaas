name: Mkety Content DB Smoke

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/mkety-content-db-smoke.yml"
      - "migrations/0000_platform_content.sql"
      - "migrations/0001_platform_app_experience.sql"
      - "migrations/0002_public_ai_memory.sql"
      - "migrations/0003_platform_enterprise_orders.sql"
      - "scripts/migrate-mkety-platform-content.ts"
      - "scripts/seed-mkety-platform-content.ts"
      - "scripts/smoke-mkety-platform-content.ts"
      - "src/features/platform-content/**"
      - "src/features/platform-app-experience/**"
      - "src/features/enterprise-checkout/**"
      - "src/shared/db/schema/platform-content.ts"
      - "src/shared/db/schema/platform-app-experience.ts"
      - "src/shared/db/schema/platform-enterprise-orders.ts"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  smoke:
    name: Migrate, seed, and smoke-test Mkety content DB
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      SKIP_ENV_VALIDATION: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate database secret
        shell: bash
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "STAGING_DATABASE_URL is not set. Add it as a GitHub Actions secret before running this workflow."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply base Drizzle migrations
        run: pnpm db:migrate

      - name: Apply Mkety CMS migrations
        run: pnpm db:migrate:mkety-content

      - name: Seed Mkety CMS content
        run: pnpm db:seed:mkety-content

      - name: Smoke-test Mkety CMS content
        shell: bash
        run: |
          set -o pipefail
          pnpm db:smoke:mkety-content 2>&1 | tee /tmp/mkety-content-db-smoke.log

      - name: Upload content DB smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mkety-content-db-smoke-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: /tmp/mkety-content-db-smoke.log
