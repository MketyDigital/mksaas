name: Cloudflare Workers Subdomain Bootstrap

on:
  push:
    branches:
      - ops/cloudflare-workers-subdomain-mkety-20260912
    paths:
      - '.github/workflows/cloudflare-workers-subdomain-bootstrap.yml'

permissions:
  contents: read

jobs:
  bootstrap:
    name: Register mkety.workers.dev account subdomain
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TARGET_WORKERS_SUBDOMAIN: mkety
    steps:
      - name: Validate credentials
        shell: bash
        run: |
          set -euo pipefail
          for variable in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!variable:-}" ]; then
              echo "$variable is not configured in the staging environment."
              exit 1
            fi
          done

      - name: Inspect current Workers account subdomain
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          status="$(curl -sS -o /tmp/current-subdomain.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "$api")"

          if [ "$status" = '200' ]; then
            current="$(node <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/current-subdomain.json', 'utf8'));
          if (!payload.success || typeof payload.result?.subdomain !== 'string') process.exit(1);
          process.stdout.write(payload.result.subdomain);
          NODE
            )"
            echo "Current Workers account subdomain: $current"
            if [ "$current" = "$TARGET_WORKERS_SUBDOMAIN" ]; then
              echo 'already_configured=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "A different Workers account subdomain is already configured: $current"
            echo 'Refusing to rename it automatically because that could break existing workers.dev URLs.'
            exit 1
          fi

          if [ "$status" = '404' ]; then
            echo 'No Workers account subdomain is currently configured.'
            echo 'already_configured=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Unexpected Cloudflare response while reading Workers subdomain: HTTP $status"
          node -e "const fs=require('node:fs'); const p=JSON.parse(fs.readFileSync('/tmp/current-subdomain.json','utf8')); console.log(JSON.stringify({success:p.success,errors:p.errors},null,2))" || true
          exit 1

      - name: Register mkety Workers account subdomain
        if: steps.inspect.outputs.already_configured != 'true'
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          status="$(curl -sS -o /tmp/create-subdomain.json -w '%{http_code}' \
            -X PUT \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            --data "{\"subdomain\":\"$TARGET_WORKERS_SUBDOMAIN\"}" \
            "$api")"

          if [ "$status" != '200' ]; then
            echo "Cloudflare Workers subdomain registration failed: HTTP $status"
            node -e "const fs=require('node:fs'); const p=JSON.parse(fs.readFileSync('/tmp/create-subdomain.json','utf8')); console.log(JSON.stringify({success:p.success,errors:p.errors},null,2))" || true
            exit 1
          fi

          node <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/create-subdomain.json', 'utf8'));
          const expected = process.env.TARGET_WORKERS_SUBDOMAIN;
          if (!payload.success || payload.result?.subdomain !== expected) {
            console.error('Cloudflare did not confirm the requested Workers subdomain.');
            process.exit(1);
          }
          console.log(`Cloudflare registered ${expected}.workers.dev.`);
          NODE

      - name: Verify account subdomain
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'Content-Type: application/json' \
            "$api" > /tmp/verified-subdomain.json
          node <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/verified-subdomain.json', 'utf8'));
          const expected = process.env.TARGET_WORKERS_SUBDOMAIN;
          if (!payload.success || payload.result?.subdomain !== expected) {
            throw new Error(`Expected Workers account subdomain ${expected}; verification did not match.`);
          }
          console.log(`Verified account Workers subdomain: ${expected}.workers.dev`);
          NODE
