name: Mkety Public AI Provider Probe

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/mkety-public-ai-provider-probe.yml'
      - '.github/workflows/mkety-public-candidate-deploy.yml'
      - '.github/workflows/mkety-public-production-cutover.yml'
      - 'src/features/public-assistant/**'
      - 'src/features/ai-runtime/providers/**'
      - 'src/shared/lib/env.ts'

permissions:
  contents: read

jobs:
  azure-foundry:
    name: Validate Azure Foundry Public AI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AZURE_API_KEY: ${{ secrets.MKETY_PUBLIC_AZURE_OPEN_AI_API_KEY || secrets.MKETY_PUBLIC_AZURE_OPENAI_API_KEY || secrets.MKETY_PUBLIC_AZURE_OPEN_AI_KEY || secrets.MKETY_PUBLIC_AZURE_OPENAI_KEY || secrets.MKETY_PUBLIC_AZURE_API_KEY || secrets.MKETY_PUBLIC_AZURE_KEY || secrets.AZURE_OPENAI_API_KEY || secrets.AZURE_AI_API_KEY }}
      AZURE_ENDPOINT: ${{ secrets.MKETY_PUBLIC_AZURE_OPEN_AI_ENDPOINT || secrets.MKETY_PUBLIC_AZURE_OPENAI_ENDPOINT || vars.MKETY_PUBLIC_AZURE_OPEN_AI_ENDPOINT || vars.MKETY_PUBLIC_AZURE_OPENAI_ENDPOINT }}
      AZURE_MODEL: ${{ secrets.MKETY_PUBLIC_AZURE_OPEN_AI_MODEL || secrets.MKETY_PUBLIC_AZURE_OPENAI_MODEL || secrets.MKETY_PUBLIC_AZURE_OPEN_AI_DEPLOYMENT || secrets.MKETY_PUBLIC_AZURE_OPENAI_DEPLOYMENT || vars.MKETY_PUBLIC_AZURE_OPEN_AI_MODEL || vars.MKETY_PUBLIC_AZURE_OPENAI_MODEL || vars.MKETY_PUBLIC_AZURE_OPEN_AI_DEPLOYMENT || vars.MKETY_PUBLIC_AZURE_OPENAI_DEPLOYMENT }}
    steps:
      - name: Require Azure Foundry configuration
        shell: bash
        run: |
          set -euo pipefail
          for variable in AZURE_API_KEY AZURE_ENDPOINT AZURE_MODEL; do
            if [ -z "${!variable:-}" ]; then
              echo "${variable} is not configured through the supported Public AI Azure secret aliases."
              exit 1
            fi
          done
          node -e "const u=new URL(process.env.AZURE_ENDPOINT);if(u.protocol!=='https:'||!/(?:\.openai\.azure\.com|\.services\.ai\.azure\.com)$/.test(u.hostname))process.exit(1)"
          echo 'Azure Foundry Public AI configuration is present.'

      - name: Call Responses API
        shell: bash
        run: |
          set -euo pipefail
          endpoint="${AZURE_ENDPOINT%/}"
          body="$(node -e "process.stdout.write(JSON.stringify({model:process.env.AZURE_MODEL,input:'Reply briefly with Mkety Azure ready.',max_output_tokens:64}))")"
          status="$(curl --connect-timeout 10 --max-time 60 -sS             -o /tmp/azure-response.json             -w '%{http_code}'             -X POST             -H 'Content-Type: application/json'             -H "api-key: $AZURE_API_KEY"             --data "$body"             "$endpoint/openai/v1/responses" || true)"
          if [ "$status" != '200' ]; then
            echo "Azure Foundry Responses API returned HTTP $status."
            RESPONSE=/tmp/azure-response.json node <<'NODE'
          const fs=require('node:fs');
          let payload={};
          try { payload=JSON.parse(fs.readFileSync(process.env.RESPONSE,'utf8')); } catch {}
          const error=payload.error && typeof payload.error==='object' ? payload.error : payload;
          const code=typeof error.code==='string' ? error.code : '';
          const message=typeof error.message==='string' ? error.message : '';
          if(code) console.error('Azure error code: '+code);
          if(message) console.error('Azure error: '+message.slice(0,500));
          NODE
            exit 1
          fi
          RESPONSE=/tmp/azure-response.json node <<'NODE'
          const fs=require('node:fs');
          const payload=JSON.parse(fs.readFileSync(process.env.RESPONSE,'utf8'));
          const text=typeof payload.output_text==='string'
            ? payload.output_text.trim()
            : (Array.isArray(payload.output) ? payload.output : [])
                .flatMap((item)=>Array.isArray(item?.content)?item.content:[])
                .map((part)=>typeof part?.text==='string'?part.text:'')
                .join('\n')
                .trim();
          if(!text) throw new Error('Azure Foundry returned HTTP 200 without usable response text.');
          console.log('Azure Foundry Public AI is responding successfully.');
          NODE

  worker-baseline:
    name: Read active Cloudflare Worker deployment/version metadata
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_NAME: mkety-platform
    steps:
      - name: Read Worker deployment and version metadata
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo 'Cloudflare API token is not configured.'; exit 1; }
          [[ "${CLOUDFLARE_ACCOUNT_ID:-}" =~ ^[0-9a-fA-F]{32}$ ]] || { echo 'Cloudflare account ID is missing or malformed.'; exit 1; }

          node <<'NODE'
          const fs = require('node:fs');
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const worker = process.env.WORKER_NAME;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const base = 'https://api.cloudflare.com/client/v4/accounts/' +
            encodeURIComponent(account) + '/workers/scripts/' +
            encodeURIComponent(worker);

          async function read(path) {
            let response;
            try {
              response = await fetch(base + path, {
                headers: { authorization: 'Bearer ' + token, accept: 'application/json' },
                signal: AbortSignal.timeout(20000),
              });
            } catch {
              throw new Error('Cloudflare read request failed before receiving a response.');
            }
            if (!response.ok) throw new Error('Cloudflare read request returned HTTP ' + response.status + '.');
            let body;
            try { body = await response.json(); }
            catch { throw new Error('Cloudflare returned invalid JSON for a read request.'); }
            if (body.success !== true) throw new Error('Cloudflare rejected a read request; response details were intentionally suppressed.');
            return body.result;
          }

          (async () => {
            const result = await read('/deployments?per_page=5');
            const deployments = Array.isArray(result?.deployments) ? result.deployments.slice(0, 5) : [];
            if (deployments.length === 0) throw new Error('No Worker deployments were returned.');
            const ids = [...new Set(deployments.flatMap(d =>
              Array.isArray(d.versions) ? d.versions.map(v => v.version_id) : []
            ))];
            for (const id of ids) {
              if (!/^[0-9a-f-]{36}$/i.test(id)) throw new Error('Cloudflare returned an invalid version identifier.');
            }
            const versions = new Map();
            await Promise.all(ids.map(async id => {
              const v = await read('/versions/' + encodeURIComponent(id));
              const metadata = v?.metadata || {};
              const script = v?.resources?.script || {};
              versions.set(id, {
                id: v?.id || id,
                number: v?.number ?? null,
                created_on: metadata.created_on || null,
                source: metadata.source || null,
                script_etag: script.etag || null,
                last_deployed_from: script.last_deployed_from || null,
              });
            }));
            const summary = deployments.map(d => ({
              id: d.id,
              created_on: d.created_on,
              source: d.source,
              strategy: d.strategy,
              versions: (d.versions || []).map(v => ({
                version_id: v.version_id,
                percentage: v.percentage,
                metadata: versions.get(v.version_id) || null,
              })),
              triggered_by: d.annotations?.['workers/triggered_by'] || null,
            }));
            const output = JSON.stringify({
              worker,
              inspected_at: new Date().toISOString(),
              active_deployment: summary[0],
              recent_deployments: summary,
            }, null, 2);
            console.log(output);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, '## Active production Worker baseline\\n\\n' + output + '\\n');
          })().catch(error => {
            console.error(error instanceof Error ? error.message : 'Worker metadata inspection failed.');
            process.exitCode = 1;
          });
          NODE
