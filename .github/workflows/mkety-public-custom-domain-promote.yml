name: Mkety Public Custom Domain Promote

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/mkety-public-custom-domain-promote.yml'

permissions:
  contents: read

jobs:
  validate:
    name: Validate custom-domain promotion control plane
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm workflow parser and safe staging state
        shell: bash
        run: |
          set -euo pipefail
          echo 'PASS custom-domain promotion workflow parses correctly.'
          echo 'No Cloudflare API call is made by this validation commit.'
