name: Mkety Public Custom Domain Promote

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mkety-public-custom-domain-promote.yml'

permissions:
  actions: read
  contents: read

env:
  VERIFIED_SHA: 8ef16bd1802499331d5d8ea9e43db2b0f8da6bcd
  PRODUCTION_WORKER_NAME: mkety-platform
  MKETY_HYPERDRIVE_NAME: mkety-production-db
  SKIP_ENV_VALIDATION: 'true'

jobs:
  promote:
    name: Promote verified Mkety public Worker with Custom Domains
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'ops: promote mkety via custom domains'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      NOWPAYMENTS_API_KEY: ${{ secrets.NOWPAYMENTS_API_KEY }}
      NOWPAYMENTS_IPN_SECRET: ${{ secrets.NOWPAYMENTS_IPN_SECRET }}
      MKETY_PUBLIC_AI_VISITOR_SECRET: ${{ secrets.MKETY_PUBLIC_AI_VISITOR_SECRET }}
      MKETY_PUBLIC_OPENAI_API_KEY: ${{ secrets.MKETY_PUBLIC_OPENAI_API_KEY }}
      MKETY_PUBLIC_AZURE_OPENAI_API_KEY: ${{ secrets.MKETY_PUBLIC_AZURE_OPENAI_API_KEY }}
      MKETY_PUBLIC_AZURE_OPENAI_ENDPOINT: ${{ secrets.MKETY_PUBLIC_AZURE_OPENAI_ENDPOINT }}
      MKETY_PUBLIC_AZURE_OPENAI_DEPLOYMENT: ${{ secrets.MKETY_PUBLIC_AZURE_OPENAI_DEPLOYMENT }}
      MKETY_PUBLIC_GEMINI_API_KEY: ${{ secrets.MKETY_PUBLIC_GEMINI_API_KEY }}
      MKETY_PUBLIC_VERTEX_PROJECT_ID: ${{ secrets.MKETY_PUBLIC_VERTEX_PROJECT_ID }}
      MKETY_PUBLIC_VERTEX_LOCATION: ${{ secrets.MKETY_PUBLIC_VERTEX_LOCATION }}
      MKETY_PUBLIC_VERTEX_ACCESS_TOKEN: ${{ secrets.MKETY_PUBLIC_VERTEX_ACCESS_TOKEN }}
      MKETY_PUBLIC_CLOUDFLARE_AI_API_TOKEN: ${{ secrets.MKETY_PUBLIC_CLOUDFLARE_AI_API_TOKEN }}
      MKETY_PUBLIC_BEDROCK_ACCESS_KEY_ID: ${{ secrets.MKETY_PUBLIC_BEDROCK_ACCESS_KEY_ID }}
      MKETY_PUBLIC_BEDROCK_SECRET_ACCESS_KEY: ${{ secrets.MKETY_PUBLIC_BEDROCK_SECRET_ACCESS_KEY }}
      MKETY_PUBLIC_BEDROCK_SESSION_TOKEN: ${{ secrets.MKETY_PUBLIC_BEDROCK_SESSION_TOKEN }}
      MKETY_PUBLIC_BEDROCK_REGION: ${{ secrets.MKETY_PUBLIC_BEDROCK_REGION }}
    steps:
      - name: Validate required production configuration
        shell: bash
        run: |
          set -euo pipefail
          for variable in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NOWPAYMENTS_API_KEY NOWPAYMENTS_IPN_SECRET MKETY_PUBLIC_AI_VISITOR_SECRET; do
            [ -n "${!variable:-}" ] || { echo "$variable is required in production."; exit 1; }
          done
          [ "${#MKETY_PUBLIC_AI_VISITOR_SECRET}" -ge 32 ] || { echo 'MKETY_PUBLIC_AI_VISITOR_SECRET is too short.'; exit 1; }

      - name: Verify exact candidate release evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verify_success() {
            workflow="$1"; label="$2"
            response="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?head_sha=$VERIFIED_SHA&status=success&per_page=20")"
            RESPONSE="$response" LABEL="$label" node <<'NODE'
          const p=JSON.parse(process.env.RESPONSE||'{}');
          if(!Array.isArray(p.workflow_runs)||p.workflow_runs.length===0) throw new Error(`No successful ${process.env.LABEL} evidence for exact certified SHA`);
          console.log(`PASS ${process.env.LABEL}`);
          NODE
          }
          verify_success mkety-public-candidate-deploy.yml 'public candidate'
          verify_success mkety-public-ai-runtime-diagnostic.yml 'Public AI runtime'
          verify_success mkety-production-preflight.yml 'production routing preflight'

      - name: Snapshot Cloudflare DNS, routes and existing Custom Domains
        id: edge
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          curl -fsS "${auth[@]}" "$api/zones?name=mkety.com&account.id=$CLOUDFLARE_ACCOUNT_ID" >/tmp/zones.json
          zone_id="$(node <<'NODE'
          const p=require('/tmp/zones.json');
          if(!p.success||!Array.isArray(p.result)||p.result.length!==1) throw new Error('Expected exactly one active mkety.com zone');
          process.stdout.write(p.result[0].id);
          NODE
          )"
          echo "zone_id=$zone_id" >> "$GITHUB_OUTPUT"
          curl -fsS "${auth[@]}" "$api/zones/$zone_id/dns_records?name=mkety.com" >/tmp/root-dns.json
          curl -fsS "${auth[@]}" "$api/zones/$zone_id/dns_records?name=www.mkety.com" >/tmp/www-dns.json
          curl -fsS "${auth[@]}" "$api/zones/$zone_id/workers/routes" >/tmp/routes-before.json
          curl -fsS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" >/tmp/domains-before.json
          node <<'NODE'
          const fs=require('node:fs');
          const root=require('/tmp/root-dns.json'), www=require('/tmp/www-dns.json'), routes=require('/tmp/routes-before.json'), domains=require('/tmp/domains-before.json');
          for(const [n,p] of [['root',root],['www',www],['routes',routes],['domains',domains]]) if(!p.success||!Array.isArray(p.result)) throw new Error(`Cloudflare ${n} lookup failed`);
          const targets=new Set(['mkety.com/*','www.mkety.com/*']);
          if(routes.result.some(r=>targets.has(r.pattern))) throw new Error('Refusing Custom Domain promotion while apex/www Worker Routes exist');
          for(const h of ['mkety.com','www.mkety.com']){
            const conflicts=domains.result.filter(d=>d.hostname===h && d.service!==process.env.PRODUCTION_WORKER_NAME);
            if(conflicts.length) throw new Error(`${h} already belongs to another Worker Custom Domain`);
          }
          const cnames=[...root.result,...www.result].filter(r=>r.type==='CNAME');
          if(cnames.length) throw new Error('Custom Domain promotion blocked by existing CNAME record');
          const safe=(p)=>p.result.map(r=>({name:r.name,type:r.type,proxied:r.proxied,ttl:r.ttl}));
          fs.writeFileSync('/tmp/dns-backup.json',JSON.stringify({root:root.result,www:www.result}));
          fs.writeFileSync('/tmp/routes-safe.json',JSON.stringify(routes.result.map(r=>({pattern:r.pattern,script:r.script||null})),null,2));
          fs.writeFileSync('/tmp/preflight-safe.json',JSON.stringify({root:safe(root),www:safe(www)},null,2));
          console.log('PASS no apex/www Worker Routes, no CNAME blockers, rollback DNS snapshot captured');
          NODE

      - name: Checkout exact certified application SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VERIFIED_SHA }}
          fetch-depth: 1

      - name: Assert exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$VERIFIED_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Select configured Public Mkety AI providers
        id: ai
        shell: bash
        run: |
          set -euo pipefail
          providers=()
          [ -n "${MKETY_PUBLIC_OPENAI_API_KEY:-}" ] && providers+=(openai)
          if [ -n "${MKETY_PUBLIC_AZURE_OPENAI_API_KEY:-}" ] && [ -n "${MKETY_PUBLIC_AZURE_OPENAI_ENDPOINT:-}" ] && [ -n "${MKETY_PUBLIC_AZURE_OPENAI_DEPLOYMENT:-}" ]; then providers+=(azure-openai); fi
          [ -n "${MKETY_PUBLIC_GEMINI_API_KEY:-}" ] && providers+=(gemini)
          if [ -n "${MKETY_PUBLIC_VERTEX_PROJECT_ID:-}" ] && [ -n "${MKETY_PUBLIC_VERTEX_LOCATION:-}" ] && [ -n "${MKETY_PUBLIC_VERTEX_ACCESS_TOKEN:-}" ]; then providers+=(vertex); fi
          [ -n "${MKETY_PUBLIC_CLOUDFLARE_AI_API_TOKEN:-}" ] && providers+=(cloudflare-ai)
          if [ -n "${MKETY_PUBLIC_BEDROCK_ACCESS_KEY_ID:-}" ] && [ -n "${MKETY_PUBLIC_BEDROCK_SECRET_ACCESS_KEY:-}" ]; then providers+=(bedrock); fi
          [ "${#providers[@]}" -gt 0 ] || { echo 'No production Public AI provider is configured.'; exit 1; }
          echo "primary=${providers[0]}" >> "$GITHUB_OUTPUT"
          fallback=''; [ "${#providers[@]}" -le 1 ] || fallback="$(IFS=,; echo "${providers[*]:1}")"
          echo "fallback=$fallback" >> "$GITHUB_OUTPUT"
          echo "PASS configured Public AI providers: ${#providers[@]}"

      - name: Resolve production Hyperdrive
        id: hyperdrive
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Accept: application/json' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/hyperdrive/configs?per_page=100")"
          HYPERDRIVES="$response" node <<'NODE' >/tmp/hyperdrive-id
          const p=JSON.parse(process.env.HYPERDRIVES||'{}'); const m=(p.result||[]).filter(x=>x.name===process.env.MKETY_HYPERDRIVE_NAME);
          if(!p.success||m.length!==1||!m[0].id) throw new Error('Expected exactly one production Hyperdrive');
          process.stdout.write(m[0].id);
          NODE
          echo "id=$(cat /tmp/hyperdrive-id)" >> "$GITHUB_OUTPUT"

      - name: Configure route-free production Worker and build
        shell: bash
        env:
          MKETY_HYPERDRIVE_ID: ${{ steps.hyperdrive.outputs.id }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('node:fs'); const p='wrangler.jsonc'; const c=JSON.parse(fs.readFileSync(p,'utf8'));
          c.name=process.env.PRODUCTION_WORKER_NAME; c.workers_dev=true; c.preview_urls=true;
          c.vars={...(c.vars||{}),SKIP_ENV_VALIDATION:'true'};
          c.hyperdrive=[{binding:'MKETY_DB',id:process.env.MKETY_HYPERDRIVE_ID}];
          delete c.route; delete c.routes; fs.writeFileSync(p,JSON.stringify(c,null,2)+'\n');
          NODE
          pnpx vinext check
          pnpm build
          CANDIDATE_WORKER_NAME="$PRODUCTION_WORKER_NAME" MKETY_HYPERDRIVE_ID="$MKETY_HYPERDRIVE_ID" pnpm run deploy --dry-run

      - name: Deploy exact production Worker route-free
        id: deploy
        shell: bash
        env:
          MKETY_HYPERDRIVE_ID: ${{ steps.hyperdrive.outputs.id }}
        run: |
          set -euo pipefail
          CANDIDATE_WORKER_NAME="$PRODUCTION_WORKER_NAME" MKETY_HYPERDRIVE_ID="$MKETY_HYPERDRIVE_ID" pnpm run deploy 2>&1 | tee /tmp/deploy.log
          url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.workers\.dev' /tmp/deploy.log | tail -n1 || true)"
          if [ -z "$url" ]; then
            account="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Accept: application/json' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain")"
            ACCOUNT="$account" node <<'NODE' >/tmp/subdomain
          const p=JSON.parse(process.env.ACCOUNT||'{}'); if(!p.success||!p.result?.subdomain) throw new Error('No workers.dev account subdomain'); process.stdout.write(p.result.subdomain);
          NODE
            url="https://${PRODUCTION_WORKER_NAME}.$(cat /tmp/subdomain).workers.dev"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Attach production runtime secrets
        shell: bash
        env:
          AI_PRIMARY: ${{ steps.ai.outputs.primary }}
          AI_FALLBACK: ${{ steps.ai.outputs.fallback }}
        run: |
          set -euo pipefail
          put_secret(){ n="$1"; v="$2"; if [ -n "$v" ]; then printf '%s' "$v" | pnpm exec wrangler secret put "$n" --name "$PRODUCTION_WORKER_NAME" >/dev/null; fi; }
          put_secret NOWPAYMENTS_API_KEY "$NOWPAYMENTS_API_KEY"
          put_secret NOWPAYMENTS_IPN_SECRET "$NOWPAYMENTS_IPN_SECRET"
          put_secret MKETY_PUBLIC_AI_VISITOR_SECRET "$MKETY_PUBLIC_AI_VISITOR_SECRET"
          put_secret MKETY_PUBLIC_AI_ENABLED 'true'
          put_secret MKETY_PUBLIC_AI_PRIMARY_PROVIDER "$AI_PRIMARY"
          put_secret MKETY_PUBLIC_AI_FALLBACK_PROVIDERS "$AI_FALLBACK"
          put_secret MKETY_PUBLIC_OPENAI_API_KEY "${MKETY_PUBLIC_OPENAI_API_KEY:-}"
          put_secret MKETY_PUBLIC_AZURE_OPENAI_API_KEY "${MKETY_PUBLIC_AZURE_OPENAI_API_KEY:-}"
          put_secret MKETY_PUBLIC_AZURE_OPENAI_ENDPOINT "${MKETY_PUBLIC_AZURE_OPENAI_ENDPOINT:-}"
          put_secret MKETY_PUBLIC_AZURE_OPENAI_DEPLOYMENT "${MKETY_PUBLIC_AZURE_OPENAI_DEPLOYMENT:-}"
          put_secret MKETY_PUBLIC_GEMINI_API_KEY "${MKETY_PUBLIC_GEMINI_API_KEY:-}"
          put_secret MKETY_PUBLIC_VERTEX_PROJECT_ID "${MKETY_PUBLIC_VERTEX_PROJECT_ID:-}"
          put_secret MKETY_PUBLIC_VERTEX_LOCATION "${MKETY_PUBLIC_VERTEX_LOCATION:-}"
          put_secret MKETY_PUBLIC_VERTEX_ACCESS_TOKEN "${MKETY_PUBLIC_VERTEX_ACCESS_TOKEN:-}"
          put_secret MKETY_PUBLIC_CLOUDFLARE_ACCOUNT_ID "$CLOUDFLARE_ACCOUNT_ID"
          put_secret MKETY_PUBLIC_CLOUDFLARE_AI_API_TOKEN "${MKETY_PUBLIC_CLOUDFLARE_AI_API_TOKEN:-}"
          put_secret MKETY_PUBLIC_BEDROCK_ACCESS_KEY_ID "${MKETY_PUBLIC_BEDROCK_ACCESS_KEY_ID:-}"
          put_secret MKETY_PUBLIC_BEDROCK_SECRET_ACCESS_KEY "${MKETY_PUBLIC_BEDROCK_SECRET_ACCESS_KEY:-}"
          put_secret MKETY_PUBLIC_BEDROCK_SESSION_TOKEN "${MKETY_PUBLIC_BEDROCK_SESSION_TOKEN:-}"
          put_secret MKETY_PUBLIC_BEDROCK_REGION "${MKETY_PUBLIC_BEDROCK_REGION:-}"
          echo 'PASS production runtime secrets attached without logging values'

      - name: Smoke route-free Worker before public mutation
        shell: bash
        env:
          BASE: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          routes=(/ /platform /workspaces /solutions /academy /pricing /enterprise /about /docs /privacy /terms /contact /robots.txt /sitemap.xml /api/public/assistant)
          for route in "${routes[@]}"; do
            code=000
            for attempt in $(seq 1 12); do
              code="$(curl -L -sS --connect-timeout 10 --max-time 25 -o /tmp/body -w '%{http_code}' "$BASE$route" || true)"
              [ "$code" = 200 ] && break
              sleep 4
            done
            echo "route-free $route HTTP $code"
            [ "$code" = 200 ] || exit 1
          done
          echo 'PASS route-free production Worker before hostname mutation'

      - name: Attach apex and www as Worker Custom Domains
        id: domains
        shell: bash
        env:
          ZONE_ID: ${{ steps.edge.outputs.zone_id }}
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          : >/tmp/created-domain-ids
          for host in mkety.com www.mkety.com; do
            all="$(curl -fsS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains")"
            existing="$(DOMAINS="$all" HOST="$host" node <<'NODE'
          const p=JSON.parse(process.env.DOMAINS||'{}'); const d=(p.result||[]).find(x=>x.hostname===process.env.HOST);
          if(d&&d.service!==process.env.PRODUCTION_WORKER_NAME) process.exit(2); if(d) process.stdout.write(d.id);
          NODE
            )" || status=$?
            if [ "${status:-0}" = 2 ]; then echo "$host belongs to another Worker"; exit 1; fi
            if [ -n "$existing" ]; then echo "$host already attached to $PRODUCTION_WORKER_NAME"; continue; fi
            body="$(HOST="$host" ZONE_ID="$ZONE_ID" node -e "process.stdout.write(JSON.stringify({hostname:process.env.HOST,service:process.env.PRODUCTION_WORKER_NAME,zone_id:process.env.ZONE_ID}))")"
            response="$(curl -fsS -X PUT "${auth[@]}" --data "$body" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains")"
            id="$(RESPONSE="$response" node <<'NODE'
          const p=JSON.parse(process.env.RESPONSE||'{}'); if(!p.success||!p.result?.id) throw new Error('Custom Domain attach failed'); process.stdout.write(p.result.id);
          NODE
            )"
            echo "$id" >>/tmp/created-domain-ids
            echo "PASS attached $host as Worker Custom Domain"
          done

      - name: Verify live mkety.com and www canonical redirect
        shell: bash
        run: |
          set -euo pipefail
          code=000
          for attempt in $(seq 1 60); do
            code="$(curl -sS --connect-timeout 10 --max-time 25 -o /tmp/root -w '%{http_code}' https://mkety.com/ || true)"
            [ "$code" = 200 ] && break
            echo "apex readiness attempt $attempt HTTP $code"
            sleep 5
          done
          [ "$code" = 200 ] || { echo 'mkety.com did not become healthy'; exit 1; }
          routes=(/ /platform /workspaces /solutions /academy /pricing /enterprise /about /docs /privacy /terms /contact /robots.txt /sitemap.xml /api/public/assistant)
          for route in "${routes[@]}"; do
            code="$(curl -L -sS --connect-timeout 10 --max-time 25 -o /tmp/live -w '%{http_code}' "https://mkety.com$route" || true)"
            echo "live $route HTTP $code"
            [ "$code" = 200 ] || exit 1
          done
          headers="$(curl -sSI --connect-timeout 10 --max-time 25 'https://www.mkety.com/pricing?source=promotion' || true)"
          status="$(printf '%s' "$headers" | awk 'toupper($1) ~ /^HTTP\// {code=$2} END{print code}')"
          location="$(printf '%s' "$headers" | awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/\r$/,""); sub(/^location:[[:space:]]*/,""); print; exit}')"
          echo "www redirect HTTP $status -> $location"
          [ "$status" = 308 ] || exit 1
          [ "$location" = 'https://mkety.com/pricing?source=promotion' ] || exit 1
          echo 'PASS public custom-domain acceptance'

      - name: Disable workers.dev after successful public verification
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data '{"enabled":false,"previews_enabled":false}' "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$PRODUCTION_WORKER_NAME/subdomain" >/dev/null
          echo 'PASS production workers.dev exposure disabled'

      - name: Verify routing isolation after promotion
        shell: bash
        env:
          ZONE_ID: ${{ steps.edge.outputs.zone_id }}
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'; auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          routes="$(curl -fsS "${auth[@]}" "$api/zones/$ZONE_ID/workers/routes")"
          before="$(cat /tmp/routes-safe.json)"
          ROUTES="$routes" BEFORE="$before" node <<'NODE'
          const p=JSON.parse(process.env.ROUTES||'{}'); const before=JSON.parse(process.env.BEFORE||'[]');
          if(!p.success||!Array.isArray(p.result)) throw new Error('Could not verify Worker Routes');
          const now=p.result.map(r=>({pattern:r.pattern,script:r.script||null}));
          if(JSON.stringify(now)!==JSON.stringify(before)) throw new Error('Worker Routes changed during Custom Domain promotion');
          console.log('PASS Worker Routes unchanged; unrelated routes preserved');
          NODE
          domains="$(curl -fsS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains")"
          DOMAINS="$domains" node <<'NODE'
          const p=JSON.parse(process.env.DOMAINS||'{}'); for(const h of ['mkety.com','www.mkety.com']){const d=(p.result||[]).find(x=>x.hostname===h); if(!d||d.service!==process.env.PRODUCTION_WORKER_NAME) throw new Error(`${h} Custom Domain missing`);} console.log('PASS both public hostnames attached to production Worker');
          NODE

      - name: Roll back only new Custom Domains on failure
        if: ${{ failure() && steps.edge.outcome == 'success' }}
        shell: bash
        env:
          ZONE_ID: ${{ steps.edge.outputs.zone_id }}
        run: |
          set +e
          api='https://api.cloudflare.com/client/v4'; auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')
          if [ -f /tmp/created-domain-ids ]; then
            while read -r id; do [ -z "$id" ] || curl -sS -X DELETE "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains/$id" >/dev/null; done </tmp/created-domain-ids
          fi
          sleep 3
          if [ -f /tmp/dns-backup.json ] && [ -n "${ZONE_ID:-}" ]; then
            DNS_BACKUP="$(cat /tmp/dns-backup.json)" ZONE_ID="$ZONE_ID" CLOUDFLARE_API_TOKEN="$CLOUDFLARE_API_TOKEN" node <<'NODE'
          const {execFileSync}=require('node:child_process'); const b=JSON.parse(process.env.DNS_BACKUP||'{}');
          const records=[...(b.root||[]),...(b.www||[])].filter(r=>r.type==='A'||r.type==='AAAA'||r.type==='CNAME');
          for(const r of records){
            const q=execFileSync('curl',['-fsS','-H',`Authorization: Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,'-H','Content-Type: application/json',`https://api.cloudflare.com/client/v4/zones/${process.env.ZONE_ID}/dns_records?type=${encodeURIComponent(r.type)}&name=${encodeURIComponent(r.name)}&content=${encodeURIComponent(r.content)}`],{encoding:'utf8'});
            const p=JSON.parse(q); if(Array.isArray(p.result)&&p.result.length) continue;
            const body=JSON.stringify({type:r.type,name:r.name,content:r.content,ttl:r.ttl||1,proxied:Boolean(r.proxied)});
            execFileSync('curl',['-fsS','-X','POST','-H',`Authorization: Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,'-H','Content-Type: application/json','--data',body,`https://api.cloudflare.com/client/v4/zones/${process.env.ZONE_ID}/dns_records`],{stdio:'ignore'});
          }
          NODE
          fi
          echo 'Rollback attempted for Custom Domains created by this run and legacy DNS records were re-established if missing.'

      - name: Upload sanitized promotion evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: mkety-public-custom-domain-${{ env.VERIFIED_SHA }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            /tmp/preflight-safe.json
            /tmp/routes-safe.json
