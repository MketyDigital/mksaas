name: Mkety Cloudflare Private DB Capability Audit

on:
  workflow_dispatch:
  push:
    branches:
      - fix/production-db-private-runner
    paths:
      - '.github/workflows/mkety-cloudflare-private-db-capability-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    # Read-only probe: no Cloudflare or Coolify resources are mutated here.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      COOLIFY_URL: https://deploy.mkety.com
    steps:
      - name: Verify private database platform capabilities
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo 'CLOUDFLARE_API_TOKEN unavailable.'; exit 1; }
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || { echo 'CLOUDFLARE_ACCOUNT_ID unavailable.'; exit 1; }
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Accept: application/json')
          check() {
            local label="$1" url="$2" out="$3"
            local code
            code="$(curl -sS -o "$out" -w '%{http_code}' "${auth[@]}" "$url" || true)"
            echo "$label HTTP $code"
            if [ "$code" = '200' ]; then return 0; fi
            node -e "const x=require(process.argv[1]); const e=Array.isArray(x.errors)?x.errors.map(v=>String(v.code||'')+':'+String(v.message||'')).join('; '):''; if(e) console.log('Cloudflare error: '+e)" "$out" 2>/dev/null || true
            return 1
          }

          tunnel=0; vpc=0; hyperdrive=0; access_apps=0; access_tokens=0
          check 'Tunnel list' "$base/cfd_tunnel?is_deleted=false&per_page=50" /tmp/tunnels.json && tunnel=1 || true
          check 'Workers VPC services list' "$base/connectivity/directory/services?per_page=50" /tmp/vpc.json && vpc=1 || true
          check 'Hyperdrive list' "$base/hyperdrive/configs" /tmp/hyperdrive.json && hyperdrive=1 || true
          check 'Access applications list' "$base/access/apps?per_page=50" /tmp/access-apps.json && access_apps=1 || true
          check 'Access service tokens list' "$base/access/service_tokens?per_page=50" /tmp/access-tokens.json && access_tokens=1 || true

          if [ "$hyperdrive" = '1' ]; then
            node <<'NODE'
          const fs=require('node:fs'); const x=JSON.parse(fs.readFileSync('/tmp/hyperdrive.json','utf8')); const a=Array.isArray(x.result)?x.result:[];
          console.log(`Hyperdrive configurations visible: ${a.length}`);
          for(const h of a){const o=h.origin||{}; console.log(`- name=${String(h.name||'unnamed')}; id=${String(h.id||'')}; origin=${o.service_id?'vpc-service':o.access_client_id?'access-tunnel':o.host?'internet-host':'unknown'}`)}
          NODE
          fi
          echo "Capability summary: tunnel=$tunnel vpc=$vpc hyperdrive=$hyperdrive access_apps=$access_apps access_service_tokens=$access_tokens"

      - name: Read safe Coolify PostgreSQL TLS posture
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${COOLIFY_API_TOKEN:-}" ] || { echo 'COOLIFY_TOKEN unavailable.'; exit 1; }
          curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            "${COOLIFY_URL%/}/api/v1/databases" -o /tmp/dbs.json
          node <<'NODE'
          const fs=require('node:fs'); const x=JSON.parse(fs.readFileSync('/tmp/dbs.json','utf8')); const a=Array.isArray(x)?x:(x.data||x.databases||[]);
          const d=a.find(v=>v&&v.name==='mkety-postgres'); if(!d) throw new Error('mkety-postgres not found');
          const keys=['name','uuid','status','image','is_public','public_port','enable_ssl','ssl_mode','ssl_enabled','ssl_certificate_id','health_check_enabled'];
          const safe={}; for(const k of keys) if(d[k]!==undefined) safe[k]=d[k];
          console.log('Postgres safe posture: '+JSON.stringify(safe));
          NODE
