name: Mkety Authenticated Preview Smoke

on:
  push:
    branches:
      - feat/mkety-auth-zitadel-vinext
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mkety-authenticated-preview-smoke
  cancel-in-progress: true

jobs:
  authenticated-smoke:
    name: ZITADEL login → Mkety tenant → logout
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      ZITADEL_MANAGEMENT_TOKEN: ${{ secrets.ZITADEL_MANAGEMENT_PAT }}
      MKETY_AUTH_ISSUER: ${{ vars.ZITADEL_URL }}
      ZITADEL_PROJECT_ID: ${{ secrets.ZITADEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve preview URL and smoke identity
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID STAGING_DATABASE_URL ZITADEL_MANAGEMENT_TOKEN MKETY_AUTH_ISSUER ZITADEL_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing authenticated-smoke credential/configuration: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "::add-mask::$ZITADEL_MANAGEMENT_TOKEN"

          response="$(curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
          subdomain="$(RESPONSE="$response" node <<'NODE'
          const parsed = JSON.parse(process.env.RESPONSE);
          if (parsed.success !== true || !parsed.result?.subdomain) throw new Error('Cloudflare workers.dev subdomain missing');
          process.stdout.write(parsed.result.subdomain);
          NODE
          )"
          preview_url="https://mkety-platform-preview.${subdomain}.workers.dev"
          suffix="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          username="mkety-smoke-${suffix}"
          email="${username}@example.invalid"
          workspace_slug="auth-smoke-${suffix}"
          password="Mkety!$(openssl rand -hex 18)Aa9"
          echo "::add-mask::$password"
          echo "PREVIEW_URL=$preview_url" >> "$GITHUB_ENV"
          echo "SMOKE_USERNAME=$username" >> "$GITHUB_ENV"
          echo "SMOKE_EMAIL=$email" >> "$GITHUB_ENV"
          echo "SMOKE_WORKSPACE_SLUG=$workspace_slug" >> "$GITHUB_ENV"
          echo "SMOKE_PASSWORD=$password" >> "$GITHUB_ENV"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "workspace_slug=$workspace_slug" >> "$GITHUB_OUTPUT"
          echo "- Preview URL: $preview_url" >> "$GITHUB_STEP_SUMMARY"

      - name: Create temporary ZITADEL smoke user
        id: zitadel-user
        shell: bash
        run: |
          set -euo pipefail
          project_response="$(curl --fail-with-body --silent --show-error \
            -X POST "${MKETY_AUTH_ISSUER%/}/zitadel.project.v2.ProjectService/GetProject" \
            -H "Authorization: Bearer ${ZITADEL_MANAGEMENT_TOKEN}" \
            -H 'Connect-Protocol-Version: 1' \
            -H 'Content-Type: application/json' \
            --data "{\"projectId\":\"${ZITADEL_PROJECT_ID}\"}")"
          organization_id="$(RESPONSE="$project_response" node <<'NODE'
          const parsed = JSON.parse(process.env.RESPONSE);
          if (!parsed.project?.organizationId) throw new Error('ZITADEL project organization id missing');
          process.stdout.write(parsed.project.organizationId);
          NODE
          )"
          body="$(ORG_ID="$organization_id" node <<'NODE'
          process.stdout.write(JSON.stringify({
            username: process.env.SMOKE_USERNAME,
            organization: { orgId: process.env.ORG_ID },
            profile: {
              givenName: 'Mkety',
              familyName: 'Smoke',
              displayName: 'Mkety Auth Smoke',
              preferredLanguage: 'en',
            },
            email: { email: process.env.SMOKE_EMAIL, isVerified: true },
            password: { password: process.env.SMOKE_PASSWORD, changeRequired: false },
          }));
          NODE
          )"
          user_response="$(curl --fail-with-body --silent --show-error \
            -X POST "${MKETY_AUTH_ISSUER%/}/v2/users/human" \
            -H "Authorization: Bearer ${ZITADEL_MANAGEMENT_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "$body")"
          user_id="$(RESPONSE="$user_response" node <<'NODE'
          const parsed = JSON.parse(process.env.RESPONSE);
          if (!parsed.userId) throw new Error('ZITADEL did not return smoke user id');
          process.stdout.write(parsed.userId);
          NODE
          )"
          echo "ZITADEL_SMOKE_USER_ID=$user_id" >> "$GITHUB_ENV"
          echo "user_id=$user_id" >> "$GITHUB_OUTPUT"
          echo "- Temporary ZITADEL smoke user created" >> "$GITHUB_STEP_SUMMARY"

      - name: Install Playwright for CI-only smoke
        shell: bash
        run: |
          set -euo pipefail
          pnpm add --save-dev --lockfile=false @playwright/test@1.55.0
          pnpm exec playwright install --with-deps chromium

      - name: Exercise real login, Mkety session, tenant authorization, and logout
        shell: bash
        run: |
          set -euo pipefail
          cat > auth-smoke.spec.cjs <<'PLAYWRIGHT'
          const { test, expect } = require('@playwright/test');

          const preview = process.env.PREVIEW_URL;
          const issuer = new URL(process.env.MKETY_AUTH_ISSUER).origin;
          const username = process.env.SMOKE_USERNAME;
          const password = process.env.SMOKE_PASSWORD;
          const email = process.env.SMOKE_EMAIL;
          const slug = process.env.SMOKE_WORKSPACE_SLUG;

          async function fillFirstVisible(page, selectors, value) {
            for (const selector of selectors) {
              const locator = page.locator(selector).first();
              if (await locator.isVisible().catch(() => false)) {
                await locator.fill(value);
                return;
              }
            }
            throw new Error(`No visible input matched: ${selectors.join(', ')}`);
          }

          async function clickFirstVisible(page, selectors) {
            for (const selector of selectors) {
              const locator = page.locator(selector).first();
              if (await locator.isVisible().catch(() => false)) {
                await locator.click();
                return;
              }
            }
            throw new Error(`No visible action matched: ${selectors.join(', ')}`);
          }

          test('real ZITADEL login creates a Mkety session and current-tenant authorization, then logout revokes it', async ({ page }) => {
            await page.goto(`${preview}/login`);
            await page.getByRole('button', { name: /continue with zitadel/i }).click();
            await page.waitForURL((url) => url.origin === issuer, { timeout: 30_000 });

            await fillFirstVisible(page, [
              'input[name="loginName"]',
              'input[name="username"]',
              'input[autocomplete="username"]',
              'input[type="email"]',
              'input[type="text"]',
            ], username);
            await clickFirstVisible(page, [
              'button[type="submit"]',
              'button:has-text("Next")',
              'button:has-text("Continue")',
              'button:has-text("Login")',
              'button:has-text("Sign in")',
            ]);

            await fillFirstVisible(page, [
              'input[name="password"]',
              'input[autocomplete="current-password"]',
              'input[type="password"]',
            ], password);
            await clickFirstVisible(page, [
              'button[type="submit"]',
              'button:has-text("Next")',
              'button:has-text("Continue")',
              'button:has-text("Login")',
              'button:has-text("Sign in")',
            ]);

            await page.waitForURL((url) => url.origin === new URL(preview).origin, { timeout: 45_000 });

            const session = await page.evaluate(async () => {
              const response = await fetch('/api/auth/session', { credentials: 'include', cache: 'no-store' });
              return { status: response.status, body: await response.json() };
            });
            expect(session.status).toBe(200);
            expect(session.body?.user?.email).toBe(email);

            const create = await page.evaluate(async ({ slug }) => {
              const response = await fetch('/api/workspaces', {
                method: 'POST',
                credentials: 'include',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({ name: 'Mkety Auth Smoke', slug, description: 'CI authenticated smoke workspace' }),
              });
              return { status: response.status, body: await response.json() };
            }, { slug });
            expect(create.status).toBe(200);
            expect(create.body?.redirectTo).toBe(`/t/${slug}`);

            const protectedResponse = await page.goto(`${preview}/t/${slug}`);
            expect(protectedResponse?.status()).toBeLessThan(400);
            await expect(page).toHaveURL(new RegExp(`/t/${slug}(?:/)?$`));

            await page.goto(`${preview}/api/auth/logout?returnTo=/login`);
            await page.waitForURL(`${preview}/login`, { timeout: 30_000 });

            const afterLogout = await page.evaluate(async () => {
              const response = await fetch('/api/auth/session', { credentials: 'include', cache: 'no-store' });
              return { status: response.status, body: await response.json() };
            });
            expect(afterLogout.status).toBe(200);
            expect(afterLogout.body?.user ?? null).toBeNull();
          });
          PLAYWRIGHT
          pnpm exec playwright test auth-smoke.spec.cjs --reporter=line --workers=1
          rm -f auth-smoke.spec.cjs
          echo "- Authenticated browser smoke: passed" >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup temporary Mkety staging identity/workspace
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import postgres from 'postgres';
          const sql = postgres(process.env.STAGING_DATABASE_URL, { max: 1, prepare: false });
          try {
            if (process.env.SMOKE_WORKSPACE_SLUG) {
              await sql`delete from saas_template.tenants where slug = ${process.env.SMOKE_WORKSPACE_SLUG}`;
            }
            if (process.env.SMOKE_EMAIL) {
              await sql`delete from saas_template.users where email = ${process.env.SMOKE_EMAIL}`;
            }
          } finally {
            await sql.end({ timeout: 5 });
          }
          NODE

      - name: Cleanup temporary ZITADEL smoke user
        if: always() && steps.zitadel-user.outputs.user_id != ''
        shell: bash
        env:
          ZITADEL_SMOKE_USER_ID: ${{ steps.zitadel-user.outputs.user_id }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X DELETE "${MKETY_AUTH_ISSUER%/}/v2/users/${ZITADEL_SMOKE_USER_ID}" \
            -H "Authorization: Bearer ${ZITADEL_MANAGEMENT_TOKEN}" \
            -H 'Content-Type: application/json' >/dev/null
          echo "- Temporary ZITADEL smoke user removed" >> "$GITHUB_STEP_SUMMARY"
