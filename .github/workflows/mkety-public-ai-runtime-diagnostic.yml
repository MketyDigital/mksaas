name: Mkety Public AI Runtime Diagnostic

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/mkety-public-ai-runtime-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    name: Detect accessible Public AI OpenAI model
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 24
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: staging
    env:
      MKETY_PUBLIC_OPENAI_API_KEY: ${{ secrets.MKETY_PUBLIC_OPENAI_API_KEY }}
    steps:
      - name: Probe approved OpenAI models
        shell: bash
        run: |
          set -euo pipefail
          found=''
          for model in gpt-5.6-luna gpt-5.6-terra gpt-5.6-sol gpt-5.6; do
            code="$(curl -sS -o /tmp/model.json -w '%{http_code}' \
              -H "Authorization: Bearer $MKETY_PUBLIC_OPENAI_API_KEY" \
              "https://api.openai.com/v1/models/$model" || true)"
            echo "$model access status: $code"
            if [ "$code" = '200' ] && [ -z "$found" ]; then
              found="$model"
            fi
          done
          if [ -z "$found" ]; then
            echo 'No currently approved GPT-5.6 Public AI model is accessible to this OpenAI project.'
            exit 1
          fi
          echo "First accessible approved model: $found"
