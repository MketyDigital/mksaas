name: Verify immutable refreshed Webhook head

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/_webhook-auth-refresh-diagnostic.yml'

permissions:
  contents: read

env:
  CI: 'true'
  SKIP_ENV_VALIDATION: 'true'
  DATABASE_URL: postgresql://probe:probe@localhost:5432/probe
  VERIFIED_WEBHOOK_SHA: d62bc71fe6d491b65db2db128ef3cb9e8cb39868
  VERIFIED_AUTH_SHA: 42d10cdbbd0ae51c9158539f0df2982e62c34bf1

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: d62bc71fe6d491b65db2db128ef3cb9e8cb39868
          fetch-depth: 0
      - name: Verify immutable commit and Auth ancestry
        run: |
          test "$(git rev-parse HEAD)" = "$VERIFIED_WEBHOOK_SHA"
          git merge-base --is-ancestor "$VERIFIED_AUTH_SHA" HEAD
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify migration baseline and forward generation
        run: |
          pnpm db:check:migrations
          pnpm exec drizzle-kit check
          before="$(git status --porcelain)"
          pnpm db:generate --name=immutable_forward_probe
          test "$(git status --porcelain)" = "$before"
      - name: Run full tests
        run: pnpm test
      - name: Run type-check
        run: pnpm type-check
      - name: Run lint
        run: pnpm lint
      - name: Check vinext compatibility
        run: pnpx vinext check
      - name: Build production artifact
        run: pnpm build
      - name: Validate isolated preview packaging
        run: pnpm run deploy --env preview --dry-run
