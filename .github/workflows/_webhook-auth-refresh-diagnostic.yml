name: Webhook Auth refresh diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/_webhook-auth-refresh-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mkety-automation-webhook-trigger
          fetch-depth: 0
      - name: Fetch verified Auth branch
        run: git fetch origin feat/mkety-auth-zitadel-vinext
      - name: Diagnose Auth merge conflicts
        run: |
          git config user.name 'Mkety Webhook Integration Bot'
          git config user.email 'actions@users.noreply.github.com'
          set +e
          git merge --no-commit --no-ff origin/feat/mkety-auth-zitadel-vinext
          status=$?
          set -e
          echo "merge_status=$status"
          echo '=== unmerged files ==='
          git diff --name-only --diff-filter=U | sort
          echo '=== staged merge summary ==='
          git diff --cached --stat || true
          if [ "$status" -ne 0 ]; then
            test -n "$(git diff --name-only --diff-filter=U)"
            exit 1
          fi
          git merge --abort
