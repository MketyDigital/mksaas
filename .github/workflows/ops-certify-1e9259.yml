name: Ops Certify Mkety 1e9259

on:
  push:
    branches:
      - ops/certify-1e9259
    paths:
      - '.github/workflows/ops-certify-1e9259.yml'

permissions:
  actions: write
  contents: read

env:
  TARGET_SHA: 1e925904bef8be9007167aeb51bb086b4c2df118
  TARGET_REF: main

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify exact main head and dispatch release certifications
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="$(curl -fsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/branches/$TARGET_REF")"
          BRANCH="$branch" node <<'NODE'
          const payload = JSON.parse(process.env.BRANCH || '{}');
          if (payload?.commit?.sha !== process.env.TARGET_SHA) {
            throw new Error(`Main head changed: expected ${process.env.TARGET_SHA}, got ${payload?.commit?.sha || 'unknown'}`);
          }
          console.log(`Verified exact main SHA: ${process.env.TARGET_SHA}`);
          NODE

          dispatch() {
            local workflow="$1"
            local code
            code="$(curl -sS -o /tmp/dispatch.json -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H 'Content-Type: application/json' \
              --data "$(node -e 'process.stdout.write(JSON.stringify({ref:process.env.TARGET_REF}))')" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/dispatches")"
            if [ "$code" != '204' ]; then
              echo "Dispatch failed for $workflow with HTTP $code"
              cat /tmp/dispatch.json
              exit 1
            fi
            echo "Dispatched $workflow on exact main SHA $TARGET_SHA"
          }

          dispatch 'mkety-content-db-smoke.yml'
          dispatch 'mkety-public-ai-runtime-diagnostic.yml'
          dispatch 'mkety-production-preflight.yml'
          dispatch 'mkety-public-candidate-deploy.yml'
