name: Mkety Cloudflare Preview

on:
  push:
    branches:
      - feat/mkety-auth-zitadel-vinext
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: mkety-cloudflare-preview
  cancel-in-progress: true

env:
  SKIP_ENV_VALIDATION: 'true'

jobs:
  verify:
    name: Verify preview candidate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: Run type-check
        run: pnpm type-check
      - name: Run lint
        run: pnpm lint
      - name: Check vinext compatibility
        run: pnpx vinext check
      - name: Build production artifact
        run: pnpm build
      - name: Validate isolated preview packaging
        run: pnpm run deploy --env preview --dry-run

  deploy-preview:
    name: Deploy isolated workers.dev preview
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      ZITADEL_MANAGEMENT_TOKEN: ${{ secrets.ZITADEL_MANAGEMENT_PAT }}
      MKETY_AUTH_ISSUER: ${{ vars.ZITADEL_URL }}
      ZITADEL_PROJECT_ID: ${{ secrets.ZITADEL_PROJECT_ID }}
      CONFIGURED_MKETY_AUTH_SESSION_SECRET: ${{ secrets.MKETY_AUTH_SESSION_SECRET }}
    outputs:
      preview_url: ${{ steps.preview-url.outputs.url }}
      zitadel_application_id: ${{ steps.zitadel.outputs.application_id }}
      zitadel_client_id: ${{ steps.zitadel.outputs.client_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Require exact preview credentials
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID_VAR: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID_VAR:-}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID_VAR" >> "$GITHUB_ENV"
            export CLOUDFLARE_ACCOUNT_ID="$CLOUDFLARE_ACCOUNT_ID_VAR"
          fi
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID STAGING_DATABASE_URL ZITADEL_MANAGEMENT_TOKEN MKETY_AUTH_ISSUER ZITADEL_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required preview credential/configuration: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "::add-mask::$ZITADEL_MANAGEMENT_TOKEN"
          echo "Using exact configured ZITADEL keys: ZITADEL_MANAGEMENT_PAT, ZITADEL_URL, ZITADEL_PROJECT_ID."

      - name: Derive exact workers.dev URL before deployment
        id: preview-url
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/subdomain" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
          subdomain="$(RESPONSE="$response" node <<'NODE'
          const parsed = JSON.parse(process.env.RESPONSE);
          if (parsed.success !== true || !parsed.result?.subdomain) {
            throw new Error('Cloudflare did not return the account workers.dev subdomain');
          }
          process.stdout.write(parsed.result.subdomain);
          NODE
          )"
          url="https://mkety-platform-preview.${subdomain}.workers.dev"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "PREVIEW_URL=$url" >> "$GITHUB_ENV"
          echo "MKETY_AUTH_REDIRECT_URI=$url/api/auth/callback" >> "$GITHUB_ENV"
          echo "MKETY_AUTH_POST_LOGOUT_REDIRECT_URI=$url/login" >> "$GITHUB_ENV"
          echo "### Cloudflare preview" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker name: \`mkety-platform-preview\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deterministic URL: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Create or reconcile Mkety Platform Preview in ZITADEL
        id: zitadel
        shell: bash
        env:
          ZITADEL_APPLICATION_NAME: Mkety Platform Preview
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/provision-zitadel-redirects.ts

      - name: Require returned ZITADEL client and summarize non-secret identity
        shell: bash
        env:
          ZITADEL_APPLICATION_ID: ${{ steps.zitadel.outputs.application_id }}
          ZITADEL_CLIENT_ID: ${{ steps.zitadel.outputs.client_id }}
          ZITADEL_CREATED: ${{ steps.zitadel.outputs.created }}
        run: |
          set -euo pipefail
          if [ -z "$ZITADEL_APPLICATION_ID" ] || [ -z "$ZITADEL_CLIENT_ID" ]; then
            echo "::error::ZITADEL provisioning did not return an application id and client id."
            exit 1
          fi
          echo "MKETY_AUTH_CLIENT_ID=$ZITADEL_CLIENT_ID" >> "$GITHUB_ENV"
          echo "ZITADEL_APPLICATION_ID=$ZITADEL_APPLICATION_ID" >> "$GITHUB_ENV"
          echo "- ZITADEL application: \`Mkety Platform Preview\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- ZITADEL application id: \`$ZITADEL_APPLICATION_ID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- ZITADEL client id: \`$ZITADEL_CLIENT_ID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Created this run: \`$ZITADEL_CREATED\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- OIDC mode: public Web client, Authorization Code + PKCE, no client secret" >> "$GITHUB_STEP_SUMMARY"

      - name: Determine durable preview session-secret strategy
        id: session
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CONFIGURED_MKETY_AUTH_SESSION_SECRET:-}" ]; then
            echo "::add-mask::$CONFIGURED_MKETY_AUTH_SESSION_SECRET"
            echo "EFFECTIVE_MKETY_AUTH_SESSION_SECRET=$CONFIGURED_MKETY_AUTH_SESSION_SECRET" >> "$GITHUB_ENV"
            echo "include_session_secret=true" >> "$GITHUB_OUTPUT"
            echo "- Session secret source: configured GitHub preview secret" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          existing="false"
          if pnpm exec wrangler secret list --env preview --format json > /tmp/mkety-existing-secrets.json 2>/dev/null; then
            existing="$(node -e "const fs=require('node:fs'); const raw=fs.readFileSync('/tmp/mkety-existing-secrets.json','utf8'); const match=raw.match(/\[\s*(?:\{|\])/); if(!match) throw new Error('Wrangler output did not contain a JSON array'); const entries=JSON.parse(raw.slice(match.index)); process.stdout.write(entries.some((entry)=>entry.name==='MKETY_AUTH_SESSION_SECRET')?'true':'false');")"
          fi

          if [ "$existing" = "true" ]; then
            echo "include_session_secret=false" >> "$GITHUB_OUTPUT"
            echo "- Session secret source: existing Cloudflare binding preserved via keep_vars" >> "$GITHUB_STEP_SUMMARY"
          else
            session_secret="$(openssl rand -hex 32)"
            echo "::add-mask::$session_secret"
            echo "EFFECTIVE_MKETY_AUTH_SESSION_SECRET=$session_secret" >> "$GITHUB_ENV"
            echo "include_session_secret=true" >> "$GITHUB_OUTPUT"
            echo "- Session secret source: generated once for first preview deployment" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build exact-origin preview artifact
        env:
          NEXT_PUBLIC_APP_URL: ${{ steps.preview-url.outputs.url }}
        run: pnpm build

      - name: Deploy preview Worker with complete required runtime
        shell: bash
        env:
          INCLUDE_SESSION_SECRET: ${{ steps.session.outputs.include_session_secret }}
          NEXT_PUBLIC_APP_URL: ${{ steps.preview-url.outputs.url }}
        run: |
          set -euo pipefail
          secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file"' EXIT
          SECRETS_FILE="$secrets_file" node <<'NODE'
          const fs = require('node:fs');
          const values = {
            NODE_ENV: 'production',
            DATABASE_URL: process.env.STAGING_DATABASE_URL,
            MKETY_AUTH_PROVIDER: 'zitadel',
            MKETY_AUTH_ISSUER: process.env.MKETY_AUTH_ISSUER,
            MKETY_AUTH_CLIENT_ID: process.env.MKETY_AUTH_CLIENT_ID,
            MKETY_AUTH_REDIRECT_URI: process.env.MKETY_AUTH_REDIRECT_URI,
            MKETY_AUTH_POST_LOGOUT_REDIRECT_URI: process.env.MKETY_AUTH_POST_LOGOUT_REDIRECT_URI,
            NEXT_PUBLIC_APP_URL: process.env.NEXT_PUBLIC_APP_URL,
          };
          if (process.env.INCLUDE_SESSION_SECRET === 'true') {
            values.MKETY_AUTH_SESSION_SECRET = process.env.EFFECTIVE_MKETY_AUTH_SESSION_SECRET;
          }
          for (const [key, value] of Object.entries(values)) {
            if (!value) throw new Error(`Missing required preview runtime value: ${key}`);
          }
          fs.writeFileSync(process.env.SECRETS_FILE, JSON.stringify(values));
          NODE
          pnpm run deploy --env preview --secrets-file "$secrets_file" 2>&1 | tee preview-deploy.log

      - name: Verify required Cloudflare bindings exist
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler secret list --env preview --format json > /tmp/mkety-preview-secrets.json
          node <<'NODE'
          const fs = require('node:fs');
          const raw = fs.readFileSync('/tmp/mkety-preview-secrets.json', 'utf8');
          const match = raw.match(/\[\s*(?:\{|\])/);
          if (!match) throw new Error('Wrangler output did not contain a JSON array');
          const entries = JSON.parse(raw.slice(match.index));
          const names = new Set(entries.map((entry) => entry.name));
          const required = [
            'DATABASE_URL',
            'MKETY_AUTH_PROVIDER',
            'MKETY_AUTH_ISSUER',
            'MKETY_AUTH_CLIENT_ID',
            'MKETY_AUTH_REDIRECT_URI',
            'MKETY_AUTH_POST_LOGOUT_REDIRECT_URI',
            'MKETY_AUTH_SESSION_SECRET',
          ];
          const missing = required.filter((name) => !names.has(name));
          if (missing.length) {
            throw new Error(`Preview Worker is missing required secret bindings: ${missing.join(', ')}`);
          }
          console.log(`Verified ${required.length} required Mkety Auth bindings by name.`);
          NODE

      - name: Smoke public preview routes
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.preview-url.outputs.url }}
        run: |
          set -euo pipefail
          for path in / /login; do
            status="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --max-time 30 "$PREVIEW_URL$path")"
            echo "$path -> HTTP $status"
            if [ "$status" -lt 200 ] || [ "$status" -ge 400 ]; then
              echo "::error::Preview route $path did not resolve successfully; HTTP $status"
              exit 1
            fi
          done

      - name: Smoke unauthenticated session boundary
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.preview-url.outputs.url }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/session.json --write-out '%{http_code}' --max-time 30 "$PREVIEW_URL/api/auth/session")"
          echo "/api/auth/session -> HTTP $status"
          if [ "$status" -eq 404 ] || [ "$status" -ge 500 ] || [ "$status" -eq 0 ]; then
            echo "::error::Mkety Auth session boundary is missing or unhealthy; HTTP $status"
            exit 1
          fi
          echo "- Unauthenticated session boundary: HTTP $status" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke branded auth first-hop redirect
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.preview-url.outputs.url }}
          EXPECTED_LOGIN_ORIGIN: https://auth.mkety.com
        run: |
          set -euo pipefail
          for intent in signin signup; do
            headers="$(mktemp)"
            status="$(curl --silent --show-error --output /dev/null --dump-header "$headers" --write-out '%{http_code}' --max-time 30 "$PREVIEW_URL/api/auth/login?returnTo=/select-tenant&intent=$intent")"
            location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")"
            rm -f "$headers"
            echo "/api/auth/login?intent=$intent -> HTTP $status"
            if [ "$status" -lt 300 ] || [ "$status" -ge 400 ] || [ -z "$location" ]; then
              echo "::error::Mkety Auth $intent did not return a branded login redirect."
              exit 1
            fi
            LOCATION="$location" INTENT="$intent" node <<'NODE'
          const location = new URL(process.env.LOCATION);
          if (location.origin !== process.env.EXPECTED_LOGIN_ORIGIN) {
            throw new Error(`Browser-visible auth redirect escaped Mkety domain: ${location.origin}`);
          }
          if (!location.pathname.startsWith('/ui/v2/login/')) {
            throw new Error(`Unexpected branded login path: ${location.pathname}`);
          }
          const requestId = location.searchParams.get('requestId') || '';
          if (!requestId || !/^[A-Za-z0-9_-]+$/.test(requestId)) {
            throw new Error('Branded login redirect is missing a valid OIDC request token');
          }
          const expectedPath = process.env.INTENT === 'signup' ? '/register' : '/login';
          if (!location.pathname.includes(expectedPath)) {
            throw new Error(`Branded ${process.env.INTENT} route mismatch: ${location.pathname}`);
          }
          console.log('BRANDED_AUTH_FIRST_HOP_SAFE '+JSON.stringify({
            intent:process.env.INTENT,
            origin:location.origin,
            path:location.pathname
          }));
          NODE
          done
          echo "- Browser-visible auth first hop: auth.mkety.com for sign-in and signup" >> "$GITHUB_STEP_SUMMARY"
          echo "- Authorization Code + PKCE remains enforced by Mkety auth service and authenticated browser flow." >> "$GITHUB_STEP_SUMMARY"

  authenticated-smoke:
    name: Authenticated login, tenant and logout gate
    needs: deploy-preview
    uses: ./.github/workflows/mkety-authenticated-preview-smoke.yml
    secrets: inherit


  report:
    name: Report exact-SHA authenticated preview
    if: always()
    needs:
      - verify
      - deploy-preview
      - authenticated-smoke
    runs-on: ubuntu-latest
    steps:
      - name: Publish authenticated preview status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          DEPLOY_RESULT: ${{ needs.deploy-preview.result }}
          AUTH_RESULT: ${{ needs.authenticated-smoke.result }}
        run: |
          set -euo pipefail
          state=failure
          description="Authenticated preview failed: verify=$VERIFY_RESULT deploy=$DEPLOY_RESULT auth=$AUTH_RESULT"
          if [ "$VERIFY_RESULT" = success ] && [ "$DEPLOY_RESULT" = success ] && [ "$AUTH_RESULT" = success ]; then
            state=success
            description='Exact-SHA preview passed build, branded first-hop auth, hosted login, Mkety session, tenant and logout.'
          fi
          STATE="$state" DESCRIPTION="$description" node <<'NODE' >/tmp/status.json
          process.stdout.write(JSON.stringify({
            state: process.env.STATE,
            context: 'mkety/authenticated-preview',
            description: String(process.env.DESCRIPTION || '').slice(0, 140),
          }));
          NODE
          curl -fsS -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H 'Accept: application/vnd.github+json'             -H 'Content-Type: application/json'             --data @/tmp/status.json             "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null
          [ "$state" = success ]
