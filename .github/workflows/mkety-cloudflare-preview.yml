name: Mkety Cloudflare Preview

on:
  push:
    branches:
      - feat/mkety-auth-zitadel-vinext
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mkety-cloudflare-preview
  cancel-in-progress: true

env:
  SKIP_ENV_VALIDATION: 'true'

jobs:
  verify:
    name: Verify preview candidate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: Run type-check
        run: pnpm type-check
      - name: Run lint
        run: pnpm lint
      - name: Check vinext compatibility
        run: pnpx vinext check
      - name: Build production artifact
        run: pnpm build
      - name: Validate isolated preview packaging
        run: pnpm run deploy --env preview --dry-run

  deploy-preview:
    name: Deploy isolated workers.dev preview
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      MKETY_AUTH_ISSUER: ${{ vars.MKETY_AUTH_ISSUER }}
      MKETY_AUTH_CLIENT_ID: ${{ vars.MKETY_AUTH_CLIENT_ID }}
      MKETY_AUTH_CLIENT_SECRET: ${{ secrets.MKETY_AUTH_CLIENT_SECRET }}
      MKETY_AUTH_SESSION_SECRET: ${{ secrets.MKETY_AUTH_SESSION_SECRET }}
      ZITADEL_MANAGEMENT_TOKEN: ${{ secrets.ZITADEL_MANAGEMENT_TOKEN }}
      ZITADEL_PROJECT_ID: ${{ vars.ZITADEL_PROJECT_ID }}
      ZITADEL_APPLICATION_ID: ${{ vars.ZITADEL_APPLICATION_ID }}
    outputs:
      preview_url: ${{ steps.preview-url.outputs.url }}
      auth_runtime_ready: ${{ steps.auth-readiness.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Require Cloudflare preview credentials and database
        shell: bash
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID STAGING_DATABASE_URL; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing preview secret $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
      - name: Build bootstrap preview artifact
        run: pnpm build
      - name: Bootstrap isolated preview Worker with database secret
        id: bootstrap
        shell: bash
        run: |
          set -euo pipefail
          secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file"' EXIT
          SECRETS_FILE="$secrets_file" node <<'NODE'
          const fs = require('node:fs');
          const value = process.env.STAGING_DATABASE_URL;
          if (!value) throw new Error('STAGING_DATABASE_URL is required');
          fs.writeFileSync(process.env.SECRETS_FILE, JSON.stringify({ DATABASE_URL: value }));
          NODE
          pnpm run deploy --env preview --secrets-file "$secrets_file" 2>&1 | tee preview-deploy.log
      - name: Capture exact workers.dev URL
        id: preview-url
        shell: bash
        run: |
          set -euo pipefail
          url="$(grep -Eo 'https://[^[:space:]]*mkety-platform-preview[^[:space:]]*\.workers\.dev[^[:space:]]*' preview-deploy.log | tail -n 1 | sed 's/[),;]$//' || true)"
          if [ -z "$url" ]; then
            url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev[^[:space:]]*' preview-deploy.log | tail -n 1 | sed 's/[),;]$//' || true)"
          fi
          if [ -z "$url" ]; then
            echo "::error::Cloudflare deploy succeeded but no workers.dev URL could be extracted from deploy output."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Cloudflare preview" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker environment: \`preview\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker name: \`mkety-platform-preview\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Check ZITADEL management readiness
        id: zitadel-management-readiness
        shell: bash
        run: |
          ready=true
          for name in MKETY_AUTH_ISSUER ZITADEL_MANAGEMENT_TOKEN ZITADEL_PROJECT_ID ZITADEL_APPLICATION_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::notice::Automatic ZITADEL redirect provisioning is not configured: missing $name"
              ready=false
            fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
      - name: Provision exact ZITADEL preview redirects
        if: steps.zitadel-management-readiness.outputs.ready == 'true'
        shell: bash
        env:
          MKETY_AUTH_REDIRECT_URI: ${{ steps.preview-url.outputs.url }}/api/auth/callback
          MKETY_AUTH_POST_LOGOUT_REDIRECT_URI: ${{ steps.preview-url.outputs.url }}/login
        run: |
          set -euo pipefail
          result="$(pnpm exec tsx scripts/provision-zitadel-redirects.ts)"
          RESULT="$result" node <<'NODE'
          const result = JSON.parse(process.env.RESULT);
          console.log(`ZITADEL redirect provisioning changed=${result.changed}; redirectUris=${result.redirectUriCount}; postLogoutRedirectUris=${result.postLogoutRedirectUriCount}`);
          NODE
          echo "- ZITADEL exact preview redirect provisioning: complete" >> "$GITHUB_STEP_SUMMARY"
      - name: Record ZITADEL provisioning credential blocker
        if: steps.zitadel-management-readiness.outputs.ready != 'true'
        run: echo "- ZITADEL redirect provisioning: blocked until management token/project/application IDs are configured in the preview environment" >> "$GITHUB_STEP_SUMMARY"
      - name: Rebuild frontend for exact preview origin
        env:
          NEXT_PUBLIC_APP_URL: ${{ steps.preview-url.outputs.url }}
        run: pnpm build
      - name: Redeploy exact-origin frontend
        env:
          NEXT_PUBLIC_APP_URL: ${{ steps.preview-url.outputs.url }}
        run: pnpm run deploy --env preview --skip-build
      - name: Check Auth runtime configuration readiness
        id: auth-readiness
        shell: bash
        run: |
          ready=true
          for name in STAGING_DATABASE_URL MKETY_AUTH_ISSUER MKETY_AUTH_CLIENT_ID MKETY_AUTH_CLIENT_SECRET MKETY_AUTH_SESSION_SECRET; do
            if [ -z "${!name:-}" ]; then
              echo "::notice::Preview Auth runtime is not fully configured: missing $name"
              ready=false
            fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" = "true" ]; then
            echo "- Auth runtime configuration: ready for binding" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Auth runtime configuration: public-preview bootstrap only; real ZITADEL smoke remains blocked" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Bind preview database and Mkety Auth runtime secrets
        if: steps.auth-readiness.outputs.ready == 'true'
        shell: bash
        env:
          MKETY_AUTH_REDIRECT_URI: ${{ steps.preview-url.outputs.url }}/api/auth/callback
          MKETY_AUTH_POST_LOGOUT_REDIRECT_URI: ${{ steps.preview-url.outputs.url }}/login
        run: |
          set -euo pipefail
          secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file"' EXIT
          SECRETS_FILE="$secrets_file" node <<'NODE'
          const fs = require('node:fs');
          const required = {
            DATABASE_URL: process.env.STAGING_DATABASE_URL,
            MKETY_AUTH_PROVIDER: 'zitadel',
            MKETY_AUTH_ISSUER: process.env.MKETY_AUTH_ISSUER,
            MKETY_AUTH_CLIENT_ID: process.env.MKETY_AUTH_CLIENT_ID,
            MKETY_AUTH_CLIENT_SECRET: process.env.MKETY_AUTH_CLIENT_SECRET,
            MKETY_AUTH_REDIRECT_URI: process.env.MKETY_AUTH_REDIRECT_URI,
            MKETY_AUTH_POST_LOGOUT_REDIRECT_URI: process.env.MKETY_AUTH_POST_LOGOUT_REDIRECT_URI,
            MKETY_AUTH_SESSION_SECRET: process.env.MKETY_AUTH_SESSION_SECRET,
          };
          for (const [key, value] of Object.entries(required)) {
            if (!value) throw new Error(`Missing required runtime value: ${key}`);
          }
          fs.writeFileSync(process.env.SECRETS_FILE, JSON.stringify(required));
          NODE
          pnpm exec wrangler secret bulk "$secrets_file" --env preview
      - name: Build Auth-ready preview artifact
        if: steps.auth-readiness.outputs.ready == 'true'
        env:
          DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          MKETY_AUTH_PROVIDER: zitadel
          MKETY_AUTH_ISSUER: ${{ vars.MKETY_AUTH_ISSUER }}
          MKETY_AUTH_CLIENT_ID: ${{ vars.MKETY_AUTH_CLIENT_ID }}
          MKETY_AUTH_CLIENT_SECRET: ${{ secrets.MKETY_AUTH_CLIENT_SECRET }}
          MKETY_AUTH_REDIRECT_URI: ${{ steps.preview-url.outputs.url }}/api/auth/callback
          MKETY_AUTH_POST_LOGOUT_REDIRECT_URI: ${{ steps.preview-url.outputs.url }}/login
          MKETY_AUTH_SESSION_SECRET: ${{ secrets.MKETY_AUTH_SESSION_SECRET }}
          NEXT_PUBLIC_APP_URL: ${{ steps.preview-url.outputs.url }}
          SKIP_ENV_VALIDATION: 'false'
        run: pnpm build
      - name: Deploy Auth-ready preview artifact
        if: steps.auth-readiness.outputs.ready == 'true'
        env:
          NEXT_PUBLIC_APP_URL: ${{ steps.preview-url.outputs.url }}
        run: pnpm run deploy --env preview --skip-build
      - name: Smoke public preview routes
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.preview-url.outputs.url }}
        run: |
          set -euo pipefail
          for path in / /login; do
            status="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --max-time 30 "$PREVIEW_URL$path")"
            echo "$path -> HTTP $status"
            if [ "$status" -ge 500 ] || [ "$status" -eq 0 ]; then
              echo "::error::Preview smoke failed for $path with HTTP $status"
              exit 1
            fi
          done
      - name: Smoke unauthenticated session boundary
        if: steps.auth-readiness.outputs.ready == 'true'
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.preview-url.outputs.url }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/session.json --write-out '%{http_code}' --max-time 30 "$PREVIEW_URL/api/auth/session")"
          echo "/api/auth/session -> HTTP $status"
          if [ "$status" -ge 500 ] || [ "$status" -eq 0 ]; then
            echo "::error::Mkety Auth session boundary returned HTTP $status"
            exit 1
          fi
          echo "- Unauthenticated session boundary: HTTP $status" >> "$GITHUB_STEP_SUMMARY"
      - name: Record real-ZITADEL smoke requirement
        if: steps.auth-readiness.outputs.ready == 'true'
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.preview-url.outputs.url }}
        run: |
          echo "- ZITADEL callback URI to register: $PREVIEW_URL/api/auth/callback" >> "$GITHUB_STEP_SUMMARY"
          echo "- Post-logout URI to register: $PREVIEW_URL/login" >> "$GITHUB_STEP_SUMMARY"
          echo "- Remaining promotion gate: browser smoke of real login → callback → session → protected route/tenant authorization → logout." >> "$GITHUB_STEP_SUMMARY"
