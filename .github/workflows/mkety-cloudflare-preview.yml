name: Mkety Cloudflare Preview

on:
  push:
    branches:
      - feat/mkety-auth-zitadel-vinext
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mkety-cloudflare-preview
  cancel-in-progress: true

env:
  SKIP_ENV_VALIDATION: 'true'

jobs:
  verify:
    name: Verify preview candidate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Run tests
        run: pnpm test
      - name: Run type-check
        run: pnpm type-check
      - name: Run lint
        run: pnpm lint
      - name: Check vinext compatibility
        run: pnpx vinext check
      - name: Build production artifact
        run: pnpm build
      - name: Validate isolated preview packaging
        run: pnpm run deploy --env preview --dry-run

  deploy-preview:
    name: Deploy isolated workers.dev preview
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: preview
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
    outputs:
      preview_url: ${{ steps.preview-url.outputs.url }}
      zitadel_application_id: ${{ steps.zitadel.outputs.application_id }}
      zitadel_client_id: ${{ steps.zitadel.outputs.client_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Normalize ZITADEL bootstrap credentials
        shell: bash
        env:
          ALL_SECRETS_JSON: ${{ toJSON(secrets) }}
          ALL_VARS_JSON: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const secrets = JSON.parse(process.env.ALL_SECRETS_JSON || '{}');
          const vars = JSON.parse(process.env.ALL_VARS_JSON || '{}');
          const entries = (object) => Object.entries(object).filter(([, value]) => typeof value === 'string' && value.trim());
          const firstExact = (names, ...objects) => {
            for (const name of names) {
              for (const object of objects) {
                const value = object[name];
                if (typeof value === 'string' && value.trim()) return { name, value: value.trim() };
              }
            }
            return null;
          };

          const tokenExact = firstExact(
            [
              'ZITADEL_MANAGEMENT_TOKEN',
              'ZITADEL_PAT',
              'ZITADEL_TOKEN',
              'ZITADEL_API_TOKEN',
              'ZITADEL_ACCESS_TOKEN',
              'ZITADEL_ACCESS',
              'MKETY_ZITADEL_PAT',
              'MKETY_ZITADEL_TOKEN',
              'MKETY_ZITADEL_ACCESS_TOKEN',
            ],
            secrets,
          );
          const tokenCandidates = entries(secrets).filter(([name]) =>
            /ZITADEL/i.test(name) && /(PAT|TOKEN|ACCESS)/i.test(name) && !/(PROJECT|URL|ISSUER|APPLICATION|CLIENT|SESSION)/i.test(name),
          );
          let token = tokenExact;
          if (!token && tokenCandidates.length === 1) {
            token = { name: tokenCandidates[0][0], value: tokenCandidates[0][1].trim() };
          }
          if (!token && tokenCandidates.length > 1) {
            throw new Error(`Multiple possible ZITADEL management secrets found by name: ${tokenCandidates.map(([name]) => name).join(', ')}. Keep one management PAT/token or use a standard alias.`);
          }

          const issuer = firstExact(
            ['MKETY_AUTH_ISSUER', 'ZITADEL_ISSUER', 'ZITADEL_URL', 'MKETY_ZITADEL_URL'],
            vars,
            secrets,
          );
          const project = firstExact(
            ['ZITADEL_PROJECT_ID', 'MKETY_ZITADEL_PROJECT_ID'],
            vars,
            secrets,
          );
          const application = firstExact(
            ['ZITADEL_APPLICATION_ID', 'MKETY_ZITADEL_APPLICATION_ID'],
            vars,
            secrets,
          );
          const session = firstExact(['MKETY_AUTH_SESSION_SECRET'], secrets);

          const missing = [];
          if (!token) missing.push('ZITADEL management PAT/token secret');
          if (!issuer) missing.push('ZITADEL issuer URL');
          if (!project) missing.push('ZITADEL project id');
          if (missing.length) {
            const zitadelSecretNames = Object.keys(secrets).filter((name) => /ZITADEL/i.test(name));
            const zitadelVarNames = Object.keys(vars).filter((name) => /ZITADEL|MKETY_AUTH_ISSUER/i.test(name));
            console.error(`::error::Missing ${missing.join(', ')}.`);
            console.error(`::notice::Available ZITADEL-related secret keys: ${zitadelSecretNames.length ? zitadelSecretNames.join(', ') : '(none)'}`);
            console.error(`::notice::Available ZITADEL-related variable keys: ${zitadelVarNames.length ? zitadelVarNames.join(', ') : '(none)'}`);
            process.exit(1);
          }

          console.log(`::add-mask::${token.value}`);
          if (session) console.log(`::add-mask::${session.value}`);

          const lines = [
            `ZITADEL_MANAGEMENT_TOKEN=${token.value}`,
            `MKETY_AUTH_ISSUER=${issuer.value}`,
            `ZITADEL_PROJECT_ID=${project.value}`,
          ];
          if (application) lines.push(`ZITADEL_APPLICATION_ID=${application.value}`);
          if (session) lines.push(`CONFIGURED_MKETY_AUTH_SESSION_SECRET=${session.value}`);
          fs.appendFileSync(process.env.GITHUB_ENV, `${lines.join('\n')}\n`);

          console.log(`ZITADEL management credential selected from ${token.name}`);
          console.log(`ZITADEL issuer selected from ${issuer.name}`);
          console.log(`ZITADEL project id selected from ${project.name}`);
          console.log(application
            ? `Existing ZITADEL application id selected from ${application.name}; create-or-reuse will validate it.`
            : 'No ZITADEL application id is configured; create-or-reuse will discover or create Mkety Platform Preview.');
          NODE

      - name: Require Cloudflare preview credentials and database
        shell: bash
        env:
          CLOUDFLARE_ACCOUNT_ID_VAR: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID_VAR:-}" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID_VAR" >> "$GITHUB_ENV"
          fi
          missing=0
          for name in CLOUDFLARE_API_TOKEN STAGING_DATABASE_URL; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing preview secret $name"
              missing=1
            fi
          done
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ] && [ -z "${CLOUDFLARE_ACCOUNT_ID_VAR:-}" ]; then
            echo "::error::Missing CLOUDFLARE_ACCOUNT_ID secret or variable"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Build bootstrap preview artifact
        run: pnpm build

      - name: Bootstrap isolated preview Worker with database secret
        shell: bash
        run: |
          set -euo pipefail
          secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file"' EXIT
          SECRETS_FILE="$secrets_file" node <<'NODE'
          const fs = require('node:fs');
          const value = process.env.STAGING_DATABASE_URL;
          if (!value) throw new Error('STAGING_DATABASE_URL is required');
          fs.writeFileSync(process.env.SECRETS_FILE, JSON.stringify({ DATABASE_URL: value }));
          NODE
          pnpm run deploy --env preview --secrets-file "$secrets_file" 2>&1 | tee preview-deploy.log

      - name: Capture exact workers.dev URL
        id: preview-url
        shell: bash
        run: |
          set -euo pipefail
          url="$(grep -Eo 'https://[^[:space:]]*mkety-platform-preview[^[:space:]]*\.workers\.dev[^[:space:]]*' preview-deploy.log | tail -n 1 | sed 's/[),;]$//' || true)"
          if [ -z "$url" ]; then
            url="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev[^[:space:]]*' preview-deploy.log | tail -n 1 | sed 's/[),;]$//' || true)"
          fi
          if [ -z "$url" ]; then
            echo "::error::Cloudflare deploy succeeded but no workers.dev URL could be extracted from deploy output."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Cloudflare preview" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker environment: \`preview\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Worker name: \`mkety-platform-preview\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: $url" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Create or reconcile Mkety Platform Preview in ZITADEL
        id: zitadel
        shell: bash
        env:
          MKETY_AUTH_REDIRECT_URI: ${{ steps.preview-url.outputs.url }}/api/auth/callback
          MKETY_AUTH_POST_LOGOUT_REDIRECT_URI: ${{ steps.preview-url.outputs.url }}/login
          ZITADEL_APPLICATION_NAME: Mkety Platform Preview
        run: |
          set -euo pipefail
          pnpm exec tsx scripts/provision-zitadel-redirects.ts
          echo "- ZITADEL Mkety Platform Preview application: create-or-reuse complete" >> "$GITHUB_STEP_SUMMARY"
          echo "- ZITADEL application id: \`${{ steps.zitadel.outputs.application_id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- ZITADEL client id: \`${{ steps.zitadel.outputs.client_id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- ZITADEL application created in this run: \`${{ steps.zitadel.outputs.created }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare durable preview Auth runtime
        id: auth-runtime
        shell: bash
        env:
          ZITADEL_CLIENT_ID: ${{ steps.zitadel.outputs.client_id }}
        run: |
          set -euo pipefail

          session_secret="${CONFIGURED_MKETY_AUTH_SESSION_SECRET:-}"
          if [ -z "$session_secret" ]; then
            session_secret="$(openssl rand -hex 32)"
          fi
          echo "::add-mask::$session_secret"
          echo "EFFECTIVE_MKETY_AUTH_SESSION_SECRET=$session_secret" >> "$GITHUB_ENV"

          if [ -z "$ZITADEL_CLIENT_ID" ]; then
            echo "::error::ZITADEL provisioning did not return a client id."
            exit 1
          fi
          echo "MKETY_AUTH_CLIENT_ID=$ZITADEL_CLIENT_ID" >> "$GITHUB_ENV"
          echo "ZITADEL_APPLICATION_ID=${{ steps.zitadel.outputs.application_id }}" >> "$GITHUB_ENV"

      - name: Bind Mkety Auth runtime to preview Worker
        shell: bash
        env:
          MKETY_AUTH_REDIRECT_URI: ${{ steps.preview-url.outputs.url }}/api/auth/callback
          MKETY_AUTH_POST_LOGOUT_REDIRECT_URI: ${{ steps.preview-url.outputs.url }}/login
        run: |
          set -euo pipefail
          secrets_file="$(mktemp)"
          trap 'rm -f "$secrets_file"' EXIT
          SECRETS_FILE="$secrets_file" node <<'NODE'
          const fs = require('node:fs');
          const values = {
            DATABASE_URL: process.env.STAGING_DATABASE_URL,
            MKETY_AUTH_PROVIDER: 'zitadel',
            MKETY_AUTH_ISSUER: process.env.MKETY_AUTH_ISSUER,
            MKETY_AUTH_CLIENT_ID: process.env.MKETY_AUTH_CLIENT_ID,
            MKETY_AUTH_REDIRECT_URI: process.env.MKETY_AUTH_REDIRECT_URI,
            MKETY_AUTH_POST_LOGOUT_REDIRECT_URI: process.env.MKETY_AUTH_POST_LOGOUT_REDIRECT_URI,
            MKETY_AUTH_SESSION_SECRET: process.env.EFFECTIVE_MKETY_AUTH_SESSION_SECRET,
          };
          for (const [key, value] of Object.entries(values)) {
            if (!value) throw new Error(`Missing required preview runtime value: ${key}`);
          }
          fs.writeFileSync(process.env.SECRETS_FILE, JSON.stringify(values));
          NODE
          pnpm exec wrangler secret bulk "$secrets_file" --env preview

      - name: Verify required Cloudflare secret bindings exist
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec wrangler secret list --env preview --format json > /tmp/mkety-preview-secrets.json
          node <<'NODE'
          const fs = require('node:fs');
          const entries = JSON.parse(fs.readFileSync('/tmp/mkety-preview-secrets.json', 'utf8'));
          const names = new Set(entries.map((entry) => entry.name));
          const required = [
            'DATABASE_URL',
            'MKETY_AUTH_PROVIDER',
            'MKETY_AUTH_ISSUER',
            'MKETY_AUTH_CLIENT_ID',
            'MKETY_AUTH_REDIRECT_URI',
            'MKETY_AUTH_POST_LOGOUT_REDIRECT_URI',
            'MKETY_AUTH_SESSION_SECRET',
          ];
          const missing = required.filter((name) => !names.has(name));
          if (missing.length) {
            throw new Error(`Preview Worker is missing required secret bindings: ${missing.join(', ')}`);
          }
          console.log(`Verified ${required.length} required Mkety Auth secret bindings by name.`);
          NODE

      - name: Build exact-origin preview artifact
        env:
          NEXT_PUBLIC_APP_URL: ${{ steps.preview-url.outputs.url }}
        run: pnpm build

      - name: Deploy exact-origin Auth preview
        env:
          NEXT_PUBLIC_APP_URL: ${{ steps.preview-url.outputs.url }}
        run: pnpm run deploy --env preview --skip-build

      - name: Smoke public preview routes
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.preview-url.outputs.url }}
        run: |
          set -euo pipefail
          for path in / /login; do
            status="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --max-time 30 "$PREVIEW_URL$path")"
            echo "$path -> HTTP $status"
            if [ "$status" -ge 500 ] || [ "$status" -eq 0 ]; then
              echo "::error::Preview smoke failed for $path with HTTP $status"
              exit 1
            fi
          done

      - name: Smoke unauthenticated session boundary
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.preview-url.outputs.url }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --output /tmp/session.json --write-out '%{http_code}' --max-time 30 "$PREVIEW_URL/api/auth/session")"
          echo "/api/auth/session -> HTTP $status"
          if [ "$status" -ge 500 ] || [ "$status" -eq 0 ]; then
            echo "::error::Mkety Auth session boundary returned HTTP $status"
            exit 1
          fi
          echo "- Unauthenticated session boundary: HTTP $status" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke real ZITADEL authorization redirect and PKCE
        shell: bash
        env:
          PREVIEW_URL: ${{ steps.preview-url.outputs.url }}
          EXPECTED_ISSUER: ${{ env.MKETY_AUTH_ISSUER }}
          EXPECTED_CLIENT_ID: ${{ steps.zitadel.outputs.client_id }}
          EXPECTED_REDIRECT_URI: ${{ steps.preview-url.outputs.url }}/api/auth/callback
        run: |
          set -euo pipefail
          headers="$(mktemp)"
          trap 'rm -f "$headers"' EXIT
          status="$(curl --silent --show-error --output /dev/null --dump-header "$headers" --write-out '%{http_code}' --max-time 30 "$PREVIEW_URL/api/auth/login?returnTo=/select-tenant")"
          location="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/, ""); sub(/\r$/, ""); print; exit}' "$headers")"
          echo "/api/auth/login -> HTTP $status"
          if [ "$status" -lt 300 ] || [ "$status" -ge 400 ] || [ -z "$location" ]; then
            echo "::error::Mkety Auth login did not return a ZITADEL redirect."
            exit 1
          fi
          LOCATION="$location" node <<'NODE'
          const location = new URL(process.env.LOCATION);
          const issuer = new URL(process.env.EXPECTED_ISSUER);
          if (location.origin !== issuer.origin) {
            throw new Error(`Authorization redirect origin mismatch: ${location.origin}`);
          }
          if (location.searchParams.get('client_id') !== process.env.EXPECTED_CLIENT_ID) {
            throw new Error('Authorization redirect client_id mismatch');
          }
          if (location.searchParams.get('redirect_uri') !== process.env.EXPECTED_REDIRECT_URI) {
            throw new Error('Authorization redirect callback mismatch');
          }
          if (location.searchParams.get('response_type') !== 'code') {
            throw new Error('Authorization redirect must use response_type=code');
          }
          if (!location.searchParams.get('code_challenge')) {
            throw new Error('Authorization redirect is missing PKCE code_challenge');
          }
          if (location.searchParams.get('code_challenge_method') !== 'S256') {
            throw new Error('Authorization redirect must use PKCE S256');
          }
          console.log('Verified real ZITADEL authorization redirect, client id, exact callback, and PKCE S256.');
          NODE
          echo "- Real ZITADEL authorization redirect + PKCE: verified" >> "$GITHUB_STEP_SUMMARY"
          echo "- ZITADEL callback URI: $EXPECTED_REDIRECT_URI" >> "$GITHUB_STEP_SUMMARY"
          echo "- ZITADEL post-logout URI: $PREVIEW_URL/login" >> "$GITHUB_STEP_SUMMARY"
          echo "- Remaining browser-only gate: complete an interactive ZITADEL user login, callback, protected tenant route, and logout." >> "$GITHUB_STEP_SUMMARY"
