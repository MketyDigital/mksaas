name: Assist Custom Domain Diagnostic
on:
  push:
    branches: [fix/assist-password-domain-owner-20261001]
    paths: ['.github/workflows/mkety-assist-domain-diagnostic.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MKETY_ASSIST_CF_SAAS_TOKEN: ${{ secrets.MKETY_ASSIST_CF_SAAS_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Probe Cloudflare SaaS custom hostname API
        shell: bash
        run: |
          set -euo pipefail
          zones="$(curl -fsS 'https://api.cloudflare.com/client/v4/zones?name=mkety.app&status=active' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")"
          zone_id="$(Z="$zones" node -e "const x=JSON.parse(process.env.Z);process.stdout.write(x.result?.[0]?.id||'')")"
          test -n "$zone_id"
          host="assist-diag-${GITHUB_RUN_ID}.example.com"
          body="$(HOST="$host" node -e "process.stdout.write(JSON.stringify({hostname:process.env.HOST,ssl:{method:'http',type:'dv'},custom_origin_server:'assist-origin.mkety.app',custom_metadata:{product:'mkety-assist',diagnostic:'true'}}))")"
          set +e
          resp="$(curl -sS -w '\nHTTP_STATUS:%{http_code}' -X POST "https://api.cloudflare.com/client/v4/zones/$zone_id/custom_hostnames" -H "Authorization: Bearer $MKETY_ASSIST_CF_SAAS_TOKEN" -H 'Content-Type: application/json' --data "$body")"
          rc=$?
          set -e
          echo "$resp" | sed -E 's/("value"|"token"|"certificate"|"key"):[^,}]*/\1:"[redacted]"/g'
          test "$rc" = "0"
          status="$(printf '%s' "$resp" | sed -n 's/^HTTP_STATUS://p')"
          json="$(printf '%s' "$resp" | sed '/^HTTP_STATUS:/d')"
          id="$(J="$json" node -e "try{const x=JSON.parse(process.env.J);process.stdout.write(x.result?.id||'')}catch{}")"
          if [ -n "$id" ]; then
            curl -sS -X DELETE "https://api.cloudflare.com/client/v4/zones/$zone_id/custom_hostnames/$id" -H "Authorization: Bearer $MKETY_ASSIST_CF_SAAS_TOKEN" >/dev/null || true
          fi
          test "$status" = "201" -o "$status" = "200"
