name: Mail domain setup diagnostics (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tail:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Validate Cloudflare access without printing credentials
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo 'Missing repository Cloudflare API token.'; exit 1; }
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || { echo 'Missing repository Cloudflare account ID.'; exit 1; }
          echo 'Cloudflare credentials are present; values are masked.'

      - name: Check app-host Mail Cloudflare token binding without reading values
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.129.0 secret list --name mkety-app-host --env="" --format json >/tmp/mkety-mail-app-host-secret-names.json
          node <<'NODE'
          const fs=require('node:fs');
          const raw=fs.readFileSync('/tmp/mkety-mail-app-host-secret-names.json','utf8');
          const start=raw.indexOf('[');
          if(start<0) throw new Error('Could not parse app-host secret-name listing.');
          const rows=JSON.parse(raw.slice(start));
          const names=new Set(rows.map((row)=>row.name));
          console.log(JSON.stringify({
            event:'mail_app_host_secret_presence',
            mail_cloudflare_token_configured:names.has('MKETY_MAIL_CLOUDFLARE_API_TOKEN'),
            mail_cloudflare_account_id_configured:names.has('MKETY_MAIL_CLOUDFLARE_ACCOUNT_ID')
          }));
          NODE

      - name: Verify repository Cloudflare token can read the Mail zone and sending config
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Accept: application/json')

          probe() {
            label="$1"
            path="$2"
            output="$3"
            code="$(curl --connect-timeout 5 --max-time 20 -sS -o "$output" -w '%{http_code}' "${auth[@]}" "$api$path" || true)"
            FILE="$output" LABEL="$label" HTTP_STATUS="$code" node <<'NODE'
          const fs=require('node:fs');
          let body={};
          try { body=JSON.parse(fs.readFileSync(process.env.FILE,'utf8')); } catch {}
          const codes=Array.isArray(body.errors)?body.errors.map(x=>x?.code).filter(Number.isInteger):[];
          const out={event:'mail_cloudflare_repo_credential_probe',check:process.env.LABEL,http_status:Number(process.env.HTTP_STATUS),success:body.success===true,error_codes:codes};
          if(process.env.LABEL==='token_verify'&&body.result?.status) out.token_status=String(body.result.status);
          console.log(JSON.stringify(out));
          NODE
          }

          probe token_verify '/user/tokens/verify' /tmp/cf-token-verify.json
          probe zone_lookup '/zones?name=mkety.com&status=active&per_page=10' /tmp/cf-zone.json

          zone_id="$(node <<'NODE'
          const fs=require('node:fs');
          try {
            const x=JSON.parse(fs.readFileSync('/tmp/cf-zone.json','utf8'));
            const rows=Array.isArray(x.result)?x.result.filter(z=>z.name==='mkety.com'&&z.status==='active'):[];
            if(x.success===true&&rows.length===1&&typeof rows[0].id==='string') process.stdout.write(rows[0].id);
          } catch {}
          NODE
          )"

          if [ -n "$zone_id" ]; then
            encoded_zone="$(node -e "process.stdout.write(encodeURIComponent(process.argv[1]))" "$zone_id")"
            probe dns_records_read "/zones/$encoded_zone/dns_records?per_page=1" /tmp/cf-dns-read.json
            probe email_sending_read "/zones/$encoded_zone/email/sending/subdomains?per_page=100" /tmp/cf-sending-read.json

            subdomain_id="$(ZONE_FILE=/tmp/cf-sending-read.json node <<'NODE'
          const fs=require('node:fs');
          try {
            const x=JSON.parse(fs.readFileSync(process.env.ZONE_FILE,'utf8'));
            const rows=Array.isArray(x.result)?x.result.filter(v=>v.name==='mkety.com'):[];
            if(x.success===true&&rows.length===1&&typeof rows[0].id==='string') process.stdout.write(rows[0].id);
          } catch {}
          NODE
          )"

            if [ -n "$subdomain_id" ]; then
              encoded_subdomain="$(node -e "process.stdout.write(encodeURIComponent(process.argv[1]))" "$subdomain_id")"
              probe email_sending_dns_read "/zones/$encoded_zone/email/sending/subdomains/$encoded_subdomain/dns" /tmp/cf-sending-dns-read.json
            else
              echo '{"event":"mail_cloudflare_repo_credential_probe","check":"email_sending_dns_read","skipped":"mkety.com sending subdomain not returned"}'
            fi

            probe event_subscriptions_read "/accounts/$CLOUDFLARE_ACCOUNT_ID/event_subscriptions/subscriptions?per_page=100" /tmp/cf-events-read.json
          else
            echo '{"event":"mail_cloudflare_repo_credential_probe","check":"zone_scoped_checks","skipped":"active mkety.com zone not uniquely returned"}'
          fi

      - name: Inspect repository token permission names without exposing token data
        shell: bash
        run: |
          set -euo pipefail
          token_id="$(node -e "const x=require('/tmp/cf-token-verify.json'); if(typeof x.result?.id==='string') process.stdout.write(x.result.id)")"
          [ -n "$token_id" ] || { echo '{"event":"mail_token_policy_probe","skipped":"token id unavailable"}'; exit 0; }
          encoded_id="$(node -e "process.stdout.write(encodeURIComponent(process.argv[1]))" "$token_id")"
          code="$(curl --connect-timeout 5 --max-time 15 -sS -o /tmp/cf-token-details.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Accept: application/json' \
            "https://api.cloudflare.com/client/v4/user/tokens/$encoded_id" || true)"
          HTTP_STATUS="$code" node <<'NODE'
          const fs=require('node:fs');
          let body={};
          try { body=JSON.parse(fs.readFileSync('/tmp/cf-token-details.json','utf8')); } catch {}
          const names=(body.result?.policies??[]).flatMap(p=>p.permission_groups??[]).map(g=>g?.name).filter(x=>typeof x==='string');
          const out={event:'mail_token_policy_probe',http_status:Number(process.env.HTTP_STATUS),success:body.success===true,error_codes:Array.isArray(body.errors)?body.errors.map(e=>e?.code).filter(Number.isInteger):[],workers_observability_write:names.includes('Workers Observability Write'),zone_settings_write:names.includes('Zone Settings Write'),permission_group_count:names.length};
          console.log(JSON.stringify(out));
          NODE

      - name: Read deployed app-host Worker observability settings without exposing secrets
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --connect-timeout 5 --max-time 20 -sS -o /tmp/mail-worker-settings.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Accept: application/json' \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/mkety-app-host/script-settings" || true)"
          HTTP_STATUS="$code" node <<'NODE'
          const fs=require('node:fs');
          let body={};
          try { body=JSON.parse(fs.readFileSync('/tmp/mail-worker-settings.json','utf8')); } catch {}
          const obs=body.result?.observability;
          const logs=obs?.logs;
          console.log(JSON.stringify({
            event:'mail_worker_observability_settings',
            worker:'mkety-app-host',
            http_status:Number(process.env.HTTP_STATUS),
            success:body.success===true,
            error_codes:Array.isArray(body.errors)?body.errors.map(e=>e?.code).filter(Number.isInteger):[],
            observability_enabled:typeof obs?.enabled==='boolean'?obs.enabled:null,
            invocation_logs_enabled:typeof logs?.invocation_logs==='boolean'?logs.invocation_logs:null,
            logs_enabled:typeof logs?.enabled==='boolean'?logs.enabled:null,
            log_persist_enabled:typeof logs?.persist==='boolean'?logs.persist:null,
            query_string_redaction:typeof logs?.redact_query_string==='boolean'?logs.redact_query_string:null
          }));
          NODE

      - name: Inspect Mail-related Worker observability settings read only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const headers={Authorization:'Bearer '+process.env.CLOUDFLARE_API_TOKEN,Accept:'application/json'};
          const base='https://api.cloudflare.com/client/v4/accounts/'+encodeURIComponent(account)+'/workers/scripts';
          const safeName=s=>typeof s==='string'&&/^[a-z0-9-]{1,128}$/.test(s);
          const get=async url=>{const r=await fetch(url,{headers});let b={};try{b=await r.json()}catch{}return {status:r.status,body:b}};
          const list=await get(base+'?per_page=100');
          const rows=Array.isArray(list.body.result)?list.body.result:[];
          const candidates=rows.map(x=>x?.id??x?.script_name).filter(s=>safeName(s)&&/(mail|domain|app-host)/i.test(s));
          const out={event:'mail_related_worker_observability_audit',list_http_status:list.status,success:list.body.success===true,worker_count:candidates.length,workers:[]};
          for(const name of candidates){
            const item=await get(base+'/'+encodeURIComponent(name)+'/script-settings');
            const obs=item.body.result?.observability;
            const logs=obs?.logs;
            out.workers.push({
              worker:name,http_status:item.status,success:item.body.success===true,
              error_codes:Array.isArray(item.body.errors)?item.body.errors.map(e=>e?.code).filter(Number.isInteger):[],
              observability_enabled:typeof obs?.enabled==='boolean'?obs.enabled:null,
              logs_enabled:typeof logs?.enabled==='boolean'?logs.enabled:null,
              invocation_logs_enabled:typeof logs?.invocation_logs==='boolean'?logs.invocation_logs:null,
              log_persist_enabled:typeof logs?.persist==='boolean'?logs.persist:null
            });
          }
          console.log(JSON.stringify(out));
          NODE

      - name: Tail only safe Mail domain setup failures
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=INT --kill-after=5s 15s npx --yes wrangler@4.129.0 tail mkety-app-host --format=json |
            node --input-type=module -e '
              import { createInterface } from "node:readline";
              const rl = createInterface({ input: process.stdin, crlfDelay: Infinity });
              const prefixes = [
                ["[mail-domain-setup] provisioning failed", "mail_domain_setup_failure"],
                ["[mail-domain-setup] retry started", "mail_domain_setup_retry_started"],
                ["[vinext] Route handler error", "mail_route_handler_error"]
              ];
              const safeKeys = ["domain", "stage", "errorName", "httpStatus", "providerCode", "safeErrorCode", "path", "method", "status", "responseStatus", "rayId", "traceId"];
              function visit(value, output) {
                if (!value || typeof value !== "object") return;
                if (Array.isArray(value)) { for (const item of value) visit(item, output); return; }
                for (const key of safeKeys) {
                  if (!(key in output) && key in value) {
                    const item = value[key];
                    if (key === "domain" && typeof item === "string" && /^[a-z0-9.-]+$/.test(item)) output[key] = item;
                    if (key === "path" && typeof item === "string" && (/^\/app\/[a-z0-9-]+\/mail\/domains$/.test(item) || /^\/api\/mail\/(?:domains|migration\/archive\/(?:chunk|complete))$/.test(item))) output[key] = item;
                    if (key === "method" && ["GET", "POST"].includes(item)) output[key] = item;
                    if (["status", "responseStatus"].includes(key) && Number.isInteger(item) && item >= 400 && item <= 599) output[key] = item;
                    if (["rayId", "traceId"].includes(key) && typeof item === "string" && /^[a-f0-9]{16,32}$/i.test(item)) output[key] = item;
                    if (key === "stage" && typeof item === "string" && /^[a-z0-9_]+$/.test(item)) output[key] = item;
                    if (key === "errorName" && typeof item === "string" && /^[A-Za-z0-9_]+$/.test(item)) output[key] = item;
                    if ((key === "httpStatus" || key === "providerCode") && Number.isInteger(item)) output[key] = item;
                    if (key === "safeErrorCode" && typeof item === "string" && /^mail_[a-z0-9_]+$/.test(item)) output[key] = item;
                  }
                }
                for (const item of Object.values(value)) visit(item, output);
              }
              rl.on("line", line => {
                let record;
                try { record = JSON.parse(line); } catch { return; }
                const request = record?.event?.request ?? record?.request;
                if (request?.method === "POST" && typeof request.url === "string") {
                  let pathname = "";
                  try { pathname = new URL(request.url).pathname; } catch {}
                  if (pathname === "/app/mkety-ops/mail/domains") {
                    const response = record?.event?.response ?? record?.response ?? {};
                    const metadata = record?.$metadata ?? {};
                    const safe = value => typeof value === "string" && /^[a-f0-9]{16,32}$/i.test(value) ? value : undefined;
                    process.stdout.write(JSON.stringify({
                      event: "mail_domain_action_request",
                      method: "POST",
                      path: pathname,
                      status: Number.isInteger(response.status) ? response.status : null,
                      rayId: safe(metadata.rayId),
                      traceId: safe(metadata.traceId)
                    }) + "\\n");
                  }
                }
                const serialized = JSON.stringify(record);
                const match = prefixes.find(([prefix]) => serialized.includes(prefix));
                if (!match) return;
                const output = { event: match[1] };
                visit(record, output);
                process.stdout.write(JSON.stringify(output) + "\\n");
              });
            ' || {
              status=$?
              [ "$status" -eq 124 ] || [ "$status" -eq 130 ] || { echo 'Cloudflare Worker tail or safe log filter failed.'; exit "$status"; }
            }
          echo 'Diagnostic tail ended normally.'

      - name: Query recent Worker events through Observability API (dry run)
        shell: bash
        run: |
          set -euo pipefail
          now_ms="$(date +%s%3N)"
          from_ms="$((now_ms - 1800000))"
          jq -n --argjson from "$from_ms" --argjson to "$now_ms" '{
            queryId: "mail-domain-action-diagnostic",
            timeframe: {from: $from, to: $to},
            parameters: {
              filters: [
                {key: "$metadata.service", operation: "eq", type: "string", value: "mkety-app-host"}
              ],
              needle: {value: "mail/domains", matchCase: false}
            },
            view: "events",
            dry: true,
            limit: 100
          }' > /tmp/mail-observability-query.json
          code="$(curl --connect-timeout 5 --max-time 40 -sS -o /tmp/mail-observability-result.json -w '%{http_code}' \
            -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/observability/telemetry/query" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' \
            --data-binary @/tmp/mail-observability-query.json || true)"
          HTTP_STATUS="$code" node <<'NODE'
          const fs=require('node:fs');
          let body={};
          try { body=JSON.parse(fs.readFileSync('/tmp/mail-observability-result.json','utf8')); } catch {}
          const out={event:'mail_observability_query',http_status:Number(process.env.HTTP_STATUS),success:body.success===true,error_codes:Array.isArray(body.errors)?body.errors.map(e=>e?.code).filter(Number.isInteger):[]};
          out.result_keys=body.result&&typeof body.result==='object'?Object.keys(body.result).filter(k=>/^[a-zA-Z0-9_]{1,40}$/.test(k)).slice(0,30):[];
          out.result_is_array=Array.isArray(body.result);
          out.run_status=typeof body.result?.run?.status==='string'?body.result.run.status:undefined;
          out.run_dry=typeof body.result?.run?.dry==='boolean'?body.result.run.dry:undefined;
          for(const key of ['events','data','results','invocations','traces','agents']){const v=body.result?.[key];if(Array.isArray(v))out[key+'_count']=v.length;else if(v&&typeof v==='object')out[key+'_keys']=Object.keys(v).filter(k=>/^[a-zA-Z0-9_]{1,40}$/.test(k)).slice(0,20)}
          const rows=body.result?.events ?? body.result?.data ?? [];
          function safeHex(v){return typeof v==='string'&&/^[a-f0-9]{16,32}$/i.test(v)?v:undefined}
          function safePath(v){try{const p=new URL(v).pathname;return /^\/app\/[a-z0-9-]+\/mail\/domains$/.test(p)||/^\/api\/mail\/(?:domains|migration\/archive\/(?:chunk|complete))$/.test(p)?p:undefined}catch{return undefined}}
          if(Array.isArray(rows)){
            out.event_count=rows.length;
            out.events=rows.slice(0,100).map(row=>{
              const md=row?.$metadata??{};
              const w=row?.$workers??{};
              const req=w?.event?.request??row?.event?.request??w?.request??{};
              const res=w?.event?.response??row?.event?.response??w?.response??{};
              const x={};
              if(typeof md.service==='string'&&/^[a-z0-9-]+$/.test(md.service))x.service=md.service;
              if(typeof md.trigger==='string'&&/^POST \/app\/[a-z0-9-]+\/mail\/domains$/.test(md.trigger))x.trigger=md.trigger;
              if(typeof md.stage==='string'&&/^[a-z0-9_]+$/.test(md.stage))x.stage=md.stage;
              if(typeof md.safeErrorCode==='string'&&/^[a-z0-9_]+$/.test(md.safeErrorCode))x.safeErrorCode=md.safeErrorCode;
              if(req.method==='POST')x.method='POST';
              const p=safePath(req.url??req.path);if(p)x.path=p;
              const status=res.status??w.responseStatus;
              if(Number.isInteger(status)&&status>=100&&status<=599)x.status=status;
              const ray=safeHex(md.rayId??w.rayId);if(ray)x.rayId=ray;
              const trace=safeHex(md.traceId??w.traceId);if(trace)x.traceId=trace;
              return x;
            }).filter(x=>x.path||x.trigger||x.stage||x.safeErrorCode);
          }
          console.log(JSON.stringify(out));
          NODE
