name: Mail domain setup diagnostics (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tail:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Validate Cloudflare access without printing credentials
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo 'Missing repository Cloudflare API token.'; exit 1; }
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || { echo 'Missing repository Cloudflare account ID.'; exit 1; }
          echo 'Cloudflare credentials are present; values are masked.'

      - name: Check app-host Mail Cloudflare token binding without reading values
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.129.0 secret list --name mkety-app-host --env="" --format json >/tmp/mkety-mail-app-host-secret-names.json
          node <<'NODE'
          const fs=require('node:fs');
          const raw=fs.readFileSync('/tmp/mkety-mail-app-host-secret-names.json','utf8');
          const start=raw.indexOf('[');
          if(start<0) throw new Error('Could not parse app-host secret-name listing.');
          const rows=JSON.parse(raw.slice(start));
          const names=new Set(rows.map((row)=>row.name));
          console.log(JSON.stringify({
            event:'mail_app_host_secret_presence',
            mail_cloudflare_token_configured:names.has('MKETY_MAIL_CLOUDFLARE_API_TOKEN'),
            mail_cloudflare_account_id_configured:names.has('MKETY_MAIL_CLOUDFLARE_ACCOUNT_ID')
          }));
          NODE

      - name: Tail only safe Mail domain setup failures
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=INT --kill-after=5s 150s npx --yes wrangler@4.129.0 tail mkety-app-host --format=json |
            node --input-type=module -e '
              import { createInterface } from "node:readline";
              const rl = createInterface({ input: process.stdin, crlfDelay: Infinity });
              const prefixes = [
                ["[mail-domain-setup] provisioning failed", "mail_domain_setup_failure"],
                ["[mail-domain-setup] retry started", "mail_domain_setup_retry_started"],
                ["[vinext] Route handler error", "mail_route_handler_error"]
              ];
              const safeKeys = ["domain", "stage", "errorName", "httpStatus", "providerCode", "safeErrorCode", "path", "method", "status", "responseStatus", "rayId", "traceId"];
              function visit(value, output) {
                if (!value || typeof value !== "object") return;
                if (Array.isArray(value)) { for (const item of value) visit(item, output); return; }
                for (const key of safeKeys) {
                  if (!(key in output) && key in value) {
                    const item = value[key];
                    if (key === "domain" && typeof item === "string" && /^[a-z0-9.-]+$/.test(item)) output[key] = item;
                    if (key === "path" && typeof item === "string" && (/^\/app\/[a-z0-9-]+\/mail\/domains$/.test(item) || /^\/api\/mail\/(?:domains|migration\/archive\/(?:chunk|complete))$/.test(item))) output[key] = item;
                    if (key === "method" && ["GET", "POST"].includes(item)) output[key] = item;
                    if (["status", "responseStatus"].includes(key) && Number.isInteger(item) && item >= 400 && item <= 599) output[key] = item;
                    if (["rayId", "traceId"].includes(key) && typeof item === "string" && /^[a-f0-9]{16,32}$/i.test(item)) output[key] = item;
                    if (key === "stage" && typeof item === "string" && /^[a-z0-9_]+$/.test(item)) output[key] = item;
                    if (key === "errorName" && typeof item === "string" && /^[A-Za-z0-9_]+$/.test(item)) output[key] = item;
                    if ((key === "httpStatus" || key === "providerCode") && Number.isInteger(item)) output[key] = item;
                    if (key === "safeErrorCode" && typeof item === "string" && /^mail_[a-z0-9_]+$/.test(item)) output[key] = item;
                  }
                }
                for (const item of Object.values(value)) visit(item, output);
              }
              rl.on("line", line => {
                let record;
                try { record = JSON.parse(line); } catch { return; }
                const serialized = JSON.stringify(record);
                const match = prefixes.find(([prefix]) => serialized.includes(prefix));
                if (!match) return;
                const output = { event: match[1] };
                visit(record, output);
                process.stdout.write(JSON.stringify(output) + "\\n");
              });
            ' || {
              status=$?
              [ "$status" -eq 124 ] || [ "$status" -eq 130 ] || { echo 'Cloudflare Worker tail or safe log filter failed.'; exit "$status"; }
            }
          echo 'Diagnostic tail ended normally.'
