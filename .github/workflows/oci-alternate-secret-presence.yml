name: OCI Alternate Secret Presence

on:
  push:
    branches:
      - fix/oci-mail-ingress-20260929
    paths:
      - '.github/workflows/oci-alternate-secret-presence.yml'

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    env:
      OCI_TENANCY: ${{ secrets.OCI_TENANCY }}
      OCI_USER: ${{ secrets.OCI_USER }}
      OCI_KEY_FINGERPRINT: ${{ secrets.OCI_KEY_FINGERPRINT }}
      OCI_KEY: ${{ secrets.OCI_KEY }}
      OCI_PRIVATE_KEY_CONTENT: ${{ secrets.OCI_PRIVATE_KEY_CONTENT }}
      OCI_API_PRIVATE_KEY_PEM: ${{ secrets.OCI_API_PRIVATE_KEY_PEM }}
      OCI_API_KEY_PEM: ${{ secrets.OCI_API_KEY_PEM }}
      OCI_REGION_NAME: ${{ secrets.OCI_REGION_NAME }}
      OCI_COMPARTMENT: ${{ secrets.OCI_COMPARTMENT }}
      OCI_CLI_CONFIG: ${{ secrets.OCI_CLI_CONFIG }}
      OCI_CREDENTIALS: ${{ secrets.OCI_CREDENTIALS }}
      OCI_CREDENTIALS_JSON: ${{ secrets.OCI_CREDENTIALS_JSON }}
      OCI_API_CONFIG: ${{ secrets.OCI_API_CONFIG }}
      OCI_API_CONFIG_JSON: ${{ secrets.OCI_API_CONFIG_JSON }}
      OCI_AUTH_CONFIG: ${{ secrets.OCI_AUTH_CONFIG }}
      OCI_AUTH_JSON: ${{ secrets.OCI_AUTH_JSON }}
      OCI_KEY_FILE: ${{ secrets.OCI_KEY_FILE }}
      ORACLE_CLOUD_TENANCY_OCID: ${{ secrets.ORACLE_CLOUD_TENANCY_OCID }}
      ORACLE_CLOUD_USER_OCID: ${{ secrets.ORACLE_CLOUD_USER_OCID }}
      ORACLE_CLOUD_FINGERPRINT: ${{ secrets.ORACLE_CLOUD_FINGERPRINT }}
      ORACLE_CLOUD_PRIVATE_KEY: ${{ secrets.ORACLE_CLOUD_PRIVATE_KEY }}
      ORACLE_CLOUD_REGION: ${{ secrets.ORACLE_CLOUD_REGION }}
      ORACLE_CLOUD_COMPARTMENT_OCID: ${{ secrets.ORACLE_CLOUD_COMPARTMENT_OCID }}
      ORACLE_CLOUD_CONFIG: ${{ secrets.ORACLE_CLOUD_CONFIG }}
      ORACLE_CLOUD_CONFIG_JSON: ${{ secrets.ORACLE_CLOUD_CONFIG_JSON }}
      ORACLE_CREDENTIALS: ${{ secrets.ORACLE_CREDENTIALS }}
      ORACLE_CREDENTIALS_JSON: ${{ secrets.ORACLE_CREDENTIALS_JSON }}
      ORACLE_API_CONFIG: ${{ secrets.ORACLE_API_CONFIG }}
      ORACLE_API_CONFIG_JSON: ${{ secrets.ORACLE_API_CONFIG_JSON }}
      ORACLE_API_KEY: ${{ secrets.ORACLE_API_KEY }}
      ORACLE_API_PRIVATE_KEY: ${{ secrets.ORACLE_API_PRIVATE_KEY }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail
          for name in             OCI_TENANCY OCI_USER OCI_KEY_FINGERPRINT OCI_KEY OCI_PRIVATE_KEY_CONTENT             OCI_API_PRIVATE_KEY_PEM OCI_API_KEY_PEM OCI_REGION_NAME OCI_COMPARTMENT OCI_CLI_CONFIG             OCI_CREDENTIALS OCI_CREDENTIALS_JSON OCI_API_CONFIG OCI_API_CONFIG_JSON OCI_AUTH_CONFIG OCI_AUTH_JSON OCI_KEY_FILE             ORACLE_CLOUD_TENANCY_OCID ORACLE_CLOUD_USER_OCID ORACLE_CLOUD_FINGERPRINT             ORACLE_CLOUD_PRIVATE_KEY ORACLE_CLOUD_REGION ORACLE_CLOUD_COMPARTMENT_OCID             ORACLE_CLOUD_CONFIG ORACLE_CLOUD_CONFIG_JSON ORACLE_CREDENTIALS ORACLE_CREDENTIALS_JSON             ORACLE_API_CONFIG ORACLE_API_CONFIG_JSON ORACLE_API_KEY ORACLE_API_PRIVATE_KEY
          do
            if [ -n "${!name:-}" ]; then echo "$name=PRESENT"; else echo "$name=MISSING"; fi
          done
