name: Cleanup orphan synthetic Mail acceptance fixture

on:
  workflow_dispatch:
    inputs:
      confirm_run_id:
        description: "Type the exact orphaned synthetic acceptance run ID"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: mkety-mail-orphan-acceptance-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirm_run_id == '36672362451' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COOLIFY_URL: https://deploy.mkety.com
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      PROJECT_UUID: 0zqhpkprlhtvlacmsgmfyyhs
      ENVIRONMENT_UUID: rtebcetyfvzlaiqitzcp0gl8
      SERVER_UUID: ynkdc4tx6bi7cyxf0kuy8kte
      POSTGRES_UUID: hgxwkiyxgbmb2i3pl57kmxc8
      ACCEPTANCE_RUN_ID: ${{ inputs.confirm_run_id }}

    steps:
      - name: Verify the exact orphaned acceptance app
        id: target
        shell: bash
        run: |
          set -euo pipefail
          [ "$ACCEPTANCE_RUN_ID" = '36672362451' ] || { echo 'Unexpected acceptance run ID.'; exit 1; }
          [ -n "${COOLIFY_API_TOKEN:-}" ] || { echo 'COOLIFY_TOKEN is required.'; exit 1; }

          base="${COOLIFY_URL%/}/api/v1"
          curl --proto '=https' --tlsv1.2 -fsS "$base/health" >/dev/null
          curl --proto '=https' --tlsv1.2 -fsS \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            "$base/applications" -o /tmp/apps.json

          expected_name="mkety-mail-acceptance-$ACCEPTANCE_RUN_ID"
          cleanup_name="$expected_name-cleanup"
          APP_RUN_ID="$ACCEPTANCE_RUN_ID" PROJECT_UUID="$PROJECT_UUID" ENVIRONMENT_UUID="$ENVIRONMENT_UUID" SERVER_UUID="$SERVER_UUID" node <<'NODE'
          const fs=require('node:fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/apps.json','utf8'));
          const apps=Array.isArray(raw)?raw:(Array.isArray(raw.data)?raw.data:[]);
          const name='mkety-mail-acceptance-'+process.env.APP_RUN_ID;
          const cleanupName=name+'-cleanup';
          const matches=apps.filter(app=>app?.name===name);
          const cleanupMatches=apps.filter(app=>app?.name===cleanupName);
          if(matches.length>1||cleanupMatches.length>1) throw new Error('Multiple exact synthetic acceptance apps exist; refusing cleanup.');
          if(matches.length===1&&cleanupMatches.length!==0) throw new Error('Both the original and recovery app exist; refusing cleanup.');
          if(matches.length===0&&cleanupMatches.length===0) {
            fs.writeFileSync('/tmp/create-recovery-app','true');
          } else if(matches.length===1) {
            const app=matches[0];
            if(!app.uuid) throw new Error('The stale acceptance app has no UUID.');
            if(app.project_uuid!==process.env.PROJECT_UUID
              || app.environment_uuid!==process.env.ENVIRONMENT_UUID
              || app.server_uuid!==process.env.SERVER_UUID) {
              throw new Error('The stale acceptance app is outside the guarded project, environment, or server.');
            }
            if(app.dockerfile_location!=='/ops/mail-gateway-acceptance/Dockerfile'
              || app.git_branch!=='main'
              || !String(app.git_repository||'').includes('MketyDigital/mksaas')) {
              throw new Error('The named app no longer matches the synthetic Mail acceptance app configuration.');
            }
            fs.writeFileSync('/tmp/target-app.json',JSON.stringify({uuid:app.uuid,name:app.name}));
          } else {
            const app=cleanupMatches[0];
            // Coolify's documented application list omits project_uuid, environment_uuid,
            // and server_uuid. Identify the exact recovery app by the immutable metadata
            // written by the guarded create request and its known dispatch commit.
            if(!app.uuid||app.name!==cleanupName
              || app.description!=='One-time synthetic Mkety Mail fixture cleanup runtime'
              || app.git_commit_sha!=='c28dd028030b0b26134fbd45c61bb63e801d7632'
              || app.build_pack!=='dockerfile'
              || app.dockerfile_location!=='/ops/mail-gateway-acceptance/Dockerfile'
              || app.ports_exposes!=='3000'
              || app.git_branch!=='main'
              || !String(app.git_repository||'').includes('MketyDigital/mksaas')) {
              throw new Error('The existing recovery app does not match the exact guarded configuration.');
            }
            fs.writeFileSync('/tmp/target-app.json',JSON.stringify({uuid:app.uuid,name:app.name}));
          }
          NODE

          if [ -f /tmp/create-recovery-app ]; then
            curl --proto '=https' --tlsv1.2 -fsS \
              -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
              "$base/databases/$POSTGRES_UUID" -o /tmp/production-db.json
            DATABASE_URL="$(node <<'NODE'
          const db=require('/tmp/production-db.json');
          const healthy=String(db.status||'').toLowerCase().includes('healthy');
          if(db.is_public!==false||db.enable_ssl!==true||!healthy||!db.internal_db_url) {
            throw new Error('Private PostgreSQL preflight failed.');
          }
          process.stdout.write(String(db.internal_db_url));
          NODE
            )"
            [ -n "$DATABASE_URL" ] || exit 1
            echo "::add-mask::$DATABASE_URL"

            APP_NAME="$cleanup_name" APP_SHA="$GITHUB_SHA" node <<'NODE' >/tmp/create-app.json
          process.stdout.write(JSON.stringify({
            project_uuid:process.env.PROJECT_UUID,
            server_uuid:process.env.SERVER_UUID,
            environment_uuid:process.env.ENVIRONMENT_UUID,
            git_repository:'https://github.com/MketyDigital/mksaas',
            git_branch:'main',
            git_commit_sha:process.env.APP_SHA,
            build_pack:'dockerfile',
            dockerfile_location:'/ops/mail-gateway-acceptance/Dockerfile',
            ports_exposes:'3000',
            name:process.env.APP_NAME,
            description:'One-time synthetic Mkety Mail fixture cleanup runtime',
            autogenerate_domain:false,
            connect_to_docker_network:true,
            instant_deploy:false,
            health_check_enabled:true,
            health_check_path:'/',
            health_check_port:'3000',
            limits_cpus:'0.25',
            limits_memory:'128m',
            docker_images_to_keep:1,
            max_restart_count:2
          }));
          NODE
            code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/create-response.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Content-Type: application/json' \
              --data-binary @/tmp/create-app.json "$base/applications/public")"
            [ "$code" = 201 ] || { echo "Recovery app create failed (HTTP $code)."; exit 1; }
            recovery_uuid="$(node -e "const x=require('/tmp/create-response.json');if(!x.uuid)process.exit(1);process.stdout.write(x.uuid)")"
            echo "::add-mask::$recovery_uuid"
            curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
              "$base/applications/$recovery_uuid" -o /tmp/recovery-app.json
            APP_UUID="$recovery_uuid" APP_NAME="$cleanup_name" APP_SHA="$GITHUB_SHA" node <<'NODE'
          const fs=require('node:fs');
          const app=JSON.parse(fs.readFileSync('/tmp/recovery-app.json','utf8'));
          // The create request above binds this UUID to the guarded project, environment,
          // and server. Coolify's GET response exposes the app fields checked here, not
          // those three UUID fields.
          if(app.uuid!==process.env.APP_UUID||app.name!==process.env.APP_NAME
            ||app.description!=='One-time synthetic Mkety Mail fixture cleanup runtime'
            ||app.git_commit_sha!==process.env.APP_SHA
            ||app.build_pack!=='dockerfile'
            ||app.dockerfile_location!=='/ops/mail-gateway-acceptance/Dockerfile'
            ||app.ports_exposes!=='3000'
            ||app.git_branch!=='main'
            ||!String(app.git_repository||'').includes('MketyDigital/mksaas')) {
            throw new Error('The newly created recovery app failed exact identity validation.');
          }
          NODE
            endpoint="$base/applications/$recovery_uuid/envs"
            upsert_env() {
              key="$1"; value="$2"
              KEY="$key" VALUE="$value" node <<'NODE' >/tmp/recovery-env.json
          process.stdout.write(JSON.stringify({
            key:process.env.KEY,value:process.env.VALUE,is_preview:false,
            is_literal:true,is_multiline:false,is_shown_once:true
          }));
          NODE
              curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
                "$endpoint" -o /tmp/recovery-envs.json
              exists="$(KEY="$key" node -e "const x=require('/tmp/recovery-envs.json');process.stdout.write(Array.isArray(x)&&x.some(v=>v?.key===process.env.KEY)?'true':'false')")"
              method=POST; [ "$exists" = true ] && method=PATCH
              code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/recovery-env-response.json -w '%{http_code}' -X "$method" \
                -H "Authorization: Bearer $COOLIFY_API_TOKEN" -H 'Content-Type: application/json' \
                --data-binary @/tmp/recovery-env.json "$endpoint")"
              [ "$code" = 201 ] || { echo "Recovery app environment setup failed for $key (HTTP $code)."; exit 1; }
            }
            upsert_env DATABASE_URL "$DATABASE_URL"
            upsert_env MKETY_MAIL_ACCEPTANCE_MODE cleanup
            upsert_env MKETY_MAIL_ACCEPTANCE_RUN_ID "$ACCEPTANCE_RUN_ID"
            node -e "const x=require('/tmp/recovery-app.json');require('node:fs').writeFileSync('/tmp/target-app.json',JSON.stringify({uuid:x.uuid,name:x.name}))"
            echo 'No original app exists; a temporary cleanup-only runtime was created.'
          fi

          target_uuid="$(node -e "process.stdout.write(require('/tmp/target-app.json').uuid)")"
          target_name="$(node -e "process.stdout.write(require('/tmp/target-app.json').name)")"
          echo "::add-mask::$target_uuid"
          echo "APP_UUID=$target_uuid" >> "$GITHUB_ENV"
          echo "APP_NAME=$target_name" >> "$GITHUB_ENV"

          curl --proto '=https' --tlsv1.2 -fsS \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            "$base/applications/$target_uuid/envs" -o /tmp/app-envs.json
          APP_RUN_ID="$ACCEPTANCE_RUN_ID" node <<'NODE'
          const fs=require('node:fs');
          const rows=JSON.parse(fs.readFileSync('/tmp/app-envs.json','utf8'));
          const envs=Array.isArray(rows)?rows:[];
          const keys=new Set(envs.map(row=>String(row?.key||'')));
          const runEnv=envs.find(row=>row?.key==='MKETY_MAIL_ACCEPTANCE_RUN_ID');
          if(!keys.has('DATABASE_URL')||!runEnv) {
            throw new Error('The exact acceptance app is missing its required cleanup runtime configuration.');
          }
          if(runEnv.value && String(runEnv.value)!==process.env.APP_RUN_ID) {
            throw new Error('The acceptance app run ID does not match the guarded cleanup target.');
          }
          NODE

      - name: Delete only the stale synthetic Mail fixture
        shell: bash
        run: |
          set -euo pipefail
          base="${COOLIFY_URL%/}/api/v1"
          target_uuid="$APP_UUID"
          endpoint="$base/applications/$target_uuid/envs"

          KEY='MKETY_MAIL_ACCEPTANCE_MODE' VALUE='cleanup' node <<'NODE' >/tmp/cleanup-env.json
          process.stdout.write(JSON.stringify({
            key:process.env.KEY,
            value:process.env.VALUE,
            is_preview:false,
            is_literal:true,
            is_multiline:false,
            is_shown_once:true
          }));
          NODE
          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/cleanup-env-response.json -w '%{http_code}' \
            -X PATCH -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            -H 'Content-Type: application/json' --data-binary @/tmp/cleanup-env.json "$endpoint")"
          [ "$code" = 201 ] || { echo "Could not set cleanup mode (HTTP $code)."; exit 1; }

          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/deploy.json -w '%{http_code}' \
            -X POST -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            "$base/deploy?uuid=$target_uuid&force=true")"
          [ "$code" = 200 ] || { echo "Could not start the cleanup deployment (HTTP $code)."; exit 1; }
          deployment_uuid="$(node -e "const x=require('/tmp/deploy.json');const d=Array.isArray(x.deployments)?x.deployments[0]:null;if(!d?.deployment_uuid)process.exit(1);process.stdout.write(d.deployment_uuid)")"

          for i in $(seq 1 120); do
            curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
              "$base/deployments/$deployment_uuid" -o /tmp/deployment-state.json
            state="$(node -e "process.stdout.write(String(require('/tmp/deployment-state.json').status||''))")"
            case "${state,,}" in
              finished|success|successful|succeeded|completed) break ;;
              failed|failure|error|cancelled|canceled)
                echo "Cleanup deployment ended in state $state; checking the exact fixture cleanup marker."
                break
                ;;
            esac
            [ "$i" -lt 120 ] || { echo 'Cleanup deployment timed out.'; exit 1; }
            sleep 3
          done

          cleaned=false
          for i in $(seq 1 60); do
            curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
              "$base/applications/$target_uuid/logs?lines=300&show_timestamps=false" -o /tmp/cleanup-logs.json || true
            if node <<'NODE'
          const fs=require('node:fs');
          try {
            const x=JSON.parse(fs.readFileSync('/tmp/cleanup-logs.json','utf8'));
            process.exit(String(x.logs||'').includes('MKETY_MAIL_FUNCTIONAL_FIXTURE_CLEANED=true')?0:1);
          } catch { process.exit(1); }
          NODE
            then
              cleaned=true
              break
            fi
            sleep 2
          done
          [ "$cleaned" = true ] || { echo 'The synthetic database fixture cleanup marker was not observed; the Coolify app is retained for investigation.'; exit 1; }
          echo 'The synthetic database fixture cleanup marker was verified.'

          # Re-read exact identity immediately before deleting the ephemeral app.
          curl --proto '=https' --tlsv1.2 -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            "$base/applications/$target_uuid" -o /tmp/app-before-delete.json
          APP_UUID="$target_uuid" node <<'NODE'
          const fs=require('node:fs');
          const app=JSON.parse(fs.readFileSync('/tmp/app-before-delete.json','utf8'));
          if(app.uuid!==process.env.APP_UUID||app.name!==process.env.APP_NAME) {
            throw new Error('The app identity changed before deletion; refusing to delete.');
          }
          NODE

          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/delete-response.json -w '%{http_code}' \
            -X DELETE -H "Authorization: Bearer $COOLIFY_API_TOKEN" "$base/applications/$target_uuid")"
          case "$code" in 200|204) ;; *) echo "Ephemeral app deletion failed (HTTP $code)."; exit 1 ;; esac

          curl --proto '=https' --tlsv1.2 -fsS \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" "$base/applications" -o /tmp/apps-after.json
          node <<'NODE'
          const fs=require('node:fs');
          const raw=JSON.parse(fs.readFileSync('/tmp/apps-after.json','utf8'));
          const apps=Array.isArray(raw)?raw:(Array.isArray(raw.data)?raw.data:[]);
          if(apps.some(app=>app?.uuid===process.env.APP_UUID||app?.name===process.env.APP_NAME)) {
            throw new Error('The stale synthetic acceptance app remains after deletion.');
          }
          console.log('STALE_MAIL_ACCEPTANCE_FIXTURE_CLEANUP_CONFIRMED=true');
          NODE
