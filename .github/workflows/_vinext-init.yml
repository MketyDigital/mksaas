name: Temporary vinext Cloudflare init

on:
  push:
    branches:
      - fix/cloudflare-deployment-baseline
    paths:
      - '.github/workflows/_vinext-init.yml'

permissions:
  contents: write

jobs:
  init-vinext:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/cloudflare-deployment-baseline
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Initialize vinext for Cloudflare
        run: pnpx vinext init --skip-check --platform=cloudflare
      - name: Show generated changes
        run: git diff -- package.json pnpm-lock.yaml vite.config.* wrangler.*
      - name: Commit generated vinext baseline
        run: |
          git config user.name "Mkety Baseline Bot"
          git config user.email "actions@users.noreply.github.com"
          git add package.json pnpm-lock.yaml vite.config.* wrangler.*
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git commit -m "build: initialize vinext Cloudflare runtime"
          git push origin HEAD:fix/cloudflare-deployment-baseline
