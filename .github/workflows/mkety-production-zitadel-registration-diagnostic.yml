name: Mkety Production ZITADEL Registration Diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mkety-production-zitadel-registration-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      ZITADEL_MANAGEMENT_TOKEN: ${{ secrets.ZITADEL_MANAGEMENT_PAT }}
      MKETY_AUTH_ISSUER: ${{ vars.ZITADEL_URL }}
      ZITADEL_PROJECT_ID: ${{ secrets.ZITADEL_PROJECT_ID }}

    steps:
      - name: Inspect production self-registration policy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          publish() {
            STATE="$1" DESC="$2" node <<'NODE' >/tmp/status.json
          process.stdout.write(JSON.stringify({state:process.env.STATE,context:'mkety/zitadel-registration',description:String(process.env.DESC||'').slice(0,140)}));
          NODE
            curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json'               -H 'Content-Type: application/json' --data @/tmp/status.json               "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null || true
          }

          for name in ZITADEL_MANAGEMENT_TOKEN MKETY_AUTH_ISSUER ZITADEL_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              publish failure "Missing production ZITADEL diagnostic setting: $name"
              exit 1
            fi
          done
          echo "::add-mask::$ZITADEL_MANAGEMENT_TOKEN"
          issuer="${MKETY_AUTH_ISSUER%/}"

          project_response="$(curl --fail-with-body --silent --show-error             -X POST "$issuer/zitadel.project.v2.ProjectService/GetProject"             -H "Authorization: Bearer ${ZITADEL_MANAGEMENT_TOKEN}"             -H 'Connect-Protocol-Version: 1'             -H 'Content-Type: application/json'             --data "{\"projectId\":\"${ZITADEL_PROJECT_ID}\"}")"
          org_id="$(RESPONSE="$project_response" node <<'NODE'
          const parsed=JSON.parse(process.env.RESPONSE||'{}');
          if(!parsed.project?.organizationId) throw new Error('project organization id missing');
          process.stdout.write(String(parsed.project.organizationId));
          NODE
          )"
          echo "::add-mask::$org_id"

          login="$(curl --fail-with-body --silent --show-error             "$issuer/v2/settings/login?ctx.orgId=$org_id"             -H "Authorization: Bearer ${ZITADEL_MANAGEMENT_TOKEN}")"

          LOGIN="$login" node <<'NODE' >/tmp/summary.json
          const p=JSON.parse(process.env.LOGIN||'{}'), s=p.settings||{};
          process.stdout.write(JSON.stringify({
            allowUsernamePassword:s.allowUsernamePassword ?? null,
            allowLocalAuthentication:s.allowLocalAuthentication ?? null,
            allowRegister:s.allowRegister ?? null,
            allowExternalIdp:s.allowExternalIdp ?? null,
            hidePasswordReset:s.hidePasswordReset ?? null,
            allowDomainDiscovery:s.allowDomainDiscovery ?? null
          }));
          NODE

          allow="$(node -e "const x=require('/tmp/summary.json');process.stdout.write(String(x.allowRegister))")"
          local="$(node -e "const x=require('/tmp/summary.json');process.stdout.write(String(x.allowLocalAuthentication))")"
          userpass="$(node -e "const x=require('/tmp/summary.json');process.stdout.write(String(x.allowUsernamePassword))")"
          echo "ZITADEL_REGISTRATION_SAFE allowRegister=$allow allowLocalAuthentication=$local allowUsernamePassword=$userpass"

          if [ "$allow" = true ] && [ "$local" = true ] && [ "$userpass" = true ]; then
            publish success 'Production ZITADEL allows self-registration and local username/password authentication.'
          else
            publish failure "Production ZITADEL registration policy blocks signup (register=$allow local=$local usernamePassword=$userpass)."
            exit 1
          fi
