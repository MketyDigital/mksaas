name: Ops Dispatch Certified Mkety Production Cutover

on:
  push:
    branches:
      - ops/cutover-8ef16b
    paths:
      - .github/workflows/ops-dispatch-production-cutover-8ef16b.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact production release head
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 8ef16bd1802499331d5d8ea9e43db2b0f8da6bcd
          RELEASE_BRANCH: feat/mkety-public-site-production
        shell: bash
        run: |
          set -euo pipefail
          encoded_branch="$(node -e "process.stdout.write(encodeURIComponent(process.env.RELEASE_BRANCH))")"
          actual_sha="$(curl -fsS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/${encoded_branch}" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).object.sha))")"
          test "$actual_sha" = "$TARGET_SHA"
          echo "Certified release branch is pinned to $TARGET_SHA"

      - name: Dispatch hardened production cutover
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: 8ef16bd1802499331d5d8ea9e43db2b0f8da6bcd
        shell: bash
        run: |
          set -euo pipefail
          payload="$(node -e "process.stdout.write(JSON.stringify({ref:'main',inputs:{verified_sha:process.env.TARGET_SHA,confirmation:'CUTOVER MKETY PUBLIC'}}))")"
          curl -fsS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/mkety-public-production-cutover.yml/dispatches" \
            -d "$payload"
          echo "Production cutover dispatched for $TARGET_SHA"
