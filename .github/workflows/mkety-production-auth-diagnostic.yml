name: Mkety Production Auth Diagnostic

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mkety-production-auth-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    env:
      COOLIFY_URL: https://deploy.mkety.com
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ZITADEL_URL: ${{ vars.ZITADEL_URL }}
      ZITADEL_MANAGEMENT_TOKEN: ${{ secrets.ZITADEL_MANAGEMENT_PAT }}
      POSTGRES_UUID: hgxwkiyxgbmb2i3pl57kmxc8
      TUNNEL_NAME: mkety-production-vpc
      DB_HOSTNAME: db-runtime.mkety.com
      HYPERDRIVE_NAME: mkety-production-db
      PRODUCTION_WORKER_NAME: mkety-platform
      OLD_PROXY_NAME: mkety-production-pgbouncer-tls-proxy
      NEW_PROXY_NAME: mkety-production-pgbouncer-tls-proxy-v2

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Run bounded production auth map
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          fail=0
          publish() {
            context="$1"; state="$2"; description="$3"
            CONTEXT="$context" STATE="$state" DESCRIPTION="$description" node <<'NODE' >/tmp/status.json
          process.stdout.write(JSON.stringify({
            state: process.env.STATE,
            context: process.env.CONTEXT,
            description: String(process.env.DESCRIPTION||'').slice(0,140),
          }));
          NODE
            curl --connect-timeout 5 --max-time 10 -fsS -X POST               -H "Authorization: Bearer $GH_TOKEN"               -H 'Accept: application/vnd.github+json'               -H 'X-GitHub-Api-Version: 2022-11-28'               -H 'Content-Type: application/json'               --data @/tmp/status.json               "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" >/dev/null || true
          }

          missing=0
          for v in COOLIFY_API_TOKEN CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ZITADEL_URL ZITADEL_MANAGEMENT_TOKEN; do
            [ -n "${!v:-}" ] || missing=1
          done
          if [ "$missing" -eq 0 ]; then publish mkety/auth-diag-secrets success 'Production secret/variable bindings are present.'; else publish mkety/auth-diag-secrets failure 'Required production access binding missing.'; fail=1; fi

          db_code="$(curl --proto '=https' --tlsv1.2 --connect-timeout 5 --max-time 12 -sS -o /tmp/db.json -w '%{http_code}'             -H "Authorization: Bearer $COOLIFY_API_TOKEN" "${COOLIFY_URL%/}/api/v1/databases/$POSTGRES_UUID" || true)"
          if [ "$db_code" = 200 ] && node <<'NODE'
          const x=require('/tmp/db.json');
          const healthy=String(x.status||'').toLowerCase().includes('healthy');
          process.exit(x.is_public===false && x.enable_ssl===true && healthy && !!x.internal_db_url ? 0 : 1);
          NODE
          then publish mkety/auth-diag-db success 'Coolify PostgreSQL is private, TLS-enabled, healthy and internally addressable.';
          else publish mkety/auth-diag-db failure "Coolify PostgreSQL API/preflight failed (HTTP $db_code)."; fail=1; fi

          base="${COOLIFY_URL%/}/api/v1"
          apps="$(curl --proto '=https' --tlsv1.2 --connect-timeout 5 --max-time 12 -fsS -H "Authorization: Bearer $COOLIFY_API_TOKEN" "$base/applications" 2>/dev/null || true)"
          proxy_uuid="$(APPS="$apps" node -e "try{const p=JSON.parse(process.env.APPS||'[]'),a=Array.isArray(p)?p:(p.data||[]);const m=a.filter(x=>x.name===process.env.NEW_PROXY_NAME);if(m.length===1&&m[0]?.uuid)process.stdout.write(String(m[0].uuid))}catch{}")"
          if [ -n "$proxy_uuid" ]; then
            pcode="$(curl --proto '=https' --tlsv1.2 --connect-timeout 5 --max-time 12 -sS -o /tmp/proxy.json -w '%{http_code}' -H "Authorization: Bearer $COOLIFY_API_TOKEN" "$base/applications/$proxy_uuid" || true)"
            lcode="$(curl --proto '=https' --tlsv1.2 --connect-timeout 5 --max-time 12 -sS -o /tmp/proxylogs.json -w '%{http_code}' -H "Authorization: Bearer $COOLIFY_API_TOKEN" "$base/applications/$proxy_uuid/logs?lines=500&show_timestamps=false" || true)"
            if [ "$pcode" = 200 ] && [ "$lcode" = 200 ] && node <<'NODE'
          const app=require('/tmp/proxy.json');
          const logs=String(require('/tmp/proxylogs.json').logs||'');
          const st=String(app.status||'').toLowerCase();
          const healthy=st.includes('running')||st.includes('healthy');
          const required=['MKETY_PGBOUNCER_V2_UPSTREAM_VERIFY_OK=true','MKETY_PGBOUNCER_V2_CLIENT_TLS_OK=true','MKETY_PGBOUNCER_V2_QUERY_OK=true','MKETY_PGBOUNCER_V2_READY=true'];
          process.exit(healthy && required.every(x=>logs.includes(x)) ? 0 : 1);
          NODE
            then publish mkety/auth-diag-proxy-v2-exists success 'PgBouncer v2 app exists in Coolify.'; publish mkety/auth-diag-proxy-v2-ready success 'PgBouncer v2 is healthy with verified TLS/query readiness markers.';
            else publish mkety/auth-diag-proxy-v2-exists success 'PgBouncer v2 app exists in Coolify.'; publish mkety/auth-diag-proxy-v2-ready failure 'PgBouncer v2 exists but is not healthy/verified-ready.'; fail=1; fi
          else publish mkety/auth-diag-proxy-v2-exists failure 'PgBouncer v2 app is missing in Coolify.'; publish mkety/auth-diag-proxy-v2-ready failure 'PgBouncer v2 cannot be ready because the app is missing.'; fail=1; fi

          tunnels="$(curl --connect-timeout 5 --max-time 12 -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel?is_deleted=false&per_page=100" 2>/dev/null || true)"
          tid="$(TUNNELS="$tunnels" node -e "try{const p=JSON.parse(process.env.TUNNELS||'{}'),a=Array.isArray(p.result)?p.result:[];const m=a.filter(x=>x.name===process.env.TUNNEL_NAME);process.stdout.write(m.length===1&&m[0]?.id?String(m[0].id):'')}catch{}")"
          if [ -n "$tid" ]; then
            cfg="$(curl --connect-timeout 5 --max-time 12 -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"               "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/cfd_tunnel/$tid/configurations" 2>/dev/null || true)"
            target="$(CFG="$cfg" node -e "try{const p=JSON.parse(process.env.CFG||'{}');const a=p?.result?.config?.ingress||[];const m=a.filter(x=>x.hostname===process.env.DB_HOSTNAME);if(m.length===1)process.stdout.write(String(m[0].service||''))}catch{}")"
            if [ "$target" = "tcp://$NEW_PROXY_NAME:6432" ]; then publish mkety/auth-diag-tunnel success 'DB tunnel targets PgBouncer v2.';
            elif [ "$target" = "tcp://$OLD_PROXY_NAME:6432" ]; then publish mkety/auth-diag-tunnel failure 'DB tunnel is still on legacy PgBouncer.'; fail=1;
            else publish mkety/auth-diag-tunnel failure 'DB tunnel target is missing or unexpected.'; fail=1; fi
          else publish mkety/auth-diag-tunnel failure 'Production Cloudflare tunnel could not be resolved.'; fail=1; fi

          hd="$(curl --connect-timeout 5 --max-time 12 -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"             "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/hyperdrive/configs?per_page=100" 2>/dev/null || true)"
          hdmode="$(HD="$hd" node -e "try{const p=JSON.parse(process.env.HD||'{}'),a=Array.isArray(p.result)?p.result:[];const m=a.filter(x=>x.name===process.env.HYPERDRIVE_NAME);if(m.length===1&&m[0]?.id){const o=m[0].origin||{};process.stdout.write(o.service_id?'service':(o.host?'host':'unknown'))}}catch{}")"
          if [ -n "$hdmode" ]; then publish mkety/auth-diag-hyperdrive success "Production Hyperdrive exists; origin mode=$hdmode.";
          else publish mkety/auth-diag-hyperdrive failure 'Production Hyperdrive is missing or ambiguous.'; fail=1; fi

          pnpm exec wrangler secret list --name "$PRODUCTION_WORKER_NAME" --format json >/tmp/secrets.json 2>/tmp/wrangler.err
          if [ "$?" -eq 0 ] && node <<'NODE'
          const fs=require('node:fs');
          const raw=fs.readFileSync('/tmp/secrets.json','utf8');
          const m=raw.match(/\[\s*(?:\{|\])/);
          const entries=m?JSON.parse(raw.slice(m.index)):[];
          const names=new Set(entries.map(x=>x.name));
          const required=['MKETY_AUTH_PROVIDER','MKETY_AUTH_ISSUER','MKETY_AUTH_CLIENT_ID','MKETY_AUTH_REDIRECT_URI','MKETY_AUTH_POST_LOGOUT_REDIRECT_URI','MKETY_AUTH_SESSION_SECRET','NEXT_PUBLIC_APP_URL'];
          process.exit(required.every(k=>names.has(k))?0:1);
          NODE
          then publish mkety/auth-diag-worker success 'Production Worker has all required Mkety Auth bindings.';
          else publish mkety/auth-diag-worker failure 'Production Worker auth bindings are incomplete or unreadable.'; fail=1; fi

          issuer="${ZITADEL_URL%/}"
          zcode="$(curl --connect-timeout 5 --max-time 12 -sS -o /tmp/oidc.json -w '%{http_code}' "$issuer/.well-known/openid-configuration" || true)"
          if [ "$zcode" = 200 ] && node -e "const x=require('/tmp/oidc.json');process.exit(x.issuer&&x.authorization_endpoint&&x.token_endpoint?0:1)"; then
            publish mkety/auth-diag-zitadel success 'ZITADEL OIDC discovery is reachable and complete.'
          else publish mkety/auth-diag-zitadel failure "ZITADEL OIDC discovery failed (HTTP $zcode)."; fail=1; fi

          pages_ok=1
          for p in /login /signup; do
            h="/tmp/${p#/}.h"; b="/tmp/${p#/}.b"
            code="$(curl --connect-timeout 5 --max-time 12 -sS -D "$h" -o "$b" -w '%{http_code}' "https://mkety.com$p" || true)"
            ct="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {sub(/^[^:]*:[[:space:]]*/, "");gsub(/\r/,"");v=$0} END{print v}' "$h")"
            [ "$code" = 200 ] && printf '%s' "$ct" | grep -Eqi '^text/html([;]|$)' && grep -Eqi '<!doctype html|<html' "$b" || pages_ok=0
          done
          if [ "$pages_ok" -eq 1 ]; then publish mkety/auth-diag-pages success 'Live login/signup routes return browser HTML.';
          else publish mkety/auth-diag-pages failure 'Live login/signup page contract is broken.'; fail=1; fi

          h=/tmp/live-auth.h
          acode="$(curl --connect-timeout 5 --max-time 15 -sS -D "$h" -o /dev/null -w '%{http_code}'             'https://mkety.com/api/auth/login?returnTo=/select-tenant' || true)"
          loc="$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]*:[[:space:]]*/, "");sub(/\r$/,"");print;exit}' "$h")"
          if [ "$acode" -ge 300 ] 2>/dev/null && [ "$acode" -lt 400 ] 2>/dev/null && [ -n "$loc" ] && LOCATION="$loc" node <<'NODE'
          const u=new URL(process.env.LOCATION), issuer=new URL(process.env.ZITADEL_URL);
          process.exit(u.origin===issuer.origin &&
            u.searchParams.get('response_type')==='code' &&
            u.searchParams.get('code_challenge_method')==='S256' &&
            !!u.searchParams.get('code_challenge') &&
            u.searchParams.get('redirect_uri')==='https://mkety.com/api/auth/callback' &&
            !!u.searchParams.get('client_id') ? 0 : 1);
          NODE
          then publish mkety/auth-diag-live success 'Live /api/auth/login reaches ZITADEL with PKCE S256.';
          else
            if [ "$acode" = 000 ]; then publish mkety/auth-diag-live failure 'Live /api/auth/login timed out before ZITADEL.';
            else publish mkety/auth-diag-live failure "Live /api/auth/login failed required ZITADEL PKCE redirect (HTTP $acode)."; fi
            fail=1
          fi

          if [ "$fail" -eq 0 ]; then publish mkety/auth-diagnostic success 'Production auth chain is fully connected.'; exit 0;
          else publish mkety/auth-diagnostic failure 'Production auth chain has broken dependencies.'; exit 1; fi
