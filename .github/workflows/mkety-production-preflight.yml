name: Mkety Production Routing Preflight

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/mkety-production-preflight.yml'
      - '.github/workflows/mkety-public-candidate-deploy.yml'
      - 'wrangler.jsonc'

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect mkety.com routing without mutation
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 24 || github.event.pull_request.number == 91
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Cloudflare read credentials
        shell: bash
        run: |
          set -euo pipefail
          for variable in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!variable:-}" ]; then
              echo "$variable is not configured."
              exit 1
            fi
          done

      - name: Inspect zone, DNS and Worker routes
        shell: bash
        run: |
          set -euo pipefail
          api='https://api.cloudflare.com/client/v4'
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json')

          curl -fsS "${auth[@]}" "$api/zones?name=mkety.com&account.id=$CLOUDFLARE_ACCOUNT_ID" > /tmp/mkety-zone.json
          zone_id="$(node <<'NODE'
          const response = require('/tmp/mkety-zone.json');
          if (!response.success || !Array.isArray(response.result) || response.result.length !== 1) {
            console.error('Expected exactly one accessible mkety.com Cloudflare zone.');
            process.exit(1);
          }
          process.stdout.write(response.result[0].id);
          NODE
          )"

          curl -fsS "${auth[@]}" "$api/zones/$zone_id/dns_records?name=mkety.com" > /tmp/mkety-root-dns.json
          curl -fsS "${auth[@]}" "$api/zones/$zone_id/dns_records?name=www.mkety.com" > /tmp/mkety-www-dns.json
          curl -fsS "${auth[@]}" "$api/zones/$zone_id/workers/routes" > /tmp/mkety-worker-routes.json
          curl -fsS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/domains" > /tmp/mkety-worker-domains.json
          curl -fsS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/mkety-platform/settings" > /tmp/mkety-worker-settings.json

          ZONE_ID="$zone_id" node <<'NODE'
          const root = require('/tmp/mkety-root-dns.json');
          const www = require('/tmp/mkety-www-dns.json');
          const routes = require('/tmp/mkety-worker-routes.json');
          const domains = require('/tmp/mkety-worker-domains.json');
          const settings = require('/tmp/mkety-worker-settings.json');
          for (const [name, payload] of [['root DNS', root], ['www DNS', www], ['Worker routes', routes], ['Worker domains', domains]]) {
            if (!payload.success || !Array.isArray(payload.result)) {
              console.error(`Cloudflare ${name} lookup failed.`);
              process.exit(1);
            }
          }
          if (!settings.success || !settings.result || typeof settings.result !== 'object' || Array.isArray(settings.result)) {
            console.error('Cloudflare Worker settings lookup failed.');
            process.exit(1);
          }

          function safeRecord(record) {
            return {
              name: record.name,
              type: record.type,
              proxied: record.proxied,
              ttl: record.ttl,
              contentKind: typeof record.content === 'string'
                ? (record.content.includes('pages.dev') ? 'pages.dev' : record.content.includes('workers.dev') ? 'workers.dev' : 'other')
                : 'unknown',
            };
          }

          console.log(`mkety.com zone accessible: yes (${process.env.ZONE_ID.slice(0, 8)}…)`);
          console.log('Root DNS records:', JSON.stringify(root.result.map(safeRecord)));
          console.log('www DNS records:', JSON.stringify(www.result.map(safeRecord)));
          console.log('Worker route patterns:', JSON.stringify(routes.result.map((route) => ({ pattern: route.pattern, script: route.script || null }))));
          console.log('Mkety Worker custom domains:', JSON.stringify(domains.result.filter((d) => ['mkety.com','www.mkety.com'].includes(d.hostname)).map((d) => ({hostname:d.hostname,service:d.service,environment:d.environment || null}))));
          console.log('Mkety Worker bindings:', JSON.stringify((settings.result?.bindings || []).map((b) => ({name:b.name,type:b.type})).sort((a,b)=>a.name.localeCompare(b.name))));
          console.log('Mkety Worker compatibility date:', settings.result?.compatibility_date || null);
          NODE

      - name: Probe live Mkety production endpoints
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            local label="$1"
            local url="$2"
            local body="/tmp/mkety-probe-${label//[^a-zA-Z0-9]/_}.body"
            local headers="/tmp/mkety-probe-${label//[^a-zA-Z0-9]/_}.headers"
            local code
            code="$(curl -sS --connect-timeout 10 --max-time 20 -D "$headers" -o "$body" -w '%{http_code}' "$url" || true)"
            content_type="$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {sub(/^[^:]*:[[:space:]]*/, ""); gsub(/\r/, ""); value=$0} END{print value}' "$headers" 2>/dev/null || true)"
            disposition="$(awk 'BEGIN{IGNORECASE=1} /^content-disposition:/ {sub(/^[^:]*:[[:space:]]*/, ""); gsub(/\r/, ""); value=$0} END{print value}' "$headers" 2>/dev/null || true)"
            server="$(awk 'BEGIN{IGNORECASE=1} /^server:/ {sub(/^[^:]*:[[:space:]]*/, ""); gsub(/\r/, ""); value=$0} END{print value}' "$headers" 2>/dev/null || true)"
            echo "PROBE $label HTTP=$code content-type=$content_type content-disposition=$disposition server=$server"
            if [ -s "$body" ]; then
              python3 - "$body" <<'PY'
import re,sys
p=sys.argv[1]
s=open(p,'r',encoding='utf-8',errors='replace').read(1200)
s=re.sub(r'(?i)(authorization|token|secret|password|api[_-]?key)\s*[:=]\s*[^\s,}"\']+', r'\1=[REDACTED]', s)
print('BODY', s.replace('\n',' ')[:1000])
PY
            fi
          }
          probe root 'https://mkety.com/'
          probe www 'https://www.mkety.com/'
          probe health 'https://mkety.com/api/health'
          probe robots 'https://mkety.com/robots.txt'
          probe sitemap 'https://mkety.com/sitemap.xml'
          probe logo 'https://mkety.com/mkety-logo.png'
          probe assistant 'https://mkety.com/api/public/assistant'

      - name: Assert preflight remains read-only
        shell: bash
        run: |
          echo 'Preflight completed using GET requests only.'
          echo 'No DNS record, Worker route, custom domain, script or zone setting was mutated.'
