name: Integrate runtime baseline into Mkety Auth

on:
  push:
    branches:
      - feat/mkety-auth-zitadel-vinext
    paths:
      - '.github/workflows/_auth-integrate-main.yml'

permissions:
  contents: write

concurrency:
  group: auth-integrate-main
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mkety-auth-zitadel-vinext
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Merge verified main runtime baseline
        run: |
          git config user.name "Mkety Auth Integration Bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          status=$?
          set -e
          conflicts="$(git diff --name-only --diff-filter=U)"
          if [ "$status" -ne 0 ] && [ "$conflicts" != "pnpm-lock.yaml" ]; then
            echo "Unexpected merge conflicts:"
            echo "$conflicts"
            exit 1
          fi
      - name: Regenerate merged lockfile from merged manifest
        run: |
          rm -f pnpm-lock.yaml
          pnpm install --lockfile-only
          git add package.json pnpm-lock.yaml
      - name: Verify frozen install
        run: pnpm install --frozen-lockfile
      - name: Diagnose WebCrypto realm boundary
        run: |
          cat > src/shared/lib/auth/__tests__/_webcrypto-realm-diagnostic.test.ts <<'EOF'
          import { webcrypto } from 'node:crypto';
          import { TextEncoder as NodeTextEncoder } from 'node:util';

          describe('WebCrypto realm diagnostic', () => {
            it('reports which byte representations Node WebCrypto accepts inside Jest', async () => {
              const keyPair = await crypto.subtle.generateKey(
                {
                  name: 'RSASSA-PKCS1-v1_5',
                  modulusLength: 2048,
                  publicExponent: new Uint8Array([1, 0, 1]),
                  hash: 'SHA-256',
                },
                true,
                ['sign', 'verify'],
              );
              const data = new NodeTextEncoder().encode('mkety-auth-realm-diagnostic');
              const signature = await crypto.subtle.sign('RSASSA-PKCS1-v1_5', keyPair.privateKey, data);
              const realmBytes = Uint8Array.from(new Uint8Array(signature));
              const realmBuffer = new ArrayBuffer(realmBytes.byteLength);
              new Uint8Array(realmBuffer).set(realmBytes);

              console.log(JSON.stringify({
                cryptoIsNodeWebcrypto: crypto === webcrypto,
                realmBytesTag: Object.prototype.toString.call(realmBytes),
                realmBufferTag: Object.prototype.toString.call(realmBuffer),
                realmBytesIsView: ArrayBuffer.isView(realmBytes),
                dataIsView: ArrayBuffer.isView(data),
                realmBytesCtorMatchesDataCtor: realmBytes.constructor === data.constructor,
                realmBufferCtorMatchesSignatureBufferCtor: realmBuffer.constructor === signature.constructor,
              }));

              const results: Record<string, string> = {};
              for (const [name, candidate] of [
                ['native-signature', signature],
                ['realm-uint8array', realmBytes],
                ['realm-arraybuffer', realmBuffer],
              ] as const) {
                try {
                  results[name] = String(await crypto.subtle.verify('RSASSA-PKCS1-v1_5', keyPair.publicKey, candidate, data));
                } catch (error) {
                  results[name] = error instanceof Error ? `${error.name}: ${error.message}` : String(error);
                }
              }
              console.log(JSON.stringify(results));
              expect(results['native-signature']).toBe('true');
            });
          });
          EOF
          pnpm exec jest src/shared/lib/auth/__tests__/_webcrypto-realm-diagnostic.test.ts --runInBand
          rm src/shared/lib/auth/__tests__/_webcrypto-realm-diagnostic.test.ts
      - name: Verify Auth and platform tests
        run: pnpm test
      - name: Verify types
        run: pnpm type-check
      - name: Verify lint
        run: pnpm lint
      - name: Verify vinext compatibility after Auth.js removal
        run: pnpx vinext check
      - name: Build Auth on authoritative Cloudflare runtime
        env:
          SKIP_ENV_VALIDATION: 'true'
        run: pnpm build
      - name: Validate Cloudflare packaging without deployment
        env:
          SKIP_ENV_VALIDATION: 'true'
        run: pnpm run deploy --dry-run
      - name: Commit verified integration and remove temporary helpers
        run: |
          git rm -f .github/workflows/_auth-main-merge-diagnostic.yml || true
          git rm -f .github/workflows/_auth-integrate-main.yml || true
          git add -A
          git commit -m "build: integrate vinext runtime baseline into Mkety Auth"
          git push origin HEAD:feat/mkety-auth-zitadel-vinext
