name: Billing Core TDD

on:
  push:
    branches:
      - feat/mkety-billing-core-foundation

permissions:
  contents: read

concurrency:
  group: billing-core-tdd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  billing-core:
    name: Billing core TDD
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Billing core tests
        run: pnpm test -- src/features/billing/domain/subscription-lifecycle.test.ts src/features/billing/domain/renewal-policy.test.ts src/features/billing/domain/settlement.test.ts src/features/billing/gateways/registry.test.ts src/shared/db/schema/billing.test.ts --runInBand
