name: Read current cbot DNS before OCI cutover
on:
  push:
    branches:
      - ops/cbot-oci-dns-cutover-20260919
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ZONE_NAME: mkety.com
      RECORD_NAME: cbot.mkety.com
    steps:
      - name: Inspect current DNS record
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CF_TOKEN"
          curl -fsS -H "Authorization: Bearer $CF_TOKEN"             "https://api.cloudflare.com/client/v4/zones?name=$ZONE_NAME&status=active" > /tmp/zones.json
          zone_id="$(node -e "const x=require('/tmp/zones.json'); if(!x.success||x.result.length!==1)process.exit(1); process.stdout.write(x.result[0].id)")"
          curl -fsS -H "Authorization: Bearer $CF_TOKEN"             "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?name=$RECORD_NAME" > /tmp/record.json
          node <<'NODE'
          const x=require('/tmp/record.json');
          if(!x.success) throw new Error('Cloudflare DNS lookup failed');
          if(x.result.length!==1) throw new Error('Expected exactly one cbot DNS record, found '+x.result.length);
          const r=x.result[0];
          console.log(JSON.stringify({
            id:r.id,type:r.type,name:r.name,content:r.content,
            proxied:r.proxied,ttl:r.ttl,comment:r.comment||null
          },null,2));
          NODE
