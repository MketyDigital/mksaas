name: OCI Secret Presence Diagnostic

on:
  push:
    branches:
      - fix/oci-mail-ingress-20260929

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    env:
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
      OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
      OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
      OCI_PRIVATE_KEY_PASSPHRASE: ${{ secrets.OCI_PRIVATE_KEY_PASSPHRASE }}
      OCI_REGION: ${{ secrets.OCI_REGION }}
      OCI_COMPARTMENT_OCID: ${{ secrets.OCI_COMPARTMENT_OCID }}
      OCI_CONFIG: ${{ secrets.OCI_CONFIG }}
      ORACLE_TENANCY_OCID: ${{ secrets.ORACLE_TENANCY_OCID }}
      ORACLE_USER_OCID: ${{ secrets.ORACLE_USER_OCID }}
      ORACLE_FINGERPRINT: ${{ secrets.ORACLE_FINGERPRINT }}
      ORACLE_PRIVATE_KEY: ${{ secrets.ORACLE_PRIVATE_KEY }}
      ORACLE_REGION: ${{ secrets.ORACLE_REGION }}
      ORACLE_COMPARTMENT_OCID: ${{ secrets.ORACLE_COMPARTMENT_OCID }}
      OCI_API_KEY: ${{ secrets.OCI_API_KEY }}
      OCI_API_PRIVATE_KEY: ${{ secrets.OCI_API_PRIVATE_KEY }}
      OCI_INSTANCE_OCID: ${{ secrets.OCI_INSTANCE_OCID }}
      OCI_SUBNET_OCID: ${{ secrets.OCI_SUBNET_OCID }}
      OCI_NSG_OCID: ${{ secrets.OCI_NSG_OCID }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail
          for name in             OCI_TENANCY_OCID OCI_USER_OCID OCI_FINGERPRINT OCI_PRIVATE_KEY             OCI_PRIVATE_KEY_PASSPHRASE OCI_REGION OCI_COMPARTMENT_OCID OCI_CONFIG             ORACLE_TENANCY_OCID ORACLE_USER_OCID ORACLE_FINGERPRINT ORACLE_PRIVATE_KEY             ORACLE_REGION ORACLE_COMPARTMENT_OCID OCI_API_KEY OCI_API_PRIVATE_KEY             OCI_INSTANCE_OCID OCI_SUBNET_OCID OCI_NSG_OCID
          do
            if [ -n "${!name:-}" ]; then
              echo "$name=PRESENT"
            else
              echo "$name=MISSING"
            fi
          done
