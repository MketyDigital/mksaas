name: Repository Secret Names Diagnostic

on:
  push:
    branches:
      - fix/oci-mail-ingress-20260929

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    env:
      REPOSITORY_SECRETS_JSON: ${{ toJSON(secrets) }}
    steps:
      - name: Report secret names only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const raw = process.env.REPOSITORY_SECRETS_JSON || '{}';
          const parsed = JSON.parse(raw);
          for (const name of Object.keys(parsed).sort()) {
            console.log(name);
          }
          NODE
