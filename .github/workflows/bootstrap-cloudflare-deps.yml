name: Bootstrap Cloudflare deployment dependencies

on:
  push:
    paths:
      - '.github/workflows/bootstrap-cloudflare-deps.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: pnpm

      - name: Install pinned Cloudflare deployment dependencies
        run: |
          pnpm add -D --save-exact @opennextjs/cloudflare@1.20.6 wrangler@4.129.0
          node - <<'NODE'
          const fs = require('node:fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.scripts['build'] = 'pnpm run build:next && opennextjs-cloudflare build --skipNextBuild';
          pkg.scripts['deploy'] = 'opennextjs-cloudflare deploy';
          pkg.scripts['preview'] = 'opennextjs-cloudflare preview';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          NODE
          pnpm install --lockfile-only

      - name: Commit generated dependency files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json pnpm-lock.yaml
          git diff --cached --quiet && exit 0
          git commit -m 'build: pin Cloudflare OpenNext toolchain'
          git push origin HEAD:main
