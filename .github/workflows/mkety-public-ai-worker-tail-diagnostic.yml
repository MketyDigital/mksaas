name: Mkety Public AI Worker Tail Diagnostic

on:
  push:
    branches:
      - feat/mkety-public-site-production
    paths:
      - '.github/workflows/mkety-public-ai-worker-tail-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CANDIDATE_URL: https://mkety-public-candidate.dry-glitter-7e16.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture Worker exception across full assistant smoke sequence
        shell: bash
        run: |
          set -u
          tail_log=/tmp/mkety-worker-tail.log
          cookie_jar=/tmp/mkety-worker-tail-cookies
          origin="$CANDIDATE_URL"
          : > "$tail_log"

          timeout 110s pnpm exec wrangler tail mkety-public-candidate --format json > "$tail_log" 2>&1 &
          tail_pid=$!
          sleep 8

          history_code="$(curl -sS -c "$cookie_jar" -b "$cookie_jar" -o /tmp/history.json -w '%{http_code}' "$CANDIDATE_URL/api/public/assistant" || true)"
          echo "initial GET HTTP=$history_code"
          cat /tmp/history.json || true
          echo

          first_code="$(curl -sS -c "$cookie_jar" -b "$cookie_jar" \
            -H 'Content-Type: application/json' -H "Origin: $origin" \
            --data '{"message":"Where can I read Mkety documentation and what is SolutionHub?"}' \
            -o /tmp/first.json -w '%{http_code}' "$CANDIDATE_URL/api/public/assistant" || true)"
          echo "first POST HTTP=$first_code"
          cat /tmp/first.json || true
          echo

          conversation_id="$(node -e "try{const x=require('/tmp/first.json'); if(x.conversationId) process.stdout.write(x.conversationId)}catch{}" 2>/dev/null || true)"
          if [ -n "$conversation_id" ]; then
            second_code="$(curl -sS -c "$cookie_jar" -b "$cookie_jar" \
              -H 'Content-Type: application/json' -H "Origin: $origin" \
              --data "{\"message\":\"What was I just asking you about?\",\"conversationId\":\"$conversation_id\"}" \
              -o /tmp/second.json -w '%{http_code}' "$CANDIDATE_URL/api/public/assistant" || true)"
            echo "second POST HTTP=$second_code"
            cat /tmp/second.json || true
            echo

            restored_code="$(curl -sS -c "$cookie_jar" -b "$cookie_jar" \
              -o /tmp/restored.json -w '%{http_code}' \
              "$CANDIDATE_URL/api/public/assistant?conversationId=$conversation_id" || true)"
            echo "restored GET HTTP=$restored_code"
            cat /tmp/restored.json || true
            echo

            new_code="$(curl -sS -c "$cookie_jar" -b "$cookie_jar" \
              -H 'Content-Type: application/json' -H "Origin: $origin" \
              --data '{"message":"Tell me about Mkety Academy."}' \
              -o /tmp/new.json -w '%{http_code}' "$CANDIDATE_URL/api/public/assistant" || true)"
            echo "new-chat POST HTTP=$new_code"
            cat /tmp/new.json || true
            echo

            new_conversation_id="$(node -e "try{const x=require('/tmp/new.json'); if(x.conversationId) process.stdout.write(x.conversationId)}catch{}" 2>/dev/null || true)"
            if [ -n "$new_conversation_id" ]; then
              echo "new-chat distinct=$([ "$new_conversation_id" != "$conversation_id" ] && echo true || echo false)"
            else
              echo 'new-chat POST did not return conversationId'
            fi
          else
            echo 'first POST did not return conversationId'
          fi

          sleep 8
          kill "$tail_pid" 2>/dev/null || true
          wait "$tail_pid" 2>/dev/null || true
          echo '--- Worker tail evidence ---'
          cat "$tail_log"
          echo '--- End Worker tail evidence ---'
