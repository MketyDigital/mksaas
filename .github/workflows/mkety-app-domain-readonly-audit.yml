name: Mkety mkety.app Read-only Cloudflare Audit

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type AUDIT MKETY.APP READ ONLY
        required: true
        type: string

permissions:
  contents: read

jobs:
  audit:
    if: ${{ inputs.confirmation == 'AUDIT MKETY.APP READ ONLY' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      EXPECTED_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Validate read-only audit credentials
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          echo "::add-mask::$CLOUDFLARE_API_TOKEN"

      - name: Inventory mkety.app DNS, Worker domains and routes
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const api='https://api.cloudflare.com/client/v4';
          const headers={Authorization:`Bearer ${process.env.CLOUDFLARE_API_TOKEN}`,'Content-Type':'application/json'};
          async function get(path, optional=false) {
            const response=await fetch(api+path,{headers});
            let body={};
            try { body=await response.json(); } catch {}
            if(!response.ok || body.success!==true) {
              if(optional) return {accessible:false,httpStatus:response.status};
              throw new Error(`Cloudflare read-only request failed (HTTP ${response.status}).`);
            }
            return {accessible:true,...body};
          }
          async function list(path, optional=false) {
            const items=[]; let page=1, totalPages=1;
            do {
              const separator=path.includes('?')?'&':'?';
              const response=await get(path+separator+'per_page=100&page='+page,optional);
              if(!response.accessible) return response;
              items.push(...(response.result||[]));
              totalPages=Number(response.result_info?.total_pages||1);
              page+=1;
            } while(page<=totalPages);
            return {accessible:true,result:items};
          }
          const zones=await list('/zones?name=mkety.app&status=active');
          const zone=(zones.result||[]).find(x=>x.name==='mkety.app');
          const summary={zoneFound:Boolean(zone),zoneName:zone?.name||null,zoneAccountMatchesConfigured:zone?zone.account?.id===process.env.EXPECTED_ACCOUNT_ID:null};
          if(zone) {
            const [dns,workerDomains,workerRoutes,customHostnames]=await Promise.all([
              list(`/zones/${zone.id}/dns_records`,true),
              list(`/accounts/${zone.account.id}/workers/domains`,true),
              list(`/zones/${zone.id}/workers/routes`,true),
              list(`/zones/${zone.id}/custom_hostnames`,true),
            ]);
            summary.dnsRecords=(dns.result||[])
              .filter(r=>r.name==='mkety.app'||r.name.endsWith('.mkety.app'))
              .map(r=>({type:r.type,name:r.name,content:r.type==='TXT'?'[redacted; DNS TXT value]':r.content,proxied:r.proxied,ttl:r.ttl}));
            summary.workerDomains=workerDomains.accessible
              ? (workerDomains.result||[]).filter(x=>x.hostname==='mkety.app'||x.hostname.endsWith('.mkety.app')).map(x=>({hostname:x.hostname,service:x.service,environment:x.environment}))
              : workerDomains;
            summary.workerRoutes=workerRoutes.accessible
              ? (workerRoutes.result||[]).filter(x=>String(x.pattern||'').includes('mkety.app')).map(x=>({pattern:x.pattern,script:x.script}))
              : workerRoutes;
            summary.cloudflareForSaaSHostnames=customHostnames.accessible
              ? (customHostnames.result||[]).filter(x=>x.hostname==='mkety.app'||x.hostname.endsWith('.mkety.app')).map(x=>({hostname:x.hostname,status:x.status,sslStatus:x.ssl?.status}))
              : customHostnames;
          }
          console.log('# Read-only Cloudflare inventory: mkety.app');
          console.log('');
          console.log('Only Cloudflare GET endpoints were called. TXT values are redacted.');
          console.log('');
          console.log('```json');
          console.log(JSON.stringify(summary,null,2));
          console.log('```');
          NODE
