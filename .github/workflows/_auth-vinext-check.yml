name: Temporary Auth vinext Compatibility Check

on:
  push:
    branches:
      - feat/mkety-auth-zitadel-vinext

permissions:
  contents: read

jobs:
  vinext-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout auth branch
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run vinext compatibility check
        run: pnpm dlx vinext@1.0.0-beta.9 check
