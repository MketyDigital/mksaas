name: Temporary Auth Lockfile Refresh

on:
  push:
    branches:
      - feat/mkety-auth-zitadel-vinext

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore: refresh auth lockfile') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feat/mkety-auth-zitadel-vinext
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --lockfile-only
      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already matches package.json"
            exit 0
          fi
          git add pnpm-lock.yaml
          git commit -m "chore: refresh auth lockfile"
          git push origin HEAD:feat/mkety-auth-zitadel-vinext
