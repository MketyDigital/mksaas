name: Temporary Auth Lockfile Artifact

on:
  push:
    branches:
      - feat/mkety-auth-zitadel-vinext

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Refresh lockfile
        id: refresh
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm install --lockfile-only 2>&1 | tee /tmp/lockfile.log
          exit ${PIPESTATUS[0]}
      - name: Commit lockfile or diagnostic
        if: always()
        run: |
          cp /tmp/lockfile.log lockfile-refresh.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml lockfile-refresh.log
          if git diff --cached --quiet; then
            echo "No lockfile or diagnostic changes"
            exit 0
          fi
          git commit -m "chore: refresh auth lockfile"
          git push origin HEAD:feat/mkety-auth-zitadel-vinext
