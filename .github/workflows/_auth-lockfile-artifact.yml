name: Temporary Auth Lockfile Artifact

on:
  push:
    branches:
      - feat/mkety-auth-zitadel-vinext

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.1
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Refresh lockfile
        run: pnpm install --lockfile-only
      - name: Upload lockfile
        uses: actions/upload-artifact@v4
        with:
          name: auth-pnpm-lockfile
          path: pnpm-lock.yaml
