name: Mkety Cloudflare vinext Smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.ts'
      - 'wrangler.jsonc'
      - 'src/**'
      - '.github/workflows/mkety-cloudflare-vinext-smoke.yml'
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.ts'
      - 'wrangler.jsonc'
      - 'src/**'
      - '.github/workflows/mkety-cloudflare-vinext-smoke.yml'

permissions:
  contents: read

jobs:
  vinext-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check vinext compatibility
        run: pnpx vinext check
      - name: Build Cloudflare Worker with vinext
        env:
          SKIP_ENV_VALIDATION: 'true'
        run: pnpm build
      - name: Verify generated Worker deployment output
        run: |
          node --input-type=module <<'EOF'
          import { existsSync, readFileSync, readdirSync, statSync } from 'node:fs';
          import { dirname, join, resolve } from 'node:path';

          const configs = [];
          const walk = (dir) => {
            for (const name of readdirSync(dir)) {
              const path = join(dir, name);
              if (statSync(path).isDirectory()) walk(path);
              else if (name === 'wrangler.json') configs.push(path);
            }
          };

          walk('dist');
          if (configs.length === 0) throw new Error('vinext did not emit any Wrangler config');

          const deployment = configs
            .map((configPath) => {
              const config = JSON.parse(readFileSync(configPath, 'utf8'));
              if (!config.main) return null;
              const workerEntry = resolve(dirname(configPath), config.main);
              return existsSync(workerEntry) ? { configPath, workerEntry } : null;
            })
            .find(Boolean);

          if (!deployment) {
            throw new Error(`No generated Wrangler config points to an existing Worker entry. Found: ${configs.join(', ')}`);
          }

          console.log(`Verified ${deployment.configPath} -> ${deployment.workerEntry}`);
          EOF
