name: Mkety Cloudflare vinext Smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.ts'
      - 'wrangler.jsonc'
      - 'src/**'
      - '.github/workflows/mkety-cloudflare-vinext-smoke.yml'
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.ts'
      - 'wrangler.jsonc'
      - 'src/**'
      - '.github/workflows/mkety-cloudflare-vinext-smoke.yml'

permissions:
  contents: read

jobs:
  vinext-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check vinext compatibility
        run: pnpx vinext check
      - name: Build Cloudflare Worker with vinext
        env:
          SKIP_ENV_VALIDATION: 'true'
        run: pnpm build
      - name: Validate Cloudflare deployment packaging without deploying
        env:
          SKIP_ENV_VALIDATION: 'true'
        run: pnpm run deploy -- --dry-run
