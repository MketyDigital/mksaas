name: Mkety Production DB Secret Diagnostic

on:
  push:
    branches:
      - ops/redis-auth-diagnostic-20260914
    paths:
      - .github/workflows/mkety-production-db-secret-diagnostic.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      COOLIFY_URL: https://deploy.mkety.com
      COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
    steps:
      - name: Check production executor inputs without mutation
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${COOLIFY_API_TOKEN:-}" ]; then
            echo 'MKETY_DIAG_COOLIFY_TOKEN_PRESENT=true'
          else
            echo 'MKETY_DIAG_COOLIFY_TOKEN_PRESENT=false'
          fi
          if [ -n "${DATABASE_URL:-}" ]; then
            echo 'MKETY_DIAG_PRODUCTION_DATABASE_URL_PRESENT=true'
          else
            echo 'MKETY_DIAG_PRODUCTION_DATABASE_URL_PRESENT=false'
          fi
          code="$(curl --proto '=https' --tlsv1.2 -sS -o /tmp/health -w '%{http_code}' "${COOLIFY_URL%/}/api/v1/health" || true)"
          echo "MKETY_DIAG_COOLIFY_HEALTH_HTTP=$code"
          [ -n "${COOLIFY_API_TOKEN:-}" ]
          [ -n "${DATABASE_URL:-}" ]
          [ "$code" = '200' ]
          echo 'MKETY_DIAG_EXECUTOR_PREFLIGHT_INPUTS_OK=true'
